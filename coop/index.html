   It cannot hurt you. It will never hurt you. Knowing that does not help,
   because the noise behind you is not smaller for being harmless.
   ========================================================================== */
/* One object per bird, because nights five and six want two of them and a
   singleton that has to become a pair later is a rewrite either way. The model
   is rebuilt per instance rather than shared: they are two draw calls each and
   there are never more than two, and cloning a Group with baked children is
   more code than just building it twice. */
const WATCH = { on:false, list:[], want:0, respawn:0 };

const WATCHCFG = {
  stareRange: 10.7,       // thirty-five feet: it freezes and looks at you
  breakRange: 4.6,        // fifteen feet: it bolts
  viewAngle: 0.85,        // "spotted" is a good deal wider than the torch cone
  walkSpd: 1.65,          // never fast. it does not need to be. slightly less never.
  fleeSpd: 6.5,
  firstSpawn: 20,         // twenty seconds into the shift
  respawn: 30,            // and thirty after each one goes
  closeStop: 1.6,         // it will come this close behind you and no closer
};

/* Three and four get one. Five and six get two. On six they stop arriving the
   moment you lift the egg — whatever is about to happen does not need an
   audience, and the ones already out stay until they are unseen like everything
   else in this building. */
function watcherCount(shift){
  if (shift === 3 || shift === 4) return 1;
  if (shift === 5 || shift === 6) return 12;
  return 0;
}

/* Six of them cannot arrive on a thirty-second drip — you would spend the
   first three minutes of the night with two. The refill rate and the spacing
   rule both scale with how many are wanted, or the crowd simply never
   assembles and nights five and six feel exactly like four. */
function watcherRespawn(){ return WATCH.want > 2 ? 2.6 : WATCHCFG.respawn; }
function watcherSpacing(){ return WATCH.want > 2 ? 3.0 : 6; }

/* And they leave faster than they used to. Slightly — enough that the break
   reads as a bird that has decided, not a bird jogging off. */
function watcherFleeSpd(){
  return (CAMPAIGN.shift >= 5 ? 7.9 : WATCHCFG.fleeSpd);
}
function watcherWanted(shift){ return watcherCount(shift) > 0; }

/* Chicken-shaped, about a metre and a bit, and pale enough that the beam finds
   it instantly — the whole point is that seeing it is easy and stopping it
   from being there is not. */
function buildWatcherModel(W, pal){
  pal = pal || {};
  const g = new THREE.Group();
  const pale = new THREE.MeshLambertMaterial({ color: pal.body != null ? pal.body : 0xbdb6a4 });
  const dark = new THREE.MeshLambertMaterial({ color: pal.dark != null ? pal.dark : 0x241f19 });
  const red  = new THREE.MeshLambertMaterial({ color: pal.comb != null ? pal.comb : 0x6b1b16 });
  const SPH = new THREE.SphereGeometry(1, 9, 7);
  const BOX = new THREE.BoxGeometry(1,1,1);
  const CON = new THREE.ConeGeometry(1, 1, 5);
  const CYL = new THREE.CylinderGeometry(1, 1, 1, 6);

  baked(g, [
    { g:SPH, p:[0, 0.72, 0],    s:[0.34, 0.4, 0.5] },
    { g:SPH, p:[0, 0.62, 0.2],  s:[0.26, 0.28, 0.3] },
    { g:CON, p:[0, 0.86, -0.42], r:[-1.0,0,0], s:[0.16, 0.55, 0.16] },
  ], pale, true);

  const neck = [];
  for (let i=0;i<5;i++){
    const t = i/4;
    neck.push({ g:SPH, p:[0, 0.98 + t*0.34, 0.16 + t*0.08], s:[0.13 - t*0.04, 0.14, 0.13 - t*0.04] });
  }
  baked(g, neck, pale, true);

  const head = new THREE.Group();
  head.position.set(0, 1.36, 0.24);
  baked(head, [{ g:SPH, p:[0,0,0], s:[0.13,0.14,0.16] }], pale, true);
  baked(head, [
    { g:BOX, p:[0, 0.15, 0], s:[0.03, 0.11, 0.2] },
    { g:BOX, p:[0, -0.12, 0.06], s:[0.03, 0.13, 0.07] },
  ], red, true);
  baked(head, [{ g:CON, p:[0, -0.01, 0.17], r:[Math.PI/2,0,0], s:[0.05,0.16,0.05] }], dark, true);
  /* Two black beads, and no glow at all. The rooster's eyes are how you find
     HIM; this one you find by its shape, and the eyes stay dead so it never
     looks supernatural. It is a bird. That is the horror. */
  baked(head, [
    { g:SPH, p:[-0.1, 0.03, 0.08], s:[0.032,0.032,0.032] },
    { g:SPH, p:[ 0.1, 0.03, 0.08], s:[0.032,0.032,0.032] },
  ], dark, false);
  g.add(head); W.head = head;

  const leg = () => {
    const L = new THREE.Group();
    baked(L, [
      { g:CYL, p:[0, -0.18, 0], s:[0.045, 0.36, 0.045] },
      { g:BOX, p:[0, -0.37, 0.07], s:[0.06, 0.04, 0.19] },
    ], dark, true);
    return L;
  };
  W.legL = leg(); W.legL.position.set(-0.12, 0.56, 0); g.add(W.legL);
  W.legR = leg(); W.legR.position.set( 0.12, 0.56, 0); g.add(W.legR);

  g.visible = false;
  return g;
}

function newWatcher(){
  const W = { group:null, head:null, legL:null, legR:null,
              x:0, z:0, yaw:0, spd:0, gait:0,
              alive:false, state:'off', t:0, noiseT:0, fade:1,
              path:[], pathT:0 };
  W.group = buildWatcherModel(W);
  world.add(W.group);
  return W;
}

function watcherReset(shift){
  WATCH.on = watcherWanted(shift);
  WATCH.want = watcherCount(shift);
  WATCH.respawn = WATCH.want > 2 ? 8 : WATCHCFG.firstSpawn;
  for (const W of WATCH.list){
    W.alive = false; W.state = 'off'; W.fade = 1;
    if (W.group){
      W.group.visible = false;
      if (!W.group.parent) world.add(W.group);   // survives a level rebuild
    }
  }
}

/* Seen means SEEN — in front of you and not through a wall. Deliberately much
   wider than the torch cone: you notice a thing that size at the edge of your
   vision whether or not the beam is on it, and pretending otherwise would make
   it feel like it was cheating. */
function watcherSeenOne(W){
  if (!W.alive) return false;
  const dx = W.x - P.x, dz = W.z - P.z;
  const d = Math.hypot(dx, dz) || 1e-4;
  const dir = camDir();
  if ((dx*dir.x + dz*dir.z)/d < Math.cos(WATCHCFG.viewAngle)) return false;
  return losClear(P.x, P.z, W.x, W.z);
}
function watcherSeen(){ return WATCH.list.some(watcherSeenOne); }
function watcherAlive(){ return WATCH.list.filter(w => w.alive).length; }

function watcherSpawn(){
  if (watcherAlive() >= WATCH.want) return false;
  let W = WATCH.list.find(w => !w.alive);
  if (!W){ W = newWatcher(); WATCH.list.push(W); }
  if (!W.group.parent) world.add(W.group);        // survives a level rebuild
  for (let i=0;i<160;i++){
    const a = rnd(0,TAU), r = rnd(14, 26);
    const x = P.x + Math.sin(a)*r, z = P.z + Math.cos(a)*r;
    const c = worldToCell(x, z);
    if (!walkable(c.x, c.y) || cellSeen(c.x, c.y)) continue;
    const w = cellToWorld(c.x, c.y);
    // and never on top of the other one — two of them in a doorway is a bug
    if (WATCH.list.some(o => o !== W && o.alive && Math.hypot(o.x-w.x, o.z-w.z) < watcherSpacing())) continue;
    W.x = w.x; W.z = w.z;
    W.alive = true; W.state = 'come'; W.t = 0;
    W.fade = 1; W.group.visible = true;
    W.path = []; W.pathT = 0;
    return true;
  }
  /* Nothing hidden at range. That happens more than you would think: standing
     in the loading bay, most of a fourteen-to-twenty-six metre ring is either
     outside the building or inside the bay, which walkable() excludes on
     purpose — so the strict search can come up empty and the bird simply never
     arrives. Fall back to anywhere walkable that is at least far enough away
     that you will not watch it appear, and only give up after that. */
  for (let i=0;i<200;i++){
    const a = rnd(0,TAU), r = rnd(18, 34);
    const c = worldToCell(P.x + Math.sin(a)*r, P.z + Math.cos(a)*r);
    if (!walkable(c.x, c.y)) continue;
    const w = cellToWorld(c.x, c.y);
    if (Math.hypot(w.x-P.x, w.z-P.z) < 16) continue;
    if (WATCH.list.some(o => o !== W && o.alive && Math.hypot(o.x-w.x, o.z-w.z) < watcherSpacing())) continue;
    W.x = w.x; W.z = w.z;
    W.alive = true; W.state = 'come'; W.t = 0;
    W.fade = 1; W.group.visible = true;
    W.path = []; W.pathT = 0;
    return true;
  }
  WATCH.respawn = 4;               // genuinely nowhere; try again shortly
  return false;
}

function watcherGoneOne(W){
  W.alive = false;
  W.state = 'off';
  if (W.group) W.group.visible = false;
  WATCH.respawn = watcherRespawn();
}

function updateWatcher(dt){
  if (!WATCH.on || MODE !== 'play' || !P.alive) return;

  /* On the last night they stop arriving once you have it. The ones already out
     are left alone — they will leave the way everything leaves here. */
  const stopSpawning = isFinalNight() && KNOWS;
  if (!stopSpawning && watcherAlive() < WATCH.want){
    WATCH.respawn -= dt;
    if (WATCH.respawn <= 0){ watcherSpawn(); WATCH.respawn = watcherRespawn(); }
  }

  for (const W of WATCH.list){
    if (!W.alive) continue;
    updateOneWatcher(W, dt);
  }
}

function updateOneWatcher(W, dt){
  const dx = P.x - W.x, dz = P.z - W.z;
  const dist = Math.hypot(dx, dz);
  const seen = watcherSeenOne(W);

  switch (W.state){

    /* Coming. Only ever while you are not looking at it — the moment you turn
       round it is standing still, and it was standing still the whole time as
       far as you can prove. */
    case 'come':
      if (seen && dist < WATCHCFG.breakRange){ W.state = 'bolt'; W.t = 0; W.fleeX = 0; sfxWatcherBolt(W.x, W.z); break; }
      if (seen && dist < WATCHCFG.stareRange){ W.state = 'stare'; W.t = 0; break; }
      if (seen){ W.spd = 0; break; }            // seen but far: it just stops
      W.spd = dist > WATCHCFG.closeStop ? WATCHCFG.walkSpd : 0;
      if (W.spd > 0) watcherStep(W, dt, P.x, P.z, W.spd);
      /* Right behind you and getting louder. It never touches you. It has no
         way to touch you. It simply will not stop being there. */
      W.noiseT -= dt;
      if (W.noiseT <= 0){
        W.noiseT = dist < 4 ? rnd(0.8, 2.0) : rnd(2.5, 5.5);
        sfxWatcher(dist, W.x, W.z, dist < 4);
      }
      break;

    /* Stopped, and looking at you. It will wait as long as you will. */
    case 'stare':
      W.spd = 0;
      W.t += dt;
      watcherFace(W, P.x, P.z, dt*6);
      if (seen && dist < WATCHCFG.breakRange){ W.state = 'bolt'; W.t = 0; W.fleeX = 0; sfxWatcherBolt(W.x, W.z); break; }
      if (!seen){ W.state = 'come'; W.t = 0; }
      break;

    /* Broken and running. It gets out of your sight and then it is not there. */
    case 'bolt': {
      W.spd = watcherFleeSpd();
      W.t += dt;
      /* Away from YOU, not along the camera axis. Using camDir meant its escape
         heading flipped whenever you turned round — so the moment you looked
         away it about-faced and ran straight back through you into your new
         field of view, and then could never get out of sight. Run from the
         player and the geometry sorts itself out. */
      if (!W.fleeX){
        const fx = W.x - P.x, fz = W.z - P.z, fd = Math.hypot(fx, fz) || 1;
        W.fleeX = fx/fd; W.fleeZ = fz/fd;
      }
      watcherStep(W, dt, W.x + W.fleeX*12 + rnd(-2,2), W.z + W.fleeZ*12 + rnd(-2,2), W.spd);
      /* It may ONLY fade while it is out of your view, and there is no timeout
         that can override that. A cap that fires regardless means that once in
         a while a thing dissolves while you are staring straight at it, which
         costs more than every successful vanish put together. If it cannot get
         out of sight it keeps running, forever, and that is fine. */
      if (W.t > 0.5 && !watcherSeenOne(W)) W.fade -= dt*3;
      else W.fade = Math.min(1, W.fade + dt*3);
      if (W.fade <= 0) watcherGoneOne(W);
      break;
    }
  }

  // ---- pose ----
  W.group.position.set(W.x, groundAt(W.x, W.z), W.z);
  W.group.rotation.y = W.yaw;
  const moving = W.spd > 0.05;
  W.gait += dt * (moving ? 2.4 + W.spd : 0);
  const sw = moving ? Math.sin(W.gait*2) * 0.5 : 0;
  if (W.legL) W.legL.rotation.x =  sw;
  if (W.legR) W.legR.rotation.x = -sw;
  if (W.head){
    // the same held-then-whipped head a chicken has, and a dead-still stare
    const u = ((W.gait*2) % TAU) / TAU;
    const thrust = moving ? (u < 0.7 ? -u*0.3 : (u-0.7)/0.3*0.8 - 0.21) : 0;
    W.head.position.z = 0.24 + thrust*0.2;
    W.head.rotation.z = W.state === 'stare' ? 0.3 : 0;
  }
  const s = Math.max(0.001, W.fade);
  W.group.scale.set(s, s, s);
}

function watcherFace(W, tx, tz, k){
  const want = Math.atan2(tx-W.x, tz-W.z);
  let d = want - W.yaw;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  W.yaw += d * Math.min(1, k);
}

function watcherStep(W, dt, tx, tz, spd){
  watcherFace(W, tx, tz, dt*5);
  W.pathT = (W.pathT || 0) - dt;
  if (W.pathT <= 0 || !W.path || !W.path.length){
    W.pathT = 0.5;
    const a = worldToCell(W.x, W.z), b = worldToCell(tx, tz);
    W.path = findPath(a.x, a.y, b.x, b.y) || [];
  }
  let gx = tx, gz = tz;
  if (W.path.length){
    const wp = W.path[0];
    gx = wp.x; gz = wp.z;
    if (Math.hypot(gx-W.x, gz-W.z) < 1.0) W.path.shift();
  }
  const dx = gx-W.x, dz = gz-W.z, d = Math.hypot(dx,dz) || 1;
  const r = collide(W.x + (dx/d)*spd*dt, W.z + (dz/d)*spd*dt, 0.3);
  if (Number.isFinite(r.x) && Number.isFinite(r.z)){ W.x = r.x; W.z = r.z; }
}

/* ==========================================================================
   PAPERS
   Pinned where somebody pinned them, in the voice of people who had to work
   here. None of it explains anything. All of it is somebody covering
   themselves, which is how this kind of thing actually gets recorded.
   ========================================================================== */
const PAPERS = { list: [], mesh: null, reading: -1 };

const PAPER_TEXT = [
  ['ROTA — NIGHT', 'Mon Vale · Tue Vale · Wed Vale · Thu —— · Fri Vale\nVale has done four in a row. Nobody is putting their name down for Thursday and I am not going to make them.'],
  ['MAINTENANCE', 'Shed 4 door frame: replacement requested THIRD TIME. Damage is at 3.8m. I do not want to hear again that it was a forklift. Show me the forklift that reaches 3.8m.'],
  ['NOTICE TO NIGHT STAFF', 'The north end is not on the round any more. If the count is short at the north end, the count is short. Do not go and find out why.'],
  ['INCIDENT — 11/03', 'Approx 0210 heard from the incubator corridor. Both of us. Ten minutes. We agreed it was the extract fan.\nIt is not the extract fan. I have written that it is the extract fan.'],
  ['FEED LOG', 'North end draw is up ninety percent on last quarter with no birds allocated to it.\nRaised with the office. Told to stop logging the north end.'],
  ['—', 'He is not big because we fed him. We fed him because he was big and it seemed like the safer of the two options at the time.'],
  ['HANDOVER NOTE', 'If you hear it in the roof do not stop walking. If you hear it in front of you, stop walking.\nYou will know which is which. Everyone does.'],
  ['CLOSURE — SITE NOTICE', 'All stock removed. All stock accounted for.\nSigned R. Vale, and I want it on record that I signed this because I was asked to and not because I counted anything.'],
];

function texPaper(title, body){
  const W = 320, H = 420;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  /* Paler stock, much darker ink, and far less staining over the text. The
     first version was mid-brown on mid-brown, and under a torch bright enough
     to wash out the paper entirely it was a beige rectangle with a suggestion
     of writing on it. */
  g.fillStyle = '#d9d2ba'; g.fillRect(0,0,W,H);
  for (let i=0;i<40;i++){
    g.fillStyle = 'rgba(96,80,52,'+rnd(0.015,0.05).toFixed(3)+')';
    const r = rnd(6,30);
    g.beginPath(); g.arc(rnd(0,W), rnd(0,H), r, 0, TAU); g.fill();
  }
  g.fillStyle = '#12100c';
  g.font = 'bold 17px monospace';
  g.fillText(title.slice(0,24), 14, 32);
  g.fillStyle = '#2a241a';
  g.fillRect(14, 40, W-28, 2);
  g.fillStyle = '#12100c';
  g.font = 'bold 13px monospace';
  let y = 60;
  for (const para of body.split('\n')){
    let line = '';
    for (const word of para.split(' ')){
      if (g.measureText(line + word).width > W-30){ g.fillText(line, 14, y); y += 18; line = ''; }
      line += word + ' ';
    }
    g.fillText(line, 14, y); y += 26;
  }
  g.restore();
  if (!c) return null;
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function clearPapers(){
  if (PAPERS.mesh){ world.remove(PAPERS.mesh); PAPERS.mesh = null; }
  PAPERS.list.length = 0;
  PAPERS.reading = -1;
}

function spawnPapers(){
  clearPapers();
  const spots = wallSpots();
  if (!spots.length) return;
  const n = Math.min(5, PAPER_TEXT.length);
  const picked = [];
  const pool = PAPER_TEXT.slice();
  for (let i=0;i<n && pool.length;i++)
    picked.push(pool.splice(rndi(0, pool.length-1), 1)[0]);

  /* One atlas, one material, one mesh. Every page is drawn into its own cell of
     a 2x3 grid and the plane for it gets UVs pointing at that cell, then all
     five planes bake together — so the documents cost one draw call between
     them instead of five, and there is room to add a sixth for nothing.

     emissiveMap so a page carries its own floor of brightness: lit only by the
     torch, a document is either invisible or blown flat white, with no
     distance in between where you can actually read it. */
  const PW = 320, PH = 420, COLS = 2, ROWS = 3;
  const c = document.createElement('canvas');
  c.width = PW*COLS; c.height = PH*ROWS;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0,0,c.width,c.height);

  const parts = [];
  picked.forEach(([title, body], i) => {
    const col = i % COLS, row = (i / COLS) | 0;
    texPaper(title, body, g, col*PW, row*PH);

    const s = pick(spots);
    lockCell(s.cx, s.cy);          // this wall stays a wall: see wallSpots()
    const geo = new THREE.PlaneGeometry(0.5, 0.66);
    const uv = geo.attributes.uv;
    for (let k=0;k<uv.count;k++){
      uv.setXY(k, (col + uv.getX(k)) / COLS, (row + uv.getY(k)) / ROWS);
    }
    uv.needsUpdate = true;
    parts.push({ g:geo, p:[s.x, groundAt(s.x, s.z) + rnd(1.35, 1.7), s.z],
                 r:[0, s.ry, rnd(-0.05, 0.05)] });
    PAPERS.list.push({ x:s.x, z:s.z, title, body });
  });

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshLambertMaterial({
    map: tex, emissive: 0x8f8f8f, emissiveMap: tex, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(bakeGeo(parts), mat);
  world.add(mesh);
  PAPERS.mesh = mesh;
}

function paperNear(){
  let best = -1, bestD = 2.4;
  const dir = camDir();
  for (let i=0;i<PAPERS.list.length;i++){
    const p = PAPERS.list[i];
    const dx = p.x-P.x, dz = p.z-P.z;
    const d = Math.hypot(dx, dz);
    if (d > bestD) continue;
    if ((dx*dir.x + dz*dir.z)/(d||1e-4) < 0.35) continue;
    bestD = d; best = i;
  }
  return best;
}

function readPaper(){
  const i = paperNear();
  if (i < 0) return false;
  const p = PAPERS.list[i];
  subtitle(p.title + ' — ' + p.body.replace(/\n/g, '  '), 11);
  sfxClick(0.4);
  return true;
}

/* ==========================================================================
   THE HOLE
   Nights three onward, part of the roof is not there any more. Not a neat
   hatch — a tear, with the deck peeled up around it and the panels bent the
   wrong way, which is what you get when something comes through a roof rather
   than being let in through it.

   It is built as geometry hung just under the ceiling rather than by removing
   ceiling tiles, because the ceiling is one plane and punching a hole in a
   plane costs more than covering one convincingly.
   ========================================================================== */
const HOLE = {
  on:false, group:null, sky:null, crater:null, rain:null, rainData:[],
  x:0, z:0, cx:0, cy:0, r:0, rin:0, dropT:0,
};

/* Chosen during generation, before a single tile is placed, because the ceiling
   builder has to know which tiles not to make. */
function chooseHole(shift){
  HOLE.on = false;
  if (shift < 3) return;
  const open = [];
  /* Never over a sunken wing. That roof is four metres below the one outside,
     with the rest of the building sitting on top of it — nothing came through
     there, and a night sky at the bottom of a basement is a bug you can see
     from across the room. */
  for (let y=4;y<G.h-4;y++) for (let x=4;x<G.w-4;x++)
    if (gAt(x,y)===0 && !inBayCell(x,y) && isFlatCell(x,y)) open.push({x,y});
  if (!open.length) return;
  const c = pick(open), w = cellToWorld(c.x, c.y);
  HOLE.cx = c.x; HOLE.cy = c.y;
  HOLE.x = w.x; HOLE.z = w.z;
  HOLE.r = rnd(3.4, 5.2);
  /* The opening you actually see through is smaller than the bite taken out of
     the ceiling, because the deck around it is pushed DOWN into the room and
     the tear is at the bottom of the dent. That gap between the two radii is
     the whole difference between a hole and a circle cut in a plane. */
  HOLE.rin = HOLE.r * 0.70;
  HOLE.on = true;

  /* Lock the floor under the tear and a ring around it. The dent is geometry
     hung under the roof at a fixed place; if the shifting walls put a partition
     up through the middle of it afterwards, the roof opening ends up fused
     into a wall and the one landmark in the building stops reading as a hole.
     It is a handful of cells and they are the most memorable ones on the map. */
  const lockR = Math.ceil((HOLE.r + CFG.cell)/CFG.cell) + 1;
  for (let y=HOLE.cy-lockR; y<=HOLE.cy+lockR; y++)
    for (let x=HOLE.cx-lockR; x<=HOLE.cx+lockR; x++)
      if (Math.hypot(x-HOLE.cx, y-HOLE.cy) <= lockR) lockCell(x,y);
}

/* Does the roof opening swallow this ceiling tile? Slightly generous, because a
   tile half over the gap looks worse than no tile. */
function holeCoversCell(cx, cy){
  if (!HOLE.on) return false;
  const w = cellToWorld(cx, cy);
  return Math.hypot(w.x-HOLE.x, w.z-HOLE.z) < HOLE.r;
}

/* A night sky, painted once: deep blue-black, a smear of cloud lit from behind
   by a moon that is never actually in frame, and a scatter of stars where the
   cloud is thin. Scrolled slowly at runtime so the weather moves. */
function texNightSky(){
  const S = 512, c = makeCanvas(S), g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,S);
  grd.addColorStop(0, '#070c16');
  grd.addColorStop(0.55, '#0d1626');
  grd.addColorStop(1, '#111c2e');
  g.fillStyle = grd; g.fillRect(0,0,S,S);
  // stars first, so cloud covers most of them
  for (let i=0;i<260;i++){
    const a = rnd(0.15, 0.85);
    g.fillStyle = 'rgba(210,224,255,'+a.toFixed(2)+')';
    const r = rnd(0.5, 1.5);
    g.beginPath(); g.arc(rnd(0,S), rnd(0,S), r, 0, TAU); g.fill();
  }
  // and the cloud: many soft blobs, brighter toward one corner
  for (let i=0;i<150;i++){
    const x = rnd(0,S), y = rnd(0,S), r = rnd(30, 130);
    const lit = clamp(1 - Math.hypot(x-S*0.3, y-S*0.25)/(S*0.9), 0, 1);
    const v = 26 + lit*74;
    const cg = g.createRadialGradient(x,y,0,x,y,r);
    cg.addColorStop(0, 'rgba('+(v|0)+','+((v*1.06)|0)+','+((v*1.3)|0)+',0.5)');
    cg.addColorStop(1, 'rgba('+(v|0)+','+((v*1.06)|0)+','+((v*1.3)|0)+',0)');
    g.fillStyle = cg; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2.2, 2.2);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* The sky has to end somewhere and you must never see where. Solid across the
   middle, gone by the rim, so its edge is a fade rather than a border. */
function texSkyFade(){
  const S = 128, c = makeCanvas(S), g = c.getContext('2d');
  const grd = g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  grd.addColorStop(0,    '#ffffff');
  grd.addColorStop(0.46, '#ffffff');
  grd.addColorStop(0.78, '#6a6a6a');
  grd.addColorStop(1,    '#000000');
  g.fillStyle = '#000'; g.fillRect(0,0,S,S);
  g.fillStyle = grd; g.fillRect(0,0,S,S);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}

/* A puddle, not a disc: opaque in the middle, nothing at the edge, with the
   boundary broken up so it never reads as a circle somebody drew. */
function texWetPatch(){
  const S = 128, c = makeCanvas(S), g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0,0,S,S);
  const grd = g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  grd.addColorStop(0,    'rgba(255,255,255,1)');
  grd.addColorStop(0.42, 'rgba(255,255,255,0.95)');
  grd.addColorStop(0.72, 'rgba(255,255,255,0.42)');
  grd.addColorStop(1,    'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,S,S);
  // and a ragged margin, because water finds the low spots and stops there
  g.globalCompositeOperation = 'destination-out';
  for (let i=0;i<40;i++){
    const a = rnd(0,TAU), r = S*rnd(0.32,0.5);
    const rr = S*rnd(0.04,0.13);
    g.beginPath(); g.arc(S/2+Math.sin(a)*r, S/2+Math.cos(a)*r, rr, 0, TAU); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function clearHole(){
  if (HOLE.group){ world.remove(HOLE.group); HOLE.group = null; }
  if (HOLE.sky){ world.remove(HOLE.sky); HOLE.sky = null; }
  HOLE.crater = null; HOLE.rain = null; HOLE.rainData = [];
}

function spawnHole(shift){
  clearHole();
  if (!HOLE.on) return;

  const g = new THREE.Group();
  const deckM = new THREE.MeshLambertMaterial({ color:0x3b3a35, side:THREE.DoubleSide });
  const barM  = new THREE.MeshLambertMaterial({ color:0x4a453c });

  /* A dome, carried on the camera: it sits a fixed distance from your eye in
     every direction, which is what a sky actually does — you cannot walk up to
     it, cannot see round it, and no angle finds a corner. It replaced a flat
     ninety-metre panel whose edge you could find from off to one side.

     It is TRANSPARENT, and that is not cosmetic. Drawn opaque and first, it
     ignored the depth buffer and turned up wherever the geometry happened to
     leave a crack, forty metres away, as a pale rectangle floating in a dark
     hall — the one thing in the building that fog could not reach, because it
     is the one thing with fog switched off. In the transparent pass it is
     depth-tested against everything solid, so a wall is a wall again.

     And it fades out with distance by hand, which is the job fog would have
     done if fog were allowed anywhere near it. Ten metres from the tear you
     are looking at the night. Thirty metres away there is nothing up there but
     dark, which is what a hole in a roof looks like from across a shed. */
  /* A plane again, and not a dome after all. The dome had no edge, which was
     the point, but it had a pole: every UV converges on the spot directly over
     your head, and looking straight up through the tear — the one view this
     whole object exists for — the clouds smeared into a pinwheel of facets.

     A plane carried on the camera has neither problem. The reason the original
     flat sky failed was that it stood still while you walked, so you could get
     out from under it and find the edge. This one cannot be walked out from
     under: it is always the same distance up and the same distance out, and
     the funnel below it means you can only ever see a narrow cone of it, so
     the edge is a hundred and ten metres of sky away from anything you can
     point the camera at. */
  const skyTex = texNightSky();
  skyTex.repeat.set(4, 4);
  /* Two hundred and twenty metres square was wider than the camera can see:
     the far plane is at ninety, so the GPU clipped the quad and the cut showed
     up through the tear as a hard straight border across the night with a
     diagonal seam where the two triangles met. Smaller, subdivided so any
     clipping that does happen is fine rather than a single huge chord, and
     faded to nothing at its own edges by an alpha map — so even if you find
     where it stops, it stops the way distance stops and not the way a poster
     stops. */
  const sky = new THREE.Mesh(
    new THREE.PlaneGeometry(150, 150, 12, 12),
    new THREE.MeshBasicMaterial({ map: skyTex, alphaMap: texSkyFade(),
                                  fog:false, side: THREE.DoubleSide,
                                  transparent:true, opacity:1, depthWrite:false }));
  sky.rotation.x = Math.PI/2;                // face down at us
  sky.frustumCulled = false;
  world.add(sky);                          // NOT in g: g is parked at the hole
  HOLE.sky = sky;

  /* ---- THE IMPACT ----
     The ceiling is a grid, so the bite it can take out of itself is a grid
     shape: at four-metre cells and a four-metre radius that is a plus sign, and
     a plus sign of night sky in a roof is the single most obviously fake thing
     in the building. A cone over the top of it fixed the plus and replaced it
     with a circle, which is the second most obviously fake thing.

     So this is a proper crater, built as a radial mesh. Two things make it read
     as an impact rather than as a hole somebody cut:

     The rim is tangent to the ceiling. The outermost ring sits AT roof height
     and the dish eases away from it on a smoothstep, so there is no crease
     where the two meet — the deck just starts going down. A cone meeting a
     plane always shows the join, and that join was the thing that looked wrong.

     And nothing about it is circular. Every sector gets its own outer radius,
     its own inner radius and its own depth, with two or three deeper lobes
     torn further out than the rest, so the opening is a ragged shape and the
     dish around it is uneven. Something came through here at an angle. */
  const rin = HOLE.rin, rout = HOLE.r + CFG.cell*1.15, dip = 1.45;
  {
    const SEC = 30, RING = 7;
    // one set of per-sector numbers, reused by every ring, so the deformation
    // is a shape rather than noise
    const wob = [], lobe = [], deep = [];
    for (let j=0;j<SEC;j++){
      const a = (j/SEC)*TAU;
      wob.push(1 + Math.sin(a*3 + 0.7)*0.09 + Math.sin(a*5 - 1.9)*0.05);
      lobe.push(1 + Math.sin(a*2 + 1.3)*0.26 + Math.sin(a*7 + 0.2)*0.13 + rnd(-0.07,0.07));
      deep.push(1 + Math.sin(a*2 - 0.6)*0.22 + rnd(-0.06,0.06));
    }
    const pos = [], uv = [], idx = [];
    for (let i=0;i<=RING;i++){
      const t = i/RING;
      const ease = t*t*(3-2*t);                 // flat at the rim, flat at the lip
      for (let j=0;j<=SEC;j++){
        const jj = j % SEC;
        const a = (j/SEC)*TAU;
        const ro = rout * wob[jj];
        const ri = rin  * lobe[jj];
        const r  = ro + (ri - ro)*t;
        const y  = WALL_H - 0.02 - dip*deep[jj]*ease;
        pos.push(Math.sin(a)*r, y, Math.cos(a)*r);
        uv.push(a/TAU*4, t*1.6);
      }
    }
    const W1 = SEC+1;
    for (let i=0;i<RING;i++) for (let j=0;j<SEC;j++){
      const p0 = i*W1+j, p1 = p0+1, p2 = p0+W1, p3 = p2+1;
      idx.push(p0,p2,p1, p1,p2,p3);
    }
    const cg = new THREE.BufferGeometry();
    cg.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    cg.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
    cg.setIndex(idx);
    cg.computeVertexNormals();
    const crater = new THREE.Mesh(cg, new THREE.MeshLambertMaterial({
      map: TEX.ceil, side: THREE.DoubleSide }));
    crater.receiveShadow = true;
    g.add(crater);
    HOLE.crater = crater;

    /* A torn lip, following the ragged inner edge rather than a circle, so the
       plates stand off exactly where the deck actually failed. */
    const shards = [];
    for (let j=0;j<SEC;j+=2){
      const a = (j/SEC)*TAU + rnd(-0.06,0.06);
      const r = rin*lobe[j]*rnd(0.92, 1.1);
      shards.push({ g:new THREE.PlaneGeometry(rnd(0.3,0.9), rnd(0.25,0.75)),
                    p:[Math.sin(a)*r, WALL_H - 0.02 - dip*deep[j] + rnd(-0.1,0.3), Math.cos(a)*r],
                    r:[rnd(-1.6,-0.5), a, rnd(-0.7,0.7)] });
    }
    baked(g, shards, deckM, true);

    // roof steels, snapped, hanging through the tear
    const bars = [];
    for (let i=0;i<6;i++){
      const j = rndi(0,SEC-1);
      const a = (j/SEC)*TAU, r = rin*lobe[j]*rnd(0.15,0.9);
      bars.push({ g:new THREE.BoxGeometry(1,1,1),
                  p:[Math.sin(a)*r, WALL_H - dip - rnd(0.1, 1.0), Math.cos(a)*r],
                  r:[rnd(-0.9,0.9), rnd(0,TAU), rnd(-0.9,0.9)],
                  s:[0.07, rnd(0.8, 2.2), 0.07] });
    }
    baked(g, bars, barM, true);
  }

  /* Rain. Only under the gap, because rain everywhere would mean rain in rooms
     with a roof on them. Thin instanced streaks falling from above the opening
     to the floor and recycling — one draw call, no pooling logic, and it never
     has to interact with anything. */
  const N = LOWFI ? 90 : 220;
  const rgeo = new THREE.PlaneGeometry(0.02, 0.55);
  const rmat = new THREE.MeshBasicMaterial({
    color:0x9fb4cc, transparent:true, opacity:0.42, depthWrite:false, fog:true });
  const rain = new THREE.InstancedMesh(rgeo, rmat, N);
  rain.frustumCulled = false;
  g.add(rain);
  HOLE.rain = rain;
  HOLE.rainData = [];
  for (let i=0;i<N;i++)
    HOLE.rainData.push({ a: rnd(0,TAU), r: Math.sqrt(Math.random())*HOLE.rin*0.92,
                         y: rnd(0, WALL_H + 12), v: rnd(11, 17) });

  // a little cold coming down. one light, and dim — it is not a way out.
  if (!LOWFI){
    const moon = new THREE.PointLight(0x5d7ba8, 4.2, 18, 1.7);
    moon.position.set(0, WALL_H - 1.0, 0);
    g.add(moon);
  }

  g.position.set(HOLE.x, groundAt(HOLE.x, HOLE.z), HOLE.z);
  world.add(g);
  HOLE.group = g;

  // and the floor underneath is wearing the roof, and is wet
  const rubble = [];
  for (let i=0;i<18;i++){
    const a = rnd(0,TAU), r = rnd(0.4, HOLE.r*1.5);
    const rx = HOLE.x + Math.sin(a)*r, rz = HOLE.z + Math.cos(a)*r;
    rubble.push({ g:new THREE.BoxGeometry(1,1,1),
                  p:[rx, groundAt(rx,rz) + 0.05, rz],
                  r:[rnd(-0.3,0.3), rnd(0,TAU), rnd(-0.3,0.3)],
                  s:[rnd(0.3,1.1), 0.07, rnd(0.3,1.1)] });
  }
  const rub = new THREE.Mesh(bakeGeo(rubble), deckM);
  rub.receiveShadow = true;
  world.add(rub); DETAIL.push(rub);

  holeDeadBirds();

  /* The wet patch was a hard-edged black disc: a circle of night laid on the
     concrete with a visible rim, which is not what standing water looks like on
     a floor — it soaks outward and gives up. Alpha falls off toward the edge so
     it fades into the dry floor instead of stopping at it. */
  const wet = new THREE.Mesh(new THREE.PlaneGeometry(HOLE.r*3.4, HOLE.r*3.4),
    new THREE.MeshPhongMaterial({ color:0x121519, shininess:130, specular:0x6a7a88,
                                  map: texWetPatch(), alphaMap: texWetPatch(),
                                  transparent:true, opacity:0.9, depthWrite:false }));
  wet.rotation.x = -Math.PI/2;
  wet.position.set(HOLE.x, groundAt(HOLE.x, HOLE.z) + 0.02, HOLE.z);
  world.add(wet); DETAIL.push(wet);
}

const _rq = new THREE.Quaternion(), _rp = new THREE.Vector3(), _rs = new THREE.Vector3(1,1,1);
function updateHole(dt, now){
  if (!HOLE.on || !HOLE.group) return;

  // weather moves, slowly, and in one direction all night
  if (HOLE.sky){
    /* Fog cannot touch the sky — it has fog off, or the night would be the
       colour of the room — so distance is applied by hand instead. Without
       this it is the brightest thing in the building from anywhere with a
       clear line to the tear. */
    const dh = Math.hypot(P.x-HOLE.x, P.z-HOLE.z);
    const op = clamp(1 - (dh - 11)/16, 0, 1);
    HOLE.sky.material.opacity = op;
    HOLE.sky.visible = op > 0.015;
    /* Positioned from the player rather than from camera.position, because the
       camera is only moved by the render loop and this also runs from the tick
       hooks — reading the camera meant the sky silently stopped following in
       every headless test, and a test that cannot see the bug is worse than no
       test. P is the truth; the camera is a copy of it. */
    HOLE.sky.position.set(P.x, P.y + 38, P.z);   // the sky is not a place you can go
    if (HOLE.sky.material.map){
      HOLE.sky.material.map.offset.x = now * 0.0000075;
      HOLE.sky.material.map.offset.y = now * 0.0000038;
    }
  }

  const R = HOLE.rain;
  if (R){
    const d = HOLE.rainData;
    for (let i=0;i<d.length;i++){
      const p = d[i];
      p.y -= p.v * dt;
      if (p.y < 0.05){
        p.y = WALL_H + rnd(6, 14);
        p.a = rnd(0,TAU); p.r = Math.sqrt(Math.random())*HOLE.rin*0.92;
        p.v = rnd(11, 17);
      }
      _rp.set(Math.sin(p.a)*p.r, p.y, Math.cos(p.a)*p.r);
      _rs.set(1, 1, 1);
      _m.compose(_rp, _rq, _rs);
      R.setMatrixAt(i, _m);
    }
    R.instanceMatrix.needsUpdate = true;
  }

  /* Splashes on the concrete, and only when you are near enough to see them —
     borrowed from the particle pool rather than given their own, so heavy rain
     can never starve the dust and down of slots for long. */
  const near = Math.hypot(P.x-HOLE.x, P.z-HOLE.z);
  if (near < 22){
    HOLE.dropT -= dt;
    if (HOLE.dropT <= 0){
      HOLE.dropT = 0.07;
      const a = rnd(0,TAU), r = Math.sqrt(Math.random())*HOLE.r;
      for (let s=0;s<2;s++){
        const sa = rnd(0,TAU), sp = rnd(0.4,1.2);
        emitFX(FX_SPLASH, HOLE.x + Math.sin(a)*r, 0.04, HOLE.z + Math.cos(a)*r,
               Math.sin(sa)*sp, rnd(0.7,1.6), Math.cos(sa)*sp, 0.013, rnd(0.25,0.5));
      }
    }
  }
}

/* ==========================================================================
   RAIN
   It used to be a two-second bandpassed noise burst retriggered every 1.9
   seconds, which is not what rain sounds like — it is what a wave sounds like,
   over and over, and the seam between one and the next was audible every time.

   Now it is one held source that never restarts: a wide hiss for the rain in
   the air and a low body for the rain hitting concrete, with the filter
   opening and the level rising as you walk under the gap. Gusts come from a
   slow wobble on the gain rather than from retriggering anything, so it never
   has a beginning. On top of it, individual fat drops off the torn deck —
   those ARE discrete events, and they are the part that tells you the roof is
   broken rather than that the weather is bad.
   ========================================================================== */
const RAINSND = { src:null, gain:null, lp:null, hp:null, pan:null,
                  body:null, bodyLp:null, phase:0, tickT:0 };

function stopRainBed(){
  if (!RAINSND.src) return;
  try { RAINSND.src.stop(); } catch(e){}
  try { RAINSND.gain.disconnect(); } catch(e){}
  RAINSND.src = null; RAINSND.gain = null;
}

function startRainBed(){
  if (!AC || !noiseBuf || RAINSND.src) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 520;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';  lp.frequency.value = 2200;
  // the low half: rain landing on a concrete floor rather than rain falling
  const body = AC.createBiquadFilter(); body.type = 'lowpass'; body.frequency.value = 380;
  const bodyG = AC.createGain(); bodyG.gain.value = 0.55;
  const g = AC.createGain(); g.gain.value = 0;
  const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
  s.connect(hp); hp.connect(lp); lp.connect(g);
  s.connect(body); body.connect(bodyG); bodyG.connect(g);
  if (pan){ g.connect(pan); pan.connect(master); } else g.connect(master);
  s.start();
  RAINSND.src = s; RAINSND.gain = g; RAINSND.lp = lp; RAINSND.hp = hp;
  RAINSND.pan = pan; RAINSND.body = body;
}

function updateRainBed(dt){
  if (!AC) return;
  if (!HOLE.on || MODE !== 'play'){ stopRainBed(); return; }
  if (!RAINSND.src) startRainBed();
  if (!RAINSND.src) return;

  const d = Math.hypot(P.x-HOLE.x, P.z-HOLE.z);
  const near = clamp(1 - d/32, 0, 1);
  RAINSND.phase += dt * 0.21;
  const gust = 0.8 + Math.sin(RAINSND.phase)*0.13 + Math.sin(RAINSND.phase*2.7)*0.07;
  const want = near*near * 0.16 * gust;
  // ramped in code, not scheduled, so it tracks the player instead of stepping
  const gp = RAINSND.gain.gain;
  gp.value += (want - gp.value) * Math.min(1, dt*2.2);
  // standing under it, you hear the top end of it. from the next room you don't.
  RAINSND.lp.frequency.value = 1100 + near*6400;
  RAINSND.hp.frequency.value = 260 + (1-near)*420;
  if (RAINSND.pan) RAINSND.pan.pan.value = panFor(HOLE.x, HOLE.z) * (0.35 + near*0.5);

  RAINSND.tickT -= dt;
  if (RAINSND.tickT <= 0){
    RAINSND.tickT = rnd(0.14, 0.7) / (0.3 + near);
    if (near > 0.22) sfxRainDrop(near);
  }
}

/* One drop, off a bent panel, onto concrete. Short, dark, and slightly
   different every time so it never becomes a metronome. */
function sfxRainDrop(near){
  if (!AC) return;
  const t = AC.currentTime, v = near * rnd(0.02, 0.075);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.setValueAtTime(rnd(900, 2600), t);
  f.frequency.exponentialRampToValueAtTime(rnd(300, 700), t+0.06);
  f.Q.value = 3.4;
  const g = AC.createGain();
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + rnd(0.05, 0.13));
  s.connect(f); f.connect(g);
  panned(g, HOLE.x + rnd(-2,2), HOLE.z + rnd(-2,2));
  s.start(t); s.stop(t+0.2);
}

/* Whatever came through the roof did not come through it politely, and it did
   not come through it alone. A few of the small ones are still underneath,
   which is the only place in the building where the flock is not a nuisance. */
function holeDeadBirds(){
  /* These were an abstraction — a lump, a neck and a leg — and they read as
     pillows. A dead hen has to be the SAME hen you have been walking past all
     night, because the whole point of it is recognition: you know exactly what
     that shape is, and it is on its side and not moving.

     So they are built from the flock's own proportions, part for part, and the
     only difference is that they are rolled ninety degrees onto one flank with
     the legs out and the neck given up. Baked, so all of them together are two
     draw calls. */
  const pale = [], dark = [], red = [], beakP = [];
  const BODY = new THREE.SphereGeometry(0.18, 6, 5);  BODY.scale(1, 0.92, 1.22);
  const WING = new THREE.SphereGeometry(0.12, 5, 3);  WING.scale(0.32, 0.78, 1.15);
  const HEAD = new THREE.SphereGeometry(0.088, 5, 4);
  const BEAK = new THREE.ConeGeometry(0.035, 0.1, 4);
  const COMB = new THREE.BoxGeometry(0.02, 0.055, 0.075);
  const TAIL = new THREE.ConeGeometry(0.1, 0.2, 4);
  const TAIL2= new THREE.ConeGeometry(0.14, 0.3, 4);
  const LEG  = new THREE.BoxGeometry(0.055, 0.12, 0.055);

  const n = 4 + (Math.random()*3|0);
  for (let i=0;i<n;i++){
    const a = rnd(0,TAU), r = rnd(0.8, HOLE.r*1.2);
    const x = HOLE.x + Math.sin(a)*r, z = HOLE.z + Math.cos(a)*r;
    const gy = groundAt(x, z);
    const yaw = rnd(0,TAU);
    const fx = Math.sin(yaw), fz = Math.cos(yaw);          // the way it is pointing
    const side = Math.random() < 0.5 ? 1 : -1;
    const sx = Math.cos(yaw)*side, sz = -Math.sin(yaw)*side; // which flank is up
    const roll = side * 1.5;
    const H = 0.17;                                         // half a body, on its side

    pale.push({ g:BODY, p:[x, gy+H, z], r:[0, yaw, roll] });
    // the neck goes slack: the head is forward and DOWN on the concrete
    const hx = x + fx*0.21 - sx*0.02, hz = z + fz*0.21 - sz*0.02;
    pale.push({ g:HEAD, p:[hx, gy+0.085, hz], r:[0, yaw, roll] });
    beakP.push({ g:BEAK, p:[hx + fx*0.085, gy+0.075, hz + fz*0.085],
                 r:[Math.PI/2, yaw, 0] });
    red.push({ g:COMB, p:[hx - sx*0.06, gy+0.095, hz - sz*0.06], r:[0, yaw, roll] });
    red.push({ g:COMB, p:[hx + fx*0.04 - sx*0.02, gy+0.045, hz + fz*0.04 - sz*0.02],
               s:[0.8,0.7,0.7], r:[0, yaw, roll] });
    // tail, still fanned, lying over
    pale.push({ g:TAIL,  p:[x - fx*0.20, gy+H+0.02, z - fz*0.20], r:[-1.2+roll*0.15, yaw, roll] });
    pale.push({ g:TAIL2, p:[x - fx*0.25, gy+H+0.05, z - fz*0.25], r:[-1.35+roll*0.15, yaw, roll] });
    // the upper wing open, the lower one under the body where you cannot see it
    pale.push({ g:WING, p:[x - sx*0.13, gy+H+0.06, z - sz*0.13],
                r:[rnd(-0.3,0.3), yaw, roll + side*0.55] });
    /* Legs out sideways and slightly up, which is the thing that makes it read
       as dead from across the room rather than as a bird sitting down. */
    for (let k=-1;k<=1;k+=2){
      dark.push({ g:LEG, p:[x - sx*0.16 + fx*0.05*k, gy+0.20, z - sz*0.16 + fz*0.05*k],
                  r:[rnd(-0.4,0.4), yaw, roll + side*0.9] });
    }
  }

  /* Dirtier than the living ones. The flock is pale so the beam finds it; these
     are not meant to be found across a room, they are meant to be trodden on. */
  const bodies = new THREE.Mesh(bakeGeo(pale),
    new THREE.MeshLambertMaterial({ color:0xa79f8c }));
  bodies.castShadow = true; bodies.receiveShadow = true;
  world.add(bodies); DETAIL.push(bodies);

  const legs = new THREE.Mesh(bakeGeo(dark),
    new THREE.MeshLambertMaterial({ color:0x2a2520 }));
  legs.castShadow = true;
  world.add(legs); DETAIL.push(legs);

  // comb and beak share a mesh: at this size and this light nobody is going to
  // audit the difference between dead comb and horn, and it is a draw call
  const combs = new THREE.Mesh(bakeGeo(red.concat(beakP)),
    new THREE.MeshLambertMaterial({ color:0x7d3a28 }));
  world.add(combs); DETAIL.push(combs);
}


/* Not a cluck. A shuffle, a scrape of feet on concrete, and once in a while
   something that is nearly a voice. */
function sfxWatcher(dist, x, z, close){
  if (!AC) return;
  const v = clamp(1 - dist/22, 0.08, 1) * (close ? 1.5 : 0.8);
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type='bandpass';
  f.frequency.value = rnd(700, 2200); f.Q.value = 1.1;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.09*v, t+0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, t+rnd(0.3, 0.7));
  s.connect(f); f.connect(g); panned(g, x, z);
  s.start(t); s.stop(t+0.8);
  if (close && Math.random() < 0.5){
    const o = AC.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(rnd(190,320), t);
    o.frequency.exponentialRampToValueAtTime(rnd(90,150), t+0.3);
    const og = AC.createGain();
    og.gain.setValueAtTime(0.05*v, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
    o.connect(og); panned(og, x, z);
    o.start(t); o.stop(t+0.36);
  }
}

function sfxWatcherBolt(x, z){
  if (!AC) return;
  noiseBurst(0.42, 'bandpass', 1400, 1.5, 0.22);
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type='square';
  o.frequency.setValueAtTime(rnd(520,760), t);
  o.frequency.exponentialRampToValueAtTime(rnd(160,240), t+0.28);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.1, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.32);
  o.connect(g); panned(g, x, z);
  o.start(t); o.stop(t+0.34);
}

/* ==========================================================================
   THE PEEKER
   Nights three onward. It never comes to find you and it never follows you.
   It is simply already at the corner when you turn round, with most of itself
   still behind the wall, looking at you. That is the entire behaviour.

   The watcher is the thing that will not stop arriving. This is the thing that
   was already there — and the difference matters, because you can hear the
   watcher coming and there is nothing to hear here. It places itself only at
   a corner, only at range, and only while you are not looking, so the moment
   it exists for you is the moment you happen to face the right way.

   Get close and it is round the corner and gone before you finish getting
   close, which is the other half of it: you never get a proper look at one.
   ========================================================================== */
const PEEK = {
  on:false, bird:null, alive:false, state:'off',
  x:0, z:0, homeX:0, homeZ:0, yaw:0, spd:0, gait:0, bob:0,
  t:0, seenT:0, far:0, fade:1, respawn:0, fleeX:0, fleeZ:0,
  path:[], pathT:0,
};

const PEEKCFG = {
  viewAngle: 1.0,     // wider than the watcher's: it is meant to be caught
                      // at the edge of vision, not found with the beam
  scareDist: 6.2,     // twenty feet. walk inside that and it is gone.
  stareOut: 5.0,      // or hold a look on it long enough and it goes anyway
  minDist: 8,
  maxDist: 21,
  fleeSpd: 8.4,       // faster than the watcher. this one you never catch.
  respawn: 9,
  first: 7,
  /* Stranding has to be FURTHER than it can spawn, or the timer starts running
     the instant it arrives and kills half of them before you have had a chance
     to walk towards one. Tuned by measurement, not by feel: at sixteen metres
     it produced twenty spawns in three minutes and one sighting; at twenty-six
     it produces nine and three. */
  strand: 26,
  strandT: 5,
  lean: 0.74,         // how far into the wall the body sits
  size: 0.84,         // a shade smaller than the watcher
};

/* Three through six. On six it stops the instant the egg leaves the nest —
   what happens after that has one bird in it and does not want an audience. */
function peekerWanted(shift){
  if (shift < 3) return false;
  if (shift >= 6 && KNOWS) return false;
  return true;
}

function newPeekerBird(){
  const B = {};
  B.group = buildWatcherModel(B, { body:0x9a927f, dark:0x1a1712, comb:0x51120f });
  world.add(B.group);
  return B;
}

function peekerReset(shift){
  PEEK.on = peekerWanted(shift);
  PEEK.alive = false; PEEK.state = 'off';
  PEEK.fade = 1; PEEK.spd = 0; PEEK.seenT = 0; PEEK.far = 0;
  PEEK.respawn = PEEKCFG.first;
  PEEK.path = []; PEEK.pathT = 0;
  if (PEEK.bird && PEEK.bird.group){
    PEEK.bird.group.visible = false;
    if (!PEEK.bird.group.parent) world.add(PEEK.bird.group);
  }
}

/* A corner is a walkable cell with a wall on one side and open floor on the
   others — something you could step round. One solid neighbour or two; three
   is an alcove and the bird would be standing in a cupboard, and none is the
   middle of a room, where there is nothing to peer round.

   Only real wall counts. Cage stacks are value 2 and they do not occlude the
   way a wall does, so hiding a body behind one would hide nothing. */
function peekerHideDir(cx, cy){
  const solid = (x,y) => gAt(x,y) === 1;
  const dirs = [];
  if (solid(cx, cy-1)) dirs.push({ x:0, y:-1 });
  if (solid(cx, cy+1)) dirs.push({ x:0, y:1 });
  if (solid(cx-1, cy)) dirs.push({ x:-1, y:0 });
  if (solid(cx+1, cy)) dirs.push({ x:1, y:0 });
  if (!dirs.length || dirs.length > 2) return null;
  return pick(dirs);
}

function peekerSeen(){
  if (!PEEK.alive) return false;
  const dx = PEEK.x - P.x, dz = PEEK.z - P.z;
  const d = Math.hypot(dx, dz) || 1e-4;
  const dir = camDir();
  if ((dx*dir.x + dz*dir.z)/d < Math.cos(PEEKCFG.viewAngle)) return false;
  return losClear(P.x, P.z, PEEK.x, PEEK.z);
}

/* Place it, then CHECK. Every filter in peekerSpawn tests the cell centre, and
   the bird does not stand at the cell centre — it leans most of a metre and a
   half toward the wall, and that lean can carry a head far enough into a
   doorway to be visible from where the cell centre was not. Testing the sample
   instead of the result is the same mistake the rooster made twice. */
function peekerPlace(cx, cy, hide){
  const w = cellToWorld(cx, cy);
  PEEK.homeX = w.x; PEEK.homeZ = w.z;
  /* Leaned into the wall on purpose. The body ends up inside the geometry and
     the head and neck do not, which is what makes it read as something looking
     round a corner rather than something standing next to one. It never walks
     in this state, so nothing ever has to resolve the overlap. */
  PEEK.x = w.x + hide.x * CFG.cell * 0.5 * PEEKCFG.lean;
  PEEK.z = w.z + hide.y * CFG.cell * 0.5 * PEEKCFG.lean;
  PEEK.yaw = Math.atan2(P.x - PEEK.x, P.z - PEEK.z);
  PEEK.alive = true; PEEK.state = 'peek';
  PEEK.t = 0; PEEK.seenT = 0; PEEK.far = 0; PEEK.fade = 1; PEEK.spd = 0;
  PEEK.bob = rnd(0, TAU); PEEK.path = []; PEEK.pathT = 0;
  if (!PEEK.bird) PEEK.bird = newPeekerBird();
  if (!PEEK.bird.group.parent) world.add(PEEK.bird.group);
  if (peekerSeen()){ PEEK.alive = false; PEEK.state = 'off'; return false; }
  PEEK.bird.group.visible = true;
  return true;
}

function peekerSpawn(){
  if (!PEEK.bird) PEEK.bird = newPeekerBird();
  const dir = camDir();

  /* Best of all: around the NEXT corner. March along the way you are facing
     until the wall in front of you, then look for a corner cell just past it.
     Spawning "somewhere ahead" is a lottery on a map with this many branches —
     spawning at the end of the corridor you are currently walking down is not.
     Keep walking and you will meet it. */
  {
    let hx = P.x, hz = P.z, steps = 0;
    for (; steps<34; steps++){
      const nx = hx + dir.x*1.3, nz = hz + dir.z*1.3;
      const c = worldToCell(nx, nz);
      if (gAt(c.x, c.y) !== 0) break;
      hx = nx; hz = nz;
    }
    if (steps >= 3){
      for (let i=0;i<200;i++){
        const a = rnd(0,TAU), r = rnd(1.5, 9);
        const c = worldToCell(hx + Math.sin(a)*r, hz + Math.cos(a)*r);
        if (!walkable(c.x, c.y)) continue;
        const hide = peekerHideDir(c.x, c.y);
        if (!hide) continue;
        const w = cellToWorld(c.x, c.y);
        if (Math.hypot(w.x-P.x, w.z-P.z) < PEEKCFG.minDist) continue;
        if (losClear(P.x, P.z, w.x, w.z)) continue;      // not yet in sight
        if (!peekerPlace(c.x, c.y, hide)) continue;
        return true;
      }
    }
  }

  /* Second: a corner AHEAD of you that you cannot see yet.

     This used to prefer somewhere squarely behind you with a clear line to it,
     on the theory that the scare is turning round and finding it. Measured over
     three simulated minutes of walking, that produced eight or nine perfectly
     correct spawns and about six seconds of the bird ever being on screen —
     and on one night in three, none at all. It was waiting in places the
     player had already finished with.

     Put it where you are GOING instead, behind something, and you walk round
     the corner into it. Same bird, same behaviour, and now it is a thing that
     happens to you rather than a thing that happens where you have been. */
  for (let i=0;i<260;i++){
    const a = rnd(0,TAU), r = rnd(PEEKCFG.minDist, PEEKCFG.maxDist);
    const c = worldToCell(P.x + Math.sin(a)*r, P.z + Math.cos(a)*r);
    if (!walkable(c.x, c.y)) continue;
    const hide = peekerHideDir(c.x, c.y);
    if (!hide) continue;
    const w = cellToWorld(c.x, c.y);
    const dx = w.x - P.x, dz = w.z - P.z, d = Math.hypot(dx, dz) || 1;
    if (d < PEEKCFG.minDist) continue;
    if ((dx*dir.x + dz*dir.z)/d < 0.25) continue;       // out in front of you
    if (losClear(P.x, P.z, w.x, w.z)) continue;         // but not yet in sight
    if (!peekerPlace(c.x, c.y, hide)) continue;
    return true;
  }

  /* Third: squarely behind you with a clear line to it, so it is already
     waiting the moment you happen to turn round. */
  for (let i=0;i<200;i++){
    const a = rnd(0,TAU), r = rnd(PEEKCFG.minDist, PEEKCFG.maxDist);
    const c = worldToCell(P.x + Math.sin(a)*r, P.z + Math.cos(a)*r);
    if (!walkable(c.x, c.y)) continue;
    const hide = peekerHideDir(c.x, c.y);
    if (!hide) continue;
    const w = cellToWorld(c.x, c.y);
    const dx = w.x - P.x, dz = w.z - P.z, d = Math.hypot(dx, dz) || 1;
    if (d < PEEKCFG.minDist) continue;
    if ((dx*dir.x + dz*dir.z)/d > -0.15) continue;      // must be behind you now
    if (!losClear(P.x, P.z, w.x, w.z)) continue;        // and reachable by eye later
    if (!peekerPlace(c.x, c.y, hide)) continue;
    return true;
  }
  /* Last choice: a corner anywhere at range that you currently cannot see at
     all. It costs the turn-round moment, but a bird that never appears is
     worse than one that appears when you walk into the next aisle. What it may
     never do is arrive in plain sight, so the LOS test stays. */
  for (let i=0;i<240;i++){
    const a = rnd(0,TAU), r = rnd(PEEKCFG.minDist, PEEKCFG.maxDist + 8);
    const c = worldToCell(P.x + Math.sin(a)*r, P.z + Math.cos(a)*r);
    if (!walkable(c.x, c.y)) continue;
    const hide = peekerHideDir(c.x, c.y);
    if (!hide) continue;
    const w = cellToWorld(c.x, c.y);
    if (Math.hypot(w.x-P.x, w.z-P.z) < PEEKCFG.minDist) continue;
    if (losClear(P.x, P.z, w.x, w.z)) continue;         // hidden by the building
    if (!peekerPlace(c.x, c.y, hide)) continue;
    return true;
  }
  PEEK.respawn = 3;
  return false;
}

function peekerBreak(){
  if (!PEEK.alive || PEEK.state === 'flee') return;
  PEEK.state = 'flee'; PEEK.t = 0;
  /* Out of the wall first. It has been standing half inside one, and asking a
     collider to resolve that while it is also trying to sprint produces a bird
     that shudders in place for a second and then leaves — which looks like a
     bug, because it is one. Snap to the cell it was leaning out of, then run. */
  PEEK.x = PEEK.homeX; PEEK.z = PEEK.homeZ;
  const fx = PEEK.x - P.x, fz = PEEK.z - P.z, fd = Math.hypot(fx, fz) || 1;
  PEEK.fleeX = fx/fd; PEEK.fleeZ = fz/fd;
  PEEK.path = []; PEEK.pathT = 0;
  sfxPeekerBolt(PEEK.x, PEEK.z);
}

function peekerGone(quick){
  PEEK.alive = false; PEEK.state = 'off'; PEEK.spd = 0;
  if (PEEK.bird && PEEK.bird.group) PEEK.bird.group.visible = false;
  /* Two very different exits. One you saw and chased off, and the building
     should be quiet for a bit afterwards. The other you never came near, and
     the bird is just standing in a corridor you have finished with — that one
     should pick a new corner almost immediately, because two thirds of them
     end that way and every second it waits is a second it is not frightening
     anybody. */
  PEEK.respawn = quick ? rnd(1.6, 3.4) : PEEKCFG.respawn * rnd(0.7, 1.5);
}

function updatePeeker(dt){
  if (MODE !== 'play' || !P.alive) return;
  const want = peekerWanted(CAMPAIGN.shift);
  PEEK.on = want;

  if (!PEEK.alive){
    if (!want) return;
    PEEK.respawn -= dt;
    if (PEEK.respawn <= 0){ peekerSpawn(); PEEK.respawn = PEEKCFG.respawn; }
    return;
  }

  // the egg came off the nest while one was out: it leaves like everything else
  if (!want) peekerBreak();

  const dist = Math.hypot(P.x - PEEK.x, P.z - PEEK.z);
  const seen = peekerSeen();

  if (PEEK.state === 'peek'){
    PEEK.t += dt;
    PEEK.spd = 0;
    /* If you never come back this way it gives up and goes somewhere else.
       Without this, one bird could pick a corner of a corridor you happened
       never to walk down again and stand in it for the whole night — the
       system would be working perfectly and you would never once see it, which
       is precisely what happened. It may only leave while unseen, same as
       everything else here. */
    PEEK.far = (dist > PEEKCFG.strand) ? PEEK.far + dt : 0;
    if (PEEK.far > PEEKCFG.strandT && !seen){ peekerGone(true); return; }
    // it tracks you the whole time, slowly, and it does not blink
    const wantYaw = Math.atan2(P.x - PEEK.x, P.z - PEEK.z);
    let dy = wantYaw - PEEK.yaw;
    while (dy > Math.PI) dy -= TAU;
    while (dy < -Math.PI) dy += TAU;
    PEEK.yaw += dy * Math.min(1, dt*2.2);

    PEEK.seenT = seen ? PEEK.seenT + dt : 0;
    if (dist < PEEKCFG.scareDist || PEEK.seenT > PEEKCFG.stareOut) peekerBreak();

  } else if (PEEK.state === 'flee'){
    PEEK.t += dt;
    PEEK.spd = PEEKCFG.fleeSpd;
    watcherStep(PEEK, dt,
                PEEK.x + PEEK.fleeX*14 + rnd(-2.5,2.5),
                PEEK.z + PEEK.fleeZ*14 + rnd(-2.5,2.5),
                PEEK.spd);
    /* Same rule as everything else in this building: it may only stop existing
       while you are not looking at it, and no timeout is allowed to override
       that. If it cannot get out of your sight it keeps running. */
    if (PEEK.t > 0.35 && !peekerSeen()) PEEK.fade -= dt*3.4;
    else PEEK.fade = Math.min(1, PEEK.fade + dt*3.4);
    if (PEEK.fade <= 0){ peekerGone(); return; }
  }

  // ---- pose ----
  const B = PEEK.bird;
  if (!B) return;
  B.group.position.set(PEEK.x, groundAt(PEEK.x, PEEK.z), PEEK.z);
  B.group.rotation.y = PEEK.yaw;
  const moving = PEEK.spd > 0.05;
  PEEK.gait += dt * (moving ? 3.0 + PEEK.spd : 0);
  const sw = moving ? Math.sin(PEEK.gait*2) * 0.6 : 0;
  if (B.legL) B.legL.rotation.x =  sw;
  if (B.legR) B.legR.rotation.x = -sw;
  if (B.head){
    PEEK.bob += dt * (moving ? 0 : 1.5);
    /* Standing still, a bird is never actually still: the head resets in tiny
       held jerks. That is the whole performance — there is nothing else for it
       to do, and a dead-still model would read as a prop. */
    B.head.rotation.z = moving ? 0 : Math.sin(PEEK.bob*0.9) * 0.36;
    B.head.rotation.y = moving ? 0 : Math.sin(PEEK.bob*0.29) * 0.24;
    B.head.position.z = 0.24 + (moving ? Math.sin(PEEK.gait*2)*0.06 : 0);
  }
  const s = Math.max(0.001, PEEK.fade) * PEEKCFG.size;
  B.group.scale.set(s, s, s);
}

/* It leaves louder than it stood there. A scrape, a single clipped note, and
   the wingbeat of something that did not want to be found. */
function sfxPeekerBolt(x, z){
  if (!AC) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.setValueAtTime(2600, t);
  f.frequency.exponentialRampToValueAtTime(700, t+0.3);
  f.Q.value = 1.3;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.14, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.34);
  s.connect(f); f.connect(g); panned(g, x, z);
  s.start(t); s.stop(t+0.36);

  const o = AC.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(rnd(420, 620), t);
  o.frequency.exponentialRampToValueAtTime(rnd(160, 240), t+0.16);
  const og = AC.createGain();
  og.gain.setValueAtTime(0.07, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t+0.2);
  o.connect(og); panned(og, x, z);
  o.start(t); o.stop(t+0.22);
}
