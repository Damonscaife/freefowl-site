    const k = rnd(1.1, 3.4);
    const sx = w.x + rnd(-1.6,1.6), sz = w.z + rnd(-1.6,1.6);
    _p.set(sx, groundAt(sx,sz) + 0.016, sz);
    _s.set(k, k, k);
    _e.set(-Math.PI/2, 0, Math.random()*TAU, 'XYZ'); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); m.setMatrixAt(i,_m);
  }
  m.instanceMatrix.needsUpdate = true;
  world.add(m); DETAIL.push(m);
}

function texStain(){
  const s=128, c=makeCanvas(s), g=c.getContext('2d');
  g.clearRect(0,0,s,s);
  const cx=s/2, cy=s/2;
  for (let i=0;i<14;i++){
    const a=Math.random()*TAU, r=rnd(s*0.08,s*0.4);
    const x=cx+Math.cos(a)*rnd(0,s*0.16), y=cy+Math.sin(a)*rnd(0,s*0.16);
    const grd=g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,'rgba(24,10,8,.85)');
    grd.addColorStop(0.6,'rgba(30,14,10,.4)');
    grd.addColorStop(1,'rgba(30,14,10,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* The ones that did not make it. Pressed flat, wings out, still here. */
function buildDeadBirds(){
  const openCells = [];
  for (let y=2;y<G.h-2;y++) for (let x=2;x<G.w-2;x++) if (gAt(x,y)===0) openCells.push({x,y});
  if (!openCells.length) return;
  const n = 26;
  const geo = new THREE.SphereGeometry(0.17, 6, 5);
  geo.scale(1, 0.34, 1.25);
  const mat = new THREE.MeshLambertMaterial({ color:0x6e6455 });
  const m = new THREE.InstancedMesh(geo, mat, n);
  m.frustumCulled = false; m.receiveShadow = true;
  for (let i=0;i<n;i++){
    const c = pick(openCells), w = cellToWorld(c.x,c.y);
    const bx = w.x + rnd(-1.7,1.7), bz = w.z + rnd(-1.7,1.7);
    setInst(m, i, bx, groundAt(bx,bz) + 0.06, bz,
            rnd(0.8,1.15), 1, rnd(0.8,1.15), Math.random()*TAU);
  }
  m.instanceMatrix.needsUpdate = true;
  world.add(m); DETAIL.push(m);
}

/* Things still hanging on the shackle line. You do not want to look up. */
function buildHangers(){
  const proc = roomOf('proc') || roomOf('hatchery') || roomOf('incubator');
  if (!proc) return;
  const c0 = cellToWorld(proc.x+1, proc.y+1);
  const n = 9;
  const geo = new THREE.SphereGeometry(0.2, 6, 5);
  geo.scale(0.8, 1.5, 0.8);
  const mat = new THREE.MeshLambertMaterial({ color:0x7a6a58 });
  const m = new THREE.InstancedMesh(geo, mat, n);
  m.frustumCulled = false; m.castShadow = true;
  const data = [];
  for (let i=0;i<n;i++){
    data.push({ x: c0.x + i*1.25, y: groundAt(c0.x + i*1.25, c0.z),
                z: c0.z, ph: Math.random()*TAU, amp: rnd(0.01,0.05) });
  }
  world.add(m); DETAIL.push(m);
  props.push({ kind:'hangers', obj:m, data });
}

function updateHangers(mesh, data, now){
  for (let i=0;i<data.length;i++){
    const d = data[i];
    const sway = Math.sin(now*0.0009 + d.ph)*d.amp;
    setInst(mesh, i, d.x + sway*8, (d.y||0) + WALL_H - 1.5, d.z, 1,1,1, 0);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

/* ==========================================================================
   ODDITIES
   The building is full of clutter and none of it means anything, which is
   correct — a working shed IS full of meaningless clutter. But a place only
   becomes frightening when something in it was ARRANGED, and arrangement is
   the one thing a scatter of instanced props can never imply.

   These are one-offs. Each is a single object placed once a night, in a random
   room, and each one is somebody having done something. Nothing explains them
   and nothing ever will. You are meant to walk past, stop, and come back.
   ========================================================================== */
function oddSpots(n){
  const cells = [];
  for (let y=3;y<G.h-3;y++) for (let x=3;x<G.w-3;x++)
    if (gAt(x,y)===0 && !inBayCell(x,y)) cells.push({x,y});
  const out = [];
  for (let i=0;i<n && cells.length;i++){
    const c = cells.splice(Math.floor(Math.random()*cells.length),1)[0];
    const w = cellToWorld(c.x,c.y);
    const x = w.x + rnd(-1.1,1.1), z = w.z + rnd(-1.1,1.1);
    out.push({ x, z, y: groundAt(x,z), cx:c.x, cy:c.y });
  }
  return out;
}

function buildOddities(){
  const BOX = new THREE.BoxGeometry(1,1,1);
  const CYL = new THREE.CylinderGeometry(1,1,1,7);
  const SPH = new THREE.SphereGeometry(1,7,5);
  /* Three materials, not six. Every one of these is a whole extra draw call
     for an object you look at once, and wood and cloth are close enough at
     torchlight, as are steel and rubber, as are bone and eggshell. */
  const woodM  = new THREE.MeshLambertMaterial({ color:0x4f4130 });
  const steelM = new THREE.MeshLambertMaterial({ color:0x3f4448 });
  const boneM  = new THREE.MeshLambertMaterial({ color:0xd2cab6 });
  const wood=[], steel=[], bone=[];
  const rubber = steel, shell = bone, cloth = wood;
  const S = oddSpots(9);
  let k = 0;
  const next = () => S[k++] || S[0];
  if (!S.length) return;

  /* 1. A chair, in the middle of a room, facing the wall. Not knocked over.
        Not by a table. Placed, squarely, by someone who then sat in it. */
  {
    const s = next();
    const near = nearestWallDir(s.cx, s.cy);
    const a = Math.atan2(near.x, near.y);
    wood.push({ g:BOX, p:[s.x, s.y+0.44, s.z], r:[0,a,0], s:[0.44,0.05,0.44] });
    wood.push({ g:BOX, p:[s.x - Math.sin(a)*0.21, s.y+0.7, s.z - Math.cos(a)*0.21],
                r:[0,a,0], s:[0.44,0.52,0.05] });
    for (const [ox,oz] of [[-0.18,-0.18],[0.18,-0.18],[-0.18,0.18],[0.18,0.18]]){
      const rx = ox*Math.cos(a) - oz*Math.sin(a), rz = ox*Math.sin(a) + oz*Math.cos(a);
      wood.push({ g:BOX, p:[s.x+rx, s.y+0.22, s.z+rz], r:[0,a,0], s:[0.05,0.44,0.05] });
    }
  }

  /* 2. Egg flats stacked into something about the height of a person, with a
        skull on top. Whoever built it used the materials to hand. */
  {
    const s = next();
    for (let i=0;i<14;i++)
      wood.push({ g:BOX, p:[s.x+rnd(-0.05,0.05), s.y+0.06+i*0.11, s.z+rnd(-0.05,0.05)],
                  r:[0,rnd(0,TAU),0], s:[0.76,0.09,0.76] });
    bone.push({ g:SPH, p:[s.x, s.y+1.72, s.z], s:[0.13,0.11,0.17] });
    bone.push({ g:new THREE.ConeGeometry(1,1,5), p:[s.x, s.y+1.7, s.z+0.2],
                r:[Math.PI/2,0,0], s:[0.05,0.2,0.05] });
  }

  /* 3. A ring of shells laid on the floor. Evenly spaced. One egg in the
        middle of it, unbroken. */
  {
    const s = next();
    const R = rnd(1.0, 1.5), N = 24;
    for (let i=0;i<N;i++){
      const a = (i/N)*TAU;
      shell.push({ g:new THREE.SphereGeometry(1,5,4,0,TAU,0,Math.PI*0.6),
                   p:[s.x+Math.sin(a)*R, s.y+0.03, s.z+Math.cos(a)*R],
                   r:[Math.PI,a,0], s:[0.09,0.09,0.09] });
    }
    shell.push({ g:SPH, p:[s.x, s.y+0.11, s.z], s:[0.1,0.13,0.1] });
  }

  /* 4. Boots, in a line against a wall, toes out. Nine of them. */
  {
    const s = next();
    const near = nearestWallDir(s.cx, s.cy);
    const a = Math.atan2(near.x, near.y);
    const tx = Math.cos(a), tz = -Math.sin(a);
    for (let i=0;i<9;i++){
      const o = (i-4)*0.30;
      const bx = s.x + tx*o + Math.sin(a)*1.5, bz = s.z + tz*o + Math.cos(a)*1.5;
      rubber.push({ g:CYL, p:[bx, s.y+0.17, bz], r:[0,a,0], s:[0.09,0.34,0.09] });
      rubber.push({ g:BOX, p:[bx - Math.sin(a)*0.09, s.y+0.04, bz - Math.cos(a)*0.09],
                    r:[0,a,0], s:[0.16,0.08,0.26] });
    }
  }

  /* 5. Leg rings. Hundreds of them, threaded on wire and hung from the roof in
        a curtain, which is one of those things that is only sinister because
        of how long it must have taken. */
  {
    const s = next();
    for (let c=0;c<7;c++){
      const cx = s.x + (c-3)*0.16;
      for (let i=0;i<11;i++)
        steel.push({ g:new THREE.TorusGeometry(0.045,0.012,4,7),
                     p:[cx, s.y+0.9+i*0.17, s.z], r:[Math.PI/2,rnd(0,TAU),0] });
      steel.push({ g:CYL, p:[cx, s.y+1.9, s.z], s:[0.006, WALL_H-1.9, 0.006] });
    }
  }

  /* 6. A wall clock, stopped, hung where nobody working would ever see it. */
  {
    const s = next();
    const near = nearestWallDir(s.cx, s.cy);
    const a = Math.atan2(near.x, near.y);
    const wx = s.x + Math.sin(a)*(CFG.cell/2-0.2), wz = s.z + Math.cos(a)*(CFG.cell/2-0.2);
    steel.push({ g:CYL, p:[wx, s.y+2.05, wz], r:[Math.PI/2 - 0, a, 0], s:[0.19,0.07,0.19] });
    bone.push({ g:BOX, p:[wx - Math.sin(a)*0.05, s.y+2.11, wz - Math.cos(a)*0.05],
                r:[0,a,0], s:[0.014,0.12,0.014] });
    bone.push({ g:BOX, p:[wx - Math.sin(a)*0.05, s.y+2.02, wz - Math.cos(a)*0.05],
                r:[0,a,0.9], s:[0.014,0.09,0.014] });
  }

  /* 7. A trolley, nose into a corner, still loaded. */
  {
    const s = next();
    const near = nearestWallDir(s.cx, s.cy);
    const a = Math.atan2(near.x, near.y);
    steel.push({ g:BOX, p:[s.x, s.y+0.34, s.z], r:[0,a,0], s:[0.7,0.05,1.05] });
    steel.push({ g:BOX, p:[s.x, s.y+0.78, s.z], r:[0,a,0], s:[0.7,0.05,1.05] });
    for (const [ox,oz] of [[-0.3,-0.45],[0.3,-0.45],[-0.3,0.45],[0.3,0.45]]){
      const rx = ox*Math.cos(a) - oz*Math.sin(a), rz = ox*Math.sin(a) + oz*Math.cos(a);
      steel.push({ g:CYL, p:[s.x+rx, s.y+0.17, s.z+rz], s:[0.02,0.34,0.02] });
      rubber.push({ g:CYL, p:[s.x+rx, s.y+0.05, s.z+rz], r:[Math.PI/2,0,0], s:[0.05,0.03,0.05] });
    }
    for (let i=0;i<5;i++)
      cloth.push({ g:SPH, p:[s.x+rnd(-0.24,0.24), s.y+0.95, s.z+rnd(-0.4,0.4)],
                   r:[0,rnd(0,TAU),0], s:[0.2,0.11,0.28] });
  }

  /* 8. A coat, on a hook, on a wall with nothing else on it. */
  {
    const s = next();
    const near = nearestWallDir(s.cx, s.cy);
    const a = Math.atan2(near.x, near.y);
    const wx = s.x + Math.sin(a)*(CFG.cell/2-0.16), wz = s.z + Math.cos(a)*(CFG.cell/2-0.16);
    steel.push({ g:CYL, p:[wx, s.y+1.9, wz], r:[Math.PI/2,a,0], s:[0.015,0.14,0.015] });
    cloth.push({ g:BOX, p:[wx - Math.sin(a)*0.09, s.y+1.36, wz - Math.cos(a)*0.09],
                 r:[0,a,0], s:[0.44,0.95,0.14] });
    cloth.push({ g:BOX, p:[wx - Math.sin(a)*0.09, s.y+1.72, wz - Math.cos(a)*0.09],
                 r:[0,a,0], s:[0.6,0.3,0.14] });
  }

  /* 9. A mop, standing on its own in the middle of the floor. */
  {
    const s = next();
    wood.push({ g:CYL, p:[s.x, s.y+0.72, s.z], r:[0.04,0,0.03], s:[0.022,1.44,0.022] });
    cloth.push({ g:SPH, p:[s.x+0.05, s.y+0.16, s.z+0.04], s:[0.16,0.2,0.16] });
  }

  const add = (parts, mat, shadow) => {
    if (!parts.length) return;
    const m = new THREE.Mesh(bakeGeo(parts), mat);
    m.castShadow = !!shadow; m.receiveShadow = true;
    world.add(m); DETAIL.push(m);
  };
  add(wood, woodM, true); add(steel, steelM, true); add(bone, boneM, true);
}

/* Which way is the nearest wall from this cell? Things that were PUT somewhere
   were nearly always put against something. */
function nearestWallDir(cx, cy){
  for (let r=1;r<=3;r++)
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])
      if (gAt(cx+dx*r, cy+dy*r) === 1) return { x:dx, y:dy };
  return { x:1, y:0 };
}

function buildAtmosphere(){
  buildOddities();
  buildStains();
  buildDeadBirds();
  buildHangers();
  buildLamps();
  if (!MOTES.mesh) buildMotes();
  if (!FX.mesh) buildFX(); else parkFX();
  buildBeam();
  buildDrips();
}

/* ==========================================================================
   PARTICLES
   Six effects, one draw call. A pool of flat quads in flat arrays with a ring
   buffer over the top: emitting never allocates, dead particles are never
   swept, and adding a seventh effect costs nothing but a `kind`.

   Everything here is a Lambert material on purpose. Particles that ignore the
   flashlight look pasted onto the screen; particles that light up as the beam
   crosses them are the entire reason for having any.
   ========================================================================== */
const FX_DUST = 0, FX_DOWN = 1, FX_DROP = 2, FX_SPLASH = 3;

const FX = {
  mesh:null, cap:0, head:0, live:0,
  x:null, y:null, z:null, vx:null, vy:null, vz:null,
  t:null, life:null, size:null, kind:null, ph:null, spin:null, rot:null,
};

/* A hard-edged quad reads as confetti. One soft feathered blob — vertical, so
   it works as a speck of dust at 3cm and as a piece of down at 12cm — costs one
   canvas and no draw calls, and is the difference between "particles" and
   "something in the air". */
function texMote(){
  const S = 64, c = makeCanvas(S), g = c.getContext('2d');
  g.clearRect(0,0,S,S);
  g.save();
  g.translate(S/2, S/2); g.scale(0.62, 1);
  const grd = g.createRadialGradient(0,0,0, 0,0,S/2);
  grd.addColorStop(0.00, 'rgba(255,252,244,1)');
  grd.addColorStop(0.42, 'rgba(246,240,226,0.72)');
  grd.addColorStop(0.78, 'rgba(240,232,214,0.16)');
  grd.addColorStop(1.00, 'rgba(240,232,214,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(0,0,S/2,0,TAU); g.fill();
  g.restore();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function buildFX(){
  const cap = LOWFI ? 130 : 300;
  const geo = new THREE.PlaneGeometry(1,1);
  const mat = new THREE.MeshLambertMaterial({
    map: texMote(), color:0xd9d2c0, transparent:true, opacity:0.9, depthWrite:false,
    side:THREE.DoubleSide,
  });
  const m = new THREE.InstancedMesh(geo, mat, cap);
  m.frustumCulled = false; m.castShadow = false; m.receiveShadow = false;
  scene.add(m);
  FX.mesh = m; FX.cap = cap; FX.head = 0; FX.live = 0;
  const f = () => new Float32Array(cap);
  FX.x=f(); FX.y=f(); FX.z=f(); FX.vx=f(); FX.vy=f(); FX.vz=f();
  FX.t=f(); FX.life=f(); FX.size=f(); FX.ph=f(); FX.spin=f(); FX.rot=f();
  FX.kind = new Uint8Array(cap);
  for (let i=0;i<cap;i++) FX.life[i] = 0;
  DETAIL.push(m);
  parkFX();
}

/* everything starts off-screen and stays there until it is emitted */
function parkFX(){
  for (let i=0;i<FX.cap;i++) setInst(FX.mesh, i, 0,-80,0, 0.0001,0.0001,0.0001, 0);
  FX.mesh.instanceMatrix.needsUpdate = true;
}

/* Oldest particle wins. A ring buffer means a burst during a burst steals the
   stalest quads instead of being dropped, which is always the better failure. */
function emitFX(kind, x,y,z, vx,vy,vz, size, life){
  const i = FX.head; FX.head = (FX.head + 1) % FX.cap;
  FX.kind[i]=kind; FX.x[i]=x; FX.y[i]=y; FX.z[i]=z;
  FX.vx[i]=vx; FX.vy[i]=vy; FX.vz[i]=vz;
  FX.size[i]=size; FX.life[i]=life; FX.t[i]=0;
  FX.ph[i]=Math.random()*TAU; FX.spin[i]=rnd(-2.6,2.6); FX.rot[i]=Math.random()*TAU;
  return i;
}

/* ---- the six effects ---------------------------------------------------- */

/* You brushed a roost and forty birds went up. The air where they were should
   not simply be empty again. */
function fxDisturb(x, z, strength){
  const n = Math.round((LOWFI ? 7 : 14) * clamp(strength, 0.3, 1));
  for (let i=0;i<n;i++){
    const a = rnd(0,TAU), r = rnd(0.1, 1.6);
    emitFX(FX_DOWN, x+Math.sin(a)*r, rnd(0.2,1.3), z+Math.cos(a)*r,
           rnd(-0.5,0.5), rnd(0.35,1.1), rnd(-0.5,0.5), rnd(0.07,0.13), rnd(6,13));
  }
  for (let i=0;i<n;i++){
    const a = rnd(0,TAU), r = rnd(0.1, 2.0);
    emitFX(FX_DUST, x+Math.sin(a)*r, rnd(0.05,1.1), z+Math.cos(a)*r,
           rnd(-0.7,0.7), rnd(0.1,0.7), rnd(-0.7,0.7), rnd(0.03,0.075), rnd(1.6,3.4));
  }
}

/* Dry floor, and you are not being careful. */
function fxFootfall(x, z, hard){
  const n = hard ? 5 : 2;
  for (let i=0;i<n;i++){
    const a = rnd(0,TAU), sp = rnd(0.25, hard?1.0:0.5);
    emitFX(FX_DUST, x+rnd(-0.2,0.2), rnd(0.02,0.1), z+rnd(-0.2,0.2),
           Math.sin(a)*sp, rnd(0.06,0.3), Math.cos(a)*sp, rnd(0.03,0.07), rnd(0.8,1.7));
  }
}

/* Something very heavy is walking on a very old building. You get this before
   you get her — dust coming off the ceiling ahead of where she is. */
function fxCeilingShake(x, z, amount){
  const n = amount > 0.7 ? 3 : 1;
  for (let i=0;i<n;i++)
    emitFX(FX_DUST, x+rnd(-2.6,2.6), WALL_H-rnd(0.05,0.4), z+rnd(-2.6,2.6),
           rnd(-0.05,0.05), -rnd(0.5,1.3), rnd(-0.05,0.05), rnd(0.025,0.055), rnd(2.6,4.4));
}

/* Water off the pipes into the standing water. Rooms get a signature you can
   navigate by without ever seeing them. */
const DRIPS = [];
function buildDrips(){
  DRIPS.length = 0;
  const open = [];
  for (let y=3;y<G.h-3;y++) for (let x=3;x<G.w-3;x++)
    if (gAt(x,y)===0 && !inBayCell(x,y)) open.push({x,y});
  if (!open.length) return;
  const n = LOWFI ? 4 : 7;
  for (let i=0;i<n;i++){
    const c = pick(open), w = cellToWorld(c.x,c.y);
    const dx = w.x+rnd(-1.4,1.4), dz = w.z+rnd(-1.4,1.4);
    DRIPS.push({ x:dx, z:dz, y:groundAt(dx,dz),
                 t:rnd(0,3), period:rnd(1.4,4.6) });
  }
}

function updateDrips(dt){
  for (const d of DRIPS){
    d.t -= dt;
    if (d.t > 0) continue;
    d.t = d.period * rnd(0.85, 1.15);         // never quite metronomic
    // only bother if it could possibly be seen or heard
    const dist = Math.hypot(d.x-P.x, d.z-P.z);
    if (dist > 24) continue;
    emitFX(FX_DROP, d.x, (d.y||0) + WALL_H-0.5, d.z, 0, -1.2, 0, 0.022, 3.0);
    if (dist < 16) sfxDrip(dist, d.x, d.z);
  }
}

/* The building is freezing and you are working hard in it. */
const BREATH = { t: 0 };
function updateBreath(dt){
  BREATH.t -= dt;
  if (BREATH.t > 0) return;
  const hard = P.sprinting || P.stam < CFG.stamMax*0.4;
  const cold = inRoomKind('cold');
  const scared = dread > 0.45;
  if (!cold && !hard && !scared){ BREATH.t = 1.2; return; }
  BREATH.t = hard ? rnd(1.1,1.6) : rnd(2.6,3.8);
  const d = camDir();
  const n = hard ? 4 : 2;
  for (let i=0;i<n;i++)
    emitFX(FX_DUST, P.x + d.x*0.45 + rnd(-0.06,0.06),
                    P.y - 0.14 + rnd(-0.04,0.04),
                    P.z + d.z*0.45 + rnd(-0.06,0.06),
           d.x*rnd(0.5,1.0) + rnd(-0.12,0.12), rnd(0.05,0.2),
           d.z*rnd(0.5,1.0) + rnd(-0.12,0.12), rnd(0.05,0.1), rnd(0.9,1.7));
}

function inRoomKind(kind){
  const c = worldToCell(P.x, P.z);
  for (const r of G.rooms)
    if (r.kind === kind && c.x>=r.x && c.x<r.x+r.w && c.y>=r.y && c.y<r.y+r.h) return true;
  return false;
}

/* A slow constant trickle of down in the air, emitted only behind you so you
   never watch one appear — the same rule the walls and the dust obey. */
const DOWNFALL = { t: 0 };
function updateDownfall(dt){
  DOWNFALL.t -= dt;
  if (DOWNFALL.t > 0) return;
  DOWNFALL.t = rnd(0.7, 1.9);
  const dir = camDir();
  for (let tries=0; tries<6; tries++){
    const a = rnd(0,TAU), r = rnd(5, 12);
    const nx = P.x + Math.sin(a)*r, nz = P.z + Math.cos(a)*r;
    const dx = nx-P.x, dz = nz-P.z, d = Math.hypot(dx,dz) || 1;
    if ((dx*dir.x + dz*dir.z)/d > -0.15) continue;
    emitFX(FX_DOWN, nx, rnd(1.4, WALL_H-0.4), nz,
           rnd(-0.1,0.1), rnd(-0.06,-0.015), rnd(-0.1,0.1), rnd(0.06,0.12), rnd(16,28));
    return;
  }
}

/* ---- integration -------------------------------------------------------- */
function updateFX(dt, now){
  if (!FX.mesh) return;
  let live = 0;
  for (let i=0;i<FX.cap;i++){
    if (FX.life[i] <= 0) continue;
    FX.t[i] += dt;
    const age = FX.t[i] / FX.life[i];
    if (age >= 1){ FX.life[i] = 0; setInst(FX.mesh, i, 0,-80,0, 0.0001,0.0001,0.0001, 0); continue; }
    live++;
    const k = FX.kind[i];

    if (k === FX_DOWN){
      // down does not fall, it hunts for the floor: heavy drag, almost no
      // weight, and a sideways flutter that makes the path unreadable
      FX.vx[i] *= 1 - Math.min(1, dt*1.9);
      FX.vz[i] *= 1 - Math.min(1, dt*1.9);
      FX.vy[i] = lerp(FX.vy[i], -0.075, Math.min(1, dt*1.4));
      const fl = Math.sin(now*0.0017 + FX.ph[i]);
      FX.x[i] += (FX.vx[i] + fl*0.16)*dt;
      FX.z[i] += (FX.vz[i] + Math.cos(now*0.0013 + FX.ph[i])*0.16)*dt;
      FX.y[i] += FX.vy[i]*dt;
      FX.rot[i] += FX.spin[i]*dt*0.5;
      if (FX.y[i] < 0.02){ FX.y[i] = 0.02; FX.vy[i] = 0; FX.vx[i]*=0.2; FX.vz[i]*=0.2; }
    } else if (k === FX_SPLASH){
      // a bead thrown off an impact: real weight, no impact of its own
      FX.vy[i] -= 9.2*dt;
      FX.y[i] += FX.vy[i]*dt;
      FX.x[i] += FX.vx[i]*dt; FX.z[i] += FX.vz[i]*dt;
      if (FX.y[i] < 0.02){ FX.y[i] = 0.02; FX.vx[i]*=0.3; FX.vz[i]*=0.3; FX.vy[i]=0; }
    } else if (k === FX_DROP){
      FX.vy[i] -= 9.2*dt;                     // water is the only thing here with real weight
      FX.y[i] += FX.vy[i]*dt;
      FX.x[i] += FX.vx[i]*dt; FX.z[i] += FX.vz[i]*dt;
      if (FX.y[i] <= 0.03 && FX.vy[i] < 0){
        /* It lands: a few tiny beads kick up and the drop itself is done.
           These MUST be FX_SPLASH and not FX_DROP. When they were drops, each
           one landed and spawned three more, which landed and spawned nine —
           a runaway that filled all three hundred slots within about four
           seconds of the shift starting and then stayed full forever, quietly
           evicting every mote of dust and every feather the rest of the game
           was trying to emit. */
        FX.life[i] = 0; setInst(FX.mesh, i, 0,-80,0, 0.0001,0.0001,0.0001, 0);
        for (let s=0;s<3;s++){
          const a = rnd(0,TAU), sp = rnd(0.3,0.9);
          emitFX(FX_SPLASH, FX.x[i], 0.05, FX.z[i],
                 Math.sin(a)*sp, rnd(0.6,1.5), Math.cos(a)*sp, 0.014, rnd(0.3,0.6));
        }
        continue;
      }
    } else {
      // dust: drag, a whisper of lift, and it drifts with the room
      const dr = 1 - Math.min(1, dt*1.25);
      FX.vx[i] *= dr; FX.vy[i] *= dr; FX.vz[i] *= dr;
      FX.vy[i] -= 0.16*dt;
      FX.x[i] += (FX.vx[i] + Math.sin(now*0.0005 + FX.ph[i])*0.05)*dt;
      FX.z[i] += (FX.vz[i] + Math.cos(now*0.0006 + FX.ph[i])*0.05)*dt;
      FX.y[i] += FX.vy[i]*dt;
      if (FX.y[i] < 0.015){ FX.y[i] = 0.015; FX.vy[i] = 0; }
      FX.rot[i] += FX.spin[i]*dt*0.25;
    }

    /* Fade by shrinking. Per-instance ALPHA needs a custom shader; per-instance
       SCALE is free and at these sizes the eye reads the two identically. Dust
       fades from the moment it is born, down only once it has settled. */
    let f;
    if (k === FX_DOWN) f = age < 0.82 ? 1 : 1 - (age-0.82)/0.18;
    else               f = age < 0.25 ? 1 : 1 - (age-0.25)/0.75;
    const s = FX.size[i] * f;
    const w = k === FX_DOWN ? s*0.55 : s;     // down is a quill, not a speck

    _p.set(FX.x[i], FX.y[i], FX.z[i]);
    _s.set(w, s, 1);
    _e.set(FX.rot[i]*0.6, FX.rot[i], FX.rot[i]*0.35, 'YXZ');
    _q.setFromEuler(_e);
    _m.compose(_p,_q,_s);
    FX.mesh.setMatrixAt(i, _m);
  }
  FX.live = live;
  FX.mesh.instanceMatrix.needsUpdate = true;

  updateDrips(dt);
  updateDownfall(dt);
  /* Breath and footfall puffs removed. Both fired constantly, both sat within a
     metre of the camera where the beam is brightest, and between them they were
     emitting more particles than every other effect combined for two cues you
     stop registering after thirty seconds. The pool is for things that happen
     to you, not things you do. */
}

/* A single bead of water finding a puddle, panned to where it actually is.
   Rooms you cannot see acquire a signature you can navigate by. */
function sfxDrip(dist, x, z){
  if (!AC) return;
  const v = clamp(1 - dist/16, 0.05, 1) * 0.14;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(rnd(900,1500), t);
  o.frequency.exponentialRampToValueAtTime(rnd(260,420), t+0.055);
  const g = AC.createGain();
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
  o.connect(g); panned(g, x, z);
  o.start(t); o.stop(t+0.18);
}

/* ==========================================================================
   THE BEAM
   In a building this filthy the light is visible in the air, not only where it
   lands. One additive cone with a gradient down its length: transparent at the
   lens, transparent at the far end, faintly solid in between. It is the single
   cheapest thing in this file and the one that does the most.
   ========================================================================== */
/* Three discs, not four, and each one 1.35x the cone radius rather than 2x.
   Measured: four full-width discs cost 488ms a frame under the software
   rasteriser against 16.7ms with the beam off. That is not a draw-call
   problem, it is OVERDRAW — each disc is close enough to the camera to cover
   most of the screen, so the beam was shading every pixel four times over with
   alpha blending on top.

   The outer forty percent of each disc is where the texture has already faded
   to nothing, so it was costing fill and contributing no picture. Trimming the
   width and dropping one layer removes about two thirds of the blended pixels
   and changes what you see almost not at all.

   A real GPU eats this either way. An integrated laptop chip at 4K does not,
   and neither does a phone — which is why LOWFI has no beam at all. */
const BEAM = { mesh:null, n: 3, at:[3.0, 6.4, 11.0], bright:[0.7, 1.0, 0.5], width: 1.35 };

/* A soft round falloff. Opaque-ish in the middle, nothing at all by the rim. */
function texBeam(){
  const S = 128, c = makeCanvas(S), g = c.getContext('2d');
  g.clearRect(0,0,S,S);
  const grd = g.createRadialGradient(S/2,S/2,0, S/2,S/2,S/2);
  grd.addColorStop(0.00, 'rgba(255,242,218,0.95)');
  grd.addColorStop(0.35, 'rgba(255,238,210,0.42)');
  grd.addColorStop(0.70, 'rgba(255,234,204,0.10)');
  grd.addColorStop(1.00, 'rgba(255,234,204,0)');
  g.fillStyle = grd; g.fillRect(0,0,S,S);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* The first version of this was a cone mesh, which is the obvious thing and the
   wrong thing: looking down a cone from its apex, the silhouette edge is where
   your eye passes through the most shell, so the RIM lights up and the middle
   does not. It read as a hollow glass funnel hanging in front of the camera.

   A cone of light seen from the inside is really just the air glowing more the
   closer you look to the axis — so draw exactly that: a few discs strung along
   the beam, each a soft radial falloff, brightest at the centre and gone by the
   rim. Four instances of one mesh, one draw call, no silhouette to give away. */
function buildBeam(){
  if (LOWFI || BEAM.mesh) return;          // a phone pays for this in fill rate
  const mat = new THREE.MeshBasicMaterial({
    map: texBeam(), transparent:true, opacity:0.145, depthWrite:false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    /* fog:false is not laziness. Fog mixes a fragment TOWARD the fog colour,
       which for an additive pass means multiplying its contribution to almost
       nothing a few metres out — the beam vanished exactly where a beam is
       meant to be most visible. The per-disc brightness ramp does the falloff
       instead, which is what it is for. */
    fog: false,
  });
  const m = new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1), mat, BEAM.n);
  m.frustumCulled = false; m.renderOrder = 5;
  const c = new THREE.Color();
  for (let i=0;i<BEAM.n;i++){
    // per-instance colour is the only per-instance brightness available without
    // a custom shader, and under additive blending that is exactly what it is
    const b = BEAM.bright[i];
    c.setRGB(b, b, b);
    m.setColorAt(i, c);
  }
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  scene.add(m);
  BEAM.mesh = m;
}

const _bq = new THREE.Quaternion(), _bv = new THREE.Vector3(), _bu = new THREE.Vector3();
function updateBeam(){
  if (!BEAM.mesh) return;
  const lit = LAMP.on && heldLampSlot() >= 0;
  BEAM.mesh.visible = lit;
  if (!lit) return;
  const dead = lampDead();
  const d = handDir();                     // the discs ride the HAND, not the eye
  _bv.set(d.x, d.y, d.z).normalize();
  // a plane's own normal is +Z; point that back along the beam so it faces you
  _bq.setFromUnitVectors(_bu.set(0,0,1), _bv);
  const spread = Math.tan(torch.angle * 0.78) * (dead ? 0.72 : 1);
  const reach  = dead ? 0.74 : 1;
  const o = torch.position;
  for (let i=0;i<BEAM.n;i++){
    const dist = BEAM.at[i] * reach;
    const w = spread * dist * BEAM.width;
    _p.set(o.x + _bv.x*dist, o.y + _bv.y*dist, o.z + _bv.z*dist);
    _s.set(w, w, 1);
    _m.compose(_p, _bq, _s);
    BEAM.mesh.setMatrixAt(i, _m);
  }
  BEAM.mesh.instanceMatrix.needsUpdate = true;
  // it dims with the cell, and the hard flicker punches straight through it
  BEAM.mesh.material.opacity = (dead ? 0.105 : 0.145) * (1 - LAMP.flicker);
}

/* ==========================================================================
   CAMERA WEIGHT
   The camera was welded to a coordinate. A body lands, a body settles into a
   crouch instead of teleporting into one, and a hand holding a flashlight is
   always a fraction of a second behind where the eyes already went.
   ========================================================================== */
const BODY = { crouch: 0, land: 0, landV: 0, lastGrounded: true };

function updateBody(dt){
  // crouch is a movement, not a state change
  BODY.crouch = lerp(BODY.crouch, P.crouch ? 1 : 0, Math.min(1, dt*11));
  /* The landing dip is a spring that has already been struck: bodyDip() kicks
     the VELOCITY, not the position. Gating the integrator on land !== 0 meant a
     fresh kick — velocity set, position still exactly zero — was skipped every
     time, and the dip never played once. Both terms have to be checked. */
  if (BODY.land !== 0 || BODY.landV !== 0){
    BODY.landV += -BODY.land*88*dt - BODY.landV*11*dt;
    BODY.land  += BODY.landV*dt;
    if (Math.abs(BODY.land) < 0.0006 && Math.abs(BODY.landV) < 0.006){
      BODY.land = 0; BODY.landV = 0;
    }
  }
}
function bodyDip(force){ BODY.landV -= force; }

/* the hand lags the eye: torch yaw/pitch chase the camera instead of matching it */
const HAND = { yaw: 0, pitch: 0, init: false };
function updateHand(dt){
  if (!HAND.init){ HAND.yaw = P.yaw; HAND.pitch = P.pitch; HAND.init = true; return; }
  // wrap-safe chase, or spinning past PI whips the beam the long way round
  let dy = P.yaw - HAND.yaw;
  while (dy >  Math.PI) dy -= TAU;
  while (dy < -Math.PI) dy += TAU;
  const k = Math.min(1, dt*13);
  HAND.yaw   += dy * k;
  HAND.pitch += (P.pitch - HAND.pitch) * k;
}
function handDir(){
  const cp = Math.cos(HAND.pitch);
  return { x:-Math.sin(HAND.yaw)*cp, y:Math.sin(HAND.pitch), z:-Math.cos(HAND.yaw)*cp };
}

/* ==========================================================================
   THE ROOSTER
   Night six only. Five nights teach you that she is the thing in the building.
   She is not. She is the reason he has been staying in his half of it.

   Her whole design is SEARCH: she hunts, investigates, loses your scent, and
   can be outrun with empty hands. His is AMBUSH, and it inverts every habit you
   built:

     he advances     — always toward you, always faster than you can run
     you spot him    — put the beam on him and he will not come any closer
     he breaks off   — turns, runs out of your view
     he vanishes     — repositions somewhere you are not looking
     he announces    — and you hear, from a new direction, that it starts again

   So the lamp stops being the thing that gives you away and becomes the only
   weapon in the game. On the last night you walk backwards to the van sweeping
   a torch across the dark, and the moment you stop sweeping is the moment he
   arrives.
   ========================================================================== */
const ROO = {
  present:false, group:null, head:null, legL:null, legR:null,
  x:0, z:0, yaw:0, spd:0, legPhase:0,
  state:'off', t:0,
  cycle:0,                    // how many times he has had to break off
  seenT:0,                    // how long the beam has been on him
  callT:0, stepT:0,
  path:[], pathT:0,
  lastSpot:0,
};

/* Tuning. Everything that escalates does so per CYCLE, so a player who keeps
   spotting him early is rewarded with a slower night, and a player who keeps
   missing him gets a faster one. */
const ROOCFG = {
  spotAngle: 0.52,        // he must be well inside the beam, not clipped by its edge
  spotDwell: 0.18,        // and held there for a moment — a wild sweep is not a look
  spotRange: 40,          // you can SEE him this far out
  breakDist: 15.2,        // fifty feet: the range at which looking at him works
  callDist: 16,           // and where he announces himself, on the way in

  /* Ten seconds of him watching before he moves. This is the whole feel of the
     night: most of the time he is not charging, he is standing a long way off
     with his head round a corner, and you know it, and you have to decide
     whether to spend that time finding him or moving while you still can. */
  peerTime: 6.5,
  fleeTime: 3.0,          // a CAP, not a duration — he runs until he is out of view
  catchDist: 1.75,

  /* Fast again. He beats a laden sprint (3.94 m/s) from the first cycle and
     pulls further ahead every time you turn him; stamina only buys you seven
     seconds of trying anyway. */
  spd0: 5.2, spdStep: 0.34, spdMax: 7.8,
  /* He spawns FAR. Being turned should send him back across the building, not
     into the next room — the dread is in the wait, not in him hovering. */
  near0: 34, nearStep: -1.6, nearMin: 20,
  fleeSpd: 9.5,
};

function roosterSpeed(){ return Math.min(ROOCFG.spdMax, ROOCFG.spd0 + ROO.cycle*ROOCFG.spdStep); }
function roosterRange(){ return Math.max(ROOCFG.nearMin, ROOCFG.near0 + ROO.cycle*ROOCFG.nearStep); }

/* ---------------- the bird ---------------- */
/* Leaner than her, and taller. She is a mass; he is an angle. Everything about
   the silhouette is edges — sickle tail, spurs, a comb like a blade. */
function buildRoosterModel(){
  const g = new THREE.Group();
  /* Much darker than looks sensible in a colour picker. A 620-intensity torch
     at five metres plus ACES tone mapping turns anything above about 0x141414
     into beige — the first version of him read as a tan egg on stilts, which is
     both wrong and, worse, the same colour as the hens.

     The eyes are the compensation. They are the only unlit-visible thing on
     him, so at range you get two yellow pinpricks in the black and nothing
     else, and the beam is what turns those into a bird. That is a far better
     tell than a body bright enough to see on its own. */
  const dark  = new THREE.MeshLambertMaterial({ color:0x090a09 });
  const green = new THREE.MeshLambertMaterial({ color:0x0c1410 });   // beetle sheen
  const red   = new THREE.MeshLambertMaterial({ color:0x5a0b09 });
  const horn  = new THREE.MeshLambertMaterial({ color:0x1a1610 });
  const eye   = new THREE.MeshBasicMaterial({ color:0xffd84a, fog:true });

  const SPH = new THREE.SphereGeometry(1, 10, 8);
  const BOX = new THREE.BoxGeometry(1,1,1);
  const CON = new THREE.ConeGeometry(1, 1, 5);
  const CYL = new THREE.CylinderGeometry(1, 1, 1, 6);

  // body: deep chest, tucked belly, carried high and forward
  const mBody = baked(g, [
    { g:SPH, p:[0, 2.35, 0],     s:[0.78, 0.92, 1.15] },
    { g:SPH, p:[0, 2.05, 0.28],  s:[0.62, 0.6, 0.72] },     // the crop
    { g:SPH, p:[0, 2.62, -0.5],  s:[0.6, 0.6, 0.7] },       // the saddle
  ], dark, true);

  // neck: a long arch of hackle, thickest at the shoulders
  const neck = [];
  for (let i=0;i<8;i++){
    const t = i/7;
    const y = 2.9 + t*1.15, z = 0.28 + Math.sin(t*1.5)*0.42;
    const r = 0.32 - t*0.13;
    neck.push({ g:SPH, p:[0, y, z], s:[r, r*1.05, r] });
  }
  const mNeck = baked(g, neck, green, true);

  // head, comb, wattles, beak, and the one part of him that is not black
  const head = new THREE.Group();
  head.position.set(0, 4.12, 0.72);
  baked(head, [{ g:SPH, p:[0,0,0], s:[0.23,0.27,0.3] }], dark, true);
  baked(head, [
    { g:BOX, p:[0, 0.3, -0.02], s:[0.05, 0.2, 0.42] },       // comb: a blade, not a crown
    { g:CON, p:[0, 0.42, 0.14], r:[0,0,0],   s:[0.07,0.18,0.07] },
    { g:CON, p:[0, 0.44, -0.06], r:[0,0,0],  s:[0.07,0.22,0.07] },
    { g:CON, p:[0, 0.40, -0.24], r:[0,0,0],  s:[0.06,0.15,0.06] },
    { g:BOX, p:[-0.09, -0.22, 0.1], s:[0.04, 0.3, 0.14] },   // wattles
    { g:BOX, p:[ 0.09, -0.22, 0.1], s:[0.04, 0.3, 0.14] },
  ], red, true);
  baked(head, [{ g:CON, p:[0, -0.02, 0.3], r:[Math.PI/2,0,0], s:[0.09,0.28,0.09] }], horn, true);
  baked(head, [
    { g:SPH, p:[-0.17, 0.06, 0.15], s:[0.085,0.085,0.085] },
    { g:SPH, p:[ 0.17, 0.06, 0.15], s:[0.085,0.085,0.085] },
  ], eye, false);
  /* And the glow around them. A PointLight would be the obvious way and the
     wrong one — it recompiles into every Lambert shader in the building for the
     sake of two dots. Two additive billboards with a soft falloff cost one draw
     call, are not affected by anything, and read as glow from any distance. */
  const glowM = new THREE.MeshBasicMaterial({
    map: texEyeGlow(), transparent:true, opacity:0.9, depthWrite:false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog:false,
  });
  const glow = new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1), glowM, 2);
  glow.frustumCulled = false; glow.renderOrder = 6;
  head.add(glow);
  ROO.eyeGlow = glow;
  g.add(head);
  ROO.head = head;

  // sickle tail: the thing you will see going round a corner
  const tail = [];
  for (let i=0;i<7;i++){
    const t = i/6;
    const a = 0.5 + t*1.5;
    tail.push({ g:CON, p:[rnd(-0.16,0.16), 2.75 + Math.sin(a)*1.15, -0.7 - Math.cos(a)*0.95],
                r:[-a, 0, 0], s:[0.1 - t*0.045, 1.5 - t*0.5, 0.1 - t*0.045] });
  }
  const mTail = baked(g, tail, green, true);

  // legs, scaled and spurred. He walks like something that has never hurried.
  /* Two joints, not one rigid stick. A bird's leg folds BACKWARDS at the hock
     and the foot stays flat to the floor, and a giant one that swings a plank
     from the hip reads as a puppet no matter how good the model is. The hock is
     a child group so the shank can counter-rotate against the thigh. */
  const legGeo = () => {
    const L = new THREE.Group();
    baked(L, [
      { g:CYL, p:[0, -0.5, 0], s:[0.15, 1.0, 0.15] },          // thigh, thick
      { g:SPH, p:[0, -1.0, 0], s:[0.13, 0.13, 0.13] },         // the hock itself
    ], horn, true);
    const hock = new THREE.Group();
    hock.position.set(0, -1.0, 0);
    baked(hock, [
      { g:CYL, p:[0, -0.42, 0.02], s:[0.09, 0.86, 0.09] },     // shank
      { g:CON, p:[-0.12, -0.2, 0], r:[0,0,1.3], s:[0.05,0.34,0.05] },  // spur
    ], horn, true);
    const foot = new THREE.Group();
    foot.position.set(0, -0.85, 0);
    baked(foot, [
      { g:BOX, p:[0, 0, 0.16], s:[0.11, 0.07, 0.46] },
      { g:BOX, p:[-0.15, 0, 0.06], r:[0,0.5,0], s:[0.085,0.06,0.36] },
      { g:BOX, p:[ 0.15, 0, 0.06], r:[0,-0.5,0], s:[0.085,0.06,0.36] },
      { g:BOX, p:[0, 0, -0.16], s:[0.07,0.05,0.2] },           // back toe
    ], horn, true);
    hock.add(foot);
    L.add(hock);
    L.userData.hock = hock; L.userData.foot = foot;
    return L;
  };
  /* Wings. Folded flat against him while he waits, and beating when he comes —
     a bird that size running at you without using them reads as a costume. */
  const wingGeo = (side) => {
    const W = new THREE.Group();
    baked(W, [
      { g:SPH, p:[side*0.28, 0, 0.1],  s:[0.3, 0.62, 0.85] },
      { g:CON, p:[side*0.5, -0.35, -0.5], r:[0.9, 0, side*0.5], s:[0.16, 1.25, 0.16] },
      { g:CON, p:[side*0.62, -0.2, -0.2], r:[0.6, 0, side*0.7], s:[0.13, 1.0, 0.13] },
    ], green, true);
    return W;
  };
  ROO.wingL = wingGeo(-1); ROO.wingL.position.set(-0.62, 2.5, -0.1); g.add(ROO.wingL);
  ROO.wingR = wingGeo( 1); ROO.wingR.position.set( 0.62, 2.5, -0.1); g.add(ROO.wingR);

  ROO.legL = legGeo(); ROO.legL.position.set(-0.3, 2.05, 0.05); g.add(ROO.legL);
  ROO.legR = legGeo(); ROO.legR.position.set( 0.3, 2.05, 0.05); g.add(ROO.legR);

  /* Everything that is NOT the neck and head. When he is waiting he hides all
     of this and leaves the neck out — so what you find in the beam is a head on
     a long neck, four metres up, already looking at you, with no body attached
     to it that you can see. Bodiless because the rest of him is round the
     corner, and because a whole rooster standing in a doorway is a much less
     frightening thing than most of one. */
  ROO.bulk = [mBody, mTail, ROO.legL, ROO.legR, ROO.wingL, ROO.wingR];

  g.visible = false;
  return g;
}

/* a hot core that falls off fast — an eye, not a lamp */
function texEyeGlow(){
  const S = 64, c = makeCanvas(S), g = c.getContext('2d');
  g.clearRect(0,0,S,S);
  const grd = g.createRadialGradient(S/2,S/2,0, S/2,S/2,S/2);
  grd.addColorStop(0.00, 'rgba(255,236,150,1)');
  grd.addColorStop(0.18, 'rgba(255,206,60,0.75)');
  grd.addColorStop(0.48, 'rgba(226,150,20,0.20)');
  grd.addColorStop(1.00, 'rgba(200,120,0,0)');
  g.fillStyle = grd; g.beginPath(); g.arc(S/2,S/2,S/2,0,TAU); g.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* The halos live on the head, which turns, so they have to be re-aimed at the
   camera every frame or they vanish edge-on exactly when he looks at you. */
const _eg = new THREE.Vector3(), _eq = new THREE.Quaternion(), _em = new THREE.Matrix4();
function updateEyeGlow(){
  const G2 = ROO.eyeGlow;
  if (!G2 || !ROO.group.visible) return;
  ROO.head.getWorldQuaternion(_eq);
  _eq.invert();                                   // undo the head's rotation
  const pulse = 0.85 + Math.sin(performance.now()*0.004)*0.15;
  for (let i=0;i<2;i++){
    _eg.set((i?1:-1)*0.17, 0.06, 0.16);
    _em.compose(_eg, _eq, new THREE.Vector3(0.42*pulse, 0.42*pulse, 1));
    G2.setMatrixAt(i, _em);
  }
  G2.instanceMatrix.needsUpdate = true;
  G2.material.opacity = 0.9 * pulse;
}

function buildRooster(){
  if (ROO.group){
    // he is built once for the campaign; make sure he is still IN the scene
    if (!ROO.group.parent) world.add(ROO.group);
    return;
  }
  ROO.group = buildRoosterModel();
  world.add(ROO.group);
}

/* ---------------- spotting ----------------
   Not "is he on screen" — is the BEAM on him. Screen-centre is not a torch, and
   the whole point of the night is that you have to aim the thing. He also has
   to be genuinely visible: no spotting him through a wall. */
function roosterSpotted(range){
  if (!LAMP.on || heldLampSlot() < 0) return false;
  const dx = ROO.x - P.x, dz = ROO.z - P.z;
  const d = Math.hypot(dx, dz);
  if (d > (range || ROOCFG.spotRange)) return false;
  const dir = handDir();
  const dot = (dx*dir.x + dz*dir.z) / (d || 1e-4);
  if (dot < Math.cos(ROOCFG.spotAngle)) return false;
  return losClear(P.x, P.z, ROO.x, ROO.z);
}
/* Seeing him and driving him off are two different things. You can pick him out
   of the dark at thirty metres and it will not stop him — he only turns when he
   is close enough that turning is a decision. */
function roosterRepelled(){ return roosterSpotted(ROOCFG.breakDist); }

/* Put him somewhere you are not looking, at the range this cycle has earned.
   Same rule the walls and the dust obey: you never watch it happen. */
/* Is this cell tucked against something? A cell with a solid neighbour is a
   corner to lean out of; a cell in the middle of a hall is not. */
function cellIsCorner(cx, cy){
  let solid = 0;
  if (gAt(cx+1,cy) !== 0) solid++;
  if (gAt(cx-1,cy) !== 0) solid++;
  if (gAt(cx,cy+1) !== 0) solid++;
  if (gAt(cx,cy-1) !== 0) solid++;
  return solid;
}

function roosterReposition(wantCorner){
  const want = roosterRange();
  let best = null, bestScore = -1e9;
  for (let i=0;i<220;i++){
    const a = rnd(0, TAU), r = want * rnd(0.82, 1.25);
    const nx = P.x + Math.sin(a)*r, nz = P.z + Math.cos(a)*r;
    const c = worldToCell(nx, nz);
    if (!walkable(c.x, c.y)) continue;
    if (cellSeen(c.x, c.y)) continue;                 // never in front of you
    const w = cellToWorld(c.x, c.y);
    const d = Math.hypot(w.x-P.x, w.z-P.z);
    /* Measure the SNAPPED position, not the sample. A point sampled at exactly
       nearMin lands in a cell whose centre can be over two metres nearer, so
       filtering on the sample let him arrive inside the floor he is supposed to
       respect. Check where he will actually stand. */
    if (d < ROOCFG.nearMin) continue;
    // prefer the requested distance, and prefer somewhere he can actually reach
    let score = -Math.abs(d - want) + (losClear(P.x,P.z,w.x,w.z) ? 0 : 2.5);
    // and, when he means to lean out at you, prefer something to lean out of
    if (wantCorner) score += cellIsCorner(c.x, c.y) * 6;
    if (score > bestScore){ bestScore = score; best = w; }
  }
  if (!best){
    /* Nowhere hidden at the range he wanted — take anywhere walkable behind
       you, but never nearer than nearMin. A fallback that can drop him ten
       metres away undoes the entire point of him spawning far. */
    for (let i=0;i<240;i++){
      const a = rnd(0, TAU), r = rnd(ROOCFG.nearMin, 34);
      const c = worldToCell(P.x + Math.sin(a)*r, P.z + Math.cos(a)*r);
      if (!walkable(c.x, c.y) || cellSeen(c.x, c.y)) continue;
      const w2 = cellToWorld(c.x, c.y);
      if (Math.hypot(w2.x-P.x, w2.z-P.z) < ROOCFG.nearMin) continue;
      best = w2; break;
    }
  }
  /* Still nothing. Rather than leave him standing wherever he already was —
     which on a bad frame is a metre behind you — shove him radially out to the
     minimum range and let collide() sort out the wall. Being in an odd place is
     survivable; being at point-blank range through a failed search is not. */
  if (!best){
    /* Sweep the angles behind you rather than taking one at random, so the
       last resort still respects the one rule that matters. If literally every
       heading is in view, place him anyway and let the visibility gate hold him
       back until you look away. */
    const r = ROOCFG.nearMin + 6;
    const dir = camDir();
    let fallback = null, fallbackDot = 2;
    for (let i=0;i<24;i++){
      const a = (i/24)*TAU;
      const c = collide(P.x + Math.sin(a)*r, P.z + Math.cos(a)*r, 0.5);
      /* Keep the WORST heading, not the first one. This is the last resort of a
         last resort and it used to hand back index zero — due north of you,
         which is straight ahead one time in four. If every heading is in view
         the least-in-view one is still the right answer, and with the margin
         around the building now solid this branch is reached often enough for
         "whichever came first" to be visibly wrong. */
      const dx = c.x-P.x, dz = c.z-P.z, d = Math.hypot(dx,dz) || 1;
      const dot = (dx*dir.x + dz*dir.z)/d;
      if (dot < fallbackDot){ fallbackDot = dot; fallback = { x:c.x, z:c.z }; }
      const cc = worldToCell(c.x, c.z);
      if (cellSeen(cc.x, cc.y)) continue;
      best = { x:c.x, z:c.z }; break;
    }
    if (!best) best = fallback;
  }
  ROO.x = best.x; ROO.z = best.z;
  ROO.path.length = 0; ROO.pathT = 0;
  /* Report whether the spot is actually hidden, measured on the position he
     ends up at rather than on the cell that was sampled. Every search in here
     tries to put him behind you and every one of them can fail — the building
     is not obliged to have anywhere unseen at the range he wants — so the
     honest thing is to say so and let the caller decide. Callers used to
     assume success, which is how a charging rooster occasionally switched
     himself on in plain sight. */
  const dx = ROO.x-P.x, dz = ROO.z-P.z, dd = Math.hypot(dx,dz) || 1;
  const dir2 = camDir();
  return (dx*dir2.x + dz*dir2.z)/dd <= -0.2;
}

function setRooState(s){ ROO.state = s; ROO.t = 0; }

/* Two openings, and he picks one each time. Half of them he goes a long way
   off, crows immediately so you know it is starting, and comes at you across
   the whole building. The other half he tucks in behind a corner and simply
   watches for ten seconds, silent, and the first you know of it is finding a
   head where a wall should be.

   The point of two is that hearing nothing has to be as bad as hearing him. */
function roosterNextApproach(){
  const lurk = Math.random() < 0.5;
  const hidden = roosterReposition(lurk);
  /* Visible only for the charging opening, and only when the placement really
     was out of your view. That second clause is not belt and braces: on a bad
     search — standing in the bay, where most of a thirty-metre ring is either
     outside the building or in the one room he is not allowed into — the
     fallback can put him somewhere you are looking, and switching him on there
     means a giant rooster fades up out of nothing in the middle of your beam.
     If the placement is not hidden he stays off, and the ordinary visibility
     gate brings him in the moment you look away. */
  ROO.group.visible = !lurk && hidden;
  ROO.peer = 0;
  ROO.called = false;
  if (lurk){
    setRooState('hide');
    ROO.t = ROOCFG.peerTime;      // ten seconds of being looked at, not moving
  } else {
    setRooState('stalk');
    ROO.called = true;            // the crow is the OPENING here, not the warning
    sfxRoosterCall(ROO.x, ROO.z, ROO.cycle);
  }
}

/* ---------------- the night ---------------- */
function roosterStart(){
  buildRooster();
  ROO.present = true;
  ROO.group.visible = true;
  ROO.cycle = 0; ROO.seenT = 0; ROO.spd = 0; ROO.peer = 1;
  ROO.x = P.x; ROO.z = P.z - 30;
  if (!roosterReposition(true)){ ROO.x = P.x + 18; ROO.z = P.z; }
  ROO.group.visible = false;
  setRooState('hide');
  ROO.t = ROOCFG.peerTime;
}

function roosterStop(){
  ROO.present = false;
  ROO.peer = 0;
  if (ROO.bulk) for (const m of ROO.bulk) m.visible = true;
  if (ROO.group) ROO.group.visible = false;
  setRooState('off');
}

function updateRooster(dt){
  if (!ROO.present || !ROO.group) return;
  if (!P.alive || P.downed){ ROO.group.visible = false; return; }

  const dx = P.x - ROO.x, dz = P.z - ROO.z;
  const dist = Math.hypot(dx, dz);
  ROO.t -= dt;

  switch (ROO.state){

    /* Far off, and watching. His body stays behind whatever he is standing
       behind and the neck and head come round it. You can find him with the
       beam and it will not stop him — he has not committed to anything yet, so
       there is nothing to break off. Looking only buys you knowing where he is,
       which is worth a great deal and is not the same as being safe. */
    case 'hide': {
      /* He is never watched into existence. The reposition already put him out
         of your view, but a fast turn could catch the frame he switches on, so
         the switch itself waits until he is genuinely not being looked at. */
      const rc = worldToCell(ROO.x, ROO.z);
      if (!ROO.group.visible && !cellSeen(rc.x, rc.y)) ROO.group.visible = true;
      ROO.peer = Math.min(1, (ROO.peer||0) + dt*2.2);
      ROO.spd = 0;
      faceRooster(P.x, P.z, dt*2.5);
      setDread(clamp(0.12 + (1 - dist/40)*0.28, 0.1, 0.42));
      if (ROO.t <= 0){ setRooState('stalk'); ROO.called = false; }
      break;
    }

    /* coming. Faster than you can run, and it does not stop for anything but
       being looked at. */
    case 'stalk': {
      const sc = worldToCell(ROO.x, ROO.z);
      if (!ROO.group.visible && !cellSeen(sc.x, sc.y)) ROO.group.visible = true;
      ROO.spd = roosterSpeed();
      roosterStep(dt, P.x, P.z, ROO.spd);
      setDread(clamp(1 - dist/26, 0.15, 1));

      /* The crow fires when he is CLOSE, not when he appears. Announcing
         himself from across the building gave you a direction and five seconds
         to act on it; announcing at fifty feet tells you he is already here. */
      if (!ROO.called && dist < ROOCFG.callDist){
        ROO.called = true;
        sfxRoosterCall(ROO.x, ROO.z, ROO.cycle);
      }
      // footfalls closing, so you can hear him even with the beam elsewhere
      ROO.stepT -= dt;
      if (ROO.stepT <= 0){ ROO.stepT = 0.42; roosterStep_sfx(dist); }

      if (roosterRepelled()){
        ROO.seenT += dt;
        if (ROO.seenT >= ROOCFG.spotDwell){
          ROO.seenT = 0; ROO.cycle++;
          setRooState('seen'); ROO.t = 0.55;
          sfxRoosterScream(ROO.x, ROO.z);
          toast('IT SEES YOU SEEING IT');
        }
      } else ROO.seenT = Math.max(0, ROO.seenT - dt*2);

      if (dist < ROOCFG.catchDist) roosterCatch();
      break;
    }

    /* caught in the beam: a half second of the two of you looking at each other */
    case 'seen':
      ROO.group.visible = true;
      ROO.spd = 0;
      faceRooster(P.x, P.z, dt*10);
      if (ROO.t <= 0){ setRooState('flee'); ROO.t = ROOCFG.fleeTime; }
      break;

    /* it will not be looked at. It goes, fast, and it goes AWAY from the camera
       rather than away from you — so it leaves your view instead of the room. */
    case 'flee': {
      ROO.group.visible = true;
      ROO.spd = ROOCFG.fleeSpd;
      const dir = camDir();
      const tx = ROO.x + dir.x*14 + rnd(-4,4);
      const tz = ROO.z + dir.z*14 + rnd(-4,4);
      roosterStep(dt, tx, tz, ROO.spd);
      setDread(0.3);
      /* He does not blink out the moment he turns. He RUNS, and he has to be
         genuinely out of your view before he is allowed to move — so you watch
         something that size actually leave, which is the only part of this that
         is ever a relief. The timeout is a safety net for a corridor with
         nowhere to run to, not the normal path. */
      /* Out of sight is the ONLY way out. The old timeout could reposition him
         while he was still in frame, which reads as a bug rather than as a
         disappearance — and this whole character is built on you never catching
         the moment. If a corridor gives him nowhere to run he keeps running. */
      const gone = !roosterSpotted();
      if (gone && ROO.t < ROOCFG.fleeTime - 0.8) roosterNextApproach();
      break;
    }
  }

  /* Peering is its own pose, not just the charge pose with parts switched off.
     He leans BODILY sideways out of the corner — the whole group rolls over,
     the neck comes round with it, and the head stays level because he is
     looking at you the entire time. A rooster is a thing that tilts its head to
     look at you with one eye, and doing that at four metres tall is worse than
     anything he does at speed. */
  if (ROO.state === 'stalk' || ROO.state === 'seen' || ROO.state === 'flee')
    ROO.peer = Math.max(0, (ROO.peer||0) - dt*3.5);
  const peer = ROO.peer || 0;
  const peering = peer > 0.5;
  if (ROO.bulk) for (const m of ROO.bulk) m.visible = !peering;
  // a slow sway, so he is never quite still while he waits
  const sway = Math.sin(performance.now()*0.0009) * 0.09;
  ROO.group.rotation.z = peer * (0.34 + sway);
  ROO.group.rotation.x = peer * 0.1;
  if (ROO.head) ROO.head.rotation.z = -peer * (0.55 + sway*1.5);

  ROO.group.position.set(ROO.x, groundAt(ROO.x, ROO.z), ROO.z);
  ROO.group.rotation.y = ROO.yaw;
  /* ---- animation ----
     A bird does not walk like a mammal. The body stays level and the HEAD
     stabilises: it locks in space while the body moves under it, then whips
     forward to a new lock. That head-bob is the single most recognisable thing
     about a walking chicken, and putting it on something four metres tall is
     what makes this read as a real animal rather than a monster costume.
     Everything below is driven off one gait phase so nothing can drift apart. */
  const moving = ROO.spd > 0.15;
  const charging = ROO.state === 'stalk' || ROO.state === 'flee';
  ROO.gait = (ROO.gait||0) + dt * (moving ? 1.1 + ROO.spd*0.5 : 0);
  const gp = ROO.gait, gs = Math.sin(gp), gc = Math.cos(gp);
  const stride = moving ? 1 : 0;

  // wings: shut while he waits, beating hard the whole time he is coming
  ROO.flap = charging ? Math.min(1, (ROO.flap||0) + dt*5) : Math.max(0, (ROO.flap||0) - dt*4);
  if (ROO.wingL){
    ROO.wingPhase = (ROO.wingPhase||0) + dt * (7 + ROO.spd*2.4);
    const beat = Math.sin(ROO.wingPhase) * ROO.flap;
    const open = ROO.flap * 0.5;
    ROO.wingL.rotation.z =  (open + beat*0.8);
    ROO.wingR.rotation.z = -(open + beat*0.8);
    ROO.wingL.rotation.x = beat*0.3 - ROO.flap*0.15;
    ROO.wingR.rotation.x = beat*0.3 - ROO.flap*0.15;
  }

  /* Legs: thigh swings, hock folds BACKWARDS against it, foot stays flat.
     Two legs half a cycle apart, and the hock leads the thigh by a quarter
     cycle — that lag is what makes a stride look like it is pushing off rather
     than being dragged through the air. */
  ROO.legPhase = gp * 2;
  const lp = ROO.legPhase;
  if (ROO.legL && ROO.legL.userData.hock){
    for (let i=0;i<2;i++){
      const leg = i ? ROO.legR : ROO.legL;
      const ph = lp + (i ? Math.PI : 0);
      const sw = Math.sin(ph), lift = Math.max(0, Math.sin(ph - 0.8));
      leg.rotation.x = sw * 0.55 * stride;
      leg.userData.hock.rotation.x = -lift * 0.95 * stride;
      leg.userData.foot.rotation.x = (lift * 0.5 - sw * 0.25) * stride;
    }
  }

  /* Body: rocks side to side over the standing leg, dips on each footfall, and
     pitches forward the faster he goes. A charging rooster is nearly
     horizontal — that lean is most of the reason he looks like he means it. */
  const lean = charging ? Math.min(0.42, 0.1 + ROO.spd*0.05) : 0;
  ROO.body = lerp(ROO.body||0, lean, Math.min(1, dt*4));
  const roll = gc * 0.09 * stride;
  const bounce = Math.abs(Math.sin(lp)) * 0.11 * stride;

  updateEyeGlow();
  /* Head stabilisation. The body is moving; the head is not. It holds a fixed
     point for most of the cycle and then snaps forward to the next one, which
     is exactly what a chicken does and exactly what nothing else does. The
     saw-tooth is deliberate — a sine here reads as a nodding dog. */
  if (ROO.head){
    const want = Math.atan2(P.x-ROO.x, P.z-ROO.z) - ROO.yaw;
    let d = want; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
    ROO.head.rotation.y = clamp(d, -1.1, 1.1);
    // 0..1 through the cycle, held then whipped
    const u = ((gp*2) % TAU) / TAU;
    const thrust = stride * (u < 0.72 ? -u*0.42 : (u-0.72)/0.28*1.1 - 0.30);
    ROO.head.position.z = 0.72 + thrust*0.42 + ROO.body*0.5;
    ROO.head.position.y = 4.12 - ROO.body*0.85 - bounce*0.4;
    // and he cocks it to one eye when he is not charging
    if (!peering) ROO.head.rotation.z = lerp(ROO.head.rotation.z, charging ? 0 : 0.22, Math.min(1, dt*2));
  }
  // apply the body lean, roll and bounce last, over the peer pose
  ROO.group.rotation.x += ROO.body;
  ROO.group.rotation.z += roll;
  ROO.group.position.y = bounce;
}

function faceRooster(tx, tz, k){
  const want = Math.atan2(tx-ROO.x, tz-ROO.z);
  let d = want - ROO.yaw;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  ROO.yaw += d * Math.min(1, k);
}

/* Walks the grid path like she does, so he cannot cut through a wall — but he
   re-plans four times as often, because he is never wandering. */
function roosterStep(dt, tx, tz, spd){
  faceRooster(tx, tz, dt*6);
  ROO.pathT -= dt;
  if (ROO.pathT <= 0 || !ROO.path.length){
    ROO.pathT = 0.35;
    const a = worldToCell(ROO.x, ROO.z), b = worldToCell(tx, tz);
    ROO.path = findPath(a.x, a.y, b.x, b.y) || [];
  }
  /* findPath returns WORLD positions ({x,z}), not cell coordinates — it runs
     cellToWorld internally before it hands the path back. Treating a waypoint
     as a cell and calling cellToWorld on it again read an undefined .y, which
     made the target NaN, which made his position NaN the first time he had to
     path around anything at all. He then stood still forever at nowhere.
     It only ever looked fine in a test because a target in the same cell
     returns an empty path and falls through to walking straight at you. */
  let gx = tx, gz = tz;
  if (ROO.path.length){
    const wp = ROO.path[0];
    gx = wp.x; gz = wp.z;
    if (Math.hypot(gx-ROO.x, gz-ROO.z) < 1.1) ROO.path.shift();
  }
  const dx = gx-ROO.x, dz = gz-ROO.z, d = Math.hypot(dx,dz) || 1;
  const nx = ROO.x + (dx/d)*spd*dt, nz = ROO.z + (dz/d)*spd*dt;
  const r = collide(nx, nz, 0.5);
  if (Number.isFinite(r.x) && Number.isFinite(r.z)){ ROO.x = r.x; ROO.z = r.z; }
  else { ROO.path.length = 0; ROO.pathT = 0; }   // never let a bad frame strand him
}

/* On night six there is no second chance and no waking up by the doors. */
function roosterCatch(){
  if (!P.alive || P.downed) return;
  ROO.group.visible = true;
  setDread(1);
  sfxRoosterScream(ROO.x, ROO.z);
  killPlayer();
  toast('');
  subtitle('It was never her you had to worry about.', 7);
}

/* ---------------- his voice ----------------
   A crow, but wrong: too low, too long, and it does not resolve. */
function sfxRoosterCall(x, z, cycle){
  if (!AC) return;
  const t = AC.currentTime;
  const base = 300 - Math.min(120, cycle*13);
  for (let v=0; v<3; v++){
    const o = AC.createOscillator();
    o.type = v === 0 ? 'sawtooth' : v === 1 ? 'square' : 'triangle';
    const f0 = base * (1 + v*0.51) * rnd(0.97, 1.03);
    o.frequency.setValueAtTime(f0*0.6, t);
    o.frequency.exponentialRampToValueAtTime(f0*1.35, t+0.14);
    o.frequency.setValueAtTime(f0*1.3, t+0.42);
    o.frequency.exponentialRampToValueAtTime(f0*0.42, t+1.15);   // the fall that never lands
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.09/(v+1), t+0.05);
    g.gain.setValueAtTime(0.085/(v+1), t+0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t+1.25);
    const f = AC.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = rnd(500, 1400); f.Q.value = 1.6;
    o.connect(f); f.connect(g); panned(g, x, z);
    o.start(t); o.stop(t+1.3);
  }
  // and the air moving around something far too big
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const nf = AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=380; nf.Q.value=0.8;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(0, t);
  ng.gain.linearRampToValueAtTime(0.07, t+0.1);
  ng.gain.exponentialRampToValueAtTime(0.0001, t+1.2);
  s.connect(nf); nf.connect(ng); panned(ng, x, z);
  s.start(t); s.stop(t+1.3);
}

/* the noise he makes at being looked at — outrage, not fear */
function sfxRoosterScream(x, z){
  if (!AC) return;
  const t = AC.currentTime;
  for (let v=0; v<2; v++){
    const o = AC.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(rnd(820, 1150) * (1+v*0.34), t);
    o.frequency.exponentialRampToValueAtTime(rnd(180, 260), t+0.42);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.12/(v+1), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
    o.connect(g); panned(g, x, z);
    o.start(t); o.stop(t+0.52);
  }
  noiseBurst(0.5, 'bandpass', 1500, 2.5, 0.1);
}

function roosterStep_sfx(dist){
  if (!AC || dist > 30) return;
  const v = clamp(1 - dist/30, 0.06, 1);
  noiseBurst(0.2, 'lowpass', rnd(90,150), 1.4, 0.2*v*v);
  tone(rnd(44,60), 0.16, 'sine', 0.1*v*v, 30);
}

/* ==========================================================================
   NIGHT SIX
   She does not fight you for it. She brings it to you and puts it down, and
   for about four seconds you think you have got away with all of it.
   ========================================================================== */
const HANDOVER = { active:false, armed:false, done:false, waiting:false, step:0, t:0, range:16 };

function isFinalNight(){ return CAMPAIGN.shift >= CAMPAIGN.last; }

function startHandover(){
  if (HANDOVER.active) return;
  HANDOVER.active = true; HANDOVER.armed = false; HANDOVER.step = 0; HANDOVER.t = 2.2;
  FLOCK.silent = true;
  LOOKAT.on = true;                 // your head turns towards her whether you like it or not
  subtitle('She has been waiting.', 5);
}

/* Armed at the start of the last night, fired when you get close enough to see
   her. She is not summoned — she has been standing over the nest since you
   clocked in, and walking into her range is the whole trigger. */
function updateHandoverTrigger(){
  if (!HANDOVER.armed || HANDOVER.active || !EGG.mesh) return;
  const d = Math.hypot(EGG.x - P.x, EGG.z - P.z);
  if (d < HANDOVER.range && losClear(P.x, P.z, EGG.x, EGG.z)) startHandover();
}

/* She is SHOWN, not simulated. Her AI stays switched off for the whole scene —
   MON.present is false, so nothing hunts, nothing paths, nothing can go wrong
   in the one moment the campaign has been building towards. */
function handoverShowHer(x, z){
  if (!MON.group) buildMonster();
  MON.group.visible = true;
  MON.x = x; MON.z = z;
  MON.group.position.set(x, groundAt(x, z), z);
  MON.group.rotation.y = Math.atan2(P.x-x, P.z-z);
}

/* ---- the camera turn ----
   You do not get to look away from this. Yaw and pitch are eased onto her over
   about a second and released as soon as she has your attention, so it reads as
   your head turning rather than as a cutscene taking the controls off you. */
const LOOKAT = { on:false, t:0 };
function updateLookAt(dt){
  if (!LOOKAT.on) return;
  LOOKAT.t += dt;
  const tx = MON.x, tz = MON.z;
  /* NO +PI. face() sets yaw = atan2(-(tx-P.x), -(tz-P.z)), which is the same
     as atan2(P.x-tx, P.z-tz) — that IS the heading that looks at the target.
     Adding half a turn on top of it aimed you exactly away from her, which is
     precisely what a cinematic camera must never do. */
  const wantYaw = Math.atan2(P.x - tx, P.z - tz);
  let d = wantYaw - P.yaw;
  while (d >  Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  const k = Math.min(1, dt*3.2);
  P.yaw += d * k;
  // and up, because she is nearly four metres to the crown
  const wantPitch = Math.atan2(2.4 - P.y, Math.max(1, Math.hypot(tx-P.x, tz-P.z)));
  P.pitch += (wantPitch - P.pitch) * k;
  if (LOOKAT.t > 1.6 || Math.abs(d) < 0.04) LOOKAT.on = false;
}

/* She may only leave while you are not looking at her. Deliberately the same
   test the building shifter uses - squarely behind your shoulders, not merely
   off the edge of the screen - so no aspect ratio and no quick flick of the
   mouse can ever catch her mid-vanish. */
function updateHenExit(){
  if (!HANDOVER.waiting) return;
  if (!MON.group || !MON.group.visible){ HANDOVER.waiting = false; return; }
  /* Distance must NEVER be enough on its own. The old test let her go if she
     was more than thirty-four metres away whichever way you were facing, so
     backing off down a long hall made her vanish while you were staring
     straight at her. Only your back releases her, and -0.35 is a wider margin
     than the shifter uses because she is four metres tall and you will catch a
     glimpse of her at the very edge of the frame that you would never catch of
     a wall. */
  const dx = MON.x - P.x, dz = MON.z - P.z;
  const d = Math.hypot(dx, dz) || 1;
  const dir = camDir();
  const dot = (dx*dir.x + dz*dir.z) / d;
  if (dot > -0.35) return;                   // anywhere but behind you: she waits
  MON.group.visible = false;
  HANDOVER.waiting = false;
}

function updateHandover(dt){
  updateHandoverTrigger();
  updateLookAt(dt);
  updateHenExit();
  if (!HANDOVER.active) return;
  // keep her facing you for as long as she is here
  if (HANDOVER.step >= 1 && HANDOVER.step < 3 && MON.group && MON.group.visible)
    MON.group.rotation.y = Math.atan2(P.x-MON.x, P.z-MON.z);
  HANDOVER.t -= dt;
  if (HANDOVER.t > 0) return;
  HANDOVER.step++;
  switch (HANDOVER.step){
    /* She does not move. Not a step, not once.
       She used to be re-placed at each beat, which meant that walking towards
       her snapped her two metres backwards and then six more — she appeared to
       flinch away from you in jumps, which is the opposite of everything the
       scene is for. She stands over the nest from the moment the shift begins
       until your back is turned, and the only thing that changes is the egg. */
    case 1:
      HANDOVER.t = 3.4;
      sfxKnows();
      subtitle('She steps back off the nest, and lets you see it.', 5);
      if (EGG.mesh){ EGG.mesh.visible = true; EGG.nest.visible = true; }
      break;
    case 2:
      HANDOVER.t = 3.0;
      subtitle('Every bird in this building is looking at the same door.', 5);
      break;
    case 3:
      HANDOVER.t = 0;
      HANDOVER.active = false;
      HANDOVER.done = true;
      /* She does not blink out in front of you. She stands there until you turn
         away, and when you turn back she is gone, and you did not see it happen
         and there is no moment you can point to. The same rule the walls obey,
         applied to the one thing you have been afraid of for five nights, on
         the night it stops being the thing worth being afraid of. */
      HANDOVER.waiting = true;
      subtitle('Take it, then. That is what you came for.', 6);
      break;
  }
}

/* He does not wake on a timer and he does not wake when she leaves. He wakes
   when you pick it up — so the last thing you do before the worst part of the
   game is choose to do it. */
function eggTakenOnFinalNight(){
  if (!isFinalNight() || ROO.present) return;
  roosterStart();
  flockFrenzy();
  toast('SOMETHING ELSE IS AWAKE');
  subtitle('Keep the light on it. It will not come at you while you are looking.', 8);
}

/* ==========================================================================
   TEST TOOLS
   Numbers 1-6 jump between nights, 7 removes the two resources that stop you
   experimenting, 8 gives you something to shoot the flock with. All of it dies
   with CFG.debugKeys, which is the only thing that has to change for release.
   ========================================================================== */
const CHEAT = { power:false, gun:false };

function toggleCheatPower(){
  CHEAT.power = !CHEAT.power;
  if (CHEAT.power){ LAMP.battery = 1; P.stam = CFG.stamMax; }
  toast(CHEAT.power ? 'INFINITE LIGHT + SPRINT' : 'LIGHT + SPRINT NORMAL');
}
function updateCheats(){
  if (!CHEAT.power) return;
  LAMP.battery = 1;
  P.stam = CFG.stamMax;
}

/* Key 8 used to be a shotgun. It was a laugh for about a minute and then it was
   a way to make the building boring, which is the opposite of what a test build
   should let you do. A speed toggle gets you across a hundred-metre map to the
   thing you are actually testing. */
const RUNSPD = { step: 0, mult: [1, 1.75, 2.75, 4.0] };
function cycleRunSpeed(){
  RUNSPD.step = (RUNSPD.step + 1) % RUNSPD.mult.length;
  const m = RUNSPD.mult[RUNSPD.step];
  toast(m === 1 ? 'SPEED NORMAL' : 'SPEED ' + m + '\u00d7');
}
function runSpeedMult(){ return CFG.debugKeys ? RUNSPD.mult[RUNSPD.step] : 1; }

/* ==========================================================================
   MARKERS  (key 9)
   Arrows over the four things that matter, drawn through walls. depthTest off
   plus a high renderOrder is what makes them punch through geometry; without
   both they sink into the first cage rack between you and the target.
   ========================================================================== */
const MARKS = { on:false, list:[] };

function buildMarkers(){
  if (MARKS.list.length) return;
  const cone = new THREE.ConeGeometry(0.42, 1.1, 5);
  cone.rotateX(Math.PI);                       // point it down at the thing
  const mk = (colour) => {
    const m = new THREE.Mesh(cone, new THREE.MeshBasicMaterial({
      color: colour, transparent:true, opacity:0.92,
      depthTest:false, depthWrite:false, fog:false,
    }));
    m.renderOrder = 999;
    m.frustumCulled = false;
    m.visible = false;
    scene.add(m);
    return m;
  };
  MARKS.list = [
    { key:'roo',  mesh: mk(0xff2b1e), y: 5.6 },   // him
    { key:'hen',  mesh: mk(0xff9e2b), y: 5.2 },   // her
    { key:'van',  mesh: mk(0x4bd46a), y: 4.4 },   // the way out
    { key:'egg',  mesh: mk(0xf2e6bd), y: 2.4 },   // the job
  ];
}

function toggleMarkers(){
  buildMarkers();
  MARKS.on = !MARKS.on;
  if (!MARKS.on) for (const m of MARKS.list) m.mesh.visible = false;
  toast(MARKS.on ? 'MARKERS ON' : 'MARKERS OFF');
}

function markerTarget(key){
  switch (key){
    case 'roo': return ROO.present ? { x:ROO.x, z:ROO.z } : null;
    case 'hen': return (MON.present || (MON.group && MON.group.visible))
                       ? { x:MON.x, z:MON.z } : null;
    case 'van': return { x:EXTRACT.x, z:EXTRACT.z };
    case 'egg': return (EGG.mesh && EGG.mesh.visible && !EGG.held && !EGG.delivered)
                       ? { x:EGG.x, z:EGG.z } : null;
  }
  return null;
}

function updateMarkers(now){
  if (!MARKS.on) return;
  const bob = Math.sin(now*0.004)*0.22;
  for (const m of MARKS.list){
    const t = markerTarget(m.key);
    m.mesh.visible = !!t;
    if (!t) continue;
    m.mesh.position.set(t.x, m.y + bob, t.z);
    m.mesh.rotation.y = now*0.0016;
  }
}

/* ==========================================================================
   THE GATE
   Nights two to five, the nest is not simply lying there. Something has to
   happen first, somewhere else in the building, and doing it is loud.

   Deliberately NOT implemented by sealing part of the map. Locking cells behind
   a door means proving, every night and after every shift of the walls, that
   the player can still reach both the switch and the van — and the building
   already rearranges itself. The lock is on the NEST instead: a powered cage
   over it that will not open until the room it is fed from does. Same three
   beats, none of the ways to strand somebody in a corridor.
   ========================================================================== */
const GATE = {
  need:false, done:false, kind:'power',
  x:0, z:0, mesh:null, cage:null, hold:0, room:null,
};

const GATE_KINDS = [
  { id:'power',   label:'RESTORE POWER',  verb:'The breaker is somewhere off the plant room.',
    hold:2.6, noise:44, done:'THE LIGHTS COME ON' },
  { id:'shutter', label:'RAISE THE SHUTTER', verb:'A cage shutter, hand-cranked, and it has not turned in years.',
    hold:3.4, noise:52, done:'IT GRINDS OPEN' },
  { id:'key',     label:'FIND THE KEY',    verb:'Somebody took the key off the hook and never brought it back.',
    hold:0.8, noise:18, done:'IT TURNS' },
];

function gateKindFor(shift){ return GATE_KINDS[(shift + 1) % GATE_KINDS.length]; }

function clearGate(){
  if (GATE.mesh){ world.remove(GATE.mesh); GATE.mesh = null; }
  if (GATE.cage){ world.remove(GATE.cage); GATE.cage = null; }
  GATE.need = false; GATE.done = false; GATE.hold = 0;
}

/* Night one teaches the loop with nothing in the way, and night six is hers. */
function gateWanted(shift){ return shift >= 2 && shift <= 5; }

function spawnGate(shift){
  clearGate();
  if (!gateWanted(shift)) return;
  const k = gateKindFor(shift);
  GATE.kind = k.id; GATE.need = true; GATE.done = false;

  // somewhere that is neither the bay nor the room the nest is in
  const rooms = G.rooms.filter(r => r.kind !== 'bay' && r !== EGG.room);
  const room = rooms.length ? pick(rooms) : pick(G.rooms.filter(r => r.kind !== 'bay'));
  GATE.room = room;
  /* Against a wall, not adrift in the middle of the floor. Nobody installs a
     breaker where a forklift can hit it, and a panel standing alone in open
     space reads as a prop that was dropped rather than fitted. */
  let placed = false;
  for (const s of wallSpots()){
    const c = worldToCell(s.x, s.z);
    if (c.x < room.x || c.x >= room.x+room.w || c.y < room.y || c.y >= room.y+room.h) continue;
    GATE.x = s.x; GATE.z = s.z; GATE.yaw = s.ry; placed = true; break;
  }
  if (!placed){
    let cell, tries = 0;
    do { cell = randCellIn(room); tries++; } while (gAt(cell.x,cell.y) !== 0 && tries < 40);
    const w = cellToWorld(cell.x, cell.y);
    GATE.x = w.x + rnd(-1.2, 1.2); GATE.z = w.z + rnd(-1.2, 1.2); GATE.yaw = 0;
  }

  // the thing itself: a panel with a handle, and one live indicator
  const g = new THREE.Group();
  /* It used to hang in mid-air at chest height with nothing under it, which
     read as a bug rather than as a fitting. It stands on a post now, with a
     base plate, because everything in a building like this is bolted to
     something. */
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 1.4, 7),
    new THREE.MeshLambertMaterial({ color:0x3a3a36 }));
  post.position.y = 0.7; post.castShadow = true; g.add(post);
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.07, 10),
    new THREE.MeshLambertMaterial({ color:0x2e2e2b }));
  plate.position.y = 0.035; plate.receiveShadow = true; g.add(plate);
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.15, 0.28),
    new THREE.MeshPhongMaterial({ color:0x2b3a34, shininess:22, specular:0x445044 }));
  box.position.y = 1.35; box.castShadow = true; g.add(box);
  const lever = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.42, 0.1),
    new THREE.MeshPhongMaterial({ color:0xb03a24, shininess:40 }));
  lever.position.set(0.26, 1.2, 0.2); lever.rotation.z = 0.5; g.add(lever);
  /* And the lamp is the point of the whole object: it is how you find the
     thing across a dark room. Much bigger, self-lit, with an additive halo so
     it carries through fog instead of being eaten by it. */
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.13, 9, 7),
    new THREE.MeshBasicMaterial({ color:0xff4a22, fog:true }));
  lamp.position.set(-0.26, 1.78, 0.16); g.add(lamp);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5),
    new THREE.MeshBasicMaterial({ map: texEyeGlow(), transparent:true, opacity:0.55,
      depthWrite:false, blending: THREE.AdditiveBlending, fog:false }));
  halo.position.copy(lamp.position);
  g.add(halo);
  GATE.halo = halo;
  g.position.set(GATE.x, groundAt(GATE.x, GATE.z), GATE.z);
  g.rotation.y = GATE.yaw || 0;
  world.add(g);
  GATE.mesh = g; GATE.lever = lever; GATE.lamp = lamp;

  // and the cage over the nest, which is what it actually controls
  const cage = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), MAT.cage);
  cage.position.set(EGG.x, groundAt(EGG.x, EGG.z) + 0.75, EGG.z);
  cage.castShadow = true;
  world.add(cage);
  GATE.cage = cage;

  subtitle(k.verb, 6);
}

function gateBlocked(){ return GATE.need && !GATE.done; }

function gateNear(){
  return GATE.need && !GATE.done && GATE.mesh &&
         Math.hypot(GATE.x - P.x, GATE.z - P.z) < 2.6;
}

/* Press to start, stay to finish. Walking away resets it, which means the
   longest you are ever pinned in one place is the length of the crank — and
   the noise starts the moment you do, not when you succeed. */
function updateGate(dt){
  if (!GATE.need || GATE.done) return;
  const k = GATE_KINDS.find(x => x.id === GATE.kind) || GATE_KINDS[0];
  if (GATE.hold > 0){
    if (!gateNear()){ GATE.hold = 0; subtitle('You let go of it.', 2.5); return; }
    GATE.hold += dt;
    if (GATE.lever) GATE.lever.rotation.z = 0.5 - (GATE.hold/k.hold)*1.0;
    if (Math.random() < dt*6) emitNoise(GATE.x, GATE.z, k.noise, false);
    if (GATE.hold >= k.hold) gateOpen(k);
  }
  if (GATE.lamp){
    const on = GATE.hold > 0 ? (Math.sin(performance.now()*0.02) > 0) : (Math.sin(performance.now()*0.003) > 0.4);
    GATE.lamp.material.color.setHex(on ? 0xff6a3a : 0x40120a);
    if (GATE.halo){
      GATE.halo.material.opacity = on ? 0.75 : 0.12;
      GATE.halo.lookAt(camera.position);       // billboard, or it vanishes edge-on
    }
  }
}

function startGate(){
  if (!gateNear() || GATE.hold > 0) return false;
  const k = GATE_KINDS.find(x => x.id === GATE.kind) || GATE_KINDS[0];
  GATE.hold = 0.0001;
  sfxClick(1);
  emitNoise(GATE.x, GATE.z, k.noise, true);
  suspect(GATE.x, GATE.z, 26);
  subtitle('Hold it. Do not walk away from it.', 4);
  return true;
}

function gateOpen(k){
  GATE.done = true; GATE.hold = 0;
  if (GATE.cage){ world.remove(GATE.cage); GATE.cage = null; }
  if (GATE.lamp) GATE.lamp.material.color.setHex(0x1d6a2a);
  sfxKnows();
  emitNoise(GATE.x, GATE.z, k.noise + 12, true);
  toast(k.done);
  subtitle('Whatever was holding the nest shut is not holding it any more.', 5);
  startleAt(GATE.x, GATE.z, 22, true);
}

/* ==========================================================================
   THE WATCHER
   Night three. One medium bird, waist high, entirely harmless, and the single
   most unpleasant thing in the building — because it does the one thing the
   flock never does: it comes to find you, and it only does it while you are
   not looking.

     unseen          it walks toward you, slowly, forever
     seen at range   it stops dead and looks at you
     seen up close   it breaks and runs, and is gone
