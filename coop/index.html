/* ==========================================================================
   THE EGG
   One thing, hidden somewhere in the building. Finding it is act one.
   Lifting it is the moment the building stops pretending you are alone.
   ========================================================================== */
const EGG = {
  x:0, z:0, mesh:null, nest:null, glow:null,
  held:false, delivered:false, room:null, hum:0,
};
let KNOWS = false;          // has the building noticed the egg is gone

function spawnEgg(){
  if (EGG.mesh){ world.remove(EGG.mesh); world.remove(EGG.nest); }
  EGG.held = false; EGG.delivered = false; EGG.hum = 0;

  /* Not "the furthest room". Furthest meant the opposite corner every single
     night, which is a straight line you learn once and then never think about
     again — the map may as well have been a corridor.

     Score by TURNS instead: walk the actual path from the van to each room and
     count the direction changes. A room two thirds of the way out with six
     corners between you and it is a longer, tenser walk than the far wall in a
     straight line, and it puts the nest somewhere different every night. */
  const cands = G.rooms.filter(r => r.kind !== 'bay');
  /* Path FROM the first walkable cell outside the bay, not from the van. The
     bay is excluded from walkable() on purpose (she is not allowed in it), so a
     path starting at the van can never leave — findPath returned an empty array
     every single time and the turn count was silently always zero. */
  const vc = nearestOpen(worldToCell(EXTRACT.x, EXTRACT.z).x,
                         worldToCell(EXTRACT.x, EXTRACT.z).y);
  let best = null, bestScore = -1;
  let maxD = 1;
  for (const r of cands){
    const c = roomCenter(r);
    maxD = Math.max(maxD, Math.hypot(c.x-EXTRACT.x, c.z-EXTRACT.z));
  }
  for (const r of cands){
    const c = roomCenter(r);
    const d = Math.hypot(c.x-EXTRACT.x, c.z-EXTRACT.z);
    if (d < maxD*0.42) continue;                 // never right next to the van
    const rc = nearestOpen(worldToCell(c.x, c.z).x, worldToCell(c.x, c.z).y);
    const path = findPath(vc.x, vc.y, rc.x, rc.y) || [];
    let turns = 0, lx = 0, lz = 0;
    for (let i=1;i<path.length;i++){
      const ax = Math.sign(path[i].x - path[i-1].x), az = Math.sign(path[i].z - path[i-1].z);
      if ((ax !== lx || az !== lz) && i > 1) turns++;
      lx = ax; lz = az;
    }
    // turns first, distance as a tiebreak, and a shove of randomness so two
    // nights on the same floorplan do not pick the same room
    const score = turns*3 + (d/maxD)*4 + rnd(0, 2.5);
    if (score > bestScore){ bestScore = score; best = r; }
  }
  EGG.room = best || pick(cands);
  best = EGG.room;
  let cell, tries = 0;
  do { cell = randCellIn(best); tries++; } while (gAt(cell.x,cell.y)!==0 && tries<50);
  const w = cellToWorld(cell.x, cell.y);
  EGG.x = w.x + rnd(-1,1); EGG.z = w.z + rnd(-1,1);

  // a nest, because someone made this
  const nest = new THREE.Mesh(new THREE.TorusGeometry(0.42,0.17,5,10),
    new THREE.MeshLambertMaterial({ color:0x4a3d28 }));
  nest.rotation.x = Math.PI/2;
  const eggY = groundAt(EGG.x, EGG.z);
  nest.position.set(EGG.x, eggY + 0.1, EGG.z);
  nest.receiveShadow = true; nest.castShadow = true;
  world.add(nest); EGG.nest = nest;

  const m = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10),
    new THREE.MeshPhongMaterial({ color:0xf0e4cc, shininess:40, specular:0x554a38,
                                  emissive:0x3a2a18 }));
  m.scale.set(1, 1.32, 1);
  m.position.set(EGG.x, eggY + 0.28, EGG.z);
  m.castShadow = true;
  world.add(m); EGG.mesh = m;

  // it is warm, and warm things glow a little in a building this cold
  const glow = new THREE.PointLight(0xffb877, 2.2, 5.5, 2);
  glow.position.set(EGG.x, 0.4, EGG.z);   // local to the egg mesh, so already offset
  m.add(glow); EGG.glow = glow;
}

function takeEgg(){
  /* The cage is the gate. Refusing here rather than sealing off a wing of the
     building is what keeps the shifting walls safe to run alongside it. */
  if (gateBlocked()){
    toast('IT IS STILL CAGED');
    sfxClick(0.3);
    return false;
  }
  const h = freeHand();
  if (h < 0){ toast('YOU NEED A HAND FREE FOR IT'); sfxClick(0.3); return false; }
  EGG.held = true;
  P.hands[h] = { egg:true };
  world.remove(EGG.mesh); world.remove(EGG.nest);
  theBuildingKnows();
  refreshHands();
  return true;
}

function dropEgg(x, z){
  EGG.held = false;
  const r = collide(x, z, 0.3);
  EGG.x = r.x; EGG.z = r.z;
  EGG.mesh.position.set(EGG.x, 0.28, EGG.z);
  world.add(EGG.mesh);
  const i = P.hands.findIndex(h => h && h.egg);
  if (i >= 0) P.hands[i] = null;
  refreshHands();
}

/* the hinge of the whole game */
function theBuildingKnows(){
  if (KNOWS) return;
  KNOWS = true;
  ROBBED = true;
  MON.commit = 0;
  /* Night six: she handed it to you. She is not coming to take it back.
     This has to key off the NIGHT, not off whether the rooster happens to be
     awake yet — gate it on ROO.present and a player who grabs the egg during
     the handover summons her anyway, which is precisely the bug that made the
     last night feel like all the others. */
  /* THE BUILDING MOVES. Not a nudge — everything behind you, all at once, and
     then it keeps moving for the rest of the night. Nine hundred attempts
     instead of two hundred and twenty, because the shifter refuses any change
     you could see and any change that would strand you, so the number you ask
     for and the number you get are very different. */
  SHIFTER.active = true; SHIFTER.t = 1.2;
  mutateUnseen(900);
  flockPanic();
  FLOCK.silent = true;
  sfxShift(1);
  if (isFinalNight()){ sfxKnows(); toast('IT KNOWS'); eggTakenOnFinalNight(); return; }
  monsterArrive();
  sfxKnows();
  LAMP.flicker = 0.9;
  toast('IT KNOWS');
  subtitle('Every bird in the building stopped at once. Get to the van.', 6);
}

function updateEgg(dt){
  if (EGG.held || EGG.delivered || !EGG.mesh) return;
  // a low warm hum when you are near it: the only kind thing in here
  const d = Math.hypot(EGG.x-P.x, EGG.z-P.z);
  const want = d < 20 && losClear(EGG.x,EGG.z,P.x,P.z) ? clamp(1 - d/20, 0, 1) : 0;
  EGG.hum = lerp(EGG.hum, want, dt*2);
  setWarm(EGG.hum);
  if (EGG.glow) EGG.glow.intensity = 2.2 + Math.sin(performance.now()*0.0016)*0.5;
}

function eggInHand(){ return P.hands.some(h => h && h.egg); }

/* ==========================================================================
   THE FLOCK
   Harmless. That is what makes them useful: most of what you hear is nothing,
   so you stop trusting your ears at exactly the wrong moment.
   ========================================================================== */
const FLOCK = {
  birds: [], roosts: [], silent: false, body:null, head:null, cluck:0,
  // rituals. never on a schedule you could learn: kind, duration and the gap
  // between them are all rolled fresh every time.
  ritual: null, rt: 0, rcd: 0, rx: 0, rz: 0, rYaw: 0,
  chantT: 0, chantBeat: 0,
  hush: 0, hushCd: 0,
};
/* Shift one they are birds. By the last one they are organised. The pool a
   ritual is drawn from widens with every egg you have taken out of here, so
   the flock is the guilt meter — and it is still random inside each tier. */
const RITUAL_TIERS = [
  ['watch','face','disperse'],
  ['gather','follow','sentinel'],
  ['ring','chant','vigil'],
  ['procession','part','kneel','mimic'],
];

function ritualPool(){
  const eggs = CAMPAIGN.eggs;
  const tiers = eggs >= 5 ? 4 : eggs >= 3 ? 3 : eggs >= 1 ? 2 : 1;
  let pool = [];
  for (let i=0;i<tiers;i++) pool = pool.concat(RITUAL_TIERS[i]);
  return pool;
}

function pickRitual(){
  FLOCK.ritual = pick(ritualPool());
  const eggs = CAMPAIGN.eggs;
  FLOCK.rt  = rnd(5, 15) + eggs*1.4;              // they hold it longer
  FLOCK.rcd = Math.max(6, rnd(11, 46) - eggs*4.5); // and start again sooner
  if (CAMPAIGN.shift >= 6){                        // and on the last night, barely stop
    FLOCK.rt *= 1.5;
    FLOCK.rcd = Math.max(2.5, FLOCK.rcd * 0.35);
  }
  FLOCK.rYaw = rnd(0, TAU);
  const r = pick(G.rooms);
  const c = roomCenter(r);
  FLOCK.rx = c.x; FLOCK.rz = c.z;
  FLOCK.chantBeat = 0;
  if (FLOCK.ritual === 'gather' && Math.random() < 0.45){
    FLOCK.rx = P.x + rnd(-9,9); FLOCK.rz = P.z + rnd(-9,9);   // sometimes they gather on YOU
  }
}
const BIRD_N = LOWFI ? 300 : 600;

const BIRD_PARTS = ['body','head','beak','comb','wattle','tail','tail2','legs','wingL','wingR'];
function buildFlockMeshes(){
  if (FLOCK.body) return;
  const parts = buildFlockMeshesV2();
  for (const k of BIRD_PARTS) FLOCK[k] = parts[k];
}

function spawnFlock(){
  buildFlockMeshes();
  if (!FLOCK.body.parent) for (const k of BIRD_PARTS) world.add(FLOCK[k]);
  FLOCK.birds.length = 0; FLOCK.roosts.length = 0; FLOCK.silent = false;
  FLOCK.ritual = null; FLOCK.rt = 0; FLOCK.rcd = rnd(8, 26); FLOCK.chantBeat = 0;
  FLOCK.hush = 0; FLOCK.hushCd = rnd(18, 50);

  const add = (px, pz, ri) => {
    FLOCK.birds.push({
      x: px, z: pz, hx: px, hz: pz, y: 0.17,
      yaw: rnd(0,TAU), state:'calm', t: rnd(0,4),
      bob: rnd(0,TAU), roost: ri, speed: 0,
      hopT: 0, hopDur: 0.7, hopH: 0.5, flap: 0, wingPhase: 0,
      // how close she has to be before THIS bird notices. some are oblivious.
      nerve: Math.random() < 0.28 ? rnd(4, 9) : rnd(10, 23),
      size: rnd(0.82, 1.18),
      idx: FLOCK.birds.length, sepd: 0,   // stable identity for the spacing pass
      parked: false,
    });
  };

  const rooms = G.rooms.filter(r => r.kind !== 'bay');
  let made = 0;

  // 1. the vigil around the nest — always the thickest gathering in the building
  const nEgg = Math.floor(BIRD_N * 0.22);
  FLOCK.roosts.push({ x:EGG.x, z:EGG.z, alarm:0 });
  for (let i=0; i<nEgg && made<BIRD_N; i++){
    const a = rnd(0,TAU), rr = rnd(1.2, 8);
    const r0 = collide(EGG.x + Math.sin(a)*rr, EGG.z + Math.cos(a)*rr, 0.2);
    add(r0.x, r0.z, 0); made++;
  }

  // 2. EVERY room gets its own roost, so nowhere in the building is empty
  const perRoom = Math.floor((BIRD_N * 0.56) / Math.max(1, rooms.length));
  rooms.forEach((room, ri) => {
    const c = roomCenter(room);
    FLOCK.roosts.push({ x:c.x, z:c.z, alarm:0 });
    for (let i=0; i<perRoom && made<BIRD_N; i++){
      let cell, tries=0;
      do { cell = randCellIn(room); tries++; } while (gAt(cell.x,cell.y)!==0 && tries<24);
      if (gAt(cell.x,cell.y)!==0) continue;
      const w = cellToWorld(cell.x, cell.y);
      add(w.x + rnd(-1.5,1.5), w.z + rnd(-1.5,1.5), ri+1); made++;
    }
  });

  // 3. the rest loose in the corridors, so the walk between rooms is never empty
  const open = [];
  for (let y=2;y<G.h-2;y++) for (let x=2;x<G.w-2;x++)
    if (gAt(x,y)===0 && !inBayCell(x,y)) open.push({x,y});
  let guard = 0;
  while (made < BIRD_N && open.length && guard++ < BIRD_N*4){
    const c = pick(open);
    const w = cellToWorld(c.x, c.y);
    add(w.x + rnd(-1.6,1.6), w.z + rnd(-1.6,1.6), -1); made++;
  }

  hideSpareBirds(made);
  tintFlock();
}

function hideSpareBirds(made){
  for (let i=made; i<BIRD_N; i++)
    for (const k of BIRD_PARTS) setInst(FLOCK[k], i, 0,-50,0, 0.0001,0.0001,0.0001, 0);
  for (const k of BIRD_PARTS) FLOCK[k].instanceMatrix.needsUpdate = true;
}

function flockPanic(){
  for (const b of FLOCK.birds){ b.state = 'flee'; b.t = rnd(1.4,2.6); b.yaw = rnd(0,TAU); }
  FLOCK.roosts.forEach(r => r.alarm = 3);
  sfxFlap(1);
}

/* walking into a roost sets off a clatter that tells the thing exactly where you are */
function startleAt(x, z, radius, loud){
  let hit = 0;
  for (const b of FLOCK.birds){
    if (b.state === 'flee') continue;
    if (Math.hypot(b.x-x, b.z-z) > radius) continue;
    b.state = 'flee'; b.t = rnd(1.1,2.2);
    b.yaw = Math.atan2(b.x-x, b.z-z) + rnd(-0.5,0.5);
    if (Math.random() < 0.75) birdHop(b, rnd(0.4, 0.95));   // most of them go up
    hit++;
  }
  if (hit >= 1) fxDisturb(x, z, clamp(hit/8, 0.3, 1));
  if (hit >= 2){
    sfxFlap(clamp(hit/6, 0.35, 1));
    emitNoise(x, z, loud ? 26 : 20, true);
    /* Nights one and two only. By night three you know what a startled flock
       sounds like, and being told about it every time you clip a roost turns
       the loudest thing in the building into UI. After that it is just noise,
       which is what it always was. */
    if (hit >= 4 && CAMPAIGN.shift <= 2) toast('THEY SCATTER');
  } else if (hit === 1){
    sfxFlap(0.25);
    emitNoise(x, z, 9);
  }
  return hit;
}

/* ==========================================================================
   PERSONAL SPACE
   A pressed bird stops dead. Sixty stopped birds in the same corner occupy the
   same half metre and render as one pale mass — you cannot count them, so they
   stop being animals. Every bird holds a body's width of clearance from every
   other, in every state, so a packed corner still reads as individuals.

   Uniform hash at exactly the separation distance: any pair close enough to
   matter shares a bucket or touches one, so nine lookups per bird is exhaustive
   and the whole pass stays linear at six hundred birds.
   ========================================================================== */
const SEP = { dist: 0.58, grid: new Map(), moved: [] };

function separateFlock(dt){
  const cs = SEP.dist, g = SEP.grid, N = FLOCK.birds.length;
  const moved = SEP.moved; moved.length = 0;
  g.clear();
  for (let i=0;i<N;i++){
    const b = FLOCK.birds[i];
    // birds nobody can see do not need elbow room
    if (Math.abs(b.x-P.x) > 32 || Math.abs(b.z-P.z) > 32) continue;
    const k = (((b.x/cs)|0) + 512)*1024 + (((b.z/cs)|0) + 512);
    const a = g.get(k);
    if (a) a.push(b); else g.set(k, [b]);
  }
  /* Resolve each overlapping PAIR once and move both birds half the overlap
     apart immediately — a relaxation step, not a soft force. Accumulating
     forces and applying them at the end looks principled and does nothing: in
     a tight cluster every push cancels its opposite and the pile never opens.
     Resolving in place converges in a handful of frames instead of never. */
  const cap = Math.min(dt, 0.05) * 7.0;      // metres a bird may be shoved per frame
  for (const arr of g.values()){
    for (let n=0;n<arr.length;n++){
      const b = arr[n];
      const cx = ((b.x/cs)|0) + 512, cz = ((b.z/cs)|0) + 512;
      for (let ox=-1; ox<=1; ox++) for (let oz=-1; oz<=1; oz++){
        const other = g.get((cx+ox)*1024 + (cz+oz));
        if (!other) continue;
        for (let m=0;m<other.length;m++){
          const o = other[m];
          if (o.idx <= b.idx) continue;      // every pair exactly once
          let dx = b.x-o.x, dz = b.z-o.z;
          let d2 = dx*dx + dz*dz;
          if (d2 >= cs*cs) continue;
          let d;
          if (d2 < 1e-6){
            // exactly coincident: pick a stable direction from the two indices
            const a = (b.idx*2.3999632 + o.idx*1.7);
            dx = Math.sin(a); dz = Math.cos(a); d = 1;
          } else d = Math.sqrt(d2);
          const push = Math.min((cs - d)*0.5, cap);
          const nx = dx/d, nz = dz/d;
          b.x += nx*push; b.z += nz*push;
          o.x -= nx*push; o.z -= nz*push;
          if (!b.sepd){ b.sepd = 1; moved.push(b); }
          if (!o.sepd){ o.sepd = 1; moved.push(o); }
        }
      }
    }
  }
  // one wall check each, after the shoving, rather than one per pair
  for (let i=0;i<moved.length;i++){
    const b = moved[i]; b.sepd = 0;
    const r = collide(b.x, b.z, 0.16);
    b.x = r.x; b.z = r.z;
  }
}

function updateFlock(dt){
  if (!FLOCK.birds.length) return;
  separateFlock(dt);
  const monNear = MON.present;
  const N = FLOCK.birds.length;

  /* Night six: they are already chanting when you walk in and they do not stop
     until you pick it up. No scheduling, no gaps, no other ritual — the whole
     building is doing one thing, and the thing it is doing is waiting. */
  if (isFinalNight() && !KNOWS && !FRENZY.on){
    FLOCK.ritual = 'chant'; FLOCK.rt = 9; FLOCK.silent = false;
  } else
  // ---- ritual scheduling: random kind, random length, random gap ----
  if (!FLOCK.silent){
    if (FLOCK.ritual){
      FLOCK.rt -= dt;
      if (FLOCK.rt <= 0) FLOCK.ritual = null;
    } else {
      FLOCK.rcd -= dt;
      if (FLOCK.rcd <= 0) pickRitual();
    }
  } else FLOCK.ritual = null;

  const rit = FLOCK.ritual;
  const dir = camDir();

  // ---- chanting: a low unison pulse from far too many throats ----
  if (rit === 'chant'){
    FLOCK.chantT -= dt;
    if (FLOCK.chantT <= 0){
      /* Ordinary tempo everywhere, including the last night — it is the fact
         that it NEVER STOPS on night six that does the work, not the speed. It
         only quickens while the camera is locked on her, and then it is not the
         flock reacting to you, it is the flock reacting to her. */
      FLOCK.chantT = (LOOKAT.on || HANDOVER.active) ? 0.25 : 0.42;
      FLOCK.chantBeat++;
      // call, then response: two halves of the flock answering each other
      const half = FLOCK.chantBeat % 2;
      let voices = 0;
      for (let k=0;k<FLOCK.birds.length && voices<9;k++){
        const b = FLOCK.birds[k];
        if ((k & 1) !== half) continue;
        const d = Math.hypot(b.x-P.x, b.z-P.z);
        if (d < 32){ sfxCluck(d*0.55, b.x, b.z); voices++; }
      }
    }
  }

  // ---- a hush over nothing, so silence can never be trusted ----
  FLOCK.hush = Math.max(0, FLOCK.hush - dt);
  FLOCK.hushCd -= dt;
  if (FLOCK.hushCd <= 0 && !FLOCK.silent){
    FLOCK.hushCd = rnd(22, 70);
    if (Math.random() < 0.5){ FLOCK.hush = rnd(2.5, 7); FLOCK.ritual = null; }
  }

  // ---- ambient clucking while nothing is happening ----
  FLOCK.cluck -= dt;
  if (FLOCK.cluck <= 0){
    FLOCK.cluck = rnd(2.2, 7);
    if (!FLOCK.silent && rit !== 'chant'){
      const b = FLOCK.birds[rndi(0, N-1)];
      if (b && b.state === 'calm'){
        const d = Math.hypot(b.x-P.x, b.z-P.z);
        if (d < 26 && b.state !== 'press') sfxCluck(d, b.x, b.z);
      }
    }
  }

  for (let i=0;i<N;i++){
    const b = FLOCK.birds[i];
    b.t -= dt;
    if (b.hopT > 0){
      b.hopT -= dt;
      b.wingPhase += dt*30;
      b.flap = 1;
      if (b.hopT <= 0){ b.hopT = 0; b.flap = 0; }
    } else if (b.state === 'flee'){
      b.wingPhase += dt*22; b.flap = 0.75;
    } else b.flap = Math.max(0, b.flap - dt*3);
    const pdx = P.x-b.x, pdz = P.z-b.z;
    const dP = Math.hypot(pdx, pdz);
    const dM = monNear ? Math.hypot(b.x-MON.x, b.z-MON.z) : 999;

    /* They know before you do — but not all of them, and not at the same range.
       Each bird has its own nerve, rolled per shift, so a quiet room is a hint
       and never a reading. Sometimes they go quiet over nothing at all. */
    const hushed = FLOCK.hush > 0;
    if ((dM < b.nerve || FLOCK.silent || hushed) && b.state !== 'flee'){
      b.state = 'press'; b.t = 1.2;
    }

    /* Anything with a light on it in a room this dark gets an audience. Birds
       near the switch turn and watch it, which does two things: it tells you
       where the switch is from across the building, and it means the moment you
       throw it you have thirty witnesses. */
    if (GATE.need && !GATE.done && b.state === 'calm'){
      const gx = GATE.x - b.x, gz = GATE.z - b.z;
      if (gx*gx + gz*gz < 81){                 // nine metres
        b.speed = 0; b.bob = 0;
        b.yaw = lerp(b.yaw, Math.atan2(gx, gz), Math.min(1, dt*3));
        if (dP < 38) placeBird(i, b); else if (!b.parked){ parkBird(i); b.parked = true; }
        if (dP < 38) b.parked = false;
        continue;
      }
    }

    if (b.state !== 'flee' && (b.state !== 'press' || rit === 'kneel') && rit){
      applyRitual(b, i, rit, dP, pdx, pdz, dir, dt);
    } else {
      switch (b.state){
        case 'calm':  birdCalm(b, i, dt, dP); break;
        case 'stare':
          b.speed = 0; b.bob = 0;
          b.yaw = lerp(b.yaw, Math.atan2(pdx, pdz), Math.min(1, dt*5));
          if (b.t <= 0) b.state = 'calm';
          break;
        case 'dart':
          b.speed = 3.4; b.bob += dt*14; stepBird(b, dt);
          if (b.t <= 0){ b.state = 'calm'; b.hx = b.x; b.hz = b.z; }
          break;
        case 'flee':
          b.speed = 4.6; b.bob += dt*20; stepBird(b, dt);
          if (b.t <= 0){ b.state = FLOCK.silent ? 'press' : 'calm'; b.hx = b.x; b.hz = b.z; }
          break;
        case 'press':
          b.speed = 0; b.bob = 0;
          if (b.t <= 0 && dM > b.nerve + 4 && !FLOCK.silent && FLOCK.hush <= 0) b.state = 'calm';
          break;
      }
    }

    // you brushed one of them
    if (b.state !== 'flee' && dP < (P.sprinting ? 3.4 : 1.9) && Math.hypot(P.vx,P.vz) > 0.7){
      startleAt(b.x, b.z, 4.2, P.sprinting);
    }

    // Past ~38 units the fog has already swallowed them, so there is no point
    // composing eight matrices for a bird nobody can see.
    if (dP < 38) placeBird(i, b);
    else if (!b.parked){ parkBird(i); b.parked = true; }
    if (dP < 38) b.parked = false;
  }
  for (const k of BIRD_PARTS) FLOCK[k].instanceMatrix.needsUpdate = true;
  FLOCK.roosts.forEach(r => { r.alarm = Math.max(0, r.alarm - dt); });
}

/* ---- ordinary milling about, with herd instinct ---- */
function birdCalm(b, i, dt, dP){
  b.bob += dt * 3.4;
  b.speed = 0.34;

  // HERD: sample a handful of neighbours rather than all of them, which keeps
  // this O(n) instead of O(n^2) at two hundred birds.
  let cx=0, cz=0, sx=0, sz=0, ax=0, az=0, n=0;
  const N = FLOCK.birds.length;
  const near = dP < 42;
  for (let k=0; k<(near?7:3); k++){
    const o = FLOCK.birds[(i*13 + k*37 + (FLOCK.chantBeat|0)) % N];
    if (o === b) continue;
    const dx = o.x-b.x, dz = o.z-b.z;
    const d = Math.hypot(dx,dz);
    if (d > 7 || d < 1e-4) continue;
    cx += o.x; cz += o.z; n++;
    if (d < 1.0){ sx -= dx/d; sz -= dz/d; }              // don't crowd
    ax += Math.sin(o.yaw); az += Math.cos(o.yaw);        // drift the same way
  }
  if (n){
    cx = cx/n - b.x; cz = cz/n - b.z;
    const wx = cx*0.4 + sx*2.4 + ax*0.5;
    const wz = cz*0.4 + sz*2.4 + az*0.5;
    if (Math.hypot(wx,wz) > 0.15){
      const want = Math.atan2(wx,wz);
      let d = want - b.yaw;
      while (d> Math.PI) d-=TAU; while (d<-Math.PI) d+=TAU;
      b.yaw += d * Math.min(1, dt*1.4);
    }
  } else if (b.t <= 0){ b.yaw += rnd(-1.6,1.6); b.t = rnd(0.9,3.2); }

  stepBird(b, dt);

  if (b.t <= 0.05 && dP < 13 && Math.random() < 0.28){ b.state='stare'; b.t = rnd(2.5,6); }
  else if (b.t <= 0.05 && Math.random() < 0.05){ b.state='dart'; b.t = rnd(0.5,0.9); b.yaw = rnd(0,TAU); }
  // they only get jumpy when you are close. at a distance they just stand there,
  // which is worse.
  else if (b.t <= 0.05 && dP < 8 && Math.random() < 0.05) birdHop(b, rnd(0.25,0.5));
  else if (b.t <= 0.05 && dP < 3.2 && Math.random() < 0.22) birdHop(b, rnd(0.4,0.85));
}

/* ---- the unsettling part ---- */
function applyRitual(b, i, rit, dP, pdx, pdz, dir, dt){
  const faceP = () => {
    const want = Math.atan2(pdx, pdz);
    let d = want - b.yaw;
    while (d> Math.PI) d-=TAU; while (d<-Math.PI) d+=TAU;
    b.yaw += d * Math.min(1, dt*4);
  };
  const goTo = (tx, tz, spd, stopAt) => {
    const dx = tx-b.x, dz = tz-b.z, d = Math.hypot(dx,dz);
    if (d < (stopAt||0.9)){ b.speed = 0; return true; }
    b.speed = spd;
    const want = Math.atan2(dx,dz);
    let df = want - b.yaw;
    while (df> Math.PI) df-=TAU; while (df<-Math.PI) df+=TAU;
    b.yaw += df * Math.min(1, dt*3.5);
    stepBird(b, dt);
    return false;
  };

  switch (rit){
    case 'watch':
      // every bird in the building turns and looks at you at the same moment
      b.speed = 0; b.bob = 0; faceP();
      break;

    case 'follow': {
      // they come after you — but only while you are not looking at them
      const d = Math.hypot(pdx,pdz) || 1;
      const seen = ((-pdx)*dir.x + (-pdz)*dir.z)/d > 0.55 && d < 22;
      if (seen){ b.speed = 0; b.bob = 0; faceP(); }
      else if (d < 34 && d > 4.5){ b.bob += dt*4; goTo(P.x, P.z, 1.5, 4.5); }
      else { b.speed = 0; faceP(); }
      break;
    }

    case 'gather':
      b.bob += dt*3;
      if (goTo(FLOCK.rx, FLOCK.rz, 1.7, 1.4 + (i%5)*0.5)){
        // stand facing inward, shoulder to shoulder
        const want = Math.atan2(FLOCK.rx-b.x, FLOCK.rz-b.z);
        b.yaw = lerp(b.yaw, want, Math.min(1, dt*3));
      }
      break;

    case 'ring': {
      // a circle around you, at a polite distance, facing in
      const a = (i / FLOCK.birds.length) * TAU;
      const R = 7.5;
      const tx = P.x + Math.sin(a)*R, tz = P.z + Math.cos(a)*R;
      if (goTo(tx, tz, 1.9, 1.1)) faceP();
      break;
    }

    case 'chant':
      // rooted, heads rising and falling together
      b.speed = 0;
      b.bob = FLOCK.chantT * 5.4;
      faceP();
      break;

    case 'face':
      // all of them turned to look at the same nothing
      b.speed = 0; b.bob = 0;
      b.yaw = lerp(b.yaw, FLOCK.rYaw, Math.min(1, dt*2.5));
      break;

    case 'disperse':
      // and sometimes they all just walk away from you
      b.bob += dt*4;
      goTo(b.x - pdx*3, b.z - pdz*3, 1.3, 0.5);
      break;

    case 'vigil': {
      // every bird in the building turns to face the nest, wherever it is
      b.speed = 0; b.bob = 0;
      const tx = EGG.held ? P.x : EGG.x, tz = EGG.held ? P.z : EGG.z;
      const want = Math.atan2(tx-b.x, tz-b.z);
      let d = want - b.yaw;
      while (d> Math.PI) d-=TAU; while (d<-Math.PI) d+=TAU;
      b.yaw += d * Math.min(1, dt*1.6);
      break;
    }

    case 'procession': {
      // single file, following the one in front, going somewhere
      const N = FLOCK.birds.length;
      const lead = FLOCK.birds[(i + N - 1) % N];
      b.bob += dt*3.2;
      if (i === 0) goTo(FLOCK.rx, FLOCK.rz, 1.25, 1.0);
      else goTo(lead.x, lead.z, 1.35, 0.62);
      break;
    }

    case 'mimic': {
      // they all face exactly the way YOU are facing. when you turn, they turn.
      b.speed = 0; b.bob = 0;
      const want = Math.atan2(dir.x, dir.z);
      let d = want - b.yaw;
      while (d> Math.PI) d-=TAU; while (d<-Math.PI) d+=TAU;
      b.yaw += d * Math.min(1, dt*3.2);
      break;
    }

    case 'part': {
      // they clear a corridor for you, and stand either side of it facing in
      const d = Math.hypot(pdx,pdz) || 1;
      const rx = -pdz/d, rz = pdx/d;                 // perpendicular to you
      const side = (i % 2) ? 1 : -1;
      const along = ((i*37) % 100)/100 * 16 - 4;
      const tx = P.x - dir.x*along + rx*side*3.4;
      const tz = P.z - dir.z*along + rz*side*3.4;
      b.bob += dt*3;
      if (goTo(tx, tz, 2.0, 0.8)) faceP();
      break;
    }

    case 'kneel':
      // all of them down at once, breasts to the concrete, facing you
      b.speed = 0; b.bob = 0;
      b.state = 'press'; b.t = 0.6;
      faceP();
      break;

    case 'sentinel': {
      // one bird in twelve stands absolutely still watching you; the rest ignore you
      if (i % 12 === 0){ b.speed = 0; b.bob = 0; faceP(); }
      else birdCalm(b, i, dt, dP);
      break;
    }
  }
}

function pressedNear(b){ return b.state === 'press'; }

/* Hens do not walk out of your way. They go straight up, shriek, and come
   down somewhere else. Height and timing are rolled every single time. */
function birdHop(b, h){
  b.hopH = h;
  b.hopDur = rnd(0.42, 0.78);
  b.hopT = b.hopDur;
  b.wingPhase = rnd(0, TAU);
  b.flap = 1;
}

function stepBird(b, dt){
  if (b.speed <= 0) return;
  const nx = b.x + Math.sin(b.yaw)*b.speed*dt;
  const nz = b.z + Math.cos(b.yaw)*b.speed*dt;
  const r = collide(nx, nz, 0.16);
  if (Math.abs(r.x-nx) > 0.001 || Math.abs(r.z-nz) > 0.001) b.yaw += Math.PI*0.6 + rnd(-0.4,0.4);
  b.x = r.x; b.z = r.z;
}

/* ---------------- flock + egg audio ---------------- */
let warmGain = null, warmOsc = null;

function initWarm(){
  if (!AC || warmGain) return;
  warmGain = AC.createGain(); warmGain.gain.value = 0;
  warmOsc = AC.createOscillator(); warmOsc.type = 'sine'; warmOsc.frequency.value = 132;
  const o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = 198;
  const g2 = AC.createGain(); g2.gain.value = 0.35;
  warmOsc.connect(warmGain); o2.connect(g2); g2.connect(warmGain);
  warmGain.connect(master);
  warmOsc.start(); o2.start();
}
function setWarm(v){ if (warmGain) warmGain.gain.value = v*v*0.035; }

function panFor(x, z){
  const dx = x - P.x, dz = z - P.z, d = Math.hypot(dx,dz) || 1;
  const rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
  return clamp((dx*rx + dz*rz)/d, -1, 1);
}
function panned(node, x, z){
  if (AC.createStereoPanner){
    const p = AC.createStereoPanner(); p.pan.value = panFor(x,z);
    node.connect(p); p.connect(master);
  } else node.connect(master);
}

function sfxCluck(dist, x, z){
  if (!AC) return;
  const t = AC.currentTime, vol = clamp(1 - dist/26, 0, 1) * 0.09;
  const o = AC.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(rnd(300,460), t);
  o.frequency.exponentialRampToValueAtTime(rnd(150,240), t+0.13);
  const f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=2.2;
  const g = AC.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.19);
  o.connect(f); f.connect(g); panned(g,x,z);
  o.start(t); o.stop(t+0.21);
}

function sfxFlap(intensity){
  if (!AC) return;
  const t = AC.currentTime, n = Math.ceil(3 + intensity*7);
  for (let i=0;i<n;i++){
    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = AC.createBiquadFilter(); f.type='bandpass';
    f.frequency.value = rnd(300,1100); f.Q.value = 1.1;
    const g = AC.createGain();
    const at = t + i*rnd(0.02,0.09);
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(0.10*intensity, at+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at+rnd(0.10,0.24));
    s.connect(f); f.connect(g); g.connect(master);
    s.start(at); s.stop(at+0.3);
  }
  // and the squawking
  for (let i=0;i<Math.ceil(intensity*4);i++){
    setTimeout(()=>{ if (AC) sfxCluck(2, P.x, P.z); }, i*rnd(40,150));
  }
}

function sfxKnows(){
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(70, t);
  o.frequency.exponentialRampToValueAtTime(28, t+2.2);
  const g = AC.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.22,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+2.5);
  noiseBurst(1.6,'highpass',2600,1,0.10,0.01);
  sfxShriek();
}

/* ==========================================================================
   FRENZY
   The moment he wakes, six hundred birds stop being scenery. This is not a
   panic — panic scatters and settles. They do not settle.
   ========================================================================== */
const FRENZY = { on:false, t:0, burst:0 };

function flockFrenzy(){
  FRENZY.on = true; FRENZY.t = 0; FRENZY.burst = 0;
  FLOCK.silent = false;
  FLOCK.ritual = null; FLOCK.rt = 0; FLOCK.rcd = 999;   // no rituals. no order at all.
  FLOCK.hush = 0; FLOCK.hushCd = 999;
  for (const b of FLOCK.birds){
    b.state = 'flee';
    b.t = rnd(3, 9);
    b.yaw = rnd(0, TAU);
    if (Math.random() < 0.9) birdHop(b, rnd(0.5, 1.3));
  }
  sfxFlap(1);
  emitNoise(P.x, P.z, 30, false);
}

function updateFrenzy(dt){
  if (!FRENZY.on) return;
  FRENZY.t += dt;
  /* Keep re-lighting them. Left alone a fleeing bird calms down in a couple of
     seconds and the room goes quiet again, which is exactly wrong here — the
     building should not settle for the rest of the night. */
  for (const b of FLOCK.birds){
    if (b.state !== 'flee' && Math.random() < dt*1.6){
      b.state = 'flee'; b.t = rnd(1.5, 5);
      b.yaw = rnd(0, TAU);
      if (Math.random() < 0.4) birdHop(b, rnd(0.4, 1.1));
    }
  }
  // and a rolling wall of noise from somewhere near you, over and over
  FRENZY.burst -= dt;
  if (FRENZY.burst <= 0){
    FRENZY.burst = rnd(0.5, 1.4);
    sfxFlap(rnd(0.5, 1));
    let voices = 0;
    for (let k=0;k<FLOCK.birds.length && voices<7;k+=17){
      const b = FLOCK.birds[k];
        const d = Math.hypot(b.x-P.x, b.z-P.z);
      if (d < 26){ sfxCluck(d*0.5, b.x, b.z); voices++; }
    }
  }
}

/* ==========================================================================
   THE BUILDING MOVES
   Only ever where you are not looking. You never see it happen — you just
   find that the way you came is not the way you came.
   ========================================================================== */
const SHIFTER = { t: 0, changes: 0, active: false };

/* Nothing in front of you EVER changes — not far away, not occluded, not
   through a doorway. A cell only qualifies if it is squarely behind your
   shoulders. dot < -0.2 is about 100 degrees off your facing, which is wider
   than any frustum this camera can produce at any aspect ratio.
   Occlusion is not good enough: a wall can stop occluding the moment you step. */
function cellSeen(cx, cy){
  const w = cellToWorld(cx, cy);
  const dx = w.x - P.x, dz = w.z - P.z;
  const d = Math.hypot(dx, dz);
  if (d < CFG.cell*2.2) return true;           // never rearrange the room you stand in
  const dir = camDir();
  const dot = (dx*dir.x + dz*dir.z) / (d || 1);
  return dot > -0.2;                            // anything not clearly behind counts as seen
}

/* Can whatever is currently after you still walk to where you are standing?
   One flood over walkable cells from the player, and every live hunter has to
   be in it. Cheap enough to run once per batch, and it is the only check that
   speaks for the chase rather than for the floorplan. */
function huntersCanReachPlayer(){
  const hunters = [];
  if (MON.present && MON.state !== 'dead') hunters.push({ x:MON.x, z:MON.z });
  if (typeof ROO !== 'undefined' && ROO.present) hunters.push({ x:ROO.x, z:ROO.z });
  if (!hunters.length) return true;

  const pc = worldToCell(P.x, P.z);
  const start = nearestOpen(pc.x, pc.y);
  const N = G.w*G.h, seen = new Uint8Array(N);
  const q = [start];
  seen[start.y*G.w+start.x] = 1;
  while (q.length){
    const c = q.pop();
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=c.x+dx, ny=c.y+dy;
      if (nx<0||ny<0||nx>=G.w||ny>=G.h) continue;
      const k = ny*G.w+nx;
      if (seen[k] || !walkable(nx,ny)) continue;
      seen[k]=1; q.push({x:nx,y:ny});
    }
  }
  for (const h of hunters){
    const c = worldToCell(h.x, h.z);
    const o = nearestOpen(c.x, c.y);
    if (!seen[o.y*G.w+o.x]) return false;
  }
  return true;
}

/* The strong guarantee: EVERY open cell in the building can reach the van.
   Checking only "can the player get home from where they stand" was not enough
   — it allowed sealed pockets elsewhere, and you can be put into one by a
   respawn, a shove, or simply by walking there before the next batch runs. */
function openRegionOk(){
  let total = 0;
  for (let i=0;i<G.cells.length;i++) if (G.cells[i] === 0) total++;
  if (!total) return false;
  const b = worldToCell(EXTRACT.x, EXTRACT.z);
  const N = G.w*G.h;
  const seen = new Uint8Array(N);
  const q = new Int32Array(N);
  let head = 0, tail = 0, found = 0;
  const si = clamp(b.y,0,G.h-1)*G.w + clamp(b.x,0,G.w-1);
  if (G.cells[si] !== 0) return false;          // the van itself must stand in open space
  q[tail++] = si; seen[si] = 1; found = 1;
  while (head < tail){
    const cur = q[head++];
    const cx = cur % G.w, cy = (cur / G.w)|0;
    for (let k=0;k<4;k++){
      const nx = cx + (k===0?1:k===1?-1:0);
      const ny = cy + (k===2?1:k===3?-1:0);
      if (nx<0||ny<0||nx>=G.w||ny>=G.h) continue;
      const ni = ny*G.w+nx;
      if (seen[ni] || G.cells[ni] !== 0) continue;
      seen[ni] = 1; q[tail++] = ni; found++;
    }
  }
  return found === total;                        // no isolated pockets, anywhere
}

/* can the player still walk from where they stand to the van? */
function vanReachable(){
  const a = worldToCell(P.x, P.z);
  const b = worldToCell(EXTRACT.x, EXTRACT.z);
  const N = G.w*G.h;
  const seen = new Uint8Array(N);
  const q = new Int32Array(N);
  let head = 0, tail = 0;
  const si = clamp(a.y,0,G.h-1)*G.w + clamp(a.x,0,G.w-1);
  const ti = clamp(b.y,0,G.h-1)*G.w + clamp(b.x,0,G.w-1);
  q[tail++] = si; seen[si] = 1;
  while (head < tail){
    const cur = q[head++];
    if (cur === ti) return true;
    const cx = cur % G.w, cy = (cur / G.w)|0;
    for (let k=0;k<4;k++){
      const nx = cx + (k===0?1:k===1?-1:0);
      const ny = cy + (k===2?1:k===3?-1:0);
      if (nx<0||ny<0||nx>=G.w||ny>=G.h) continue;
      const ni = ny*G.w+nx;
      if (seen[ni] || gAt(nx,ny) !== 0) continue;
      seen[ni] = 1; q[tail++] = ni;
    }
  }
  return false;
}

/* Try n mutations on cells nobody is looking at. Anything that would trap the
   player is rolled straight back — the building is cruel, not unfair. */
function mutateUnseen(n){
  const done = [];
  /* Whether she could reach you BEFORE any of this. The reachability check at
     the bottom must only ever punish a batch for BREAKING something — measured
     against nothing, it also punishes it for failing to fix a situation it did
     not cause, and then a single map where she starts out cut off means the
     building never moves again for the rest of the night. Test the delta. */
  const couldReach = huntersCanReachPlayer();
  for (let t=0; t<n; t++){
    /* Sample inside the building, not inside the grid. The grid grew a margin
       of solid ground on three sides for the stairs to be dug into, and that
       margin is locked — so picking uniformly over the whole grid meant nearly
       half of every batch was spent proposing changes to rock it was never
       allowed to touch, and the building visibly stopped moving. */
    const cx = rndi(CORE.x+1, CORE.x+CORE.w-2), cy = rndi(CORE.y+1, CORE.y+CORE.h-2);
    if (inBayCell(cx,cy)) continue;
    const v = gAt(cx,cy);
    if (v === 2) continue;                       // leave the cage stacks be
    /* And leave the stairs alone. A wall opened at the top of a flight is a
       four-metre drop with nothing under it, and a wall closed at the bottom of
       one seals a wing of the building behind a staircase you cannot walk back
       up. The whole elevated wing and both ends of every flight are locked at
       generation and stay locked all night. */
    if (lockedCell(cx,cy)) continue;
    if (cellSeen(cx,cy)) continue;
    /* Never seal a cell anything is standing in. This used to check her and
       the nest and nothing else, which was true when she was the only thing in
       the building — there are now a rooster, up to twelve watchers and a
       peeker out there, and a wall closing on any of them is a bird embedded
       in masonry for the rest of the night. */
    const w = cellToWorld(cx,cy);
    if (v === 0){
      if (Math.hypot(MON.x - w.x, MON.z - w.z) < CFG.cell) continue;
      if (!EGG.held && Math.hypot(EGG.x - w.x, EGG.z - w.z) < CFG.cell) continue;
      if (typeof ROO !== 'undefined' && ROO.present &&
          Math.hypot(ROO.x - w.x, ROO.z - w.z) < CFG.cell) continue;
      if (typeof WATCH !== 'undefined' && WATCH.list.some(W =>
          W.alive && Math.hypot(W.x - w.x, W.z - w.z) < CFG.cell)) continue;
      if (typeof PEEK !== 'undefined' && PEEK.alive &&
          Math.hypot(PEEK.x - w.x, PEEK.z - w.z) < CFG.cell) continue;
      if (Math.hypot(P.x - w.x, P.z - w.z) < CFG.cell*1.2) continue;
    }
    gSet(cx, cy, v === 0 ? 1 : 0);
    if (!openRegionOk()){ gSet(cx, cy, v); continue; }
    done.push({ x:cx, y:cy, was:v });
  }

  /* Opening one wall can REVEAL a cell that was genuinely hidden when it
     changed. Settle: revert anything that is now in view, and repeat, because
     each revert can change what is visible again. */
  for (let pass=0; pass<4; pass++){
    let reverted = 0;
    for (let i=done.length-1; i>=0; i--){
      const c = done[i];
      if (!cellSeen(c.x, c.y)) continue;
      gSet(c.x, c.y, c.was);
      done.splice(i,1); reverted++;
    }
    if (!reverted) break;
  }

  /* The settle pass REVERTS cells, and a revert can re-seal a corridor that was
     load-bearing for the connectivity we just checked. So verify once more at
     the end, and if the batch is bad, throw the whole batch away. A shift where
     the building declines to move is infinitely better than one you cannot leave. */
  if (done.length && !openRegionOk()){
    for (const c of done) gSet(c.x, c.y, c.was);
    done.length = 0;
  }

  /* And one more, which openRegionOk cannot answer: can the things that hunt
     you still GET to you? openRegionOk floods over open cells; she walks on
     walkable ones, which excludes the loading bay and the cage stacks. A batch
     that leaves the building connected but leaves her on the wrong side of it
     is a batch that quietly ends the chase, and the player experiences that as
     the monster losing interest for no reason. If she cannot reach you after
     the batch, the batch does not happen. */
  if (done.length && couldReach && !huntersCanReachPlayer()){
    for (const c of done) gSet(c.x, c.y, c.was);
    done.length = 0;
  }

  if (done.length){
    rebuildWalls();
    MON.path.length = 0; MON.pathT = 0;          // its route just became fiction too
  }
  return done.length;
}

function updateShifter(dt){
  if (!SHIFTER.active || !P.alive) return;
  SHIFTER.t -= dt;
  if (SHIFTER.t > 0) return;
  SHIFTER.t = rnd(5, 9);
  const n = mutateUnseen(90);
  if (n > 0){
    SHIFTER.changes += n;
    sfxShift(clamp(n/14, 0.3, 1));
  }
}

function sfxShift(v){
  if (!AC) return;
  const t = AC.currentTime;
  // distant concrete grinding on something enormous
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = rnd(160,320);
  const g = AC.createGain();
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.13*v, t+rnd(0.2,0.5));
  g.gain.exponentialRampToValueAtTime(0.0001, t+rnd(1.4,2.6));
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t+2.8);
  const o = AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(rnd(40,60), t);
  o.frequency.exponentialRampToValueAtTime(rnd(22,32), t+1.8);
  const og = AC.createGain();
  og.gain.setValueAtTime(0,t); og.gain.linearRampToValueAtTime(0.09*v,t+0.15);
  og.gain.exponentialRampToValueAtTime(0.0001,t+2);
  o.connect(og); og.connect(master); o.start(t); o.stop(t+2.1);
}

/* ==========================================================================
   BETTER BIRDS
   ========================================================================== */
function buildFlockMeshesV2(){
  const pale = new THREE.MeshLambertMaterial({ color:0xdad4c4 });
  const dark = new THREE.MeshLambertMaterial({ color:0x2a2520 });
  const red  = new THREE.MeshLambertMaterial({ color:0x8e2f27 });
  const beakM= new THREE.MeshLambertMaterial({ color:0xc79a3e });

  // low segment counts: at six hundred birds every extra ring is 1,200 triangles
  const body = new THREE.SphereGeometry(0.18, 6, 5);
  body.scale(1, 0.92, 1.22);
  const wing = new THREE.SphereGeometry(0.12, 5, 3);
  wing.scale(0.32, 0.78, 1.15);
  const parts = {
    body: new THREE.InstancedMesh(body, pale, BIRD_N),
    head: new THREE.InstancedMesh(new THREE.SphereGeometry(0.088, 5, 4), pale, BIRD_N),
    beak: new THREE.InstancedMesh(new THREE.ConeGeometry(0.035, 0.1, 4), beakM, BIRD_N),
    comb: new THREE.InstancedMesh(new THREE.BoxGeometry(0.02, 0.055, 0.075), red, BIRD_N),
    tail: new THREE.InstancedMesh(new THREE.ConeGeometry(0.1, 0.2, 4), pale, BIRD_N),
    tail2:new THREE.InstancedMesh(new THREE.ConeGeometry(0.14, 0.3, 4), pale, BIRD_N),
    wattle:new THREE.InstancedMesh(new THREE.BoxGeometry(0.022,0.05,0.03), red, BIRD_N),
    legs: new THREE.InstancedMesh(new THREE.BoxGeometry(0.055, 0.12, 0.055), dark, BIRD_N),
    wingL: new THREE.InstancedMesh(wing, pale, BIRD_N),
    wingR: new THREE.InstancedMesh(wing, pale, BIRD_N),
  };
  for (const k in parts){
    // only the body casts — at three hundred birds the shadow pass is the cost
    parts[k].castShadow = (k === 'body');
    parts[k].receiveShadow = false;
    parts[k].frustumCulled = false;
  }
  return parts;
}

function parkBird(i){
  for (let k=0;k<BIRD_PARTS.length;k++)
    setInst(FLOCK[BIRD_PARTS[k]], i, 0, -60, 0, 0.0001, 0.0001, 0.0001, 0);
}

function placeBird(i, b){
  const press = b.state === 'press';
  const gy = groundAt(b.x, b.z);         // whatever floor this one is standing on
  const bobA  = b.state === 'calm' ? 0.022 : b.state === 'stare' ? 0 : 0.075;
  // a real hen doesn't run away, it launches half a metre straight up
  const hop   = b.hopT > 0 ? Math.sin((1 - b.hopT/b.hopDur)*Math.PI) * b.hopH : 0;
  const y     = gy + (press ? 0.115 : 0.185 + Math.abs(Math.sin(b.bob))*bobA) + hop;
  const s     = press ? 0.92 : 1;
  const sy    = press ? 0.72 : 1;
  const sn    = Math.sin(b.yaw), cs = Math.cos(b.yaw);
  const sc    = b.size || 1;                    // no two of them the same size

  setInst(FLOCK.body, i, b.x, y, b.z, s*sc, sy*sc, s*sc, b.yaw);

  // head sits forward and up; pecks when calm, locks rigid when staring
  const peck = b.state === 'calm' ? Math.max(0, Math.sin(b.bob))*0.11 : 0;
  const hx = b.x + sn*0.16, hz = b.z + cs*0.16;
  const hy = (press ? gy + 0.15 : y + 0.135) - peck;
  setInst(FLOCK.head, i, hx, hy, hz, sc,sc,sc, b.yaw);
  setInst(FLOCK.comb, i, hx, hy + 0.085*sc, hz, sc,sc,sc, b.yaw);
  setInst(FLOCK.wattle, i, hx + sn*0.05, hy - 0.06*sc, hz + cs*0.05, sc,sc,sc, b.yaw);

  // beak points the way it is facing — this is what makes a stare read as a stare
  const bkx = hx + sn*0.085, bkz = hz + cs*0.085;
  _p.set(bkx, hy - 0.005, bkz); _s.set(1,1,1);
  _e.set(Math.PI/2, b.yaw, 0, 'YXZ'); _q.setFromEuler(_e);
  _m.compose(_p,_q,_s); FLOCK.beak.setMatrixAt(i, _m);

  // two layers of tail: a short one and a taller fan behind it
  _p.set(b.x - sn*0.19*sc, y + 0.07*sc, b.z - cs*0.19*sc); _s.set(sc,sc,sc);
  _e.set(-0.9, b.yaw, 0, 'YXZ'); _q.setFromEuler(_e);
  _m.compose(_p,_q,_s); FLOCK.tail.setMatrixAt(i, _m);
  _p.set(b.x - sn*0.235*sc, y + 0.13*sc, b.z - cs*0.235*sc); _s.set(sc,sc,sc);
  _e.set(-1.16, b.yaw, 0, 'YXZ'); _q.setFromEuler(_e);
  _m.compose(_p,_q,_s); FLOCK.tail2.setMatrixAt(i, _m);

  setInst(FLOCK.legs, i, b.x, gy + (press ? 0.03 : 0.06) + hop, b.z, sc, (press ? 0.35 : 1)*sc, sc, b.yaw);

  // wings: tucked flat unless it is flapping, then out and beating hard
  const flap = b.flap || 0;
  const beat = flap > 0 ? Math.sin(b.wingPhase) : 0;
  const open = flap * (0.55 + beat*0.75);
  const rx = cs, rz = -sn;                       // the bird's own right vector
  for (let w=0; w<2; w++){
    const side = w ? 1 : -1;
    const off  = (0.115 + open*0.075)*sc;
    _p.set(b.x + rx*side*off, y + 0.02 + open*0.1, b.z + rz*side*off);
    _s.set(sc,sc,sc);
    _e.set(0, b.yaw, side*(0.15 + open*1.15), 'YXZ');
    _q.setFromEuler(_e);
    _m.compose(_p,_q,_s);
    (w ? FLOCK.wingR : FLOCK.wingL).setMatrixAt(i, _m);
  }
}

/* ==========================================================================
   A BETTER TALL THING
   ========================================================================== */
function buildMonsterV2(){
  const g = new THREE.Group();
  const skin = new THREE.MeshPhongMaterial({ color:0xc9c0ad, shininess:5,  specular:0x181512 });
  const raw  = new THREE.MeshPhongMaterial({ color:0xa5766a, shininess:12, specular:0x241614 });
  const dark = new THREE.MeshPhongMaterial({ color:0x241d18, shininess:4 });
  const red  = new THREE.MeshPhongMaterial({ color:0x7d221c, shininess:16, specular:0x331010 });

  /* She is not tall and thin. She is a hen the size of a car — grotesquely
     overfed, barely able to carry herself, and still coming. */
  const body = new THREE.Mesh(new THREE.SphereGeometry(1.15, 14, 11), skin);
  body.scale.set(1.06, 0.98, 1.28);
  body.position.set(0, 1.42, 0);
  body.castShadow = true; body.receiveShadow = true; g.add(body);

  // a vast pale belly, hanging low and almost clean — the only white on her
  const white = new THREE.MeshPhongMaterial({ color:0xf2eee4, shininess:18, specular:0x3a3630 });
  const belly = new THREE.Mesh(new THREE.SphereGeometry(1.02, 13, 10), white);
  belly.scale.set(0.94, 0.82, 1.1);
  belly.position.set(0, 0.86, 0.16);
  belly.castShadow = true; belly.receiveShadow = true; g.add(belly);

  // the plucked breast above it, raw where the feathers gave up
  const breast = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 10), raw);
  breast.scale.set(0.96, 0.86, 0.7);
  breast.position.set(0, 1.42, 0.66);
  breast.castShadow = true; g.add(breast);

  // haunches
  for (const side of [-1,1]){
    const hip = new THREE.Mesh(new THREE.SphereGeometry(0.5, 9, 8), skin);
    hip.scale.set(0.8, 0.86, 1);
    hip.position.set(side*0.72, 0.92, -0.18);
    hip.castShadow = true; g.add(hip);
  }

  /* The neck is the wrong part. A hen that size should have a thick short one;
     hers is long, thin and bare.

     It used to be seven spheres in a row with a vertebra bolted to each. Up
     close that reads as a string of beads rather than an animal, and the seams
     between them catch the torch in a way nothing living does. One swept tube
     along a curve instead: a single unbroken piece, tapering from shoulder to
     skull, with the bend built into the curve rather than faked by stacking. */
  MON.neck = [];
  const spine = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,    2.20, 0.24),
    new THREE.Vector3(0.02, 2.62, 0.40),
    new THREE.Vector3(0.01, 3.06, 0.52),
    new THREE.Vector3(-0.01,3.48, 0.56),
    new THREE.Vector3(0,    3.86, 0.50),
  ]);
  const neckGeo = new THREE.TubeGeometry(spine, 22, 0.235, 10, false);
  /* Taper it by hand: TubeGeometry has one radius for its whole length, and a
     neck that does not narrow toward the head reads as a pipe. The v coordinate
     runs 0 at the shoulder to 1 at the skull, so scale each ring by it. */
  {
    const pos = neckGeo.attributes.position, uv = neckGeo.attributes.uv;
    const tmp = new THREE.Vector3();
    for (let i=0;i<pos.count;i++){
      const t = uv.getY(i);
      const k = 1 - t*0.42;
      const p = spine.getPointAt(Math.min(1, Math.max(0, t)));
      tmp.set(pos.getX(i), pos.getY(i), pos.getZ(i)).sub(p).multiplyScalar(k).add(p);
      pos.setXYZ(i, tmp.x, tmp.y, tmp.z);
    }
    pos.needsUpdate = true;
    neckGeo.computeVertexNormals();
  }
  const neck = new THREE.Mesh(neckGeo, raw);
  neck.castShadow = true; neck.receiveShadow = true;
  g.add(neck); MON.neck.push(neck);

  // head: small for the body, which is exactly what makes it wrong
  const head = new THREE.Group();
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.32, 10, 9), raw);
  skull.scale.set(0.94, 0.9, 1.12);
  skull.castShadow = true; head.add(skull);

  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.62, 6), new THREE.MeshPhongMaterial({ color:0xb8933c, shininess:30 }));
  beak.rotation.x = Math.PI/2;
  beak.position.set(0, -0.02, 0.5);
  beak.castShadow = true; head.add(beak);

  // a heavy comb flopped over, and wattles far too long
  for (let i=0;i<5;i++){
    const lobe = new THREE.Mesh(new THREE.SphereGeometry(0.11 - i*0.008, 7, 6), red);
    lobe.scale.set(0.5, 1.25, 1);
    lobe.position.set(rnd(-0.03,0.03), 0.3 - i*0.015, 0.2 - i*0.11);
    lobe.rotation.z = 0.5 + i*0.05;
    head.add(lobe);
  }
  for (const side of [-1,1]){
    const wattle = new THREE.Mesh(new THREE.SphereGeometry(0.1, 7, 6), red);
    wattle.scale.set(0.55, 2.1, 0.7);
    wattle.position.set(side*0.09, -0.32, 0.3);
    head.add(wattle);
  }
  for (const side of [-1,1]){
    const socket = new THREE.Mesh(new THREE.SphereGeometry(0.075, 7, 6), dark);
    socket.position.set(side*0.2, 0.09, 0.2); head.add(socket);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.028, 5, 4),
      new THREE.MeshPhongMaterial({ color:0x0a0a0a, shininess:120, specular:0xbbbbbb }));
    glint.position.set(side*0.22, 0.1, 0.26); head.add(glint);
  }
  head.position.set(0, 3.86, 0.72);
  g.add(head); MON.headBone = head;

  // stubby legs buried in all that weight — she waddles, and it is worse
  MON.legs = [];
  for (const side of [-1,1]){
    const leg = new THREE.Group();
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.18, 0.46, 7), skin);
    thigh.position.y = -0.23; thigh.castShadow = true; leg.add(thigh);
    const shin = new THREE.Group();
    const shinM = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.11, 0.44, 7), raw);
    shinM.position.y = -0.22; shinM.castShadow = true; shin.add(shinM);
    const foot = new THREE.Group();
    for (const t of [-0.5, 0, 0.5]){
      const toe = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.09, 0.52), dark);
      toe.position.set(Math.sin(t)*0.2, -0.46, 0.2 + Math.cos(t)*0.05);
      toe.rotation.y = t; toe.castShadow = true; foot.add(toe);
    }
    shin.add(foot);
    shin.position.y = -0.46; leg.add(shin);
    leg.position.set(side*0.44, 0.86, 0.02);
    leg.userData.shin = shin;
    g.add(leg); MON.legs.push(leg);
  }

  // stubs where the wings were, and a ragged fan of tail quills
  for (const side of [-1,1]){
    const stub = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 7), skin);
    stub.scale.set(0.45, 0.8, 1.05);
    stub.position.set(side*1.14, 1.34, 0.1);
    stub.rotation.z = side*0.24;
    stub.castShadow = true; g.add(stub);
  }
  for (let i=0;i<9;i++){
    const q = new THREE.Mesh(new THREE.ConeGeometry(0.075, rnd(0.7,1.25), 4), skin);
    const a = -0.9 + i*0.225;
    q.position.set(Math.sin(a)*0.5, 1.9 + Math.cos(a)*0.25, -1.28);
    q.rotation.set(-1.15, 0, a*0.85);
    q.castShadow = true; g.add(q);
  }

  g.visible = false;
  world.add(g);
  return g;
}

/* ==========================================================================
   ENVIRONMENT DETAIL
   ========================================================================== */
function buildDetail(){
  /* All of this is instanced. The first version used one mesh per object and
     pushed draw calls from 35 to 165 for scenery nobody looks at twice. */
  const panelM = new THREE.MeshLambertMaterial({ color:0x36372f });
  const woodM  = new THREE.MeshLambertMaterial({ color:0x4b3d29 });
  const plastM = new THREE.MeshLambertMaterial({ color:0x2f3a34 });
  const wetM   = new THREE.MeshPhongMaterial({ color:0x14161a, shininess:110, specular:0x555f66 });
  const wireM  = new THREE.MeshLambertMaterial({ color:0x1b1b1d });

  const openCells = [];
  for (let y=2;y<G.h-2;y++) for (let x=2;x<G.w-2;x++) if (gAt(x,y)===0) openCells.push({x,y});
  if (!openCells.length) return;
  /* A spot now knows how high its floor is. Everything in both dressing passes
     is positioned off this, so a room at the bottom of a flight gets dressed
     like every other room instead of having its furniture hang in the air four
     metres over the floor. */
  const spot = () => { const c = pick(openCells); const w = cellToWorld(c.x,c.y);
                       const x = w.x + rnd(-1.4,1.4), z = w.z + rnd(-1.4,1.4);
                       return { x, z, y: groundAt(x,z) }; };

  const mk = (geo, mat, n, shadow) => {
    const m = new THREE.InstancedMesh(geo, mat, n);
    m.castShadow = !!shadow; m.receiveShadow = true; m.frustumCulled = false;
    world.add(m); DETAIL.push(m); return m;
  };

  // fallen ceiling panels
  const NP = 30;
  const panels = mk(new THREE.BoxGeometry(1,0.04,1), panelM, NP, false);
  for (let i=0;i<NP;i++){ const s = spot(), k = rnd(0.7,1.35);
    setInst(panels, i, s.x, s.y+0.02, s.z, k, 1, rnd(0.7,1.35), Math.random()*TAU); }
  panels.instanceMatrix.needsUpdate = true;

  // pallets: one instanced slat mesh, one instanced base
  const NPAL = 14, NSLAT = NPAL*5;
  const slats = mk(new THREE.BoxGeometry(1.1,0.06,0.14), woodM, NSLAT, true);
  const bases = mk(new THREE.BoxGeometry(1.1,0.1,1.0), woodM, NPAL, true);
  let si = 0;
  for (let i=0;i<NPAL;i++){
    const s = spot(), ry = Math.random()*TAU;
    const sn = Math.sin(ry), cs = Math.cos(ry);
    setInst(bases, i, s.x, s.y+0.05, s.z, 1,1,1, ry);
    for (let k=0;k<5;k++){
      const off = -0.44 + k*0.22;
      setInst(slats, si++, s.x + sn*off, s.y+0.12, s.z + cs*off, 1,1,1, ry);
    }
    // no collider: a pallet is 15cm tall. Stopping a grown adult dead against
    // an ankle-high board is the single most infuriating thing a level can do.
  }
  slats.instanceMatrix.needsUpdate = true; bases.instanceMatrix.needsUpdate = true;

  // drums and buckets
  const ND = 20;
  const drums = mk(new THREE.CylinderGeometry(0.3,0.3,0.78,9), plastM, ND, true);
  for (let i=0;i<ND;i++){
    const s = spot(), small = Math.random() < 0.5;
    const k = small ? 0.58 : 1;
    setInst(drums, i, s.x, s.y+(small?0.23:0.39), s.z, k, small?0.42:1, k, Math.random()*TAU);
    if (!small) PILLARS.push({ x:s.x, z:s.z, r:0.31 });   // the drum, not a halo round it
  }
  drums.instanceMatrix.needsUpdate = true;

  // standing water
  const NW = 18;
  const pools = mk(new THREE.CircleGeometry(1, 12), wetM, NW, false);
  for (let i=0;i<NW;i++){
    const s = spot(), k = rnd(0.6,2.0);
    _p.set(s.x, s.y+0.012, s.z); _s.set(k,k,k);
    _e.set(-Math.PI/2, 0, Math.random()*TAU, 'XYZ'); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); pools.setMatrixAt(i, _m);
  }
  pools.instanceMatrix.needsUpdate = true;

  // wires out of the ceiling, drifting
  const NWI = 34;
  const wires = mk(new THREE.CylinderGeometry(0.014,0.014,1,4), wireM, NWI, true);
  const wireData = [];
  for (let i=0;i<NWI;i++){
    const s = spot(), len = rnd(0.5,2.2);
    wireData.push({ x:s.x, y:s.y, z:s.z, len, phase:Math.random()*TAU, amp:rnd(0.02,0.09) });
  }
  props.push({ kind:'wires', obj:wires, data:wireData });

  // cage doors torn off and leaning
  const NC = 16;
  const doors = mk(new THREE.BoxGeometry(0.9,0.7,0.05), MAT.cage, NC, true);
  for (let i=0;i<NC;i++){
    const s = spot();
    _p.set(s.x, s.y+0.34, s.z); _s.set(1,1,1);
    _e.set(rnd(-0.55,-0.2), Math.random()*TAU, rnd(-0.12,0.12), 'YXZ'); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); doors.setMatrixAt(i, _m);
  }
  doors.instanceMatrix.needsUpdate = true;

  buildDetail2(openCells, spot, mk);
}

/* ==========================================================================
   SECOND DRESSING PASS
   The first pass filled the floor. What was missing was everything at eye
   height and above — a room you can only read by looking down is a room that
   feels like a corridor. All instanced; this whole function is ten draw calls.
   ========================================================================== */
function wallSpots(){
  /* every open cell with a solid neighbour, plus the direction that faces away
     from the wall — so things can be hung ON walls instead of floating near them */
  const out = [];
  const D = [[1,0,-Math.PI/2],[-1,0,Math.PI/2],[0,1,Math.PI],[0,-1,0]];
  for (let y=2;y<G.h-2;y++) for (let x=2;x<G.w-2;x++){
    if (gAt(x,y) !== 0) continue;
    for (const [dx,dy,ry] of D){
      if (gAt(x+dx, y+dy) !== 1) continue;
      const w = cellToWorld(x,y);
      const wx = w.x + dx*(CFG.cell/2 - 0.09), wz = w.z + dy*(CFG.cell/2 - 0.09);
      /* Carry the WALL cell, not just the position. Anything hung on a wall has
         to be able to say which wall, because the building rearranges itself
         later and a notice pinned to a partition that is no longer there is a
         sheet of paper hanging in mid-air — which is exactly what was
         happening, and it is the single most immersion-breaking thing the
         shifting walls could possibly produce. */
      out.push({ x: wx, z: wz, ry, y: groundAt(wx, wz), cx: x+dx, cy: y+dy });
    }
  }
  return out;
}

function buildDetail2(openCells, spot, mk){
  const steelM  = new THREE.MeshLambertMaterial({ color:0x585c60 });
  const boxM    = new THREE.MeshLambertMaterial({ color:0x2b3b33 });
  const sackM   = new THREE.MeshLambertMaterial({ color:0x6a6250 });
  const featherM= new THREE.MeshLambertMaterial({ color:0xcfc8b6, transparent:true,
                                                  opacity:0.9, depthWrite:false });
  const paperM  = new THREE.MeshLambertMaterial({ color:0xa79f8a, side:THREE.DoubleSide });
  const walls = wallSpots();
  /* Taking a wall spot pins that wall for the night. Ninety-odd cells out of
     two thousand, and the shifter has hundreds of other places to go. */
  const wspot = () => {
    if (!walls.length) return null;
    const s = pick(walls);
    lockCell(s.cx, s.cy);
    return s;
  };

  /* Troughs, ducting and breaker boxes are all boxes in the same grey steel, so
     they are all the SAME instanced mesh at different per-instance scales. Three
     kinds of object, one draw call. */
  const NTR = 22, NDU = 16, NBR = 20;
  const steelBoxes = mk(new THREE.BoxGeometry(1,1,1), steelM, NTR+NDU+NBR, false);
  let bi = 0;
  for (let i=0;i<NTR;i++){                              // feed troughs, on the floor
    const s = spot();
    _p.set(s.x, s.y+0.1, s.z); _s.set(0.34,0.2,2.6);
    _e.set(0, Math.random()<0.5 ? 0 : Math.PI/2, 0); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); steelBoxes.setMatrixAt(bi++, _m);
  }
  for (let i=0;i<NDU;i++){                              // trunking, high on the wall
    const s = wspot(); if (!s) break;
    _p.set(s.x, s.y+WALL_H-0.95, s.z); _s.set(0.62,0.5,CFG.cell);
    _e.set(0, s.ry, 0); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); steelBoxes.setMatrixAt(bi++, _m);
  }
  for (let i=0;i<NBR;i++){                              // breaker boxes, at chest height
    const s = wspot(); if (!s) break;
    _p.set(s.x, s.y+rnd(1.2,1.7), s.z); _s.set(0.42,0.6,0.18);
    _e.set(0, s.ry, 0); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); steelBoxes.setMatrixAt(bi++, _m);
  }
  for (let i=bi;i<NTR+NDU+NBR;i++) setInst(steelBoxes, i, 0,-60,0, 0.001,0.001,0.001, 0);
  steelBoxes.instanceMatrix.needsUpdate = true;

  // ---- water line: thin pipe at shin height along the walls ----
  const NL = 30;
  const lines = mk(new THREE.CylinderGeometry(0.035,0.035,CFG.cell,5), MAT.rust, NL, false);
  for (let i=0;i<NL;i++){
    const s = wspot(); if (!s) break;
    _p.set(s.x, s.y+rnd(0.35,0.62), s.z); _s.set(1,1,1);
    _e.set(Math.PI/2, s.ry, 0, 'YXZ'); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); lines.setMatrixAt(i,_m);
  }
  lines.instanceMatrix.needsUpdate = true;

  /* ---- dead fluorescent battens ----
     Fitting and tube are one baked geometry, so a light fitting is one instance
     rather than two meshes chasing each other around the ceiling. */
  const NF = 26;
  const fitting = bakeGeo([
    { g:new THREE.BoxGeometry(0.16,0.09,1.5), p:[0,0,0] },
    { g:new THREE.CylinderGeometry(0.035,0.035,1.42,5), p:[0,-0.08,0], r:[Math.PI/2,0,0] },
  ]);
  const battens = mk(fitting, steelM, NF, false);
  for (let i=0;i<NF;i++){
    const s = spot();
    setInst(battens, i, s.x, s.y+WALL_H-0.16, s.z, 1,1,1, Math.random()<0.5 ? 0 : Math.PI/2);
  }
  battens.instanceMatrix.needsUpdate = true;

  // ---- stacked egg flats, the plastic kind, still in towers ----
  const NST = 12, NPT = NST*6;
  const flats = mk(new THREE.BoxGeometry(0.78,0.09,0.78), boxM, NPT, true);
  let fi = 0;
  for (let i=0;i<NST;i++){
    const s = spot(), ry = Math.random()*TAU, lean = rnd(-0.06,0.06);
    for (let k=0;k<6;k++)
      setInst(flats, fi++, s.x + lean*k, s.y+0.05 + k*0.1, s.z + lean*k*0.6, 1,1,1, ry + k*0.04);
    PILLARS.push({ x:s.x, z:s.z, r:0.42 });
  }
  flats.instanceMatrix.needsUpdate = true;

  // ---- feed sacks, split, spilling ----
  const NSA = 16;
  const sacks = mk(new THREE.SphereGeometry(0.3,6,5), sackM, NSA, true);
  for (let i=0;i<NSA;i++){
    const s = spot();
    setInst(sacks, i, s.x, s.y+0.2, s.z, rnd(0.9,1.3), rnd(0.55,0.8), rnd(1.2,1.7), Math.random()*TAU);
  }
  sacks.instanceMatrix.needsUpdate = true;

  // ---- feathers. Hundreds. They are the dust of this building. ----
  const NFE = LOWFI ? 90 : 200;
  const feathers = mk(new THREE.PlaneGeometry(0.1,0.26), featherM, NFE, false);
  for (let i=0;i<NFE;i++){
    const s = spot();
    _p.set(s.x, s.y+0.011, s.z); _s.set(rnd(0.7,1.5),rnd(0.7,1.5),1);
    _e.set(-Math.PI/2, 0, Math.random()*TAU, 'XYZ'); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); feathers.setMatrixAt(i,_m);
  }
  feathers.instanceMatrix.needsUpdate = true;

  // ---- paperwork, still pinned to the walls, forty years out of date ----
  const NPA = 22;
  const paper = mk(new THREE.PlaneGeometry(0.3,0.42), paperM, NPA, false);
  for (let i=0;i<NPA;i++){
    const s = wspot(); if (!s) break;
    _p.set(s.x, s.y+rnd(1.3,1.9), s.z); _s.set(rnd(0.8,1.5),rnd(0.8,1.4),1);
    _e.set(0, s.ry, rnd(-0.14,0.14), 'YXZ'); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); paper.setMatrixAt(i,_m);
  }
  paper.instanceMatrix.needsUpdate = true;

  // ---- hanging chains from the ceiling, drifting like the wires ----
  const NCH = 18;
  const chains = mk(new THREE.CylinderGeometry(0.03,0.03,1,5), steelM, NCH, true);
  const chainData = [];
  for (let i=0;i<NCH;i++){
    const s = spot();
    chainData.push({ x:s.x, y:s.y, z:s.z, len:rnd(0.9,2.6), phase:Math.random()*TAU, amp:rnd(0.01,0.05) });
  }
  props.push({ kind:'wires', obj:chains, data:chainData });
}

function updateWires(mesh, data, now){
  for (let i=0;i<data.length;i++){
    const d = data[i];
    const sway = Math.sin(now*0.0008 + d.phase)*d.amp;
    _p.set(d.x, (d.y||0) + WALL_H - d.len/2, d.z); _s.set(1, d.len, 1);
    _e.set(0, 0, sway, 'XYZ'); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); mesh.setMatrixAt(i, _m);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

/* ==========================================================================
   THE CAMPAIGN
   Six nights. You go deeper each time, and you take another one out each time.
   The game never says you are the villain. It just keeps letting you do it.
   ========================================================================== */
const CAMPAIGN = { shift: 1, eggs: 0, last: 6, over: false };

function campaignLoad(){
  try {
    const raw = localStorage.getItem('coop.campaign');
    if (raw){ const v = JSON.parse(raw);
      CAMPAIGN.shift = clamp(v.shift|0, 1, CAMPAIGN.last);
      CAMPAIGN.eggs  = clamp(v.eggs|0, 0, 99); }
  } catch(e){}
}
function campaignSave(){
  try { localStorage.setItem('coop.campaign',
    JSON.stringify({ shift:CAMPAIGN.shift, eggs:CAMPAIGN.eggs })); } catch(e){}
}
function campaignReset(){ CAMPAIGN.shift = 1; CAMPAIGN.eggs = 0; CAMPAIGN.over = false; campaignSave(); }

/* what the building is like this far in */
function floorPlan(shift){
  if (shift <= 2) return { name:'PROCESSING',  kinds:['plant','office','proc','cold','store'] };
  if (shift <= 4) return { name:'REARING',     kinds:['plant','incubator','proc','cold','store'] };
  return            { name:'THE HATCHERY', kinds:['incubator','hatchery','office','incubator','plant'] };
}

/* ---- rooms that only exist deeper in ---- */
function dressIncubator(room){
  const trayM = new THREE.MeshLambertMaterial({ color:0x4a4d44 });
  // filthy perspex, not milk: barely there until the beam catches it
  const glassM= new THREE.MeshPhongMaterial({ color:0x6d7a70, shininess:70, specular:0x556055,
                                              transparent:true, opacity:0.14, depthWrite:false });
  const eggM  = new THREE.MeshPhongMaterial({ color:0xe8dcc2, shininess:35, specular:0x4a4238 });
  let trays = 0, eggs = 0;
  const trayList = [], eggList = [];
  for (let x=room.x+1; x<room.x+room.w-1; x+=2){
    for (let y=room.y+1; y<room.y+room.h-1; y++){
      if (gAt(x,y) !== 0) continue;
      const w = cellToWorld(x,y);
      const fy = groundAt(w.x, w.z);
      for (let tier=0; tier<3; tier++){
        trayList.push({ x:w.x, y:fy+0.5+tier*1.25, z:w.z });
        for (let e=0;e<5;e++)
          eggList.push({ x:w.x + rnd(-0.55,0.55), y:fy+0.62+tier*1.25, z:w.z + rnd(-1.4,1.4) });
      }
      gSet(x,y,2);
    }
  }
  if (!trayList.length) return;
  const trayMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1.5,0.09,CFG.cell*0.92), trayM, trayList.length);
  trayMesh.castShadow = true; trayMesh.receiveShadow = true; trayMesh.frustumCulled = false;
  trayList.forEach((t,i)=> setInst(trayMesh, i, t.x, t.y, t.z, 1,1,1, 0));
  trayMesh.instanceMatrix.needsUpdate = true; world.add(trayMesh); DETAIL.push(trayMesh);

  const glass = new THREE.InstancedMesh(new THREE.BoxGeometry(1.5,1.1,CFG.cell*0.92), glassM, trayList.length);
  glass.frustumCulled = false;
  trayList.forEach((t,i)=> setInst(glass, i, t.x, t.y+0.6, t.z, 1,1,1, 0));
  glass.instanceMatrix.needsUpdate = true; world.add(glass); DETAIL.push(glass);

  const eggMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.11, 6, 5), eggM, eggList.length);
  eggMesh.frustumCulled = false;
  eggList.forEach((e,i)=>{ _p.set(e.x,e.y,e.z); _s.set(1,1.28,1);
    _e.set(rnd(-0.3,0.3), Math.random()*TAU, rnd(-0.2,0.2), 'YXZ'); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); eggMesh.setMatrixAt(i,_m); });
  eggMesh.instanceMatrix.needsUpdate = true; world.add(eggMesh); DETAIL.push(eggMesh);
}

function dressHatchery(room){
  // shells. thousands of them, and nothing that came out of them.
  const shellM = new THREE.MeshLambertMaterial({ color:0xd9cdb4 });
  const list = [];
  for (let y=room.y+1; y<room.y+room.h-1; y++)
    for (let x=room.x+1; x<room.x+room.w-1; x++){
      if (gAt(x,y) !== 0) continue;
      const w = cellToWorld(x,y);
      for (let i=0;i<14;i++){
        const sx = w.x+rnd(-1.9,1.9), sz = w.z+rnd(-1.9,1.9);
        list.push({ x:sx, z:sz, y:groundAt(sx,sz) });
      }
    }
  if (!list.length) return;
  const geo = new THREE.SphereGeometry(0.09, 5, 4, 0, TAU, 0, Math.PI*0.62);
  const shells = new THREE.InstancedMesh(geo, shellM, list.length);
  shells.receiveShadow = true; shells.frustumCulled = false;
  list.forEach((s,i)=>{ _p.set(s.x, s.y+0.03, s.z); _s.set(rnd(0.7,1.3),rnd(0.7,1.3),rnd(0.7,1.3));
    _e.set(rnd(-0.5,0.5)+Math.PI, Math.random()*TAU, rnd(-0.5,0.5), 'YXZ'); _q.setFromEuler(_e);
    _m.compose(_p,_q,_s); shells.setMatrixAt(i,_m); });
  shells.instanceMatrix.needsUpdate = true; world.add(shells); DETAIL.push(shells);
}

function dressDeepRooms(){
  for (const r of G.rooms){
    if (r.kind === 'incubator') dressIncubator(r);
    else if (r.kind === 'hatchery') dressHatchery(r);
  }
}

/* ==========================================================================
   THE ENDING
   You get out. You win. And then the box moves.
   ========================================================================== */
const ENDING = { active:false, step:0, t:0 };

const ENDING_BEATS = [
  { t:3.2, text:'The shutter comes down behind you.' },
  { t:3.4, text:'Nobody in the cab asks what is in the box.' },
  { t:3.6, text:'It is warm through the cardboard. It has been warm all night.' },
  { t:4.2, text:'Somewhere behind you, a building full of birds is completely silent.' },
  { t:3.0, text:'' },
  { t:4.6, text:'Something inside the box moves.' },
];

function startEnding(){
  if (ENDING.active) return;
  ENDING.active = true; ENDING.step = 0; ENDING.t = 0;
  MODE = 'ending';
  if (pointerLocked && document.exitPointerLock) document.exitPointerLock();
  ['hud','carry','stam','touch','prompt'].forEach(id => {
    const e = $(id); if (e) e.style.display = 'none';
  });
  setDread(0); setWarm(0);
  const o = $('ovl');
  o.style.display = 'flex';
  o.style.background = '#000';
  o.innerHTML = '<p id="endText" style="font-size:15px;line-height:2;color:#8f8875;' +
                'max-width:min(560px,88vw);opacity:0;transition:opacity 1.2s"></p>';
  sfxEndDrone();
}

function updateEnding(dt){
  if (!ENDING.active) return;
  ENDING.t -= dt;
  if (ENDING.t > 0) return;
  const el = $('endText');
  if (ENDING.step >= ENDING_BEATS.length){
    endingFinal();
    return;
  }
  const beat = ENDING_BEATS[ENDING.step++];
  ENDING.t = beat.t;
  if (el){
    el.style.opacity = '0';
    setTimeout(()=>{ el.textContent = beat.text; el.style.opacity = beat.text ? '1' : '0'; }, 500);
  }
  if (ENDING.step === ENDING_BEATS.length) sfxHeartbeatIn();
}

function endingFinal(){
  ENDING.active = false;
  const o = $('ovl');
  o.style.background = '#000';
  o.innerHTML =
    '<h2 style="letter-spacing:9px">THE COOP</h2>' +
    '<p style="margin-top:10px">You brought six of them out.</p>' +
    '<div id="tally"><div class="row"><span>SHIFTS SURVIVED</span><b>' + CAMPAIGN.last + '</b></div>' +
    '<div class="row"><span>TAKEN</span><b>' + CAMPAIGN.eggs + '</b></div>' +
    '<div class="row tot"><span>RETURNED</span><b>0</b></div></div>' +
    '<button class="btn" id="bNew">CLOCK IN AGAIN</button>';
  const nb = $('bNew');
  if (nb) nb.onclick = () => { campaignReset(); showTitle(); $('ovl').style.background = 'rgba(4,5,7,.93)'; };
  campaignReset();
}

function sfxEndDrone(){
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type='sine'; o.frequency.value = 41;
  const o2 = AC.createOscillator(); o2.type='sine'; o2.frequency.value = 61.5;
  const g = AC.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.07, t+3);
  o.connect(g); o2.connect(g); g.connect(master);
  o.start(t); o2.start(t);
  o.stop(t+26); o2.stop(t+26);
}

function sfxHeartbeatIn(){
  if (!AC) return;
  // something small, quick, and not yours
  for (let i=0;i<9;i++){
    setTimeout(()=>{
      if (!AC) return;
      tone(52, 0.1, 'sine', 0.09);
      setTimeout(()=>tone(41,0.14,'sine',0.07), 130);
    }, i*430);
  }
}

/* ==========================================================================
   BIRD DETAIL
   Per-instance colour and size do more for perceived detail than any number
   of extra meshes: six hundred identical white blobs read as a texture, six
   hundred slightly different birds read as a flock.
   ========================================================================== */
const BIRD_COLOURS = [
  0xe6e0d0, 0xe6e0d0, 0xdcd4c0,        // leghorn white, most of them
  0xc9a066, 0xb98a54,                   // buff
  0x8a5230, 0x6f4326,                   // rust
  0x9a958a, 0x7d7770,                   // grey
  0x2e2b28,                             // one in ten is nearly black
];

function tintFlock(){
  const c = new THREE.Color();
  for (let i=0;i<BIRD_N;i++){
    const base = BIRD_COLOURS[i % BIRD_COLOURS.length];
    c.setHex(base);
    // and no two are quite the same shade
    c.offsetHSL(rnd(-0.02,0.02), rnd(-0.06,0.06), rnd(-0.07,0.07));
    for (const k of ['body','head','tail','tail2','wingL','wingR']){
      if (FLOCK[k] && FLOCK[k].setColorAt) FLOCK[k].setColorAt(i, c);
    }
  }
  for (const k of ['body','head','tail','tail2','wingL','wingR'])
    if (FLOCK[k] && FLOCK[k].instanceColor) FLOCK[k].instanceColor.needsUpdate = true;
}

/* ==========================================================================
   ATMOSPHERE
   ========================================================================== */
const MOTES = { mesh:null, n: 0, data: [] };
const LAMPS = [];

/* Dust in the beam. Nothing sells a torch in a filthy building like the air
   being visibly full of something. */
function buildMotes(){
  const n = LOWFI ? 90 : 190;
  const geo = new THREE.SphereGeometry(0.012, 3, 2);
  const mat = new THREE.MeshLambertMaterial({ color:0xd8d0bc, transparent:true, opacity:0.7 });
  const m = new THREE.InstancedMesh(geo, mat, n);
  m.frustumCulled = false; m.castShadow = false; m.receiveShadow = false;
  scene.add(m);
  MOTES.mesh = m; MOTES.n = n; MOTES.data = [];
  for (let i=0;i<n;i++)
    MOTES.data.push({ x:P.x + rnd(-11,11), y:groundAt(P.x,P.z) + rnd(0.2,WALL_H-0.3), z:P.z + rnd(-11,11),
                      vy:rnd(-0.09,-0.02), dx:rnd(-0.05,0.05), dz:rnd(-0.05,0.05),
                      ph:Math.random()*TAU });
  DETAIL.push(m);
}

/* Put a mote somewhere new WITHOUT you seeing it happen: only ever behind you,
   and only ever far enough away to be past the beam. Same rule as the walls. */
function recycleMote(p){
  const dir = camDir();
  for (let tries=0; tries<8; tries++){
    const a = rnd(0, TAU), r = rnd(9, 15);
    const nx = P.x + Math.sin(a)*r, nz = P.z + Math.cos(a)*r;
    const dx = nx-P.x, dz = nz-P.z, d = Math.hypot(dx,dz) || 1;
    if ((dx*dir.x + dz*dir.z)/d > -0.15) continue;   // must be behind you
    p.x = nx; p.z = nz; p.y = groundAt(nx,nz) + rnd(0.3, WALL_H-0.3);
    return;
  }
  // couldn't find a spot behind you; just drop it back to the ceiling where it is
  p.y = groundAt(p.x, p.z) + WALL_H - 0.3;
}

function updateMotes(dt, now){
  if (!MOTES.mesh) return;
  const d = MOTES.data;
  /* You displace the air. Motes within arm's reach get shoved along your
     velocity and outward from your chest, so sprinting through a shaft of dust
     opens a hole in it and leaves a wake — the cheapest possible proof that the
     world is a place and not a backdrop. */
  const sp = Math.hypot(P.vx, P.vz);
  const wake = sp > 0.5;
  for (let i=0;i<MOTES.n;i++){
    const p = d[i];
    if (wake){
      const dx = p.x-P.x, dz = p.z-P.z, dy = p.y-P.y;
      const d2 = dx*dx + dz*dz + dy*dy*0.5;
      if (d2 < 2.25){                                  // 1.5m bubble
        const f = (1 - d2/2.25) * dt * 2.4;
        const inv = 1/Math.sqrt(d2 || 1e-4);
        p.x += (P.vx*0.55 + dx*inv*sp*0.5) * f;
        p.z += (P.vz*0.55 + dz*inv*sp*0.5) * f;
        p.y += (dy*inv*sp*0.22) * f;
      }
    }
    // ABSOLUTE world coordinates. The cloud hangs in the room and you walk
    // through it; it does not ride along with the camera.
    p.y += p.vy*dt;
    p.x += (p.dx + Math.sin(now*0.0004 + p.ph)*0.06)*dt;
    p.z += (p.dz + Math.cos(now*0.0005 + p.ph)*0.06)*dt;
    const far = Math.hypot(p.x-P.x, p.z-P.z) > 17;
    if (p.y < groundAt(p.x,p.z) + 0.04 || far) recycleMote(p);
    setInst(MOTES.mesh, i, p.x, p.y, p.z, 1,1,1, 0);
  }
  MOTES.mesh.instanceMatrix.needsUpdate = true;
}

/* Emergency lamps that have never gone out, far off down the halls. They give
   you something to walk toward that is not safety. */
function buildLamps(){
  LAMPS.length = 0;
  const rooms = G.rooms.filter(r => r.kind !== 'bay');
  const count = Math.min(3, rooms.length);   // each one is a light in every shader
  for (let i=0;i<count;i++){
    const r = rooms[(i*3) % rooms.length];
    const c = roomCenter(r);
    const l = new THREE.PointLight(0xff3418, 0, 13, 2);
    const lx = c.x + rnd(-2,2), lz = c.z + rnd(-2,2);
    l.position.set(lx, groundAt(lx,lz) + WALL_H - 0.5, lz);
    world.add(l);
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.16,0.12),
      new THREE.MeshBasicMaterial({ color:0x551009 }));
    box.position.copy(l.position);
    world.add(box); DETAIL.push(box);
    LAMPS.push({ light:l, box, base:rnd(1.6,3.2), ph:Math.random()*TAU,
                 dead: Math.random() < 0.3 });
  }
}

function updateLamps(dt, now){
  for (const L of LAMPS){
    if (L.dead){ L.light.intensity = 0; continue; }
    // failing ballast: mostly on, dipping and stuttering
    const f = 0.72 + Math.sin(now*0.003 + L.ph)*0.18 +
              (Math.sin(now*0.031 + L.ph*3) > 0.93 ? -0.6 : 0);
    L.light.intensity = Math.max(0, L.base * f);
    L.box.material.color.setRGB(0.33*f + 0.05, 0.06*f, 0.03*f);
  }
}

/* Stains. Old ones, in the drains and under the line. */
function buildStains(){
  const openCells = [];
  for (let y=2;y<G.h-2;y++) for (let x=2;x<G.w-2;x++) if (gAt(x,y)===0) openCells.push({x,y});
  if (!openCells.length) return;
  const tex = texStain();
  const mat = new THREE.MeshLambertMaterial({ map:tex, transparent:true, opacity:0.85,
                                              depthWrite:false });
  const n = 46;
  const m = new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1), mat, n);
  m.frustumCulled = false; m.receiveShadow = false;
  for (let i=0;i<n;i++){
    const c = pick(openCells), w = cellToWorld(c.x,c.y);
