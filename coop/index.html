<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>THE COOP — salvage horror</title>
<meta name="description" content="Free co-op horror. You are salvage crew. The facility is dark. Take what you can carry and get out.">
<meta name="theme-color" content="#07090c">
<link rel="canonical" href="https://www.freefowl.com/coop/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.freefowl.com/coop/">
<meta property="og:title" content="THE COOP">
<meta property="og:description" content="Salvage crew. Dark facility. Take what you can carry and get out.">
<meta property="og:site_name" content="Free Fowl">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#040507;color:#d8d2c4;
    font-family:'Courier New',ui-monospace,monospace;}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#040507;}
  .ui{position:fixed;z-index:10;pointer-events:none;}

  /* ---------- vignette + grain ---------- */
  #vig{inset:0;background:radial-gradient(ellipse 78% 78% at 50% 50%,
        transparent 32%, rgba(0,0,0,.42) 68%, rgba(0,0,0,.86) 100%);}
  #grain{inset:0;opacity:.055;mix-blend-mode:overlay;background-repeat:repeat;}
  #hurt{inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(120,8,8,.85) 100%);
    opacity:0;transition:opacity .18s;}

  /* ---------- HUD ---------- */
  #hud{top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0;
    display:none;font-size:12px;letter-spacing:1px;text-shadow:0 1px 4px #000;}
  #hudTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .lbl{color:#6b6656;font-size:9px;letter-spacing:2px;display:block;margin-bottom:2px;}
  .val{font-size:16px;color:#cfc7b2;}
  .val.good{color:#8fbf6a;} .val.warn{color:#d8a33a;} .val.bad{color:#c8503c;}
  #clockBox{text-align:right;}
  #quotaBar{height:4px;width:min(38vw,190px);background:rgba(255,255,255,.1);margin-top:5px;
    border-radius:2px;overflow:hidden;}
  #quotaBar>div{height:100%;background:#8fbf6a;width:0%;transition:width .3s;}

  /* ---------- carry strip ---------- */
  #carry{left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));
    display:none;justify-content:center;gap:8px;}
  .slot{width:62px;height:40px;border:1px solid rgba(216,210,196,.22);background:rgba(8,10,14,.62);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:7.5px;letter-spacing:1px;color:#7b7466;text-align:center;padding:2px;line-height:1.2;}
  .slot.full{border-color:rgba(216,163,58,.65);color:#dcc37e;}
  .slot.lamp{border-color:rgba(150,190,255,.5);color:#a9c6f0;}
  .slot b{font-size:8.5px;display:block;color:#e2d9bf;font-weight:normal;}

  /* ---------- stamina ---------- */
  #stam{left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));
    width:min(46vw,220px);height:3px;background:rgba(255,255,255,.09);display:none;}
  #stamF{height:100%;background:#8a8e9a;width:100%;transition:width .1s linear;}

  /* ---------- reticle + prompt ---------- */
  #prompt{left:50%;top:calc(50% + 26px);transform:translateX(-50%);display:none;
    font-size:12px;letter-spacing:2px;color:#e2d9bf;text-shadow:0 2px 6px #000;white-space:nowrap;
    background:rgba(6,8,11,.6);padding:5px 12px;border:1px solid rgba(216,210,196,.2);}
  /* Messages are UI, not scenery. They used to be thin translucent text laid
     straight onto the 3D scene, which meant the beam or a pale wall behind them
     wiped them out, and when the building rearranged underneath they read as
     something floating in the room. Solid panel, its own background, centred,
     and big enough to read at a glance without stopping walking. */
  #toast{left:0;right:0;top:27%;text-align:center;font-size:23px;letter-spacing:4px;
    color:#f4ecd6;opacity:0;transition:opacity .35s;}
  #toast span{display:inline-block;background:rgba(6,8,11,.92);padding:12px 26px;
    border:1px solid rgba(216,163,58,.55);box-shadow:0 6px 30px rgba(0,0,0,.85);}
  #sub{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    font-size:18px;letter-spacing:.4px;color:#f4efe4;opacity:0;
    transition:opacity .4s;line-height:1.6;max-width:min(680px,88vw);}
  #sub span{display:inline-block;background:rgba(5,7,10,.94);padding:16px 24px;
    border:1px solid rgba(214,208,194,.3);box-shadow:0 8px 36px rgba(0,0,0,.88);}
  /* While something is actually after you the panel gets out of the way: down
     to the lower third and quiet, because a box in the middle of the screen
     during a chase is worse than no message at all. */
  #sub.danger{top:auto;bottom:calc(120px + env(safe-area-inset-bottom));
    transform:translateX(-50%);font-size:14px;color:#cdc4ae;}
  #sub.danger span{background:rgba(5,7,10,.78);border-color:rgba(214,208,194,.16);
    padding:9px 16px;}

  /* ---------- touch controls ---------- */
  #touch{inset:0;display:none;}
  #stick{position:absolute;left:calc(18px + env(safe-area-inset-left));
    bottom:calc(24px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;
    border:1px solid rgba(216,210,196,.16);background:rgba(10,12,16,.3);pointer-events:auto;}
  #knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;
    border-radius:50%;background:rgba(216,210,196,.22);border:1px solid rgba(216,210,196,.3);}
  #btns{position:absolute;right:calc(16px + env(safe-area-inset-right));
    bottom:calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;
    align-items:flex-end;}
  .tb{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:1px solid rgba(216,210,196,.28);
    background:rgba(10,12,16,.45);color:#cfc7b2;font-family:inherit;font-size:10px;letter-spacing:1.5px;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;}
  .tb:active{background:rgba(216,210,196,.2);}
  .tb.sm{width:60px;height:60px;font-size:9px;}
  .tb.hot{border-color:rgba(216,163,58,.8);color:#dcc37e;}

  /* ---------- overlays ---------- */
  #ovl{position:fixed;inset:0;background:rgba(4,5,7,.93);display:flex;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;padding:26px 20px;z-index:30;pointer-events:auto;
    overflow-y:auto;}
  #ovl h1{font-size:clamp(30px,9vw,58px);letter-spacing:10px;color:#c8bfa6;font-weight:normal;
    text-shadow:0 0 26px rgba(200,80,60,.28);margin-bottom:2px;}
  #ovl .sub1{color:#7d7565;font-size:11px;letter-spacing:5px;margin-bottom:22px;}
  #ovl h2{font-size:clamp(19px,5.4vw,30px);letter-spacing:6px;font-weight:normal;color:#c8bfa6;
    margin-bottom:10px;}
  #ovl p{color:#8f8875;font-size:13px;line-height:1.75;max-width:430px;margin-bottom:18px;}
  #ovl p em{color:#c0b79e;font-style:normal;}
  .btn{pointer-events:auto;background:rgba(216,163,58,.1);border:1px solid rgba(216,163,58,.7);
    color:#e2d9bf;font-family:inherit;font-size:14px;letter-spacing:4px;padding:13px 40px;
    cursor:pointer;margin-top:6px;}
  .btn:active,.btn:hover{background:rgba(216,163,58,.24);}
  .btn.ghost{border-color:rgba(216,210,196,.3);color:#9c937e;font-size:11px;padding:9px 24px;
    letter-spacing:2px;}
  #keys{color:#6b6656;font-size:10.5px;line-height:2;letter-spacing:1px;margin-top:22px;}
  #keys b{color:#a39a84;font-weight:normal;}
  #tally{font-size:12px;color:#9c937e;line-height:2;margin-bottom:16px;letter-spacing:1px;}
  #tally .row{display:flex;justify-content:space-between;gap:26px;min-width:236px;}
  #tally .row b{color:#dcc37e;font-weight:normal;}
  #tally .tot{border-top:1px solid rgba(216,210,196,.2);margin-top:7px;padding-top:7px;}
  #load{color:#5d5749;font-size:11px;letter-spacing:4px;}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="ui" id="vig"></div>
<div class="ui" id="grain"></div>
<div class="ui" id="hurt"></div>

<div class="ui" id="hud">
  <div id="hudTop">
    <div>
      <span class="lbl">FLASHLIGHT</span><span class="val" id="hCarry">0</span>
      <div id="quotaBar"><div id="quotaF"></div></div>
      <span class="lbl" style="margin-top:5px">OBJECTIVE</span>
      <span class="val" id="hBank" style="font-size:13px">0 / 0</span>
    </div>
    <div id="clockBox">
      <span class="lbl">VAN LEAVES</span><span class="val" id="hClock">00:00</span>
      <span class="lbl" style="margin-top:5px">SPARE CELLS</span>
      <span class="val" id="hWeight" style="font-size:13px">0 kg</span>
    </div>
  </div>
</div>

<div class="ui" id="stam"><div id="stamF"></div></div>
<div class="ui" id="prompt"></div>
<div class="ui" id="toast"></div>
<div class="ui" id="sub"></div>
<div class="ui" id="carry">
  <div class="slot" id="slot0">EMPTY</div>
  <div class="slot" id="slot1">EMPTY</div>
</div>

<div class="ui" id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button class="tb sm" id="bLight">LIGHT</button>
    <button class="tb sm" id="bDrop">DROP</button>
    <button class="tb" id="bUse">TAKE</button>
  </div>
</div>

<div id="ovl">
  <div id="load">LOADING</div>
</div>

<script src="three.min.js?v=160"></script>
<script>
'use strict';
/* ==========================================================================
   THE COOP — co-op salvage horror (v0.1 solo slice)
   freefowl.com/coop/
   You are salvage crew. Grab what you can carry. The light is a hand.
   ========================================================================== */

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;
const rnd   = (a,b) => a+Math.random()*(b-a);
const rndi  = (a,b) => Math.floor(rnd(a,b+1));
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];
const TAU = Math.PI*2;

const IS_TOUCH = matchMedia('(hover:none)').matches || 'ontouchstart' in window;
const IS_SMALL = Math.min(innerWidth,innerHeight) < 620;
const LOWFI    = IS_TOUCH || IS_SMALL;

/* ==========================================================================
   CRASH REPORTING
   A black screen tells nobody anything. Any uncaught error from here on
   paints itself on the page so a phone can report its own bug.
   ========================================================================== */
let FATAL = false;
function fatal(where, err){
  if (FATAL) return; FATAL = true;
  try {
    const msg  = String((err && err.message) || err || 'unknown');
    const line = String((err && err.stack) || '').split('\n').slice(1,3).join(' | ');
    const o = document.getElementById('ovl');
    o.style.display = 'flex';
    o.innerHTML =
      '<h2>IT BROKE</h2>' +
      '<p>The game stopped. Screenshot this and send it over \u2014 it says exactly what went wrong.</p>' +
      '<div style="text-align:left;font-size:11px;line-height:1.7;color:#9c937e;max-width:min(560px,92vw);' +
      'word-break:break-word;border:1px solid rgba(216,210,196,.2);padding:12px;margin-bottom:16px">' +
      '<b style="color:#d8a33a">' + where + '</b><br>' + msg +
      (line ? '<br><span style="color:#6b6656">' + line + '</span>' : '') +
      '<br><span style="color:#6b6656">' + navigator.userAgent + '</span></div>' +
      '<button class="btn" id="bReload">RELOAD</button>';
    const rb = document.getElementById('bReload');
    if (rb) rb.onclick = () => location.reload();
  } catch(e){ /* nothing left to do */ }
}
addEventListener('error', e => fatal('error', e.error || e.message));
addEventListener('unhandledrejection', e => fatal('promise', e.reason));

/* WebGL is not optional here — say so plainly instead of showing black */
(function(){
  let gl = null;
  try { const t = document.createElement('canvas');
        gl = t.getContext('webgl2') || t.getContext('webgl') || t.getContext('experimental-webgl'); }
  catch(e){}
  if (!gl){
    const o = document.getElementById('ovl');
    o.style.display = 'flex';
    o.innerHTML = '<h2>NO WEBGL</h2><p>This browser will not give the page a 3D canvas, so The Coop ' +
      'cannot run. On iPhone check Settings \u2192 Apps \u2192 Safari \u2192 Advanced \u2192 Experimental Features ' +
      '\u2192 WebGL, or try another browser.</p><div style="font-size:11px;color:#6b6656;max-width:92vw;' +
      'word-break:break-word">' + navigator.userAgent + '</div>';
    throw new Error('WebGL unavailable');
  }
})();

/* ---------------- tuning ---------------- */
const CFG = {
  cell: 4.2,              // world units per grid cell
  /* The grid is bigger than the building. The plan itself is still the same
     thirty-four squares it always was — that shape is tuned, and stretching it
     would just put more corridor between the same rooms — but it now sits
     inside a margin of solid ground on three sides. That margin is where the
     stairs go: a wing can only have exactly one way into it if it is dug out
     of somewhere that had nothing in it, and the flat plan had no rock left
     anywhere to dig into. The south edge has no margin, because that is where
     the dock punches through and the night has to be visible from inside. */
  gw: 50, gh: 42,         // grid size, margin included
  eyeH: 1.62,
  walkSpd: 3.05,
  sprintSpd: 5.15,
  crouchSpd: 1.5,
  accel: 13,
  playerR: 0.42,
  stamMax: 7.0,
  stamRegen: 0.55,
  // No limit while you are testing. Flip TIMED to true for release and the
  // ten minute clock comes back with its HUD readout.
  timed: false,
  debugKeys: true,        // 1-6 jumps to that night. FLIP FALSE FOR RELEASE.
  shiftLen: 600,          // seconds per shift, when timed
  // A shift must take SEVERAL trips. Every trip is exposure, and exposure is
  // where the whole game actually lives.
  quotaBase: 900, quotaStep: 420,
  reachDist: 2.4,
  weightMax: 42,          // kg at which you are at max slowdown
  // 0.45 puts the thing's hunt speed INSIDE your load curve: empty you outrun it,
  // one item is a knife-edge, two and you must drop something. That choice is the game.
  weightSlow: 0.45,
};

/* ---------------- renderer ---------------- */
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({
  canvas: cv, antialias: false, powerPreference: 'high-performance', stencil: false
});
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = LOWFI ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;

const RENDER_SCALE = LOWFI ? 0.68 : 0.86;
let W = 0, H = 0;
function resize(){
  W = innerWidth; H = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, LOWFI ? 2 : 2);
  renderer.setPixelRatio(dpr * RENDER_SCALE);
  renderer.setSize(W, H, false);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  if (camera){ camera.aspect = W/H; camera.updateProjectionMatrix(); }
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030406);
scene.fog = new THREE.FogExp2(0x030508, LOWFI ? 0.058 : 0.050);

const camera = new THREE.PerspectiveCamera(74, 1, 0.08, 90);
addEventListener('resize', resize);
resize();

/* ==========================================================================
   PROCEDURAL TEXTURES  (no asset files — everything drawn at boot)
   ========================================================================== */
function makeCanvas(s){ const c = document.createElement('canvas'); c.width=c.height=s; return c; }
function toTex(c, rx, ry, srgb){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx||1, ry||1);
  t.anisotropy = LOWFI ? 2 : 4;
  if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function noiseInto(g, s, amt, dark){
  const im = g.getImageData(0,0,s,s), d = im.data;
  for (let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*amt;
    d[i]   = clamp(d[i]  +n,0,255);
    d[i+1] = clamp(d[i+1]+n,0,255);
    d[i+2] = clamp(d[i+2]+n*(dark?1.15:1),0,255);
  }
  g.putImageData(im,0,0);
}
function grime(g, s, n, col, aMax, rMax){
  for (let i=0;i<n;i++){
    const x=Math.random()*s, y=Math.random()*s, r=rnd(s*0.02, s*rMax);
    const grd=g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0, `rgba(${col},${rnd(aMax*0.4,aMax)})`);
    grd.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
}

/* --- concrete floor: worn, stained, scored by decades of trolleys --- */
function texFloor(){
  const s=512, c=makeCanvas(s), g=c.getContext('2d');
  g.fillStyle='#403f3a'; g.fillRect(0,0,s,s);
  noiseInto(g,s,40,true);
  // wear patches where everything walked
  for (let i=0;i<9;i++){
    const x=Math.random()*s, y=Math.random()*s, r=rnd(s*0.08,s*0.26);
    const grd=g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,'rgba(96,92,80,.22)'); grd.addColorStop(1,'rgba(96,92,80,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  // trolley scores
  g.strokeStyle='rgba(28,26,22,.32)';
  for (let i=0;i<18;i++){
    g.lineWidth=rnd(0.6,2.2);
    const y=Math.random()*s;
    g.beginPath(); g.moveTo(0,y); g.lineTo(s,y+rnd(-8,8)); g.stroke();
  }
  grime(g,s,34,'24,22,18',0.5,0.14);
  grime(g,s,12,'44,26,16',0.28,0.09);
  // drain channel lines
  g.strokeStyle='rgba(16,15,13,.55)'; g.lineWidth=3;
  g.beginPath(); g.moveTo(0,s*0.5); g.lineTo(s,s*0.5); g.stroke();
  g.beginPath(); g.moveTo(s*0.5,0); g.lineTo(s*0.5,s); g.stroke();
  // cracks
  g.strokeStyle='rgba(14,13,11,.4)'; g.lineWidth=1;
  for (let i=0;i<7;i++){
    g.beginPath(); let x=Math.random()*s, y=Math.random()*s; g.moveTo(x,y);
    for (let k=0;k<6;k++){ x+=rnd(-26,26); y+=rnd(-26,26); g.lineTo(x,y); }
    g.stroke();
  }
  return toTex(c, CFG.gw*0.75, CFG.gh*0.75);
}
/* --- stained tile wall: grout depth, mould, weeping rust, missing tiles --- */
function texWall(){
  const s=512, c=makeCanvas(s), g=c.getContext('2d');
  g.fillStyle='#3a3833'; g.fillRect(0,0,s,s);            // grout showing through
  const t=48;
  for (let y=0;y<s;y+=t) for (let x=0;x<s;x+=t){
    if (Math.random() < 0.06) continue;                   // a tile has come off
    const v = rndi(78,96);
    g.fillStyle = `rgb(${v},${v-3},${v-10})`;
    g.fillRect(x+2,y+2,t-4,t-4);
    // a highlight along the top edge gives the tile a lip
    g.fillStyle = 'rgba(255,255,255,.05)';
    g.fillRect(x+2,y+2,t-4,2);
    g.fillStyle = 'rgba(0,0,0,.18)';
    g.fillRect(x+2,y+t-4,t-4,2);
  }
  noiseInto(g,s,14,true);
  // rust weeping from fixings
  for (let i=0;i<26;i++){
    const x=Math.random()*s, w=rnd(2,11), h=rnd(s*0.12,s*0.8), y0=rnd(0,s*0.35);
    const grd=g.createLinearGradient(0,y0,0,y0+h);
    grd.addColorStop(0,'rgba(78,44,20,.55)'); grd.addColorStop(1,'rgba(78,44,20,0)');
    g.fillStyle=grd; g.fillRect(x,y0,w,h);
  }
  // black mould creeping up from the floor
  const md = g.createLinearGradient(0,s,0,s*0.55);
  md.addColorStop(0,'rgba(14,16,12,.72)'); md.addColorStop(1,'rgba(14,16,12,0)');
  g.fillStyle=md; g.fillRect(0,s*0.55,s,s*0.45);
  grime(g,s,26,'20,22,16',0.4,0.16);
  grime(g,s,14,'26,20,16',0.5,0.1);
  return toTex(c,1,1);
}
/* --- cage front: wire with real depth, rust, and the odd bent bar --- */
function texCage(){
  const s=256, c=makeCanvas(s), g=c.getContext('2d');
  g.fillStyle='#0e0f11'; g.fillRect(0,0,s,s);
  grime(g,s,14,'54,34,16',0.45,0.3);
  // shadow pass under each bar, then the bar itself: cheap fake relief
  const drawBars = (off, col, w) => {
    g.strokeStyle=col; g.lineWidth=w;
    for (let x=10;x<s;x+=26){
      g.beginPath();
      const bend = Math.random()<0.12 ? rnd(-5,5) : 0;
      g.moveTo(x+off, 0); g.lineTo(x+off+bend, s/2); g.lineTo(x+off, s);
      g.stroke();
    }
    g.lineWidth=w*1.3;
    for (let y=16;y<s;y+=44){ g.beginPath(); g.moveTo(0,y+off); g.lineTo(s,y+off); g.stroke(); }
  };
  drawBars(2, 'rgba(0,0,0,.75)', 5);
  drawBars(0, '#8a7d69', 3.4);
  drawBars(-1.1, 'rgba(214,204,182,.4)', 1.2);
  g.globalCompositeOperation='source-atop';
  grime(g,s,26,'104,54,18',0.6,0.2);
  g.globalCompositeOperation='source-over';
  noiseInto(g,s,20,true);
  return toTex(c,1,1);
}
/* --- corrugated metal (doors, van, machinery) --- */
function texMetal(){
  const s=128, c=makeCanvas(s), g=c.getContext('2d');
  g.fillStyle='#4a4d52'; g.fillRect(0,0,s,s);
  for (let x=0;x<s;x+=8){
    g.fillStyle = (x/8)%2 ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.18)';
    g.fillRect(x,0,8,s);
  }
  grime(g,s,14,'70,40,18',0.5,0.24);
  noiseInto(g,s,22,true);
  return toTex(c,1,1);
}
/* --- ceiling: grid panels, half missing --- */
function texCeil(){
  const s=128, c=makeCanvas(s), g=c.getContext('2d');
  g.fillStyle='#2a2b2c'; g.fillRect(0,0,s,s);
  g.strokeStyle='#3d3e40'; g.lineWidth=2;
  for (let i=0;i<=s;i+=32){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,s); g.stroke();
                            g.beginPath(); g.moveTo(0,i); g.lineTo(s,i); g.stroke(); }
  for (let y=0;y<s;y+=32) for (let x=0;x<s;x+=32){
    if (Math.random()<0.22){ g.fillStyle='#0a0b0d'; g.fillRect(x+2,y+2,28,28); }
  }
  noiseInto(g,s,16,true);
  return toTex(c, CFG.gw*0.5, CFG.gh*0.5);
}

const TEX = {};
function buildTextures(){
  TEX.floor = texFloor(); TEX.wall = texWall(); TEX.cage = texCage();
  TEX.metal = texMetal(); TEX.ceil  = texCeil();
}

/* ==========================================================================
   FACILITY GENERATION
   grid[y][x] : 1 = solid, 0 = open.  rooms carved, then corridors.
   ========================================================================== */
const G = { w: CFG.gw, h: CFG.gh, cells: null, rooms: [] };
/* Where the building proper lives inside that grid. Everything the generator
   lays out is written relative to this, so the plan is unchanged and the
   margin is simply somewhere else. */
const CORE = { x: 8, y: 8, w: 34, h: 34 };
/* the loading dock opening: where the van came in, and the only night you see */
const EXIT = { x0:0, x1:0, y0:0, y1:0, wx:0, wz:0, halfW:0 };

function gAt(x,y){ if (x<0||y<0||x>=G.w||y>=G.h) return 1; return G.cells[y*G.w+x]; }
function gSet(x,y,v){ if (x<0||y<0||x>=G.w||y>=G.h) return; G.cells[y*G.w+x]=v; }
function cellToWorld(x,y){ return { x:(x-G.w/2+0.5)*CFG.cell, z:(y-G.h/2+0.5)*CFG.cell }; }
function worldToCell(wx,wz){ return { x:Math.floor(wx/CFG.cell+G.w/2), y:Math.floor(wz/CFG.cell+G.h/2) }; }

/* ==========================================================================
   ELEVATION
   The grid is one storey and it is staying that way. Pathfinding, the shifter,
   spawning, line of sight and every spawn filter in this build reason about
   cells, and giving them a second floor to think about would mean touching all
   of them and getting one of them subtly wrong.

   So the GRID stays flat and the WORLD does not. Every cell carries a floor
   height. A wing of the building sits four metres down at the bottom of a
   stair run, or a couple of metres up at the top of one, and topologically
   nothing whatsoever has changed: it is still one connected plan, the same
   corridor graph, the same reachability guarantee. A monster that paths to
   your cell walks down the stairs to get there without knowing stairs exist.

   Two footprints never overlap, which is the other half of why this works —
   the basement is a sunken WING, not a floor underneath the one you are on. So
   a 2D line-of-sight test is still telling the truth, and nothing has to learn
   about ceilings.
   ========================================================================== */
const LVL = {
  drop: -4.4,           // down a flight
  rise:  3.0,           // and some nights, up one
  zones: [],            // { rect, dy }
  stairs: [],           // { cells:[{x,y}], dirx, diry, dy }
};

/* Heights live per cell; corners are what the surface is actually built from,
   so a corner shared by four cells has exactly ONE height and the floor is
   continuous by construction. There is no seam to close where a stair meets a
   landing because there was never a seam. */
function gY(x,y){
  if (!G.floorY) return 0;
  const cx = clamp(x, 0, G.w-1), cy = clamp(y, 0, G.h-1);
  return G.floorY[cy*G.w + cx];
}
function gYset(x,y,v){
  if (x<0||y<0||x>=G.w||y>=G.h) return;
  G.floorY[y*G.w+x] = v;
}
function cornerY(i,j){
  return (gY(i-1,j-1) + gY(i,j-1) + gY(i-1,j) + gY(i,j)) * 0.25;
}
/* The walking surface, sampled anywhere. Bilinear across the corner grid, so
   it agrees with the floor mesh vertex for vertex — the player is never a few
   centimetres inside the geometry or floating above it. */
function groundAt(wx, wz){
  if (!G.floorY) return 0;
  const fx = wx/CFG.cell + G.w/2, fz = wz/CFG.cell + G.h/2;
  const i = Math.floor(fx), j = Math.floor(fz);
  const u = fx - i, v = fz - j;
  const a = cornerY(i,j),   b = cornerY(i+1,j);
  const c = cornerY(i,j+1), d = cornerY(i+1,j+1);
  return (a*(1-u) + b*u)*(1-v) + (c*(1-u) + d*u)*v;
}
function isFlatCell(x,y){ return Math.abs(gY(x,y)) < 0.01; }
function lockedCell(x,y){
  if (!G.locked || x<0||y<0||x>=G.w||y>=G.h) return false;
  return G.locked[y*G.w+x] === 1;
}
function lockCell(x,y){
  if (!G.locked || x<0||y<0||x>=G.w||y>=G.h) return;
  G.locked[y*G.w+x] = 1;
}

/* One or two extra wings each night, from night two on, and they are DUG
   rather than converted. The first version tried to sink an existing room and
   put a flight at each of its doors, which does not survive contact with the
   generator: a room here is a carved rectangle with corridors driven through
   it, so it routinely has seven or sixteen separate cells of doorway, several
   of them four wide. Every one of those would have needed its own staircase,
   and sealing the spares would have cut the corridor graph in half.

   Tunnelling instead gives the topology for free. The wing goes where there is
   nothing but solid rock, so it has exactly one way in by construction, and
   that one way in is the stairwell. It also makes the building bigger every
   night, which the flat version could only fake by pushing the walls out. */
function chooseElevation(shift){
  G.floorY = new Float32Array(G.w*G.h);
  G.locked = new Uint8Array(G.w*G.h);
  LVL.zones.length = 0; LVL.stairs.length = 0;

  /* The whole margin is locked from the start. It is ground the building was
     never dug out of, and the shifting walls must not be allowed to start
     hollowing it out at random in the middle of the night — a cave with no way
     into it is invisible, but it is still the building doing something it was
     never asked to do. digWing unlocks nothing; it writes into the margin
     itself and locks what it wrote. */
  for (let y=0;y<G.h;y++) for (let x=0;x<G.w;x++)
    if (x < CORE.x || x >= CORE.x+CORE.w || y < CORE.y) lockCell(x,y);

  if (shift < 2) return;

  /* Down first, always. "There is a basement" is the thing worth having; a
     wing up a short flight is a good second helping and a poor only course. */
  digWing(LVL.drop);
  if (shift >= 4) digWing(Math.random() < 0.5 ? LVL.drop : LVL.rise);
}

function inRect(r, x, y){ return x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h; }

/* Solid, untouched, and not up against anything that matters. */
function diggable(x, y){
  if (x < 2 || y < 2 || x >= G.w-2 || y >= G.h-2) return false;
  if (gAt(x,y) !== 1) return false;
  if (inBayCell(x,y)) return false;
  if (dugCell(x,y)) return false;          // another wing already claimed it
  if (y >= EXIT.y0 - 1) return false;
  return true;
}
/* The margin is locked before anything is dug, so "locked" cannot be the test
   for "already taken" — every candidate would fail it. Wings record their own
   footprint instead. */
function dugCell(x,y){
  for (const z of LVL.zones){
    if (x >= z.rect.x-1 && x < z.rect.x+z.rect.w+1 &&
        y >= z.rect.y-1 && y < z.rect.y+z.rect.h+1) return true;
    if (z.tunnel && z.tunnel.some(c => Math.abs(c.x-x) <= 1 && Math.abs(c.y-y) <= 1)) return true;
  }
  return false;
}

function digWing(dy){
  const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
  for (let tries=0; tries<900; tries++){
    const w = rndi(4,7), h = rndi(4,6);
    const rx = rndi(2, G.w-w-3), ry = rndi(2, G.h-h-3);

    // the room AND a one-cell skin of rock around it
    let clear = true;
    for (let y=ry-1; y<=ry+h && clear; y++)
      for (let x=rx-1; x<=rx+w && clear; x++)
        if (!diggable(x,y)) clear = false;
    if (!clear) continue;

    /* Now drive a tunnel out of one face until it breaks into the building.
       Everything it passes through has to be rock, and both flanks of every
       cell of it have to be rock too — otherwise the flight has an open side
       and you can walk off the edge of it. */
    const faces = DIRS.slice();
    for (let i=faces.length-1;i>0;i--){ const j=rndi(0,i); const t=faces[i]; faces[i]=faces[j]; faces[j]=t; }
    for (const [dx,dy2] of faces){
      // where on that face the tunnel leaves from
      const off = (dx !== 0) ? rndi(ry+1, ry+h-2) : rndi(rx+1, rx+w-2);
      let sx, sy;
      if (dx > 0){ sx = rx+w;   sy = off; }
      else if (dx < 0){ sx = rx-1; sy = off; }
      else if (dy2 > 0){ sx = off; sy = ry+h; }
      else { sx = off; sy = ry-1; }

      const tunnel = [];
      let hit = false;
      for (let k=0; k<10; k++){
        const cx = sx + dx*k, cy = sy + dy2*k;
        // have we arrived?
        const nx = cx + dx, ny = cy + dy2;
        if (!diggable(cx,cy)) break;
        // flanks
        const px = dy2, py = dx;
        if (gAt(cx+px, cy+py) !== 1 || gAt(cx-px, cy-py) !== 1) break;
        tunnel.push({ x:cx, y:cy });
        if (gAt(nx,ny) === 0 && !inBayCell(nx,ny)){ hit = true; break; }
      }
      if (!hit || tunnel.length < 2) continue;

      // ---- commit ----
      const rect = { x:rx, y:ry, w, h, kind:'cellar' };
      carveRect(rect);
      for (let y=ry;y<ry+h;y++) for (let x=rx;x<rx+w;x++) gYset(x,y,dy);
      for (let y=ry-1;y<=ry+h;y++) for (let x=rx-1;x<=rx+w;x++) lockCell(x,y);

      const L = tunnel.length;
      tunnel.forEach((c,i) => {
        gSet(c.x, c.y, 0);
        gYset(c.x, c.y, i === L-1 ? 0 : (i === L-2 ? dy*0.5 : dy));
        lockCell(c.x, c.y);
        lockCell(c.x + dy2, c.y + dx);        // both flanks stay walls all night
        lockCell(c.x - dy2, c.y - dx);
      });
      lockCell(tunnel[L-1].x + dx, tunnel[L-1].y + dy2);

      /* The flight is drawn between the last cell at ground level and the first
         cell at full depth, because that is exactly the span the surface is
         sloping across — corner heights do the easing at both ends for free. */
      const top = tunnel[L-1];
      const bot = (L >= 3) ? tunnel[L-3]
                           : { x: tunnel[0].x - dx, y: tunnel[0].y - dy2 };
      LVL.stairs.push({ dy, x0:top.x, y0:top.y, x1:bot.x, y1:bot.y });
      LVL.zones.push({ rect, dy, tunnel });
      G.rooms.push(rect);
      relaxSolidY();
      return true;
    }
  }
  return false;
}

/* Solid cells get a height too, because corners average the cells around them
   and a wall left at zero next to a sunken room would tug the floor up at the
   edge. Twice, so a wall two cells thick still resolves. */
function relaxSolidY(){
  for (let pass=0; pass<2; pass++){
    const next = new Float32Array(G.floorY);
    for (let y=0;y<G.h;y++) for (let x=0;x<G.w;x++){
      if (gAt(x,y) === 0) continue;
      let sum = 0, n = 0;
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        if (x+dx<0||y+dy<0||x+dx>=G.w||y+dy>=G.h) continue;
        if (pass === 0 && gAt(x+dx,y+dy) !== 0) continue;
        sum += gY(x+dx, y+dy); n++;
      }
      if (n) next[y*G.w+x] = sum/n;
    }
    G.floorY = next;
  }
}

function carveRect(r){ for (let y=r.y;y<r.y+r.h;y++) for (let x=r.x;x<r.x+r.w;x++) gSet(x,y,0); }
function rectsOverlap(a,b,pad){
  pad=pad||1;
  return !(a.x-pad > b.x+b.w || a.x+a.w+pad < b.x || a.y-pad > b.y+b.h || a.y+a.h+pad < b.y);
}
/* Carve an L between two cells directly, ignoring rooms. Used to repair
   walkable connectivity after the room-to-room corridors are in. */
function carveLink(ax, ay, bx, by){
  const stepX=(y)=>{ for (let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++){ gSet(x,y,0); gSet(x,y+1,0); } };
  const stepY=(x)=>{ for (let y=Math.min(ay,by);y<=Math.max(ay,by);y++){ gSet(x,y,0); gSet(x+1,y,0); } };
  if (Math.random()<0.5){ stepX(ay); stepY(bx); } else { stepY(ax); stepX(by); }
}

function linkWalkableRegions(){
  for (let pass=0; pass<4; pass++){
    // seed: the first walkable cell outside the bay, working out from the van
    let seed = null;
    for (let y=1;y<G.h-1 && !seed;y++) for (let x=1;x<G.w-1;x++)
      if (gAt(x,y)===0 && !inBayCell(x,y)){ seed = {x,y}; break; }
    if (!seed) return;
    const N = G.w*G.h, seen = new Uint8Array(N), q = [seed];
    seen[seed.y*G.w+seed.x] = 1;
    while (q.length){
      const c = q.pop();
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=c.x+dx, ny=c.y+dy;
        if (nx<1||ny<1||nx>=G.w-1||ny>=G.h-1) continue;
        const k = ny*G.w+nx;
        if (seen[k] || gAt(nx,ny)!==0 || inBayCell(nx,ny)) continue;
        seen[k]=1; q.push({x:nx,y:ny});
      }
    }
    // anything open, out of the bay, and unreached is a marooned pocket
    let orphan = null, bestD = 1e9;
    for (let y=1;y<G.h-1;y++) for (let x=1;x<G.w-1;x++){
      if (gAt(x,y)!==0 || inBayCell(x,y) || seen[y*G.w+x]) continue;
      const d = Math.hypot(x-seed.x, y-seed.y);
      if (d < bestD){ bestD = d; orphan = {x,y}; }
    }
    if (!orphan) return;
    carveLink(orphan.x, orphan.y, seed.x, seed.y);
  }
}

function carveCorridor(a,b){
  const ax=Math.floor(a.x+a.w/2), ay=Math.floor(a.y+a.h/2);
  const bx=Math.floor(b.x+b.w/2), by=Math.floor(b.y+b.h/2);
  const horizFirst = Math.random()<0.5;
  const stepX=(y)=>{ for (let x=Math.min(ax,bx);x<=Math.max(ax,bx);x++){ gSet(x,y,0); gSet(x,y+1,0); } };
  const stepY=(x)=>{ for (let y=Math.min(ay,by);y<=Math.max(ay,by);y++){ gSet(x,y,0); gSet(x+1,y,0); } };
  if (horizFirst){ stepX(ay); stepY(bx); } else { stepY(ax); stepX(by); }
}

/* The floorplan is deliberate, not random — a real building has a shape, and
   random rectangle-scatter kept failing to place half the rooms. Slots are
   fixed and jittered; WHICH room lands in which slot is shuffled each shift. */
function genFacility(){
  G.cells = new Uint8Array(G.w*G.h).fill(1);
  G.rooms = [];

  // 1. loading bay — bottom centre. The van, and the only way out.
  const bay = { x: CORE.x+13, y: CORE.y+26, w: 9, h: 6, kind:'bay' };
  carveRect(bay); G.rooms.push(bay);

  // 2. two long cage halls flanking the building — the heart of the place
  [ { x:CORE.x+2,  y:CORE.y+4, w:11, h:15, kind:'hall' },
    { x:CORE.x+21, y:CORE.y+3, w:11, h:16, kind:'hall' } ].forEach(r => { carveRect(r); G.rooms.push(r); });

  // 3. five support rooms in five fixed pockets, shuffled between them
  const slots = [
    { x:CORE.x+14, y:CORE.y+2,  w:6, h:6 },   // top centre
    { x:CORE.x+14, y:CORE.y+12, w:6, h:7 },   // dead centre, between the halls
    { x:CORE.x+2,  y:CORE.y+23, w:8, h:6 },   // bottom left
    { x:CORE.x+23, y:CORE.y+22, w:8, h:6 },   // bottom right
    { x:CORE.x+14, y:CORE.y+20, w:5, h:4 },   // just north of the bay
  ];
  const kinds = floorPlan(CAMPAIGN.shift).kinds.slice();
  for (let i=kinds.length-1;i>0;i--){ const j=rndi(0,i); const t=kinds[i]; kinds[i]=kinds[j]; kinds[j]=t; }
  slots.forEach((s,i) => {
    const r = { x: clamp(s.x+rndi(-1,1), CORE.x+2, CORE.x+CORE.w-s.w-3),
                y: clamp(s.y+rndi(-1,1), CORE.y+2, CORE.y+CORE.h-s.h-3),
                w: s.w, h: s.h, kind: kinds[i] };
    carveRect(r); G.rooms.push(r);
  });

  // 4. connect: a spine through the support rooms, then loops so it isn't a tree
  for (let i=1;i<G.rooms.length;i++) carveCorridor(G.rooms[i-1], G.rooms[i]);
  carveCorridor(G.rooms[0], G.rooms[G.rooms.length-1]);   // bay -> last
  carveCorridor(G.rooms[1], G.rooms[2]);                  // hall -> hall
  carveCorridor(G.rooms[0], G.rooms[1]);                  // bay -> left hall
  carveCorridor(G.rooms[0], G.rooms[2]);                  // bay -> right hall
  carveCorridor(G.rooms[3], G.rooms[6]);
  carveCorridor(G.rooms[4], G.rooms[7]);
  /* Two more cross-links between support rooms, picked at random each night.
     A spine with a couple of loops is a tree you memorise; a spine with five is
     a place you have to navigate, and it means the route to the nest can bend
     three or four times instead of running straight up the middle. */
  for (let i=0;i<2;i++){
    const a = rndi(3, G.rooms.length-1), b = rndi(3, G.rooms.length-1);
    if (a !== b) carveCorridor(G.rooms[a], G.rooms[b]);
  }

  /* 4b. And make sure the part of the building she can use is one piece.
     Every corridor above was carved between room centres, which guarantees the
     OPEN cells are connected — but the loading bay is not walkable for her, and
     a couple of the links run through it. That left rooms you could walk to and
     she could not follow you into, which is not a difficulty setting, it is a
     safe room nobody told the player about. Flood what she can use, and cut a
     direct link to anything the flood missed. */
  linkWalkableRegions();

  // 5. hard border
  for (let x=0;x<G.w;x++){ gSet(x,0,1); gSet(x,G.h-1,1); }
  for (let y=0;y<G.h;y++){ gSet(0,y,1); gSet(G.w-1,y,1); }

  /* 6. the hole the van reversed through. Without it the van is a lorry someone
        built a warehouse around. The dock is punched clean through the south
        wall so the night is visible from inside — three cells wide, two deep,
        and past the last row there is no grid, so you can see out and not walk
        out. mutateUnseen never samples these rows, so the exit cannot be
        sealed behind you. */
  EXIT.x0 = CORE.x + 16; EXIT.x1 = CORE.x + 18;
  EXIT.y0 = G.h - 2;               EXIT.y1 = G.h - 1;
  for (let y=EXIT.y0; y<=EXIT.y1; y++) for (let x=EXIT.x0; x<=EXIT.x1; x++) gSet(x,y,0);
  const m0 = cellToWorld(EXIT.x0, EXIT.y0), m1 = cellToWorld(EXIT.x1, EXIT.y1);
  EXIT.wx = (m0.x + m1.x)/2;
  EXIT.wz = m1.z + CFG.cell/2;      // the plane of the mouth
  EXIT.halfW = (m1.x - m0.x)/2 + CFG.cell/2;

  /* Sink a wing (and some nights raise another) before the roof is chosen,
     because the roof can only be torn open over somewhere the sky can reach. */
  chooseElevation(CAMPAIGN.shift);

  /* Pick where the roof is open BEFORE anything is built, because the ceiling
     has to be able to leave those tiles out. From night three on. */
  chooseHole(CAMPAIGN.shift);

  return G.rooms;
}
function roomOf(kind){ return G.rooms.find(r=>r.kind===kind); }
function roomCenter(r){ return cellToWorld(Math.floor(r.x+r.w/2), Math.floor(r.y+r.h/2)); }
function randCellIn(r){ return { x: rndi(r.x, r.x+r.w-1), y: rndi(r.y, r.y+r.h-1) }; }

/* ==========================================================================
   WORLD BUILD  (instanced — keeps draw calls tiny so shadows stay affordable)
   ========================================================================== */
const world = new THREE.Group();
scene.add(world);
const WALL_H = 5.0;   // she is nearly 4m to the crown; 3.4 put her head through the roof
const props = [];          // interactive / dressing meshes needing per-frame work
const PILLARS = [];        // thin obstacles with their own small colliders
const DETAIL  = [];        // instanced scenery, disposed on level rebuild
let cageMesh=null, wallMesh=null, hookMesh=null;

const MAT = {};
function buildMaterials(){
  MAT.wall  = new THREE.MeshLambertMaterial({ map:TEX.wall  });
  MAT.floor = new THREE.MeshLambertMaterial({ map:TEX.floor });
  MAT.ceil  = new THREE.MeshLambertMaterial({ map:TEX.ceil  });
  MAT.cage  = new THREE.MeshLambertMaterial({ map:TEX.cage  });
  MAT.metal = new THREE.MeshLambertMaterial({ map:TEX.metal });
  MAT.dark  = new THREE.MeshLambertMaterial({ color:0x1b1d20 });
  MAT.rust  = new THREE.MeshLambertMaterial({ color:0x5a3a1e });
  MAT.gold  = new THREE.MeshLambertMaterial({ color:0xb8912f, emissive:0x2a1f06 });
  MAT.copper= new THREE.MeshLambertMaterial({ color:0x9a5a2a, emissive:0x1d0d04 });
  MAT.pale  = new THREE.MeshLambertMaterial({ color:0x8d8778 });
}

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(),
      _p = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler();
function setInst(mesh, i, x,y,z, sx,sy,sz, ry){
  _p.set(x,y,z); _s.set(sx,sy,sz); _e.set(0, ry||0, 0); _q.setFromEuler(_e);
  _m.compose(_p,_q,_s); mesh.setMatrixAt(i,_m);
}

/* ---- geometry baking ----
   A van built from thirty little boxes is thirty draw calls for one object you
   walk past once. three's merge helpers live in examples/, which we do not
   ship, so this is the twenty lines of it we actually use: bake each part's
   transform into its own vertices and concatenate. One mesh per material.
   parts: [{ g, p:[x,y,z], r:[rx,ry,rz], s:[sx,sy,sz] }] */
function bakeGeo(parts){
  const gs = [];
  for (const pt of parts){
    let g = pt.g.clone();
    if (g.index) g = g.toNonIndexed();
    _e.set(pt.r ? pt.r[0]:0, pt.r ? pt.r[1]:0, pt.r ? pt.r[2]:0, 'XYZ'); _q.setFromEuler(_e);
    _p.set(pt.p[0], pt.p[1], pt.p[2]);
    _s.set(pt.s ? pt.s[0]:1, pt.s ? pt.s[1]:1, pt.s ? pt.s[2]:1);
    _m.compose(_p,_q,_s);
    g.applyMatrix4(_m);
    gs.push(g);
  }
  let n = 0;
  for (const g of gs) n += g.attributes.position.count;
  const pos = new Float32Array(n*3), nor = new Float32Array(n*3), uv = new Float32Array(n*2);
  let o3 = 0, o2 = 0;
  for (const g of gs){
    const c = g.attributes.position.count;
    pos.set(g.attributes.position.array.subarray(0, c*3), o3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array.subarray(0, c*3), o3);
    if (g.attributes.uv)     uv.set(g.attributes.uv.array.subarray(0, c*2), o2);
    o3 += c*3; o2 += c*2;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',   new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv',       new THREE.BufferAttribute(uv,2));
  out.computeBoundingSphere();
  return out;
}
/* add a baked mesh to a group and return it */
function baked(group, parts, mat, shadow){
  const m = new THREE.Mesh(bakeGeo(parts), mat);
  m.castShadow = !!shadow; m.receiveShadow = !!shadow;
  group.add(m); return m;
}

/* One mesh for the floor and one for the roof, both built off the corner grid.
   The floor used to be a single flat plane and the roof a field of flat tiles,
   which was right when the building was flat. Now a corner carries a height and
   both surfaces are welded to it: the floor ramps into a stairwell with no seam
   because the vertices at the seam ARE the same vertices, and the roof follows
   the floor down so a sunken wing has a roof over it at the same height above
   your head as everywhere else.

   skipCell is how the hole in the roof stays a hole. */
function buildSurface(yOff, up, mat, skipCell){
  const W1 = G.w+1, H1 = G.h+1;
  const pos = new Float32Array(W1*H1*3), uvs = new Float32Array(W1*H1*2);
  for (let j=0;j<H1;j++) for (let i=0;i<W1;i++){
    const n = j*W1+i;
    pos[n*3  ] = (i - G.w/2)*CFG.cell;
    pos[n*3+1] = cornerY(i,j) + yOff;
    pos[n*3+2] = (j - G.h/2)*CFG.cell;
    uvs[n*2  ] = i/G.w;
    uvs[n*2+1] = j/G.h;
  }
  const idx = [];
  for (let y=0;y<G.h;y++) for (let x=0;x<G.w;x++){
    if (skipCell && skipCell(x,y)) continue;
    const a = y*W1+x, b = a+1, c = a+W1, d = c+1;
    if (up) idx.push(a,c,b, b,c,d);       // normals +Y
    else    idx.push(a,b,c, b,d,c);       // normals -Y
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.computeBoundingSphere();
  const m = new THREE.Mesh(g, mat);
  m.frustumCulled = false;
  return m;
}

/* The flights themselves. The surface underneath is already a ramp and it is
   already what you walk on — these are treads laid on top of it so the eye is
   told what the feet are doing. Sampled straight off groundAt, so the steps
   cannot drift away from the slope no matter what the generator did. */
function buildStairs(){
  if (!LVL.stairs.length) return;
  const parts = [];
  for (const s of LVL.stairs){
    const a = cellToWorld(s.x0, s.y0), b = cellToWorld(s.x1, s.y1);
    const len = Math.hypot(b.x-a.x, b.z-a.z);
    const n = Math.max(6, Math.round(len/0.62));
    const ux = (b.x-a.x)/len, uz = (b.z-a.z)/len;
    const lo = Math.min(groundAt(a.x,a.z), groundAt(b.x,b.z)) - 0.9;
    for (let i=0;i<n;i++){
      const t = (i+0.5)/n;
      const px = a.x + ux*len*t, pz = a.z + uz*len*t;
      const top = groundAt(px, pz) + 0.085;
      parts.push({ g:new THREE.BoxGeometry(1,1,1),
                   p:[px, (top+lo)/2, pz],
                   r:[0, Math.atan2(ux, uz), 0],
                   s:[CFG.cell*0.97, top-lo, len/n*1.02] });
    }
  }
  const m = new THREE.Mesh(bakeGeo(parts), MAT.floor);
  m.receiveShadow = true; m.castShadow = true;
  world.add(m);
}

function buildWorld(){
  // ---- floor + ceiling ----
  const floor = buildSurface(0, true, MAT.floor, null);
  floor.receiveShadow = true;
  world.add(floor);
  buildStairs();

  const ceil = buildSurface(WALL_H, false, MAT.ceil, (x,y)=>holeCoversCell(x,y));
  world.add(ceil);

  rebuildWalls();

  // ---- cage batteries: rows of stacked cages down the long halls ----
  const cages = [], cageCells = [];
  G.rooms.filter(r=>r.kind==='hall').forEach(r=>{
    const midY = Math.floor(r.y + r.h/2);          // cross-aisle so you can get across
    for (let x=r.x+1; x<r.x+r.w-1; x+=3){
      for (let y=r.y+1; y<r.y+r.h-1; y++){
        if (y === midY || y === midY+1) continue;
        cageCells.push({x,y});
        const w = cellToWorld(x,y);
        const cy0 = groundAt(w.x, w.z);
        for (let tier=0; tier<4; tier++){
          cages.push({ x:w.x+rnd(-0.06,0.06), y:cy0+0.42+tier*0.86, z:w.z, ry:rnd(-0.02,0.02) });
        }
      }
    }
  });
  if (cages.length){
    cageMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1.5,0.8,CFG.cell*0.96), MAT.cage, cages.length);
    cageMesh.castShadow = true; cageMesh.receiveShadow = true;
    cages.forEach((c,i)=> setInst(cageMesh, i, c.x, c.y, c.z, 1,1,1, c.ry));
    cageMesh.instanceMatrix.needsUpdate = true;
    world.add(cageMesh);
    cageCells.forEach(c => gSet(c.x, c.y, 2));    // 2 = cage stack: blocks bodies, not sight
  }

  // ---- the shackle line: overhead rail + hanging hooks in the processing room ----
  const proc = roomOf('proc');
  if (proc){
    const c0 = cellToWorld(proc.x+1, proc.y+1), c1 = cellToWorld(proc.x+proc.w-2, proc.y+1);
    const railLen = Math.abs(c1.x-c0.x)+CFG.cell;
    const rail = new THREE.Mesh(new THREE.BoxGeometry(railLen,0.12,0.12), MAT.metal);
    const railY = groundAt((c0.x+c1.x)/2, c0.z) + WALL_H;
    rail.position.set((c0.x+c1.x)/2, railY-0.42, c0.z); rail.castShadow = true;
    world.add(rail);
    const n = Math.max(4, Math.floor(railLen/1.15));
    hookMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.06,0.72,0.06), MAT.metal, n);
    hookMesh.castShadow = true;
    hookMesh.userData.hooks = [];
    for (let i=0;i<n;i++){
      const hx = c0.x - CFG.cell/2 + (i+0.5)*(railLen/n);
      hookMesh.userData.hooks.push({ x:hx, z:c0.z, phase:Math.random()*TAU, amp:rnd(0.008,0.03) });
      setInst(hookMesh, i, hx, railY-0.86, c0.z, 1,1,1, 0);
    }
    hookMesh.instanceMatrix.needsUpdate = true;
    world.add(hookMesh);
  }

  buildDressing();
  buildExtraction();
  buildDetail();
  buildAtmosphere();
}

/* Walls are rebuilt from the grid on demand, because after you take the egg the
   grid stops being a constant. */
function rebuildWalls(){
  const cells = [];
  for (let y=0;y<G.h;y++) for (let x=0;x<G.w;x++){
    if (gAt(x,y) !== 1) continue;
    if (gAt(x-1,y)===1&&gAt(x+1,y)===1&&gAt(x,y-1)===1&&gAt(x,y+1)===1&&
        gAt(x-1,y-1)===1&&gAt(x+1,y-1)===1&&gAt(x-1,y+1)===1&&gAt(x+1,y+1)===1) continue;
    cells.push({x,y});
  }
  if (wallMesh){ world.remove(wallMesh); wallMesh.dispose(); wallMesh.geometry.dispose(); }
  wallMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), MAT.wall, Math.max(1,cells.length));
  wallMesh.castShadow = true; wallMesh.receiveShadow = true;
  wallMesh.frustumCulled = false;
  cells.forEach((c,i)=>{
    const w = cellToWorld(c.x,c.y);
    /* A wall at the edge of a sunken wing has to reach from the lowest floor it
       touches to the highest roof it touches, or you get daylight through the
       side of a stairwell. Cheap: nine samples, and only the handful of cells
       that actually straddle a change end up any taller than they were. */
    let lo = gY(c.x,c.y), hi = gY(c.x,c.y) + WALL_H;
    for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
      const v = gY(c.x+dx, c.y+dy);
      if (v < lo) lo = v;
      if (v + WALL_H > hi) hi = v + WALL_H;
    }
    setInst(wallMesh, i, w.x, (lo+hi)/2, w.z, CFG.cell, hi-lo, CFG.cell, 0);
  });
  for (let i=cells.length;i<1;i++) setInst(wallMesh, i, 0,-99,0, 0.001,0.001,0.001, 0);
  wallMesh.instanceMatrix.needsUpdate = true;
  world.add(wallMesh);
}

/* ---- pillars, fans, pipes, the van ---- */
function buildDressing(){
  PILLARS.length = 0; DETAIL.length = 0;

  /* Support pillars on a coarse lattice wherever open. Twenty-five identical
     posts used to be twenty-five meshes and twenty-five draw calls; they are
     one instanced mesh, and the colliders are still per-post. */
  const bayR = roomOf('bay');
  const inBay = (x,y) => bayR && x>=bayR.x-1 && x<bayR.x+bayR.w+1 && y>=bayR.y-1 && y<bayR.y+bayR.h+1;
  const posts = [];
  for (let y=3;y<G.h-3;y+=6) for (let x=3;x<G.w-3;x+=6){
    if (gAt(x,y)!==0 || inBay(x,y)) continue;
    const w = cellToWorld(x,y);
    posts.push(w);
    // a 0.46m post used to mark its entire 4.2m cell solid, blocking nine times
    // its own width. it gets a post-sized collider instead — 0.33 is the corner
    // of the post itself, so you can lean on it and not stop a stride away.
    PILLARS.push({ x:w.x, z:w.z, r:0.33 });
  }
  if (posts.length){
    const pm = new THREE.InstancedMesh(new THREE.BoxGeometry(0.46,WALL_H,0.46),
                                       MAT.metal, posts.length);
    pm.castShadow = true; pm.receiveShadow = true; pm.frustumCulled = false;
    // roof is always WALL_H above the floor, so a post is the same post
    // wherever it stands — it just stands lower
    posts.forEach((w,i)=> setInst(pm, i, w.x, groundAt(w.x,w.z) + WALL_H/2, w.z, 1,1,1, 0));
    pm.instanceMatrix.needsUpdate = true;
    world.add(pm); DETAIL.push(pm);
  }

  /* Ceiling pipes running the length of the building — one baked mesh, five
     runs, but broken at any wing that is not at ground level. A pipe that
     carried straight on over a sunken room would be buried inside its roof,
     and over a raised one it would come up through the floor at knee height.
     Segments over flat ground only, and the gap reads as a pipe that was cut
     when they put the stairs in. */
  const pipeParts = [];
  for (let i=0;i<5;i++){
    const r = rnd(0.07,0.15), hy = WALL_H - rnd(0.18,0.5);
    const cy = rndi(CORE.y+3, CORE.y+CORE.h-4);
    const z = cellToWorld(0, cy).z;
    let x = 1;
    while (x < G.w-1){
      if (!isFlatCell(x, cy)){ x++; continue; }
      let x2 = x;
      while (x2 < G.w-1 && isFlatCell(x2, cy)) x2++;
      const a = cellToWorld(x, cy), b = cellToWorld(x2-1, cy);
      const len = (b.x - a.x) + CFG.cell;
      if (len > CFG.cell*1.5)
        pipeParts.push({ g:new THREE.CylinderGeometry(1,1,1,6),
                         p:[(a.x+b.x)/2, hy, z],
                         r:[0,0,Math.PI/2], s:[r, len*0.98, r] });
      x = x2 + 1;
    }
  }
  if (!pipeParts.length)
    pipeParts.push({ g:new THREE.CylinderGeometry(1,1,1,6), p:[0,-90,0],
                     r:[0,0,Math.PI/2], s:[0.01,0.01,0.01] });
  const pipes = new THREE.Mesh(bakeGeo(pipeParts), MAT.rust);
  pipes.castShadow = true; pipes.frustumCulled = false;
  world.add(pipes); DETAIL.push(pipes);

  /* Dead extractor fans, high on the wall — they still turn in the draught.
     Hub and four blades bake into one geometry so a spinning fan is one mesh
     that rotates, not a group of five that rotate together. */
  const fanGeo = bakeGeo([
    { g:new THREE.CylinderGeometry(0.1,0.1,0.16,6), p:[0,0,0], r:[Math.PI/2,0,0] },
    { g:new THREE.BoxGeometry(0.9,0.02,0.26), p:[0,0,0.02], r:[0,0.34,0] },
    { g:new THREE.BoxGeometry(0.9,0.02,0.26), p:[0,0,0.02], r:[0,0.34,Math.PI/2] },
    { g:new THREE.BoxGeometry(0.9,0.02,0.26), p:[0,0,0.02], r:[0,0.34,Math.PI] },
    { g:new THREE.BoxGeometry(0.9,0.02,0.26), p:[0,0,0.02], r:[0,0.34,Math.PI*1.5] },
  ]);
  for (let i=0;i<3;i++){
    const c = roomCenter(pick(G.rooms));
    const fan = new THREE.Mesh(fanGeo, MAT.metal);
    fan.castShadow = true;
    const fx = c.x + rnd(-1.5,1.5), fz = c.z + rnd(-1.5,1.5);
    fan.position.set(fx, groundAt(fx,fz) + WALL_H - 0.7, fz);
    world.add(fan);
    props.push({ kind:'fan', obj:fan, spd:rnd(0.15,0.5) });
  }
}

/* ---- the extraction van, backed into the loading bay ---- */
const EXTRACT = { x:0, z:0, r:3.1, mesh:null };
let VAN_Z = 0;   // where the vehicle itself sits; EXTRACT is at its open doors
/* The bay is sacred: it will come to the mouth but never cross into the van's light. */
let BAY_RECT = null;
function inBayCell(cx,cy){
  if (cx >= EXIT.x0-1 && cx <= EXIT.x1+1 && cy >= EXIT.y0-1) return true;   // the dock counts
  return !!BAY_RECT && cx >= BAY_RECT.x-1 && cx < BAY_RECT.x+BAY_RECT.w+1
                    && cy >= BAY_RECT.y-1 && cy < BAY_RECT.y+BAY_RECT.h+1;
}

/* ==========================================================================
   THE DOCK
   The van used to be a box parked in a windowless room, which made it read as
   scenery rather than as the way out. Now the south wall is punched through: a
   shutter half-raised on its rails, an apron of wet asphalt outside, a fence,
   one sodium lamp still burning a hundred metres off. You can see the night
   from inside the building. That is the whole point of it.
   ========================================================================== */
function buildDock(){
  const g = new THREE.Group();
  const cw = EXIT.halfW*2;                    // clear width of the opening
  const jambM = new THREE.MeshLambertMaterial({ color:0x2a2b2c });
  const asphM = new THREE.MeshLambertMaterial({ color:0x24262b });
  const BOX = new THREE.BoxGeometry(1,1,1);
  const CYL = new THREE.CylinderGeometry(1,1,1,6);

  /* ---- OUTSIDE ----
     This used to be a rectangle of asphalt, a wire fence and one lamp, which
     told you the building had an outside without telling you where it was. A
     poultry unit is not in a city. It is at the end of a farm track with a
     treeline round it, and that is the last thing anyone who worked here saw
     on their way in.

     Everything out here lives inside about twenty-two metres, because the fog
     eats anything past that and geometry you cannot see is geometry you paid
     for. */
  const dirtM  = new THREE.MeshLambertMaterial({ color:0x2e2a23 });
  const roadM  = new THREE.MeshLambertMaterial({ color:0x3a352b });
  const rutM   = new THREE.MeshLambertMaterial({ color:0x1a1712, transparent:true,
                                                 opacity:0.85, depthWrite:false });
  const grassM = new THREE.MeshLambertMaterial({ color:0x232a1e });
  const barkM  = new THREE.MeshLambertMaterial({ color:0x1a1712 });
  const leafM  = new THREE.MeshLambertMaterial({ color:0x121a12 });

  // the yard: bare earth, not tarmac
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(cw+30, 34), dirtM);
  pad.rotation.x = -Math.PI/2;
  pad.position.set(EXIT.wx, 0.004, EXIT.wz + 15);
  pad.receiveShadow = true; g.add(pad);

  /* The track. It runs out from the doors and bends, because a straight road to
     the horizon is a runway — the bend is what makes it read as somewhere you
     drove to. Two ruts worn to mud, and the crown between them still dry. */
  const road = [];
  let rx = EXTRACT.x, rz = EXIT.wz + 1.0, ang = 0;
  for (let i=0;i<11;i++){
    ang += rnd(-0.055, 0.075);
    const seg = 2.4;
    rx += Math.sin(ang)*seg*0.35; rz += seg;
    road.push({ g:new THREE.PlaneGeometry(5.4, seg*1.06),
                p:[rx, 0.012, rz], r:[-Math.PI/2, 0, ang*0.35] });
  }
  baked(g, road, roadM, false);
  const ruts = [];
  road.forEach((r,i)=>{
    for (const off of [-1.15, 1.15])
      ruts.push({ g:new THREE.PlaneGeometry(0.5, 2.6),
                  p:[r.p[0]+off, 0.02, r.p[2]], r:[-Math.PI/2, 0, r.r[2]] });
  });
  baked(g, ruts, rutM, false);

  /* Treeline. Trunk plus two stacked cones each, all baked into two meshes, and
     placed on an arc with a gap where the track leaves. Heights vary a lot on
     purpose: a row of identical trees is a fence with leaves on. */
  const trunks = [], crowns = [];
  for (let i=0;i<26;i++){
    const a = -1.35 + (i/25)*2.7;                       // an arc in front of the doors
    const rr = rnd(15, 23);
    const tx = EXIT.wx + Math.sin(a)*rr, tz = EXIT.wz + 6 + Math.cos(a)*rr*0.55 + rnd(0,4);
    if (Math.abs(tx - EXTRACT.x) < 5.5 && tz < EXIT.wz + 20) continue;   // keep the track clear
    const hgt = rnd(4.5, 10.5), rad = hgt*rnd(0.17, 0.26);
    trunks.push({ g:new THREE.CylinderGeometry(1,1,1,5),
                  p:[tx, hgt*0.22, tz], s:[rnd(0.1,0.2), hgt*0.45, rnd(0.1,0.2)] });
    crowns.push({ g:new THREE.ConeGeometry(1,1,6),
                  p:[tx, hgt*0.58, tz], s:[rad, hgt*0.55, rad] });
    crowns.push({ g:new THREE.ConeGeometry(1,1,6),
                  p:[tx, hgt*0.82, tz], s:[rad*0.68, hgt*0.42, rad*0.68] });
  }
  // trunks, crowns and scrub all bake together: three near-black greens at
  // twenty metres in fog is one near-black green, and two fewer draw calls
  if (trunks.length) baked(g, trunks.concat(crowns), barkM, true);

  // scrub along the edge of the yard, where nothing has driven for years
  const tufts = [];
  for (let i=0;i<70;i++){
    const a = rnd(-1.5, 1.5), rr = rnd(7, 20);
    const tx = EXIT.wx + Math.sin(a)*rr, tz = EXIT.wz + 4 + Math.cos(a)*rr*0.6 + rnd(0,6);
    if (Math.abs(tx - EXTRACT.x) < 3.4) continue;
    for (let k=0;k<3;k++)
      tufts.push({ g:new THREE.ConeGeometry(1,1,3),
                   p:[tx+rnd(-0.3,0.3), rnd(0.12,0.3), tz+rnd(-0.3,0.3)],
                   r:[rnd(-0.25,0.25),rnd(0,TAU),rnd(-0.25,0.25)],
                   s:[rnd(0.06,0.14), rnd(0.3,0.7), rnd(0.06,0.14)] });
  }
  baked(g, tufts, leafM, false);

  // the header the shutter hangs from, its guide rails, and two dock bumpers
  // chewed flat by forty years of trailers — one mesh, one material
  baked(g, [
    { g:BOX, p:[EXIT.wx, WALL_H-0.45, EXIT.wz],              s:[cw+1.2, 0.9, 0.7] },
    { g:BOX, p:[EXIT.wx-(EXIT.halfW+0.15), WALL_H/2, EXIT.wz], s:[0.3, WALL_H, 0.5] },
    { g:BOX, p:[EXIT.wx+(EXIT.halfW+0.15), WALL_H/2, EXIT.wz], s:[0.3, WALL_H, 0.5] },
    { g:BOX, p:[EXIT.wx-(EXIT.halfW-0.3), 0.25, EXIT.wz+0.2],  s:[0.34,0.5,0.34] },
    { g:BOX, p:[EXIT.wx+(EXIT.halfW-0.3), 0.25, EXIT.wz+0.2],  s:[0.34,0.5,0.34] },
    // fence posts and the lamp column ride along in the same mesh: same colour
    // at this distance, and a draw call saved is a draw call saved
    { g:CYL, p:[EXIT.wx-13.2, 1.6, EXIT.wz+11], s:[0.08,3.2,0.08] },
    { g:CYL, p:[EXIT.wx-8.8,  1.6, EXIT.wz+11], s:[0.08,3.2,0.08] },
    { g:CYL, p:[EXIT.wx-4.4,  1.6, EXIT.wz+11], s:[0.08,3.2,0.08] },
    { g:CYL, p:[EXIT.wx,      1.6, EXIT.wz+11], s:[0.08,3.2,0.08] },
    { g:CYL, p:[EXIT.wx+4.4,  1.6, EXIT.wz+11], s:[0.08,3.2,0.08] },
    { g:CYL, p:[EXIT.wx+8.8,  1.6, EXIT.wz+11], s:[0.08,3.2,0.08] },
    { g:CYL, p:[EXIT.wx+13.2, 1.6, EXIT.wz+11], s:[0.08,3.2,0.08] },
    { g:CYL, p:[EXIT.wx+4.6,  3.4, EXIT.wz+9.0], s:[0.1,6.8,0.1] },
  ], jambM, true);

  // the shutter itself, wound up and stopped short — corrugated, so it reads as
  // a door and not as a beam
  const slatM = new THREE.MeshLambertMaterial({ color:0x4a4034 });
  const slatParts = [];
  for (let i=0;i<7;i++)
    slatParts.push({ g:BOX, p:[EXIT.wx, WALL_H-1.05-i*0.2, EXIT.wz + (i%2?0.03:-0.03)],
                     s:[cw, 0.17, 0.1] });
  baked(g, slatParts, slatM, false);

  /* Chain-link either side of the track, with the gate standing open — a fence
     straight across the one road out of here is the kind of detail that stops
     the eye and makes it ask a question the game cannot answer. */
  const fenceM = new THREE.MeshLambertMaterial({ color:0x3a3f44, wireframe:true });
  for (const side of [-1, 1]){
    const f = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 2.6, 11, 3), fenceM);
    f.position.set(EXTRACT.x + side*9.4, 1.3, EXIT.wz + 11); g.add(f);
  }

  const hood = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.18,0.8),
    new THREE.MeshBasicMaterial({ color:0xffb257, fog:true }));
  hood.position.set(EXIT.wx + 4.2, 6.7, EXIT.wz + 9.0); g.add(hood);
  /* One light out here, not two. Every additional light is compiled into every
     Lambert shader in the building and paid for on every lit pixel on screen,
     so the outside gets exactly one source and it is a motivated one. */
  const sod = new THREE.PointLight(0xffa348, LOWFI?18:28, 34, 1.35);
  sod.position.set(EXIT.wx + 4.2, 6.2, EXIT.wz + 9.0); g.add(sod);
  props.push({ kind:'sodium', obj:sod, base: LOWFI?18:28 });

  world.add(g);
}

/* A proper box truck, not a crate on wheels. It is the last man-made thing you
   will see and it should look like somebody drove it here. Every static part is
   baked into one mesh per material — the whole vehicle costs eight draw calls. */
function buildVan(){
  const van = new THREE.Group();
  const glassM = new THREE.MeshPhongMaterial({ color:0x0b0f14, shininess:140, specular:0x8899aa });
  const paintM = new THREE.MeshLambertMaterial({ color:0x4e4c44 });
  const boxM   = new THREE.MeshLambertMaterial({ color:0x625f55 });
  const ribM   = new THREE.MeshLambertMaterial({ color:0x55534b });
  const BOX = new THREE.BoxGeometry(1,1,1);
  const PLN = new THREE.PlaneGeometry(1,1);
  const WHL = new THREE.CylinderGeometry(0.47,0.47,0.30,12);

  // --- cargo box, ribbed flanks, and the rear doors swung back against them ---
  baked(van, [
    { g:BOX, p:[0,1.68,0.55], s:[2.62,2.45,4.5] },
    // doors: hinged at the rear corners, pinned open along the sides
    { g:BOX, p:[-1.3-Math.sin(2.0)*0.64, 1.68, 2.8+Math.cos(2.0)*0.64*-1], r:[0,-2.0,0], s:[1.28,2.3,0.08] },
    { g:BOX, p:[ 1.3+Math.sin(2.0)*0.64, 1.68, 2.8+Math.cos(2.0)*0.64*-1], r:[0, 2.0,0], s:[1.28,2.3,0.08] },
  ], boxM, true);
  /* Everything below this line has castShadow off. renderer.info counts a
     shadow-casting mesh twice — once for the depth pass — so a van made of
     shadow-casting trim costs double for detail the beam cannot resolve. */

  const ribParts = [];
  for (let i=0;i<16;i++)
    ribParts.push({ g:BOX, p:[(i<8?-1:1)*1.325, 1.68, -1.55 + (i%8)*0.6], s:[0.07,2.3,0.09] });
  baked(van, ribParts, ribM, false);

  // rusted skirt along the bottom edge
  baked(van, [{ g:BOX, p:[0,0.62,0.55], s:[2.66,0.42,4.52] }], MAT.rust, false);

  // --- cab ---
  baked(van, [
    { g:BOX, p:[0,1.42,-2.72], s:[2.42,1.5,1.9] },
    { g:BOX, p:[0,0.95,-3.85], s:[2.3,0.85,0.6] },
  ], paintM, true);

  // glass: windscreen and both door windows
  baked(van, [
    { g:PLN, p:[0,1.62,-3.69],    r:[0.13,0,0],         s:[2.1,1.05,1] },
    { g:PLN, p:[-1.22,1.6,-2.72], r:[0,-Math.PI/2,0],   s:[1.5,0.9,1] },
    { g:PLN, p:[ 1.22,1.6,-2.72], r:[0, Math.PI/2,0],   s:[1.5,0.9,1] },
  ], glassM, false);

  // --- everything dark: grille, mirrors, six wheels (dual at the back) ---
  const darkParts = [
    { g:BOX, p:[0,0.98,-4.17], s:[1.7,0.36,0.08] },
    { g:BOX, p:[-1.5,1.78,-3.5], s:[0.08,0.36,0.14] },
    { g:BOX, p:[ 1.5,1.78,-3.5], s:[0.08,0.36,0.14] },
    { g:BOX, p:[-1.36,1.86,-3.5], s:[0.3,0.04,0.04] },
    { g:BOX, p:[ 1.36,1.86,-3.5], s:[0.3,0.04,0.04] },
  ];
  for (const w of [[-1.24,-2.9],[1.24,-2.9],[-1.22,1.6],[1.22,1.6],[-1.48,1.6],[1.48,1.6]])
    darkParts.push({ g:WHL, p:[w[0],0.47,w[1]], r:[0,0,Math.PI/2] });
  baked(van, darkParts, MAT.dark, true);

  // bumper, loading lip
  baked(van, [
    { g:BOX, p:[0,0.5,-4.24], s:[2.36,0.26,0.22] },
    { g:BOX, p:[0,0.46,3.1],  s:[2.5,0.1,0.7] },
    { g:new THREE.SphereGeometry(0.14,7,5), p:[-0.86,1.0,-4.2], s:[1,0.8,0.6] },
    { g:new THREE.SphereGeometry(0.14,7,5), p:[ 0.86,1.0,-4.2], s:[1,0.8,0.6] },
  ], MAT.metal, false);

  // --- the only friendly light in the building, and the lamps still fed by it ---
  baked(van, [
    { g:BOX, p:[-1.16,1.1,2.81], s:[0.16,0.3,0.08] },
    { g:BOX, p:[ 1.16,1.1,2.81], s:[0.16,0.3,0.08] },
  ], new THREE.MeshBasicMaterial({ color:0xd8331f, fog:true }), false);

  baked(van, [
    { g:PLN, p:[0,1.62,2.83], s:[2.36,2.24,1] },                    // the lit hold
    { g:new THREE.CylinderGeometry(0.13,0.15,0.2,8), p:[0,2.27,-2.72] },  // roof beacon
  ], new THREE.MeshBasicMaterial({ color:0xffb877, fog:true }), false);

  const glow = new THREE.PointLight(0xffc98a, LOWFI?9:14, 10, 2);
  glow.position.set(0,1.6,3.0); van.add(glow);
  props.push({ kind:'vanGlow', obj:glow, base: LOWFI?9:14 });

  van.position.set(EXTRACT.x, 0, VAN_Z);
  world.add(van);
  EXTRACT.mesh = van;
}

function buildExtraction(){
  const bay = roomOf('bay');
  const c = roomCenter(bay);
  BAY_RECT = bay;
  /* Back the van right up to the dock. Parked in the middle of the bay it was
     eighteen metres from the opening, and this fog eats everything past twenty
     — so the hole in the wall, which is the entire point of the hole in the
     wall, was invisible from the one place you always stand. The trigger sits
     at the open rear doors, not at the vehicle's centre. */
  VAN_Z = c.z + 5.0;
  EXTRACT.x = c.x; EXTRACT.z = VAN_Z + 3.2;
  buildVan();
  buildDock();
}

/* ==========================================================================
   PLAYER + FLASHLIGHT
   The light is a HAND. Holding it costs you a carry slot.
   ========================================================================== */
const P = {
  x:0, z:0, y:CFG.eyeH,
  vx:0, vz:0,
  yaw:0, pitch:0,
  stam: CFG.stamMax, sprinting:false, crouch:false,
  bob:0, step:0, headY:0,
  hands: [null, null],        // slot contents: {item} | {lamp:true} | null
  pockets: [],
  banked: 0, quota: 0,
  alive: true, deadT: 0,
  strikes: 0, downed: false, downT: 0, limpT: 0,
  noiseT: 0,
};

/* the torch: a real shadow-casting spotlight. everything else is faked.
   These numbers were swept in a headless browser, not guessed — a flashlight
   that is too dim reads as a broken game, not as atmosphere. */
const TORCH = { power: LOWFI ? 560 : 620, angle: 0.62, wide: 0.82,
                penumbra: 0.62, decay: 1.0, dist: 34 };
const torch = new THREE.SpotLight(0xfff0d0, 0, TORCH.dist, TORCH.angle, TORCH.penumbra, TORCH.decay);
torch.castShadow = true;
torch.shadow.mapSize.set(LOWFI?512:1024, LOWFI?512:1024);
torch.shadow.camera.near = 0.2;
torch.shadow.camera.far  = 26;
torch.shadow.bias = -0.0016;
torch.shadow.normalBias = 0.028;
const torchTarget = new THREE.Object3D();
scene.add(torch, torchTarget);
torch.target = torchTarget;

/* a whisper of ambience so pitch black isn't pure black */
const amb  = new THREE.AmbientLight(0x232c38, 0.115);
const hemi = new THREE.HemisphereLight(0x18202c, 0x070605, 0.10);
scene.add(amb, hemi);

/* a tiny bounce light at the player so held objects read in the dark */
const bounce = new THREE.PointLight(0xffe6c0, 0, 3.2, 2);
scene.add(bounce);

/* The torch never leaves your hand now. Setting it down only ever bought you a
   second carry slot, and two heavy items already made you slower than the thing
   chasing you — so the trade was never worth taking. A choice nobody makes is
   not a choice, it is a button. */
const LAMP = { on: true, battery: 1, flickerT: 0, flicker: 0, deadT: 0 };

/* A dead cell does not kill the lamp, it cripples it: the beam pulls in, loses
   thirty percent of its throw, and stutters once every five seconds. You can
   still see. You just cannot see enough, and the building keeps reminding you. */
const DEAD = { bright: 0.70, cone: 0.72, dist: 0.74, period: 5.0 };
function lampDead(){ return LAMP.battery <= 0; }
/* The lamp is emitting whenever it is on and in your hand — a dead cell still
   glows, so anything that asks "can it see my light" must use this, not battery. */
function lampLit(){ return LAMP.on && heldLampSlot() >= 0; }

function torchIntensity(){
  if (!LAMP.on) return 0;
  const b = LAMP.battery;
  if (b <= 0) return TORCH.power * DEAD.bright * (1 - LAMP.flicker);
  const dying = b < 0.22 ? (0.35 + 0.65*(b/0.22)) : 1;
  return TORCH.power * dying * (1 - LAMP.flicker);
}

function updateTorch(dt){
  const dead = lampDead();

  if (dead){
    // a metronome, not a mood: one hard stutter every five seconds, forever
    LAMP.deadT -= dt;
    if (LAMP.deadT <= 0){ LAMP.deadT = DEAD.period; LAMP.flicker = 0.95; }
  } else {
    LAMP.deadT = DEAD.period;
    // flicker: rare, brief, worse as the cell drains
    LAMP.flickerT -= dt;
    if (LAMP.flickerT <= 0){
      LAMP.flickerT = rnd(2.2, 9) * (0.35 + LAMP.battery);
      LAMP.flicker = Math.random() < (0.55 - LAMP.battery*0.4) ? rnd(0.4,0.92) : 0;
    }
  }
  LAMP.flicker = Math.max(0, LAMP.flicker - dt*4.2);

  // twice the drain it used to have: a cell is now a real clock, not a formality
  // (the test key 7 stops the drain at source rather than topping it back up
  //  every frame, so the readout does not visibly stutter between refills)
  if (LAMP.on && LAMP.battery > 0 && !CHEAT.power)
    LAMP.battery = Math.max(0, LAMP.battery - dt*0.0092);

  if (heldLampSlot() >= 0){
    /* The lamp is in a HAND, and a hand is always a beat behind the eye. The
       beam chases your look instead of matching it — the single cheapest thing
       that stops the camera reading as a camera. */
    updateHand(dt);
    const rx = Math.cos(HAND.yaw), rz = -Math.sin(HAND.yaw);
    torch.position.set(P.x + rx*0.26, P.y - 0.16 + P.headY*0.6, P.z + rz*0.26);
    const dir = handDir();
    torchTarget.position.set(P.x + dir.x*8, P.y + dir.y*8, P.z + dir.z*8);
    torch.angle    = dead ? TORCH.angle * DEAD.cone : TORCH.angle;
    torch.penumbra = TORCH.penumbra;
    torch.decay    = TORCH.decay;
    torch.distance = dead ? TORCH.dist * DEAD.dist : TORCH.dist;
    /* Near-field exposure. A 620-intensity spot with decay 1.0 dumps enormous
       illuminance onto anything within a couple of metres, so walking up to a
       document or a switch turned it into a white rectangle — you could see
       there was a thing and not what the thing was. Step the beam forward
       through the grid, find the first surface, and pull the intensity down as
       it closes. It reads as a torch you are holding too near a wall, which is
       exactly what is happening. */
    const near = beamHitDist(dir);
    const expo = near >= 4.0 ? 1 : clamp(0.30 + (near-0.7)/3.3*0.70, 0.30, 1);
    torch.intensity = torchIntensity() * expo;
    bounce.position.set(P.x, P.y-0.3, P.z);
    bounce.intensity = LAMP.on ? (dead ? 1.0 : 1.6) : 0;
  } else {
    torch.intensity = 0; bounce.intensity = 0;
  }
}

/* How far in front of the lamp is the nearest wall, rack or cage? Marched
   through the grid rather than raycast against meshes: eight samples over four
   metres is nothing, and it cannot be fooled by a mesh with no collider. */
function beamHitDist(dir){
  const step = 0.5;
  for (let d = 0.7; d <= 4.0; d += step){
    const c = worldToCell(P.x + dir.x*d, P.z + dir.z*d);
    if (solidAt(c.x, c.y)) return d;
  }
  return 99;
}

function heldLampSlot(){ return P.hands.findIndex(h => h && h.lamp); }
/* A three.js camera looks down its own -Z. After rotateY(yaw)+rotateX(pitch)
   that is (-sin yaw * cos pitch, sin pitch, -cos yaw * cos pitch).
   Getting this sign wrong points the torch out the back of your head. */
function camDir(){
  const cp = Math.cos(P.pitch);
  return { x: -Math.sin(P.yaw)*cp, y: Math.sin(P.pitch), z: -Math.cos(P.yaw)*cp };
}

/* ---------------- collision: circle vs grid cells ---------------- */
function solidAt(cx,cy){ const v = gAt(cx,cy); return v===1 || v===2; }

/* A rack is 1.5m of steel standing in a 4.2m cell. Blocking the whole cell put
   1.35m of nothing on either side of it and you bounced off air a stride short
   of the glass. Racks (grid value 2) collide as the box they actually are:
   narrow across, full depth along the row, so the rows still read as walls you
   have to walk around but you can put your face against them. */
const RACK_HX = 0.82;                       // 1.5m of rack, plus a hair
function collide(nx, nz, r){
  const c = worldToCell(nx,nz);
  for (let gy=c.y-1; gy<=c.y+1; gy++){
    for (let gx=c.x-1; gx<=c.x+1; gx++){
      if (!solidAt(gx,gy)) continue;
      const w = cellToWorld(gx,gy);
      const half = CFG.cell/2;
      const hx = gAt(gx,gy) === 2 ? RACK_HX : half;
      const cxMin=w.x-hx, cxMax=w.x+hx, czMin=w.z-half, czMax=w.z+half;
      const qx = clamp(nx, cxMin, cxMax), qz = clamp(nz, czMin, czMax);
      let dx = nx-qx, dz = nz-qz;
      const d2 = dx*dx+dz*dz;
      if (d2 >= r*r) continue;
      let d = Math.sqrt(d2);
      if (d < 1e-5){ // dead centre — push out along the shallowest axis
        const ox = nx < w.x ? cxMin-r-nx : cxMax+r-nx;
        const oz = nz < w.z ? czMin-r-nz : czMax+r-nz;
        if (Math.abs(ox) < Math.abs(oz)) nx += ox; else nz += oz;
        continue;
      }
      const push = (r-d)/d;
      nx += dx*push; nz += dz*push;
    }
  }
  // thin obstacles get thin colliders
  for (let i=0;i<PILLARS.length;i++){
    const p = PILLARS[i];
    const dx = nx-p.x, dz = nz-p.z;
    const rr = r + p.r;
    const d2 = dx*dx + dz*dz;
    if (d2 >= rr*rr || d2 < 1e-9) continue;
    const d = Math.sqrt(d2);
    const push = (rr-d)/d;
    nx += dx*push; nz += dz*push;
  }
  return { x:nx, z:nz };
}

/* line-of-sight over the grid (used by the thing, and by "did it see your beam") */
function losClear(x0,z0,x1,z1){
  const dx = x1-x0, dz = z1-z0;
  const dist = Math.hypot(dx,dz);
  const steps = Math.ceil(dist / (CFG.cell*0.4));
  for (let i=1;i<steps;i++){
    const t = i/steps;
    const c = worldToCell(x0+dx*t, z0+dz*t);
    if (gAt(c.x,c.y) === 1) return false;   // cages (2) don't block sight, only movement
  }
  return true;
}

/* ==========================================================================
   INPUT
   ========================================================================== */
const keys = {};
let pointerLocked = false;
const touch = { moveId:null, lookId:null, mx:0, my:0, lx:0, ly:0, dx:0, dy:0, sprint:false };

function bindDesktop(){
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code==='KeyF') toggleLamp();
    if (e.code==='KeyE') interact();
    if (e.code==='KeyG') dropSlot();
    /* TEST BUILD ONLY: 1-6 jumps straight to that night. Set CFG.debugKeys
       false for release and this whole branch stops existing. */
    if (CFG.debugKeys && e.code.startsWith('Digit')){
      const n = +e.code.slice(5);
      if (n >= 1 && n <= 6){ jumpToNight(n); e.preventDefault(); return; }
      if (n === 7){ toggleCheatPower(); e.preventDefault(); return; }
      if (n === 8){ cycleRunSpeed();    e.preventDefault(); return; }
      if (n === 9){ toggleMarkers();    e.preventDefault(); return; }
    }
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });

  cv.addEventListener('click', () => {
    if (MODE==='play' && !pointerLocked && cv.requestPointerLock) cv.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === cv;
  });
  addEventListener('mousemove', e => {
    if (!pointerLocked) return;
    P.yaw   -= e.movementX * 0.0022;
    P.pitch -= e.movementY * 0.0022;
    P.pitch = clamp(P.pitch, -1.35, 1.35);
  });
  addEventListener('mousedown', e => { if (pointerLocked && e.button===0) interact(); });
}

function bindTouch(){
  const stick = $('stick');
  const knob  = $('knob');
  const R = 62;

  function stickFrom(t){
    const b = stick.getBoundingClientRect();
    let dx = t.clientX - (b.left+b.width/2);
    let dy = t.clientY - (b.top +b.height/2);
    const d = Math.hypot(dx,dy);
    if (d > R){ dx = dx/d*R; dy = dy/d*R; }
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    touch.mx = dx/R; touch.my = dy/R;
    touch.sprint = d > R*0.86;
  }
  stick.addEventListener('touchstart', e => {
    e.preventDefault(); const t = e.changedTouches[0];
    touch.moveId = t.identifier; stickFrom(t);
  }, {passive:false});

  addEventListener('touchstart', e => {
    for (const t of e.changedTouches){
      if (touch.moveId === t.identifier) continue;
      if (t.clientX < innerWidth*0.42 && t.clientY > innerHeight*0.55) continue;
      if (t.target && t.target.classList && t.target.classList.contains('tb')) continue;
      if (touch.lookId === null){ touch.lookId = t.identifier; touch.lx = t.clientX; touch.ly = t.clientY; }
    }
  }, {passive:true});

  addEventListener('touchmove', e => {
    for (const t of e.changedTouches){
      if (t.identifier === touch.moveId) stickFrom(t);
      else if (t.identifier === touch.lookId){
        P.yaw   -= (t.clientX - touch.lx) * 0.0052;
        P.pitch -= (t.clientY - touch.ly) * 0.0052;
        P.pitch = clamp(P.pitch, -1.35, 1.35);
        touch.lx = t.clientX; touch.ly = t.clientY;
      }
    }
  }, {passive:true});

  const endTouch = e => {
    for (const t of e.changedTouches){
      if (t.identifier === touch.moveId){
        touch.moveId = null; touch.mx = touch.my = 0; touch.sprint = false;
        knob.style.transform = 'translate(-50%,-50%)';
      }
      if (t.identifier === touch.lookId) touch.lookId = null;
    }
  };
  addEventListener('touchend', endTouch, {passive:true});
  addEventListener('touchcancel', endTouch, {passive:true});

  const tap = (el, fn) => {
    el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); fn(); }, {passive:false});
    el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); }, {passive:false});
  };
  tap($('bUse'),   () => interact());
  tap($('bDrop'),  () => dropSlot());
  tap($('bLight'), () => toggleLamp());
}

/* ==========================================================================
   MOVEMENT
   ========================================================================== */
/* With the salvage gone, the egg IS the load curve. At 22 it puts you under her
   hunt speed, so the walk home is a chase you cannot simply win on foot. */
function eggWeight(){ return eggInHand() ? 22 : 0; }
function carriedWeight(){
  let w = 0;
  for (const h of P.hands) if (h && h.item) w += h.item.def.kg;
  for (const it of P.pockets) w += it.def.kg;
  return w + eggWeight();
}
function carriedValue(){
  let v = 0;
  for (const h of P.hands) if (h && h.item) v += h.item.def.val;
  for (const it of P.pockets) v += it.def.val;
  return v;
}

function movePlayer(dt){
  // knocked down: it has you on the floor and is busy with what you dropped
  if (P.downed){
    P.downT -= dt;
    P.vx = P.vz = 0;
    P.y = lerp(P.y, groundAt(P.x, P.z) + 0.5, Math.min(1, dt*4));
    camera.position.set(P.x, P.y, P.z);
    camera.rotation.set(0,0,0);
    camera.rotateY(P.yaw); camera.rotateX(P.pitch);
    camera.rotateZ(Math.sin(P.downT*3)*0.06 + 0.22);
    if (P.downT <= 0){ P.downed = false; P.stam = CFG.stamMax*0.35; }
    return;
  }

  let ix = 0, iz = 0;
