  if (IS_TOUCH){ ix = touch.mx; iz = touch.my; }
  if (keys.KeyW || keys.ArrowUp)    iz -= 1;
  if (keys.KeyS || keys.ArrowDown)  iz += 1;
  if (keys.KeyA || keys.ArrowLeft)  ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  const mag = Math.hypot(ix,iz);
  if (mag > 1){ ix/=mag; iz/=mag; }
  const moving = mag > 0.08;

  P.crouch = !!keys.ControlLeft || !!keys.KeyC;
  const wantSprint = (keys.ShiftLeft || keys.ShiftRight || touch.sprint) && moving && !P.crouch;
  P.sprinting = wantSprint && P.stam > 0.12;

  if (P.sprinting && !CHEAT.power){ P.stam = Math.max(0, P.stam - dt); }
  else { P.stam = Math.min(CFG.stamMax, P.stam + dt*CFG.stamRegen*(moving?1:2.2)); }

  /* Only the EGG has weight. Cells and anything else you pick up used to feed
     the same load curve, so filling your pockets quietly made you slower than
     the thing chasing you for no reason a player could see or reason about.
     The egg is a deliberate trade you make once; a spare battery is not. */
  const wf = clamp(eggWeight()/CFG.weightMax, 0, 1);
  const load = 1 - wf*CFG.weightSlow;
  let spd = (P.crouch ? CFG.crouchSpd : P.sprinting ? CFG.sprintSpd : CFG.walkSpd) * load * runSpeedMult();
  if (P.limpT > 0){ P.limpT -= dt; spd *= 0.8; }   // it hurt you the first time

  // forward is where you look: fwd = (-sin yaw, -cos yaw), right = (cos yaw, -sin yaw)
  const s = Math.sin(P.yaw), c = Math.cos(P.yaw);
  const tx = (ix*c + iz*s) * spd;
  const tz = (-ix*s + iz*c) * spd;

  const k = 1 - Math.exp(-CFG.accel*dt);
  P.vx = lerp(P.vx, tx, k);
  P.vz = lerp(P.vz, tz, k);

  const res = collide(P.x + P.vx*dt, P.z + P.vz*dt, CFG.playerR);
  // if we got pushed back hard we hit something — kill the velocity into it
  P.x = res.x; P.z = res.z;

  // head bob + footstep noise
  updateBody(dt);
  const speedNow = Math.hypot(P.vx,P.vz);
  if (speedNow > 0.4){
    P.bob += dt * speedNow * (P.sprinting ? 2.5 : 1.9);
    P.step += dt * speedNow * (P.sprinting ? 0.62 : 0.46);
    if (P.step >= 1){
      P.step = 0;
      sfxStep(P.sprinting);
      emitNoise(P.x, P.z, P.crouch ? 5 : P.sprinting ? 26 : 13);
      markTrail();
      // the foot actually lands: the body takes it, and so does the floor
      bodyDip(P.sprinting ? 0.16 : P.crouch ? 0.03 : 0.07);
    }
  } else {
    P.bob = lerp(P.bob, 0, dt*6);
  }
  P.headY = Math.sin(P.bob*2)*0.035 + Math.sin(P.bob)*0.018 + BODY.land;
  // crouch is a movement, not a state change: BODY.crouch eases 0..1
  /* Eye height is measured from the floor under your feet, not from zero. That
     one addition is the whole of what walking down a flight of stairs is:
     everything else in the movement code is still purely two-dimensional, and
     the collider, the pathfinder and the shifter never learn that the building
     has a basement in it. */
  P.y = groundAt(P.x, P.z) + lerp(CFG.eyeH, CFG.eyeH*0.62, BODY.crouch) + P.headY;

  camera.position.set(P.x, P.y, P.z);
  camera.rotation.set(0,0,0);
  camera.rotateY(P.yaw);
  camera.rotateX(P.pitch);
  camera.rotateZ(Math.sin(P.bob)*0.007 + (P.sprinting?Math.sin(P.bob*0.5)*0.006:0));
}

/* ==========================================================================
   LOOT
   Value is what you want. Weight is what it costs you. Hands are the limit.
   ========================================================================== */
/* The only two things in the building you can pick up: the egg, and cells for
   the flashlight. Everything else was clutter competing with the dark. */
const ITEMS = [
  { id:'cell', name:'SPARE CELL', val:0, kg:0.5, big:false, battery:true },
];
const POCKET_MAX = 2;
const loot = [];

function itemGeo(def){
  switch(def.id){
    case 'copper': return new THREE.CylinderGeometry(0.3,0.3,0.42,10);
    case 'motor':  return new THREE.BoxGeometry(0.5,0.42,0.62);
    case 'chest':  return new THREE.BoxGeometry(0.62,0.32,0.36);
    case 'tin':    return new THREE.BoxGeometry(0.34,0.24,0.26);
    case 'drum':   return new THREE.CylinderGeometry(0.32,0.32,0.72,10);
    case 'jar':    return new THREE.CylinderGeometry(0.13,0.13,0.3,8);
    case 'watch':  return new THREE.BoxGeometry(0.1,0.03,0.1);
    case 'keys':   return new THREE.TorusGeometry(0.07,0.018,4,8);
    case 'cell':   return new THREE.CylinderGeometry(0.06,0.06,0.16,6);
  }
  return new THREE.BoxGeometry(0.3,0.3,0.3);
}
function itemMat(def){
  // Phong so valuables actually GLINT when the beam crosses them — that glint
  // is the whole "I see something down there" feeling.
  switch(def.id){
    case 'copper': return new THREE.MeshPhongMaterial({ color:0x9c5a26, shininess:60, specular:0x775533 });
    case 'motor':  return new THREE.MeshPhongMaterial({ color:0x3a3f45, shininess:34, specular:0x555555 });
    case 'chest':  return new THREE.MeshPhongMaterial({ color:0x8a2f22, shininess:22, specular:0x443333 });
    case 'tin':    return new THREE.MeshPhongMaterial({ color:0x9d8a3c, shininess:80, specular:0x8a7a44 });
    case 'drum':   return new THREE.MeshPhongMaterial({ color:0x4d5340, shininess:16, specular:0x333333 });
    case 'jar':    return new THREE.MeshPhongMaterial({ color:0xa8c0b4, shininess:110, specular:0xbbccbb,
                                                        transparent:true, opacity:0.82 });
    case 'watch':  return new THREE.MeshPhongMaterial({ color:0xd8b34a, shininess:140, specular:0xffeeaa });
    case 'keys':   return new THREE.MeshPhongMaterial({ color:0xb0b4b8, shininess:120, specular:0xdddddd });
    case 'cell':   return new THREE.MeshPhongMaterial({ color:0x2e6a3a, shininess:60, specular:0x88aa88 });
  }
  return MAT.pale;
}

function spawnItem(def, wx, wz){
  const m = new THREE.Mesh(itemGeo(def), itemMat(def));
  const yBase = def.big ? 0.22 : 0.1;
  m.position.set(wx, groundAt(wx,wz) + yBase, wz);
  m.rotation.y = Math.random()*TAU;
  m.castShadow = true; m.receiveShadow = true;
  world.add(m);
  const it = { def, mesh:m, yBase, held:false, banked:false, spin:rnd(-0.2,0.2) };
  loot.push(it);
  return it;
}

/* Nothing on the floor but spare cells. The salvage was clutter: it gave you
   things to think about that were not the egg, the dark, or the thing. A cell
   is the only object in the building, and it is also your only throwable. */
function scatterLoot(shift){
  const cellDef = ITEMS.find(d => d.id === 'cell');
  const count = 8;
  for (let i=0;i<count;i++){
    const room = pick(G.rooms);
    let c, tries = 0;
    do { c = randCellIn(room); tries++; } while (gAt(c.x,c.y)!==0 && tries<40);
    if (gAt(c.x,c.y)!==0) continue;
    const w = cellToWorld(c.x,c.y);
    spawnItem(cellDef, w.x + rnd(-1.2,1.2), w.z + rnd(-1.2,1.2));
  }
}

/* ---------------- carry / interact ---------------- */
function freeHand(){ return P.hands.findIndex(h => h === null); }

function lookingAt(){
  // nearest loot (or the set-down lamp) within reach and roughly in front
  const d = camDir();
  let best = null, bestScore = -1;
  for (const it of loot){
    if (it.held || it.banked) continue;
    const dx = it.mesh.position.x - P.x, dz = it.mesh.position.z - P.z;
    const dist = Math.hypot(dx,dz);
    if (dist > CFG.reachDist) continue;
    const dot = (dx*d.x + dz*d.z) / (dist||1e-4);
    // right on top of it counts no matter which way you're facing — otherwise
    // you stand in the thing you want and it refuses to be picked up
    if (dist > 0.7 && dot < 0.35) continue;
    const score = (dist < 0.7 ? 1 : dot) - dist*0.12;
    if (score > bestScore){ bestScore = score; best = { kind:'item', it }; }
  }
  return best;
}

function interact(){
  if (MODE !== 'play' || !P.alive) return;
  /* THE EGG FIRST. Always. Putting the switch and the papers ahead of it meant
     that a document pinned to a wall within two metres of the nest silently ate
     the keypress — you stood on the thing you came for, pressed use, and read
     somebody's rota instead. Anything that can be near the objective must never
     be able to outrank it. */
  if (!EGG.held && !EGG.delivered && EGG.mesh &&
      Math.hypot(EGG.x-P.x, EGG.z-P.z) < CFG.reachDist){ takeEgg(); return; }
  if (startGate()) return;                    // then the switch
  if (readPaper()) return;                    // then anything worth reading
  const t = lookingAt();
  if (!t) return;
  if (t.it.def.battery) takeCell(t.it);
}

function takeCell(it){
  if (it.held || it.banked) return false;
  if (LAMP.battery < 0.55 || P.pockets.length >= POCKET_MAX){
    LAMP.battery = Math.min(1, LAMP.battery + 0.55);
    it.banked = true; world.remove(it.mesh);
    sfxCell(); toast('CELL FITTED');
  } else {
    P.pockets.push(it); it.held = true; world.remove(it.mesh);
    sfxClick(1); toast('SPARE CELL');
  }
  emitNoise(P.x, P.z, 7);
  suspect(P.x, P.z, 20);
  refreshHands();
  return true;
}

/* ---------------- REACH: walking into a thing uses it ----------------
   There is no keyboard on a phone, and there was never a decision in the
   keypress anyway — nobody has ever stood next to the egg and chosen not to
   pick it up. So proximity does it: the switch, the egg and the spare cells
   all trigger on contact.

   The switch and the egg both have refusal paths that talk to you (the cage is
   still shut; your hands are full), and a refusal that re-fires sixty times a
   second is a strobing message rather than a message. Each one gets its own
   cooldown, and the cooldown is only spent on a refusal — a success needs no
   guard because the thing it succeeded on is gone.

   The van is deliberately NOT in here. Extraction stays a thing you do, not a
   thing that happens to you while you walk past. */
const REACH = { eggT: 0, gateT: 0 };
function updateReach(dt){
  if (MODE !== 'play' || !P.alive || P.downed) return;
  REACH.eggT -= dt; REACH.gateT -= dt;

  // the switch: standing at it starts the crank, and holding still finishes it
  if (REACH.gateT <= 0 && typeof gateNear === 'function' && gateNear() && GATE.hold <= 0){
    if (startGate()) REACH.gateT = 1.2;
  }

  /* The egg — but never in the middle of the handover. She takes a few seconds
     to step off the nest and let you see it, and proximity would let you walk
     straight through the one scene the whole campaign is built towards and end
     it before she has moved. A keypress there is still yours to make; walking
     is not a decision, so it does not get to make that one. */
  const inScene = typeof HANDOVER !== 'undefined' && HANDOVER.active && !HANDOVER.done;
  if (REACH.eggT <= 0 && !inScene && !EGG.held && !EGG.delivered && EGG.mesh &&
      Math.hypot(EGG.x-P.x, EGG.z-P.z) < CFG.reachDist){
    REACH.eggT = 2.5;
    takeEgg();
  }

  // and any cell on the floor you happen to walk over
  for (const it of loot){
    if (it.held || it.banked || !it.def.battery) continue;
    if (Math.hypot(it.mesh.position.x-P.x, it.mesh.position.z-P.z) > CFG.reachDist*0.85) continue;
    takeCell(it);
    break;                      // one per frame; the next is still there next frame
  }
}

function dropSlot(){
  if (MODE !== 'play' || P.downed) return;
  const i = P.hands.findIndex(h => h && h.item);
  let at = null;
  if (i >= 0){ at = dropItemAt(P.hands[i].item, P.x, P.z); P.hands[i] = null; }
  else if (P.pockets.length){ at = dropItemAt(P.pockets.pop(), P.x, P.z); }
  else return;
  sfxThud();
  // the clatter is louder than you are, and it COMMITS to the sound: this is
  // what turns "I lost my loot" into "I bought myself five seconds".
  emitNoise(at.x, at.z, 20, true);
  refreshHands();
}
function dropItemAt(it, x, z){
  const d = camDir();
  // running throws it further — that is how you buy yourself seconds
  const throwD = clamp(1.0 + Math.hypot(P.vx,P.vz)*0.75, 1.0, 5.2);
  it.held = false;
  const r = collide(x + d.x*throwD, z + d.z*throwD, 0.3);
  it.mesh.position.set(r.x, groundAt(r.x,r.z) + it.yBase, r.z);
  world.add(it.mesh);
  return r;
}

function toggleLamp(){
  if (MODE !== 'play') return;
  LAMP.on = !LAMP.on;
  sfxClick(0.55);
  if (!LAMP.on) toast('DARK');
}

/* ---------------- the van is the finish line, not a bank ----------------
   Nothing pays out until you leave, and you only leave with the egg. That is
   what turns "should I grab this too?" into a real question at the worst moment. */
let bankFlashT = 0;
let vanNagT = 0;
function tryExtract(){
  const d = Math.hypot(P.x-EXTRACT.x, P.z-EXTRACT.z);
  if (d > EXTRACT.r) return;
  if (!eggInHand()){
    vanNagT -= 1/60;
    if (vanNagT <= 0){ vanNagT = 4; subtitle('Not without it.', 2.5); }
    return;
  }
  let gained = 0;
  for (let i=0;i<P.hands.length;i++){
    const h = P.hands[i];
    if (h && h.item){ gained += h.item.def.val; h.item.banked = true; P.hands[i] = null; }
  }
  while (P.pockets.length){ const it = P.pockets.pop(); gained += it.def.val; it.banked = true; }
  EGG.delivered = true; EGG.held = true;
  roosterStop();
  P.pay = gained; P.banked += gained;
  bankFlashT = 1;
  CAMPAIGN.eggs++;
  campaignSave();
  refreshHands();
  if (CAMPAIGN.shift >= CAMPAIGN.last){ startEnding(); return; }
  sfxBank();
  endShift('out');
}

/* ==========================================================================
   THE THING
   It is tall, pale and eyeless. It was fed here for a very long time.
   ========================================================================== */
/* The more you have banked, the bolder it gets. Your success is the thing that
   makes the next trip dangerous — that is the whole point of a greed loop. */
function threat(){ return clamp(P.banked / Math.max(1, P.quota), 0, 1); }
let ROBBED = false;          // it sleeps until you take something

const MON = {
  x:0, z:0, y:0, yaw:0,
  state:'sleep', stateT:0,
  tx:0, tz:0,               // current target
  path:[], pathT:0,
  spd:0, lunge:0,
  heard:0, seen:0,
  group:null, headBone:null, legPhase:0,
  alertness:0,
  sx:0, sz:0, suspT:0,       // last place it has reason to care about
  stepT:0,
};

/* It follows where you HAVE been, not where you are. That is the difference
   between a monster that stalks you and one that happens to bump into you. */
const TRAIL = [];
function markTrail(){
  TRAIL.push({ x:P.x, z:P.z });
  if (TRAIL.length > 26) TRAIL.shift();
}

function suspect(x, z, secs){ MON.sx = x; MON.sz = z; MON.suspT = Math.max(MON.suspT, secs || 20); }

function buildMonster(){ MON.group = buildMonsterV2(); }

function buildMonsterOld(){
  const g = new THREE.Group();
  const skin = new THREE.MeshPhongMaterial({ color:0xa89f8e, shininess:8, specular:0x221e18 });
  const dark = new THREE.MeshPhongMaterial({ color:0x2a231d, shininess:4 });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.46,10,8), skin);
  body.scale.set(1,1.25,0.82); body.position.y = 1.42; body.castShadow = true; g.add(body);

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.15,0.95,7), skin);
  neck.position.y = 2.16; neck.castShadow = true; g.add(neck);

  const head = new THREE.Group();
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.17,8,7), skin);
  skull.scale.set(1,0.9,1.25); skull.castShadow = true; head.add(skull);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.085,0.44,6), dark);
  beak.rotation.x = Math.PI/2; beak.position.set(0,-0.02,0.3); beak.castShadow = true; head.add(beak);
  head.position.y = 2.72; g.add(head);
  MON.headBone = head;

  // legs — long, backward-knee, awful
  MON.legs = [];
  for (const side of [-1,1]){
    const leg = new THREE.Group();
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.06,0.78,6), skin);
    thigh.position.y = -0.39; thigh.castShadow = true; leg.add(thigh);
    const shin = new THREE.Group();
    const shinM = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.04,0.72,6), skin);
    shinM.position.y = -0.36; shinM.castShadow = true; shin.add(shinM);
    shin.position.y = -0.78; leg.add(shin);
    leg.position.set(side*0.2, 1.15, 0);
    leg.userData.shin = shin;
    g.add(leg); MON.legs.push(leg);
  }
  // vestigial wings, held wrong
  for (const side of [-1,1]){
    const wing = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.66,0.3), skin);
    wing.position.set(side*0.44, 1.4, -0.05);
    wing.rotation.z = side*0.38; wing.castShadow = true; g.add(wing);
  }

  g.visible = false;
  world.add(g);
  MON.group = g;
}

/* She is not in the building until you take her egg. Act one is you, the dark
   and six hundred chickens — and the knowledge that this cannot last. */
function monsterSpawn(){
  MON.x = 0; MON.z = 0;
  MON.state = 'sleep'; MON.stateT = 0; MON.path = []; MON.alertness = 0;
  MON.present = false;
  MON.group.visible = false;
}

/* the moment the egg leaves the nest */
function monsterArrive(){
  if (MON.present) return;
  // as far from you as the building allows, so she has to come the whole way
  let best = null, bestD = -1;
  for (const r of G.rooms){
    if (r.kind === 'bay') continue;
    const c = roomCenter(r);
    const d = Math.hypot(c.x-P.x, c.z-P.z);
    if (d > bestD){ bestD = d; best = c; }
  }
  const cell = nearestOpen(...(()=>{ const q = worldToCell(best.x, best.z); return [q.x,q.y]; })());
  const w = cellToWorld(cell.x, cell.y);
  MON.x = w.x; MON.z = w.z;
  MON.present = true;
  MON.group.visible = true;
  MON.alertness = 1;
  MON.path = []; MON.pathT = 0;
  MON.tx = P.x; MON.tz = P.z;
  setMonState('hunt');
}

/* BFS across the grid — cages (2) are walkable for it, it steps over them */
function findPath(sx,sy,tx,ty){
  if (sx===tx && sy===ty) return [];
  const N = G.w*G.h;
  const prev = new Int32Array(N).fill(-1);
  const seen = new Uint8Array(N);
  const q = new Int32Array(N);
  let head=0, tail=0;
  const si = sy*G.w+sx;
  q[tail++] = si; seen[si] = 1;
  const ti = ty*G.w+tx;
  let found = false;
  while (head < tail){
    const cur = q[head++];
    if (cur === ti){ found = true; break; }
    const cx = cur % G.w, cy = (cur / G.w)|0;
    for (let k=0;k<4;k++){
      const nx = cx + (k===0?1:k===1?-1:0);
      const ny = cy + (k===2?1:k===3?-1:0);
      if (nx<0||ny<0||nx>=G.w||ny>=G.h) continue;
      const ni = ny*G.w+nx;
      if (seen[ni]) continue;
      if (!walkable(nx,ny)) continue;      // cages block it, and the bay is off limits
      seen[ni] = 1; prev[ni] = cur; q[tail++] = ni;
    }
  }
  if (!found) return [];
  const out = [];
  let cur = ti;
  while (cur !== si && cur !== -1){
    const cx = cur % G.w, cy = (cur / G.w)|0;
    out.push(cellToWorld(cx,cy));
    cur = prev[cur];
  }
  out.reverse();
  return out;
}

/* nearest walkable cell — targets can land inside a cage stack or a pillar */
function walkable(cx,cy){ return gAt(cx,cy) === 0 && !inBayCell(cx,cy); }
function nearestOpen(cx,cy){
  if (walkable(cx,cy)) return {x:cx,y:cy};
  for (let r=1;r<=14;r++){
    for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
      if (Math.max(Math.abs(dx),Math.abs(dy)) !== r) continue;
      const nx=cx+dx, ny=cy+dy;
      if (nx>=0&&ny>=0&&nx<G.w&&ny<G.h&&walkable(nx,ny)) return {x:nx,y:ny};
    }
  }
  return {x:cx,y:cy};
}

function emitNoise(x,z,radius,distract){
  if (!MON.present || MON.state === 'dead' || MON.state === 'feed') return;
  const d = Math.hypot(MON.x-x, MON.z-z);
  if (d > radius) return;
  MON.alertness = Math.min(1, MON.alertness + 0.34);
  if (MON.state === 'sleep' && MON.alertness < 0.5 && !distract) return;
  MON.tx = x; MON.tz = z;
  MON.pathT = 0;
  if (distract){
    // it fixates on the clatter and stops tracking you for a moment
    MON.commit = 2.4;
    setMonState('investigate');
  } else if (MON.state !== 'hunt') setMonState('investigate');
}

function setMonState(s){
  if (MON.state === s) return;
  MON.state = s; MON.stateT = 0;
  if (s === 'hunt') sfxShriek();
}

function updateMonster(dt){
  if (!MON.group || !MON.present){ setDread(0); return; }
  MON.stateT += dt;
  MON.alertness = Math.max(0, MON.alertness - dt*0.018);   // it forgets slowly now
  MON.suspT = Math.max(0, MON.suspT - dt);

  const dxp = P.x-MON.x, dzp = P.z-MON.z;
  const distP = Math.hypot(dxp,dzp);

  /* Something four metres tall is walking on an eleven-year-dead building, and
     the ceiling has opinions about it. Dust comes down BETWEEN you and her, so
     you get the news through the roof before you get it through the dark — and
     it works when she is behind a wall, which is when it matters. */
  MON.shakeT = (MON.shakeT || 0) - dt;
  if (MON.shakeT <= 0 && distP < 26){
    const near = 1 - distP/26;
    MON.shakeT = lerp(1.1, 0.24, near);
    const t = rnd(0.35, 0.8);                    // partway from her to you
    fxCeilingShake(lerp(MON.x, P.x, t), lerp(MON.z, P.z, t), near);
  }

  // ---- perception ----
  MON.commit = Math.max(0, (MON.commit || 0) - dt);
  let sees = false;
  if (MON.state !== 'feed' && MON.commit <= 0 && P.alive && distP < 22 + threat()*9 && losClear(MON.x,MON.z,P.x,P.z)){
    const lit = lampLit();
    // Going dark is the real tool. Lit, it clocks you across the room; dark, it
    // has to almost stand on you — and crouching in the dark halves that again.
    const blind = lit ? 6.5 : (P.crouch ? 1.9 : 3.4);
    if (distP < blind) sees = true;
    else if (lit){
      const d = camDir();
      const dot = (dxp*d.x + dzp*d.z)/(distP||1e-4);
      if (dot > 0.25) sees = true;               // your beam is pointing its way
      else if (distP < 13) sees = true;          // spill light is enough that close
    }
  }
  if (sees){
    MON.alertness = Math.min(1, MON.alertness + dt*1.5);
    MON.tx = P.x; MON.tz = P.z; MON.pathT = 0;
    if (MON.state !== 'hunt' && (MON.alertness > 0.45 || distP < 8)) setMonState('hunt');
  }

  // ---- state machine ----
  switch (MON.state){
    case 'sleep':
      MON.spd = 0;
      if (MON.stateT > 10 || MON.alertness > 0.4 || ROBBED) setMonState('roam');
      break;
    case 'roam': {
      MON.spd = 2.7 + threat()*0.9;          // it used to amble. it patrols now.
      // Re-steer on a timer, NOT on arrival. Committing to one destination and
      // walking the whole way meant it was always chasing 40-second-old news.
      MON.pickCd = (MON.pickCd || 0) - dt;
      if (MON.pickCd <= 0){
        MON.pickCd = 3.0;
        MON.path.length = 0;
        let q;
        const r = Math.random();
        if (TRAIL.length > 8 && r < 0.62){
          // a few seconds behind you, so it follows rather than homes
          const back = rndi(3, 8);
          const pt = TRAIL[TRAIL.length - 1 - back];
          q = worldToCell(pt.x, pt.z);
        } else if (MON.suspT > 0 && r < 0.8){
          q = worldToCell(MON.sx, MON.sz);      // go where you were last busy
        } else if (r < 0.86 && BAY_RECT){
          q = { x: Math.floor(BAY_RECT.x + BAY_RECT.w/2), y: BAY_RECT.y - 1 };
        } else {
          q = randCellIn(pick(G.rooms));
        }
        const c = nearestOpen(q.x, q.y);
        const w = cellToWorld(c.x,c.y);
        MON.tx = w.x; MON.tz = w.z; MON.pathT = 0;
      }
      break;
    }
    case 'feed':
      MON.spd = 0;
      MON.feedT -= dt;
      if (MON.feedT <= 0){ MON.alertness = 0.3; setMonState('roam'); }
      break;
    case 'investigate':
      MON.spd = 2.9 + threat()*0.6;
      // arriving and finding nothing makes it search nearby, not shrug and wander off
      if (MON.path.length === 0 && MON.stateT > 3){
        const c = nearestOpen(...(() => { const q = worldToCell(MON.tx, MON.tz);
          return [q.x + rndi(-3,3), q.y + rndi(-3,3)]; })());
        const w = cellToWorld(c.x,c.y);
        MON.tx = w.x; MON.tz = w.z; MON.pathT = 0;
      }
      if (MON.stateT > 24 && !sees) setMonState('roam');
      break;
    case 'hunt':
      MON.spd = 4.35 + threat()*0.35;
      if (!sees && MON.stateT > 12){ suspect(P.x, P.z, 18); setMonState('investigate'); }
      break;
  }

  // ---- pathing ----
  MON.pathT -= dt;
  if (MON.pathT <= 0){
    MON.pathT = MON.state === 'hunt' ? 0.35 : 0.9;
    const a0 = worldToCell(MON.x, MON.z), b0 = worldToCell(MON.tx, MON.tz);
    const a = nearestOpen(clamp(a0.x,0,G.w-1), clamp(a0.y,0,G.h-1));
    const b = nearestOpen(clamp(b0.x,0,G.w-1), clamp(b0.y,0,G.h-1));
    MON.path = findPath(a.x, a.y, b.x, b.y);
  }

  // ---- move ----
  if (MON.spd > 0 && MON.path.length){
    const wp = MON.path[0];
    let dx = wp.x-MON.x, dz = wp.z-MON.z;
    const d = Math.hypot(dx,dz);
    if (d < 0.55){ MON.path.shift(); }
    else {
      // it moves in bursts — long still moments, then it covers ground
      // it pauses and starts again, but it should not average out to half speed
      const burst = MON.state === 'hunt' ? 1 : (0.78 + 0.22*Math.sin(MON.stateT*1.6));
      const step = MON.spd * burst * dt;
      MON.x += dx/d*step; MON.z += dz/d*step;
      MON.legPhase += step*2.6;
      MON.stepT += step;
      if (MON.stepT > 1.45){ MON.stepT = 0; monStep(distP); }
      const want = Math.atan2(dx,dz);
      let diff = want - MON.yaw;
      while (diff >  Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      MON.yaw += diff * Math.min(1, dt*6);
    }
  }

  // ---- present ----
  const g = MON.group;
  g.position.set(MON.x, groundAt(MON.x, MON.z), MON.z);
  g.rotation.y = MON.yaw;
  const bobA = MON.state==='hunt' ? 0.12 : 0.06;
  g.position.y = Math.abs(Math.sin(MON.legPhase))*bobA;
  g.rotation.z = Math.sin(MON.legPhase)*(MON.state==='hunt' ? 0.09 : 0.055);
  g.rotation.x = Math.sin(MON.legPhase*2)*0.02;
  MON.legs.forEach((leg,i)=>{
    const ph = MON.legPhase + i*Math.PI;
    leg.rotation.x = Math.sin(ph)*0.62;
    leg.userData.shin.rotation.x = Math.max(0, -Math.sin(ph))*0.9;
  });
  // hard clamp: if anything ever raises the ceiling question again, she ducks
  if (MON.headBone){
    const crown = g.position.y + MON.headBone.position.y + 0.45;
    if (crown > WALL_H - 0.15) g.position.y -= (crown - (WALL_H - 0.15));
  }
  if (MON.headBone){
    // the head tracks you even when the body doesn't
    const face = Math.atan2(dxp,dzp) - MON.yaw;
    let f = face; while (f>Math.PI) f-=TAU; while (f<-Math.PI) f+=TAU;
    const look = (MON.state==='hunt'||MON.state==='investigate') ? clamp(f,-1.1,1.1) : Math.sin(MON.stateT*0.8)*0.5;
    MON.headBone.rotation.y = lerp(MON.headBone.rotation.y, look, dt*4);
    MON.headBone.rotation.x = Math.sin(MON.stateT*2.1)*0.08;
  }

  // ---- contact ----
  if (P.alive && !P.downed && distP < 2.1 && MON.state === 'hunt') caught();

  // ---- audio pressure ----
  setDread(P.alive ? clamp(1 - (distP-4)/26, 0, 1) * (MON.state==='sleep'?0.25:1) : 0);
}

/* Being caught should cost you the run's profit, not the run itself. A shift that
   ends on first contact teaches you never to take the bet the game is built on. */
function caught(){
  if (!P.alive || P.downed) return;
  P.strikes++;

  let lost = 0;
  for (let i=0;i<P.hands.length;i++){
    const h = P.hands[i];
    if (h && h.item){ lost += h.item.def.val; dropItemAt(h.item, MON.x + rnd(-1,1), MON.z + rnd(-1,1)); P.hands[i] = null; }
  }
  while (P.pockets.length){ const it = P.pockets.pop(); lost += it.def.val; dropItemAt(it, MON.x+rnd(-1,1), MON.z+rnd(-1,1)); }
  if (eggInHand()) dropEgg(P.x + rnd(-1.6,1.6), P.z + rnd(-1.6,1.6));
  refreshHands();

  if (P.strikes >= 2){ killPlayer(); return; }

  P.downed = true; P.downT = 3.0; P.limpT = 20;
  MON.feedT = 7.5; setMonState('feed');
  MON.commit = 7.5;
  sfxDeath();
  const hu = $('hurt');
  hu.style.opacity = '1';
  setTimeout(()=>{ hu.style.opacity = '0'; }, 2000);
  // you do not get up where you fell. you wake at the doors, and everything
  // you walked to get here you have to walk again.
  const bay = roomOf('bay'), bc = roomCenter(bay);
  P.x = bc.x; P.z = bc.z - 2.6; P.vx = P.vz = 0; P.yaw = 0; P.pitch = 0;
  TRAIL.length = 0;
  toast('IT HAS YOU');
  subtitle('You come round by the doors. It is still in there, and so is the egg.', 6);
}

function killPlayer(){
  if (!P.alive) return;
  P.alive = false; P.deadT = 0;
  for (let i=0;i<P.hands.length;i++){
    const h = P.hands[i];
    if (h && h.item){ dropItemAt(h.item, MON.x + rnd(-1,1), MON.z + rnd(-1,1)); P.hands[i] = null; }
  }
  while (P.pockets.length) dropItemAt(P.pockets.pop(), MON.x+rnd(-1,1), MON.z+rnd(-1,1));
  refreshHands();
  sfxDeath();
  $('hurt').style.opacity = '1';
  if (pointerLocked && document.exitPointerLock) document.exitPointerLock();
}

/* ==========================================================================
   AUDIO — everything synthesised, no files
   ========================================================================== */
let AC = null, master = null, dreadGain = null, dreadOsc = null, noiseBuf = null;
let ambTimer = 0, heartT = 0, dread = 0, rainT = 0;

function initAudio(){
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);

  const len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i=0;i<len;i++) nd[i] = Math.random()*2-1;

  // the room tone: a low drone that never quite stops
  const drone = AC.createOscillator(); drone.type = 'sawtooth'; drone.frequency.value = 34;
  const dLp = AC.createBiquadFilter(); dLp.type='lowpass'; dLp.frequency.value = 120;
  const dG = AC.createGain(); dG.gain.value = 0.05;
  drone.connect(dLp); dLp.connect(dG); dG.connect(master); drone.start();

  // dread layer — rises as it gets close
  dreadGain = AC.createGain(); dreadGain.gain.value = 0;
  const dn = AC.createBufferSource(); dn.buffer = noiseBuf; dn.loop = true;
  const dF = AC.createBiquadFilter(); dF.type='bandpass'; dF.frequency.value = 190; dF.Q.value = 1.4;
  dn.connect(dF); dF.connect(dreadGain); dreadGain.connect(master); dn.start();
  dreadOsc = AC.createOscillator(); dreadOsc.type='sine'; dreadOsc.frequency.value = 52;
  const doG = AC.createGain(); doG.gain.value = 0.5;
  dreadOsc.connect(doG); doG.connect(dreadGain); dreadOsc.start();
  initWarm();
}
function setDread(v){ dread = v; if (dreadGain) dreadGain.gain.value = v*v*0.16; }

function noiseBurst(dur, type, freq, q, gain, atk){
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q||1;
  const g = AC.createGain();
  const t = AC.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + (atk||0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.03);
}
function tone(freq, dur, type, gain, slideTo){
  if (!AC) return;
  const o = AC.createOscillator(); o.type = type||'sine';
  const g = AC.createGain();
  const t = AC.currentTime;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.02);
}
function sfxStep(loud){ noiseBurst(loud?0.16:0.12,'bandpass', loud?rnd(180,300):rnd(120,220), 2.2, loud?0.16:0.075); }
function sfxClick(v){ noiseBurst(0.07,'highpass',1800,1,0.1*(v||1)); tone(rnd(420,560),0.06,'square',0.03*(v||1)); }
function sfxThud(v){ noiseBurst(0.28,'lowpass',260,1,0.24*(v||1)); tone(70,0.26,'sine',0.14*(v||1),44); }
function sfxCell(){ tone(660,0.09,'square',0.06); setTimeout(()=>tone(880,0.12,'square',0.06),90); }
function sfxBank(){ tone(392,0.14,'triangle',0.09); setTimeout(()=>tone(523,0.16,'triangle',0.09),110);
                    setTimeout(()=>tone(659,0.3,'triangle',0.08),230); }
function sfxShriek(){
  if (!AC) return;
  tone(rnd(700,980), 0.55, 'sawtooth', 0.09, rnd(150,260));
  noiseBurst(0.7,'bandpass',900,3,0.11,0.02);
}
function sfxDeath(){
  if (!AC) return;
  noiseBurst(1.4,'lowpass',420,1,0.36,0.01);
  tone(180,1.5,'sawtooth',0.14,38);
}
/* Stereo-panned so you can point at it with your ears. Being hunted is only
   frightening if you can half-locate the thing hunting you. */
function monStep(dist){
  if (!AC || dist > 34) return;
  const dx = MON.x - P.x, dz = MON.z - P.z, d = Math.hypot(dx,dz) || 1;
  const rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);          // player's right vector
  const pan = clamp((dx*rx + dz*rz)/d, -1, 1);
  const vol = clamp(1 - dist/34, 0, 1);
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value = rnd(85,150); f.Q.value = 1.6;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.3*vol*vol, t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
  s.connect(f); f.connect(g);
  if (AC.createStereoPanner){
    const p = AC.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(master);
  } else g.connect(master);
  s.start(t); s.stop(t+0.27);
}

function sfxCreak(){ noiseBurst(rnd(0.5,1.3),'bandpass',rnd(280,900),rnd(4,12),rnd(0.03,0.075),rnd(0.05,0.3)); }
function sfxDistant(){ tone(rnd(160,320), rnd(0.6,1.4), 'sine', 0.035, rnd(90,150)); }

function updateAudio(dt){
  if (!AC) return;
  ambTimer -= dt;
  if (ambTimer <= 0){
    ambTimer = rnd(3.5, 11);
    if (Math.random() < 0.62) sfxCreak(); else sfxDistant();
  }
  /* Rain, but only near the gap. It is a two-second loop retriggered rather
     than a held source, so it never has to be started, stopped or cleaned up
     across a level rebuild. */
  updateRainBed(dt);
  if (dread > 0.42 && P.alive){
    heartT -= dt;
    if (heartT <= 0){
      heartT = lerp(1.05, 0.44, dread);
      tone(58, 0.13, 'sine', 0.06*dread);
      setTimeout(()=>tone(46,0.17,'sine',0.045*dread), 150);
    }
  }
  if (dreadOsc) dreadOsc.frequency.value = 40 + dread*26;
}

/* ==========================================================================
   HUD
   ========================================================================== */
let toastT = 0;

/* Every message goes inside a span, because the span is what carries the
   panel — a background on the container would be a band across the whole
   screen, and the text has to be the shape of the box. Built as a node rather
   than assigned as innerHTML: some of these lines come from level data and
   none of them should ever be able to be markup. */
function msgPanel(el, msg){
  el.textContent = '';
  if (!msg){ el.style.opacity = '0'; return; }
  const s = document.createElement('span');
  s.textContent = msg;
  el.appendChild(s);
  el.style.opacity = '1';
}

/* Centre screen is the best place to read something and the worst place to
   have something while you are being chased. */
function inDanger(){
  if (typeof MON !== 'undefined' && MON.present &&
      (MON.state === 'hunt' || MON.state === 'investigate')) return true;
  if (typeof ROO !== 'undefined' && ROO.present &&
      ROO.state !== 'off' && ROO.state !== 'hide') return true;
  return false;
}

function toast(msg){ msgPanel($('toast'), msg); toastT = msg ? 2.2 : 0; }
function subtitle(msg, secs){
  const s = $('sub');
  s.classList.toggle('danger', inDanger());
  msgPanel(s, msg);
  clearTimeout(subtitle._t);
  subtitle._t = setTimeout(()=>{ s.style.opacity='0'; }, (secs||4)*1000);
}

function refreshHands(){
  for (let i=0;i<2;i++){
    const el = $('slot'+i), h = P.hands[i];
    el.className = 'slot';
    if (!h){ el.textContent = 'EMPTY'; }
    else if (h.lamp){ el.classList.add('lamp');
      el.innerHTML = '<b>' + (LAMP.on ? 'FLASHLIGHT' : 'LIGHT OFF') + '</b>' +
                     (lampDead() ? 'dead cell' : Math.round(LAMP.battery*100) + '%'); }
    else if (h.egg){ el.classList.add('full'); el.innerHTML = '<b>THE EGG</b>warm'; }
    else { el.classList.add('full'); el.innerHTML = '<b>'+h.item.def.name+'</b>' + h.item.def.val + ' · ' + h.item.def.kg + 'kg'; }
  }
  const pk = $('slot1');
  if (P.pockets.length && !P.hands[1]){
    pk.classList.add('full');
    pk.innerHTML = '<b>POCKETS ×'+P.pockets.length+'</b>' + P.pockets.reduce((a,b)=>a+b.def.val,0);
  }
}

function updateHUD(dt){
  const bat = Math.round(LAMP.battery*100);
  $('hCarry').textContent = !LAMP.on ? 'OFF' : lampDead() ? 'DEAD CELL' : bat + '%';
  $('hCarry').className = 'val ' + (bat < 22 ? 'bad' : bat < 45 ? 'warn' : '');
  const gk = GATE_KINDS.find(x => x.id === GATE.kind);
  const obj = EGG.delivered ? 'DELIVERED'
            : eggInHand() ? 'GET TO THE VAN'
            : HANDOVER.armed ? 'SHE IS WAITING'
            : ROO.present ? 'DO NOT LOSE IT'
            : gateBlocked() ? (gk ? gk.label : 'OPEN IT')
            : 'FIND THE EGG';
  $('hBank').textContent = obj;
  $('hBank').className = 'val ' + (eggInHand() ? 'warn' : '');
  $('hBank').style.fontSize = '12px';
  $('quotaF').style.width = (eggInHand() ? 100 : EGG.hum*100) + '%';
  $('quotaF').style.background = eggInHand() ? '#d8a33a' : '#8fbf6a';
  $('hWeight').textContent = String(P.pockets.length);
  $('hWeight').className = 'val ' + (P.pockets.length ? 'good' : '');
  $('hWeight').style.fontSize = '13px';

  if (CFG.timed){
    const t = Math.max(0, shiftT);
    const mm = String(Math.floor(t/60)).padStart(2,'0'), ss = String(Math.floor(t%60)).padStart(2,'0');
    $('hClock').textContent = mm+':'+ss;
    $('hClock').className = 'val ' + (t < 45 ? 'bad' : t < 90 ? 'warn' : '');
  } else {
    $('hClock').textContent = '\u2014';
    $('hClock').className = 'val';
  }

  $('stamF').style.width = (P.stam/CFG.stamMax*100) + '%';

  if (toastT > 0){ toastT -= dt; if (toastT <= 0) $('toast').style.opacity = '0'; }

  const pr = $('prompt');
  if (P.alive && !EGG.held && !EGG.delivered && EGG.mesh &&
      Math.hypot(EGG.x-P.x, EGG.z-P.z) < CFG.reachDist){
    pr.style.display = 'block';
    pr.textContent = (IS_TOUCH?'TAKE':'[E]') + '  TAKE THE EGG';
    if (bankFlashT > 0) bankFlashT -= dt*1.4;
    return;
  }
  const look = P.alive ? lookingAt() : null;
  if (look){
    pr.style.display = 'block';
    if (look.it.def.battery) pr.textContent = (IS_TOUCH?'TAKE':'[E]') + '  FIT SPARE CELL';
    else pr.textContent = (IS_TOUCH?'TAKE':'[E]') + '  ' + look.it.def.name + '   ' + look.it.def.val + ' · ' + look.it.def.kg + 'kg';
  } else pr.style.display = 'none';

  const dv = Math.hypot(P.x-EXTRACT.x, P.z-EXTRACT.z);
  if (dv < EXTRACT.r + 3 && P.alive && !EGG.delivered){
    pr.style.display = 'block';
    pr.textContent = eggInHand() ? 'GET IN THE VAN' : 'NOT WITHOUT THE EGG';
  }

  if (bankFlashT > 0){ bankFlashT -= dt*1.4; }
}

/* ==========================================================================
   GAME FLOW
   ========================================================================== */
let MENU_VIEW = false;
let MODE = 'boot';          // boot | title | play | dead | summary
let shiftT = 0, shiftNo = 1, lastT = 0, deadFade = 0;

function overlay(html){ const o = $('ovl'); o.innerHTML = html; o.style.display = 'flex'; }
function hideOverlay(){ $('ovl').style.display = 'none'; }

function showTitle(){
  MODE = 'title';
  $('ovl').style.background = 'rgba(4,5,7,.93)';
  $('hud').style.display = 'none';
  $('carry').style.display = 'none';
  $('stam').style.display = 'none';
  $('touch').style.display = 'none';
  overlay(`
    <h1>THE COOP</h1>
    <div class="sub1">SALVAGE · NIGHT SHIFT</div>
    <p>The plant closed eleven years ago. Nothing in here is worth money.<br><br>
       There is an egg somewhere inside. Find it, and bring it to the van.<br><br>
       <em>One hand holds the flashlight. It never leaves it.</em> The other is
       for the egg. Spare cells keep it alive \u2014 and a thrown cell is the only
       noise you can make on purpose.</p>
    <button class="btn" id="bStart">CLOCK IN</button>
    <div style="color:#6b6656;font-size:10.5px;letter-spacing:2px;margin-top:10px">
      NIGHT ${CAMPAIGN.shift} OF ${CAMPAIGN.last}${CAMPAIGN.eggs ? ' \u00b7 ' + CAMPAIGN.eggs + ' TAKEN' : ''}</div>
    ${CAMPAIGN.shift > 1 ? '<button class="btn ghost" id="bReset">START OVER</button>' : ''}
    <div id="keys">
      ${IS_TOUCH
        ? '<b>LEFT STICK</b> move · <b>DRAG RIGHT</b> look<br><b>TAKE</b> pick up · <b>DROP</b> drop · <b>LIGHT</b> flashlight<br>push the stick to the edge to run'
        : '<b>WSAD</b> move · <b>MOUSE</b> look · <b>SHIFT</b> run · <b>CTRL</b> crouch<br><b>E</b> take · <b>G</b> drop · <b>F</b> flashlight'}
    </div>`);
  $('bStart').onclick = () => { initAudio(); startShift(CAMPAIGN.shift); };
  const rb = $('bReset');
  if (rb) rb.onclick = () => { campaignReset(); showTitle(); };
}

function startShift(n){
  CAMPAIGN.shift = clamp(n, 1, CAMPAIGN.last);
  CAMPAIGN.over = false;
  ENDING.active = false;
  shiftNo = CAMPAIGN.shift;
  n = shiftNo;
  shiftT = CFG.shiftLen;
  P.banked = 0;
  P.quota = 0; P.pay = 0;
  P.alive = true; P.deadT = 0; deadFade = 0;
  P.strikes = 0; P.downed = false; P.downT = 0; P.limpT = 0;
  MON.commit = 0; MON.feedT = 0; MON.suspT = 0; MON.stepT = 0; MON.present = false;
  ROBBED = false; TRAIL.length = 0;
  FRENZY.on = false; FRENZY.t = 0;
  P.hands = [{lamp:true}, null];
  P.pockets = [];
  P.vx = P.vz = 0; P.stam = CFG.stamMax;
  LAMP.on = true; LAMP.battery = 1;
  $('hurt').style.opacity = '0';

  // fresh building every shift
  loot.forEach(it => { if (it.mesh.parent) world.remove(it.mesh); });
  loot.length = 0;
  rebuildLevel();
  scatterLoot(n);
  KNOWS = false;
  SHIFTER.active = false; SHIFTER.t = 0; SHIFTER.changes = 0;
  spawnEgg();
  spawnGate(n);
  spawnPapers();
  spawnHole(n);
  watcherReset(n);
  peekerReset(n);
  REACH.eggT = 0; REACH.gateT = 0;
  spawnFlock();

  const bay = roomOf('bay');
  const c = roomCenter(bay);
  P.x = c.x; P.z = c.z - 3.4;
  P.yaw = 0; P.pitch = -0.05;

  monsterSpawn();
  roosterStop();
  HANDOVER.active = false; HANDOVER.step = 0; HANDOVER.armed = false; HANDOVER.done = false; HANDOVER.waiting = false;
  LOOKAT.on = false;
  refreshHands();

  /* Night six: nothing to find, but you still have to GO there.
     The first version parked the egg eleven metres from the van and started the
     handover on a timer at spawn. That let you stand still for six seconds,
     pick it up, walk to the van and finish before the rooster had even woken —
     the entire finale was skippable by doing nothing, which is exactly what a
     player who has done this five times will do.
     Now the nest stays where spawnEgg put it, deep, with its vigil around it,
     and the handover only begins when you are standing in front of it. The
     rooster wakes there. The whole last night is the walk home. */
  if (isFinalNight() && EGG.mesh){
    EGG.mesh.visible = false; EGG.nest.visible = false;
    HANDOVER.armed = true; HANDOVER.active = false; HANDOVER.step = 0;
    // she is not summoned and she does not walk on. She has been standing over
    // it since before you clocked in, and you find her there.
    // right on top of it, and she will not move from here all night
    handoverShowHer(EGG.x + rnd(-0.5,0.5), EGG.z - 2.0);
  }

  MODE = 'play';
  hideOverlay();
  $('hud').style.display = 'block';
  $('carry').style.display = 'flex';
  $('stam').style.display = 'block';
  $('touch').style.display = IS_TOUCH ? 'block' : 'none';
  if (!IS_TOUCH && cv.requestPointerLock) cv.requestPointerLock();
  subtitle(SHIFT_TEXT[shiftNo] || 'Another egg.', 6.5);
  setTimeout(()=>{ if (MODE==='play') toast(floorPlan(shiftNo).name); }, 900);
}

/* TEST BUILD ONLY. Jump straight to a night, with the campaign state that
   night would normally have — the flock's ritual pool and her boldness both
   read from CAMPAIGN.eggs, so setting the shift without it would give you a
   night six building full of night one birds. */
function jumpToNight(n){
  n = clamp(n, 1, CAMPAIGN.last);
  CAMPAIGN.eggs = n - 1;
  campaignSave();
  roosterStop();
  HANDOVER.active = false; HANDOVER.step = 0;
  startShift(n);
  toast('NIGHT ' + n + ' \u2014 ' + floorPlan(n).name);
}

function endShift(reason){
  MODE = 'summary';
  if (pointerLocked && document.exitPointerLock) document.exitPointerLock();
  $('hud').style.display = 'none';
  $('carry').style.display = 'none';
  $('stam').style.display = 'none';
  $('touch').style.display = 'none';
  $('prompt').style.display = 'none';
  const made = reason === 'out';

  overlay(`
    <h2>${made ? 'YOU GOT OUT' : reason === 'dead' ? 'SHIFT ENDED' : 'THE VAN LEFT'}</h2>
    <p>${made
        ? 'It is warm through the box. Nobody in the cab asks what is in it.'
        : reason === 'dead'
        ? 'They will send another crew. They always do.'
        : 'You were still inside when the engine started. It is very dark now.'}</p>
    <div id="tally">
      <div class="row"><span>THE EGG</span><b>${made ? 'RECOVERED' : 'STILL IN THERE'}</b></div>
      <div class="row"><span>NIGHT</span><b>${shiftNo} OF ${CAMPAIGN.last}</b></div>
      <div class="row"><span>TAKEN SO FAR</span><b>${CAMPAIGN.eggs}</b></div>
      <div class="row"><span>TIMES CAUGHT</span><b>${P.strikes}</b></div>
      <div class="row tot"><span>THE BUILDING MOVED</span><b>${SHIFTER.changes}</b></div>
    </div>

  $('bMenu').onclick  = () => showTitle();

/* rebuild the facility geometry between shifts */
let levelBuilt = false;
/* Bodies that outlive a level.

   Everything in `world` is level geometry and gets thrown away on a rebuild —
   except the handful of things that are built once and reused for the whole
   campaign. Detaching one of those is not a crash and it does not throw: the AI
   keeps running, the pathing keeps working, the sound keeps playing, and there
   is simply nothing on screen. An invisible rooster.

   That is what has been happening since the night the second shift was added.
   The monster was special-cased here from the beginning; the flock got a
   hand-rolled `if (!FLOCK.body.parent)` guard bolted onto its spawn when the
   same thing happened to it. The rooster, the twelve watchers and the peeker
   never got one, so every one of them worked perfectly on the first night it
   appeared and was invisible on every night after — which is precisely the
   report: "sometimes invisible", and "I still cannot see the corner birds".

   One list, so the next thing with a body cannot be forgotten. */
function persistentBodies(){
  const out = [MON.group];
  if (typeof ROO !== 'undefined' && ROO.group) out.push(ROO.group);
  if (typeof WATCH !== 'undefined')
    for (const W of WATCH.list) if (W.group) out.push(W.group);
  if (typeof PEEK !== 'undefined' && PEEK.bird && PEEK.bird.group)
    out.push(PEEK.bird.group);
  if (typeof FLOCK !== 'undefined' && FLOCK.body)
    for (const k of BIRD_PARTS) if (FLOCK[k]) out.push(FLOCK[k]);
  return out.filter(Boolean);
}

function rebuildLevel(){
  if (levelBuilt){
    // drop the level, keep the bodies
    const keep = new Set(persistentBodies());
    for (let i = world.children.length-1; i >= 0; i--){
      const c = world.children[i];
      if (keep.has(c)) continue;
      world.remove(c);
      if (c.dispose) c.dispose();
      if (c.geometry) c.geometry.dispose();
      if (c.traverse) c.traverse(o => { if (o !== c && o.geometry) o.geometry.dispose(); });
    }
    props.length = 0;
  }
  genFacility();
  buildWorld();
  dressDeepRooms();
  levelBuilt = true;
}

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
function frame(now){
  try { frameBody(now); }
  catch(err){ fatal('frame loop', err); return; }   // stop, don't spin on a broken frame
  requestAnimationFrame(frame);
}

function frameBody(now){
  const dt = Math.min(0.05, (now - lastT)/1000 || 0.016);
  lastT = now;

  if (MODE === 'ending'){ updateEnding(dt); renderer.render(scene, camera); return; }

  if (MODE === 'title' || MODE === 'summary'){
    // slow torch-lit pan behind the menu, so the page never reads as "broken black"
    P.yaw += dt * 0.055;
    camera.position.set(P.x, CFG.eyeH, P.z);
    camera.rotation.set(0,0,0);
    camera.rotateY(P.yaw); camera.rotateX(-0.03);
    updateTorch(dt);
  }

  if (MODE === 'play' || MODE === 'dead'){
    if (P.alive){
      movePlayer(dt);
      tryExtract();
      if (CFG.timed){
        shiftT -= dt;
        if (shiftT <= 0){ endShift('time'); }
        if (shiftT < 42 && shiftT > 41.9) subtitle('The van leaves in forty seconds.', 4);
      }
    } else {
      P.deadT += dt;
      deadFade = Math.min(1, deadFade + dt*0.5);
      // the camera sinks and turns to face it
      P.y = lerp(P.y, 0.4, dt*2);
      const want = Math.atan2(MON.x-P.x, MON.z-P.z);
      let d = want-P.yaw; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
      P.yaw += d*Math.min(1,dt*3);
      camera.position.set(P.x,P.y,P.z);
      camera.rotation.set(0,0,0);
      camera.rotateY(P.yaw); camera.rotateX(P.pitch);
      if (P.deadT > 3.2 && MODE !== 'summary') endShift('dead');
    }
    updateTorch(dt);
    updateMonster(dt);
    updateHandover(dt);
    updateRooster(dt);
    updateFrenzy(dt);
    updateFlock(dt);
    updateCheats();
    updateEgg(dt);
    updateShifter(dt);
    updateGate(dt);
    updateReach(dt);
    updateWatcher(dt);
    updatePeeker(dt);
    updateHole(dt, now);
    updateMotes(dt, now);
    updateFX(dt, now);
    updateBeam();
    updateLamps(dt, now);
    updateAudio(dt);
    updateHUD(dt);
  }

  // dressing animation
  for (const p of props){
    if (p.kind === 'fan') p.obj.rotation.z += dt*p.spd;
    else if (p.kind === 'wires') updateWires(p.obj, p.data, now);
    else if (p.kind === 'hangers') updateHangers(p.obj, p.data, now);
    else if (p.kind === 'vanGlow') p.obj.intensity = p.base * (0.92 + Math.sin(now*0.004)*0.08);
    // the beacon still turns: a bright side and a dark side, once a second
    else if (p.kind === 'beacon') p.obj.intensity = p.base * (0.35 + Math.pow(Math.max(0,Math.sin(now*0.0016)),3)*1.9);
    else if (p.kind === 'sodium') p.obj.intensity = p.base * (0.94 + Math.sin(now*0.0021)*0.06);
  }
  updateMarkers(now);
  if (hookMesh){
    const hooks = hookMesh.userData.hooks;
    for (let i=0;i<hooks.length;i++){
      const hk = hooks[i];
      setInst(hookMesh, i, hk.x + Math.sin(now*0.0009 + hk.phase)*hk.amp*8, WALL_H-0.86, hk.z, 1,1,1, 0);
    }
    hookMesh.instanceMatrix.needsUpdate = true;
  }
  for (const it of loot){
    if (!it.held && !it.banked && it.def.big === false) it.mesh.rotation.y += dt*it.spin;
  }

  renderer.render(scene, camera);
}

/* ==========================================================================
   BOOT
   ========================================================================== */
function makeGrain(){
  const s = 96, c = document.createElement('canvas'); c.width=c.height=s;
  const g = c.getContext('2d'), im = g.createImageData(s,s), d = im.data;
  for (let i=0;i<d.length;i+=4){
    const v = Math.random()*255;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  g.putImageData(im,0,0);
  $('grain').style.backgroundImage = 'url('+c.toDataURL()+')';
}

function boot(){
  try { bootInner(); } catch(err){ fatal('boot', err); }
}

function bootInner(){
  campaignLoad();
  buildTextures();
  MENU_VIEW = true;
  buildMaterials();
  makeGrain();
  rebuildLevel();
  buildMonster();
  bindDesktop();
  if (IS_TOUCH) bindTouch();
  // stand in the loading bay with the torch lit so the menu has a backdrop
  const bay0 = roomOf('bay'), c0 = roomCenter(bay0);
  P.x = c0.x; P.z = c0.z - 2.2; P.yaw = 0;
  P.hands = [{lamp:true}, null];
  LAMP.on = true; LAMP.battery = 1;
  showTitle();
  lastT = performance.now();
  requestAnimationFrame(frame);
}
