// ============ ONLINE MODE (Phase 3) ============
const NET_URL="wss://freefowl-server-production.up.railway.app";
let netMode=false, netRoom=null, netBirds=new Map(), netPellets=new Map(), netSendT=0;
let netDir={x:1,y:0,active:false};
const SPCOLOR={Pigeon:"#9aa2ad",Canary:"#f4d03f",Bluebird:"#5dade2",Cardinal:"#e74c3c",
  Yellowtail:"#f5b041",Toucan:"#2c3e50",Crow:"#4d4d59",Eagle:"#a04000",Hawk:"#7c4a1e",Owl:"#7a68a6"};
function netBird(info){
  return { id:info.id, team:info.team, name:info.name, hawk:!!info.hawk, owl:!!info.owl, buddy:!!info.admin,
    species:{n:info.species, c:info.color||SPCOLOR[info.species]||"#9aa2ad"},
    x:0,y:0, nx:0,ny:0, heading:0, nheading:0, carried:0, dead:false,
    dashT:0, streak:0, boostT:0, emote:"", emoteT:0, flap:rand(0,10),
    isPlayer:false, bounty:false, deposited:0,
    vx:0, vy:0, hp:1, maxHp:1 };
}
async function startOnline(){
  try{
    try{ const nm=document.getElementById("nameInput").value; if(nm&&nm.trim()) playerName=nm.trim().slice(0,12); }catch(e){}
    showBanner("Connecting to the flock...");
    const client=new Colyseus.Client(NET_URL);
    let tok=null; try{ const { data:{ session } }=await supa.auth.getSession(); tok=session?session.access_token:null; }catch(e){}
    authSaveProfile();
    netRoom=await client.joinOrCreate("match",
      { name:playerName, color:playerColor, species:SPECIES[selSpecies].n, token:tok });
    netRoom.onMessage("init",(m)=>{
      const w=m.world;
      CFG.worldW=w.cfg.w; CFG.worldH=w.cfg.h; CFG.baseRadius=w.cfg.baseR; CFG.victoryTarget=w.cfg.target;
      bases=w.bases;
      obstacles=w.obstacles.map(o=>({x:o[0],y:o[1],r:o[2],tree:!!o[3]}));
      bushes=w.bushes.map(b=>({x:b[0],y:b[1],r:b[2]}));
      netPellets=new Map(); pellets=[];
      for(const p of w.pellets){ const pl={id:p[0],x:p[1],y:p[2],v:p[3],worm:!!p[4],bloom:false};
        netPellets.set(pl.id,pl); pellets.push(pl); }
      netBirds=new Map(); birds=[];
      for(const info of w.birds){ const b=netBird(info); netBirds.set(b.id,b); birds.push(b); }
      player=netBirds.get(m.you)||birds[0]; player.isPlayer=true;
      if(playerColor) player.species={...player.species, c:playerColor};
      teams=[0,1,2,3].map(()=>({bank:0,total:0,gen:0,mag:0,rally:false,genT:0,grannysBought:0}));
      hunters=[]; grannys=[]; feathers=[]; orbs=[]; floaters=[]; goldenEgg=null;
      suddenDeath=false; nightA=0; hunterMode=false; playerDog=null;
      camX=player.x=bases[player.team].x; camY=player.y=bases[player.team].y;
      netMode=true; started=true; gameOver=false;
      try{ document.getElementById("menu").style.display="none"; }catch(e){}
      showBanner("ONLINE — you are "+player.name+" on "+TEAMNAMES[player.team]);
      sfx.unlock();
    });
    netRoom.onMessage("s",(s)=>{
      timeLeft=s.t; lobbyT=s.lobby;
      nightA=s.night||0;
      suddenDeath=s.sd>0; netSdR=s.sd||0;
      bloomActive=s.bloom?{x:s.bloom[0],y:s.bloom[1],r:s.bloom[2],life:9}:null;
      goldenEgg=s.egg?{x:s.egg[0],y:s.egg[1],holder:s.egg[2]?netBirds.get(s.egg[2]):null}:null;
      for(let i=0;i<4;i++){ const t=s.teams[i];
        teams[i].bank=t[0]; teams[i].total=t[1]; teams[i].gen=t[2]; teams[i].mag=t[3]; teams[i].rally=!!t[4]; }
      // sync our clock to the server's (EMA of offset, jitter-resistant)
      const now=performance.now(), off=now-s.ts;
      if(netTimeOff===null||Math.abs(off-netTimeOff)>400) netTimeOff=off;
      else netTimeOff+=(off-netTimeOff)*0.05;
      for(const row of s.birds){ const b=netBirds.get(row[0]); if(!b) continue;
        if(!b.buf) b.buf=[];
        b.buf.push({t:s.ts, x:row[1], y:row[2], h:row[5]});
        if(b.buf.length>14) b.buf.shift();
        b.carried=row[3];
        const wasDead=b.dead; b.dead=!!row[4];
        if(wasDead&&!b.dead){ b.buf=[{t:s.ts,x:row[1],y:row[2],h:row[5]}]; b.x=row[1]; b.y=row[2];
          if(b===player){ netPX=row[1]; netPY=row[2]; } }
        b.dashT=row[6]?0.2:0; b.streak=row[7]?3:0;
        b.deposited=row[8]||0; b.bounty=!!row[9]; }
      hunters=s.hunters.map(h=>({x:h[0],y:h[1],heading:h[2],dead:!!h[3],
        state:h[4]?"aim":"wander", target:h[4]?{x:h[4],y:h[5]}:null }));
      grannys=s.grannys.map(g=>({x:g[0],y:g[1],team:g[2],
        purse:g[3]?{x:g[3],y:g[4],rot:g[5]}:null }));
      bullets=s.bullets.map(u=>({x:u[0],y:u[1],vx:u[2],vy:u[3]}));
      feathers=s.feathers.map(f=>({x:f[0],y:f[1],team:f[2],life:f[3],ch:f[4]}));
      orbs=s.orbs.map(o=>({x:o[0],y:o[1],v:5,vx:0,vy:0,life:5}));
    });
    netRoom.onMessage("ev",(ev)=>{
      if(ev.t==="feed") feed(ev.html);
      else if(ev.t==="banner") showBanner(ev.msg);
      else if(ev.t==="kill"){
        if(ev.html) feed(ev.html);
        if(ev.loot>0) addFloat(ev.x, ev.y-20, "+"+ev.loot, "#fff");
        if(player && ev.kid===player.id){ sfx.kill();
          const v=netBirds.get(ev.vid);
          showBanner((ev.cause==="⚡"?"DASH STRIKE! ":"Absorbed ")+(v?v.name:"a bird")+"! +"+ev.loot); }
        else if(player && ev.vid===player.id){ sfx.death();
          showBanner(ev.cause==="🔫"?"You got shot! You dropped everything!"
            :ev.cause==="👜"?"BONKED by a granny's purse!"
            :ev.cause==="🌑"?"The dark closed in on you!"
            :"You got taken! Respawning...");} }
      else if(ev.t==="shot"){ if(player && Math.hypot(ev.x-player.x,ev.y-player.y)<1100) sfx.shot(); }
      else if(ev.t==="aim"){ if(player && ev.id===player.id){ showBanner("A HUNTER HAS YOU IN HIS SIGHTS — MOVE!"); sfx.aim(); } }
      else if(ev.t==="bonk"){ if(player && ev.id===player.id) sfx.bonk(); }
      else if(ev.t==="worm"){ if(player && ev.id===player.id){ showBanner("Worm! +50 seeds & 10s speed boost!"); sfx.worm(); } }
      else if(ev.t==="egg"){ if(player && ev.id===player.id) sfx.egg(); }
      else if(ev.t==="avenge"){ if(player && ev.id===player.id){ showBanner("Avenged a fallen teammate! +30 seeds"); sfx.deposit(); } }
      else if(ev.t==="revive"){ if(player && ev.id===player.id){ showBanner("Teammate revived!"); sfx.egg(); } }
      else if(ev.t==="hko"){ if(player && ev.id===player.id){ showBanner("HUNTER DOWN! Grab the bounty!"); sfx.kill(); } }
      else if(ev.t==="pellet+"){ const p=ev.p, pl={id:p.id,x:p.x,y:p.y,v:p.v,worm:!!p.worm,bloom:false};
        netPellets.set(pl.id,pl); pellets.push(pl); }
      else if(ev.t==="pellet-"){ const pl=netPellets.get(ev.id);
        if(pl){ netPellets.delete(ev.id); const i=pellets.indexOf(pl); if(i>=0) pellets.splice(i,1); } }
      else if(ev.t==="bird"){ const b=netBirds.get(ev.id);
        if(b){ if(ev.admin!==undefined) b.buddy=!!ev.admin; }
        if(b&&b!==player){ b.name=ev.name;
          if(ev.species) b.species={n:ev.species, c:ev.color||SPCOLOR[ev.species]||"#9aa2ad"}; } }
      else if(ev.t==="gameover"){ gameOver=true;
        try{ if(authUser&&player){
          const mxp=Math.round(player.deposited*0.5 + (ev.winner===player.team?200:50));
          meta.xp=(meta.xp||0)+mxp; saveMeta(); authSaveProfile();
          document.getElementById("ovXp").textContent="+"+mxp+" XP"; } }catch(e){}
        try{ const ov=document.getElementById("overlay");
          document.getElementById("ovTitle").textContent=TEAMNAMES[ev.winner]+" WINS!";
          document.getElementById("ovTitle").style.color=TEAMCOL[ev.winner];
          document.getElementById("ovText").textContent=ev.totals.map((v,i)=>TEAMNAMES[i]+" "+v).join(" \u2022 ");
          document.getElementById("ovAwards").innerHTML=(ev.awards||[]).join("<br>");
          document.getElementById("ovXp").textContent="";
          ov.style.display="flex"; }catch(e){} }
    });
    netRoom.onMessage("emote",(m)=>{ const b=netBirds.get(m.id); if(b&&b!==player) setEmote(b,m.e); });
    netRoom.onLeave(()=>{ if(netMode){ showBanner("Disconnected from server"); } });
  }catch(e){ showBanner("Could not reach the server \u2014 try again"); console.error(e); }
}
let netSdR=0, netLastCarried=0, netDepAcc=0, netDepT=0, netTimeOff=null, netPX=null, netPY=null, netMyDash=0;
function netFrame(dt){
  if(!player) return;
  for(const f of floaters){ f.life-=dt; f.y-=42*dt; }
  floaters=floaters.filter(f=>f.life>0);
  // own-deposit feedback: carried dropping while at our nest = banking
  const drop=netLastCarried-player.carried;
  if(drop>0 && bases[player.team] && dist2(player,bases[player.team])<CFG.baseRadius*CFG.baseRadius){
    netDepAcc+=drop; }
  netLastCarried=player.carried;
  netDepT+=dt;
  if(netDepT>0.7){ if(netDepAcc>2){
      addFloat(player.x, player.y-radiusFor(player.carried)-16, "+"+Math.round(netDepAcc)+" BANKED", "#ffd84a");
      sfx.deposit(); }
    netDepAcc=0; netDepT=0; }
  // interpolate every bird on the SERVER clock, rendered 120ms in the past —
  // network jitter disappears into the buffer instead of into the motion
  const rt=(netTimeOff!==null)?(performance.now()-netTimeOff-120):null;
  for(const b of netBirds.values()){
    const buf=b.buf;
    if(rt!==null&&buf&&buf.length){
      while(buf.length>2&&buf[1].t<rt-400) buf.shift();
      let s0=buf[0], s1=buf[buf.length-1];
      for(let i=0;i<buf.length-1;i++)
        if(buf[i].t<=rt&&rt<=buf[i+1].t){ s0=buf[i]; s1=buf[i+1]; break; }
      let a;
      if(rt<=buf[0].t){ s0=s1=buf[0]; a=0; }
      else if(rt>=buf[buf.length-1].t){ // extrapolate briefly, then hold
        if(buf.length>=2){ s0=buf[buf.length-2]; s1=buf[buf.length-1];
          a=Math.min((rt-s0.t)/Math.max(1,s1.t-s0.t), 1+100/Math.max(1,s1.t-s0.t)); }
        else a=0; }
      else a=(rt-s0.t)/Math.max(1,s1.t-s0.t);
      b.x=s0.x+(s1.x-s0.x)*a; b.y=s0.y+(s1.y-s0.y)*a;
      let dh=s1.h-s0.h;
      while(dh>Math.PI) dh-=Math.PI*2; while(dh<-Math.PI) dh+=Math.PI*2;
      b.heading=s0.h+dh*Math.max(0,Math.min(1,a)); }
    b.flap+=dt*6; b.emoteT=Math.max(0,(b.emoteT||0)-dt);
  }
  // own bird: client-side prediction — moves the INSTANT you swipe,
  // then reconciles gently toward the server's truth
  if(player&&!player.dead){
    if(netPX===null){ netPX=player.x; netPY=player.y; }
    let sp=speedFor(radiusFor(player.carried));
    if(netMyDash>0){ netMyDash-=dt; sp*=2.6; }
    if(teams[player.team]&&teams[player.team].rally) sp*=1.10;
    if(player.streak>=3) sp*=1.08;
    if(goldenEgg&&goldenEgg.holder===player) sp*=0.7;
    let mdx=0,mdy=0,act=false;
    if(ptr.active){
      if(ptr.isTouch){ if(ptr.hasDir){ mdx=ptr.dirX; mdy=ptr.dirY; act=true; } }
      else { const w=toWorld(ptr.x,ptr.y); const dx=w.x-netPX, dy=w.y-netPY;
        const l=Math.hypot(dx,dy); if(l>10){ mdx=dx/l; mdy=dy/l; act=true; } } }
    if(act){ netPX+=mdx*sp*dt; netPY+=mdy*sp*dt;
      player.heading=Math.atan2(mdy,mdx); }
    netPX=Math.max(15,Math.min(CFG.worldW-15,netPX));
    netPY=Math.max(15,Math.min(CFG.worldH-15,netPY));
    const rr=radiusFor(player.carried);
    for(const ob of obstacles){ const dx=netPX-ob.x, dy=netPY-ob.y, d=Math.hypot(dx,dy), min=ob.r+rr*0.6;
      if(d<min&&d>0){ netPX=ob.x+dx/d*min; netPY=ob.y+dy/d*min; } }
    // reconcile toward the server's interpolated position
    const k=Math.min(1, dt*(act?2.5:6));
    netPX+=(player.x-netPX)*k; netPY+=(player.y-netPY)*k;
    player.x=netPX; player.y=netPY;
  } else { netPX=null; }
  // camera
  zoom+=(1-zoom)*Math.min(1,dt*3);
  camX+=(player.x-camX)*Math.min(1,dt*5); camY+=(player.y-camY)*Math.min(1,dt*5);
  const hw=VW/(2*zoom), hh=VH/(2*zoom);
  camX=Math.max(Math.min(hw,CFG.worldW/2),Math.min(CFG.worldW-hw,camX));
  camY=Math.max(Math.min(hh,CFG.worldH/2),Math.min(CFG.worldH-hh,camY));
  // send input at ~15Hz
  netSendT-=dt;
  if(netSendT<=0 && netRoom){ netSendT=0.066;
    let dx=0,dy=0,active=false;
    if(ptr.active){
      if(ptr.isTouch){ if(ptr.hasDir){ dx=ptr.dirX; dy=ptr.dirY; active=true; } }
      else { const w=toWorld(ptr.x,ptr.y); dx=w.x-player.x; dy=w.y-player.y;
        const l=Math.hypot(dx,dy); if(l>10){ dx/=l; dy/=l; active=true; } } }
    if(active){ netDir.x=dx; netDir.y=dy; }
    netRoom.send("i",{dx:netDir.x,dy:netDir.y,active});
  }
}
try{
  document.getElementById("onlineBtn").addEventListener("pointerdown",e=>{ e.preventDefault(); startOnline(); });
}catch(e){}
// ============ LOOP ============
let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(netMode) netFrame(dt); else update(dt);
  hud(dt); render(); requestAnimationFrame(loop); }
reset(); requestAnimationFrame(loop);
</script>
</body>
