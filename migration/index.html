<script>
'use strict';
/* ============================================================
   THE LONG MIGRATION — Act I  (Free Fowl universe, canon origin)
   Tone: serious, thematic. Never break it.
   ============================================================ */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){ W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize', resize); resize();
const vw = () => innerWidth, vh = () => innerHeight;

/* ---------------- audio: mp3 theme (if provided) + synth fallback + SFX ---------------- */
function hash(s){ let h=0; for (let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
const AU = { ctx:null, on:true, nodes:[], intensity:.35, mp3:null, hasMp3:false, sfx:{} };
/* theme.mp3 is decoded into WebAudio directly — no <audio> element, which
   iOS Safari blocks unpredictably. If the synth plays, this plays. */
function loadTheme(){ if (AU.themeBuf || AU.themeLoading || typeof fetch==='undefined') return;
  AU.themeLoading = true;
  fetch('audio/theme.mp3')
    .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(buf => { AU.ctx.decodeAudioData(buf,
        ab => { AU.themeBuf = ab; themeStart(); }, ()=>{}); })
    .catch(()=>{});
}
function themeStart(){ if (!AU.ctx || AU.themeSrc || !AU.themeBuf) return;
  const a = AU.ctx, s = a.createBufferSource(); s.buffer = AU.themeBuf; s.loop = true;
  const g = a.createGain(); g.gain.value = 0;
  s.connect(g); g.connect(a.destination); s.start();
  AU.themeSrc = s; AU.themeGain = g; AU.mp3Active = true;
  AU.nodes.forEach(n => n.gn.gain.linearRampToValueAtTime(0, a.currentTime+2));
  if (AU.melT){ clearInterval(AU.melT); AU.melT = null; }
  AU.mp3fade = setInterval(()=>{ const tgt = AU.on ? .28+AU.intensity*.5 : 0;
    g.gain.value += (tgt-g.gain.value)*.08; }, 120);
}
function auInit(){ if (AU.ctx || !AU.on) return;
  try { AU.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ AU.on=false; return; }
  const a = AU.ctx; if (a.state === 'suspended') a.resume();
  const master = a.createGain(); master.gain.value = 0; master.connect(a.destination);
  AU.master = master;
  // noise buffer for wind/crackle/ui
  const nb = a.createBuffer(1, a.sampleRate*2, a.sampleRate), d = nb.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  AU.noise = nb;
  // quiet synth pad covers the seconds while the theme downloads, then fades out
  [[110,.07],[164.8,.05],[220,.04],[329.6,.022]].forEach(([f,g])=>{
    const o = a.createOscillator(), o2 = a.createOscillator(), gn = a.createGain();
    o.type='sine'; o2.type='sine'; o.frequency.value=f; o2.frequency.value=f*1.004;
    gn.gain.value=g; o.connect(gn); o2.connect(gn); gn.connect(master);
    o.start(); o2.start(); AU.nodes.push({o,o2,gn,f,g}); });
  const lfo = a.createOscillator(), lg = a.createGain();
  lfo.frequency.value = .08; lg.gain.value = .3; lfo.connect(lg); lg.connect(master.gain); lfo.start();
  AU.melN = 0; AU.melT = setInterval(()=>{ if (!AU.on || !AU.ctx) return;
    const scale = AU.intensity>.6 ? [440,523.25,466.16,392,349.23] : [440,523.25,587.33,659.25,523.25];
    const f = scale[AU.melN++ % scale.length];
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type='sine'; o.frequency.value = f/2;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.03+AU.intensity*.03, t+.6);
    g.gain.exponentialRampToValueAtTime(.001, t+3.4);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+3.5); }, 3800);
  loadTheme();
  master.gain.linearRampToValueAtTime(1, a.currentTime + 3);
  auScene(scene);
}
function auTheme(intensity){ AU.intensity = intensity; if (!AU.ctx || AU.mp3Active) return;
  const a = AU.ctx;
  AU.nodes.forEach((n,i)=>{ const mult = intensity>.6 ? [1,1.189,2,2.378][i] : [1,1.498,2,2.996][i];
    n.o.frequency.linearRampToValueAtTime(110*mult, a.currentTime+3);
    n.o2.frequency.linearRampToValueAtTime(110*mult*1.004, a.currentTime+3);
    n.gn.gain.linearRampToValueAtTime(n.g*(0.5+intensity*.9), a.currentTime+3); });
}
function noiseVoice(filterType, freq, gain){ const a = AU.ctx;
  const src = a.createBufferSource(); src.buffer = AU.noise; src.loop = true;
  const f = a.createBiquadFilter(); f.type = filterType; f.frequency.value = freq;
  const g = a.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(AU.master); src.start();
  return { src, f, g };
}
function auScene(sc){ if (!AU.ctx || !AU.on) return;
  // stop old extras
  Object.values(AU.sfx).forEach(v=>{ try{ v.src ? v.src.stop() : clearInterval(v); }catch(e){} });
  AU.sfx = {};
  if (sc === 'burn'){ AU.sfx.wind = noiseVoice('lowpass', 220, .03);
    AU.sfx.crk = setInterval(()=>{ const a = AU.ctx, t = a.currentTime + Math.random()*.3;
      const s = a.createBufferSource(); s.buffer = AU.noise;
      const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value = 900+Math.random()*1600;
      const g = a.createGain(); g.gain.setValueAtTime(.03+Math.random()*.035, t);
      g.gain.exponentialRampToValueAtTime(.001, t+.06);
      s.connect(f); f.connect(g); g.connect(AU.master); s.start(t); s.stop(t+.08); }, 150); }
  else if (sc === 'dogs' || sc === 'hunter'){ AU.sfx.wind = noiseVoice('lowpass', 160, .035);
    AU.sfx.bark = setInterval(()=>{ if (Math.random()<.5) return;
      const a = AU.ctx, t = a.currentTime;
      for (let i=0;i<2;i++){ const o = a.createOscillator(), g = a.createGain();
        o.type='sawtooth'; o.frequency.setValueAtTime(260-i*40, t+i*.18);
        o.frequency.exponentialRampToValueAtTime(140, t+i*.18+.12);
        const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 380;
        g.gain.setValueAtTime(.025, t+i*.18); g.gain.exponentialRampToValueAtTime(.001, t+i*.18+.14);
        o.connect(f); f.connect(g); g.connect(AU.master); o.start(t+i*.18); o.stop(t+i*.18+.16); } }, 4200); }
  else if (sc === 'camp'){ AU.sfx.wind = noiseVoice('lowpass', 190, .022);
    AU.sfx.crk = setInterval(()=>{ const a = AU.ctx, t = a.currentTime + Math.random()*.4;
      const s = a.createBufferSource(); s.buffer = AU.noise;
      const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value = 800+Math.random()*1200;
      const g = a.createGain(); g.gain.setValueAtTime(.02+Math.random()*.02, t);
      g.gain.exponentialRampToValueAtTime(.001, t+.05);
      s.connect(f); f.connect(g); g.connect(AU.master); s.start(t); s.stop(t+.07); }, 260); }
  else { AU.sfx.wind = noiseVoice('lowpass', 260, .025); }
}
function uiTick(){ if (!AU.ctx || !AU.on) return; const a = AU.ctx, t = a.currentTime;
  const s = a.createBufferSource(); s.buffer = AU.noise;
  const f = a.createBiquadFilter(); f.type='highpass'; f.frequency.value = 2400;
  const g = a.createGain(); g.gain.setValueAtTime(.045, t); g.gain.exponentialRampToValueAtTime(.001, t+.05);
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(t); s.stop(t+.06);
}
function murmur(name){ if (!AU.ctx || !AU.on) return;
  const a = AU.ctx, base = 620 + (hash(name)%9)*55, n = 2 + hash(name+'c')%3;
  for (let i=0;i<n;i++){
    const t = a.currentTime + i*.16 + Math.random()*.04;
    const o = a.createOscillator(), g = a.createGain(), v = a.createOscillator(), vg = a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(base*(1+Math.random()*.08), t);
    o.frequency.linearRampToValueAtTime(base*.86, t+.14);
    v.frequency.value = 22; vg.gain.value = base*.02; v.connect(vg); vg.connect(o.frequency); v.start(t); v.stop(t+.16);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.015,t+.03);
    g.gain.exponentialRampToValueAtTime(.001,t+.15);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.16);
  }
}
$('muteBtn').onclick = () => { AU.on = !AU.on; $('muteBtn').textContent = AU.on?'♪':'∅';
  if (AU.master) AU.master.gain.value = AU.on?1:0;
  if (AU.themeGain && !AU.on) AU.themeGain.gain.value = 0; };

/* ---------------- portraits: Flow art if present, code-drawn fallback ---------------- */
const PAL = {
  'Kevin':   { c:'#4a7fb5', sz:1.0,  f:'crest' },
  'Gertie':  { c:'#b5884a', sz:.95,  f:'soft' },
  'Waddles': { c:'#7d8590', sz:1.28, f:'round' },
  'Pip':     { c:'#58a86a', sz:.8,   f:'tuft' },
  'Mabel':   { c:'#a05a78', sz:.95,  f:'soft' },
  'Dot':     { c:'#e0c060', sz:.58,  f:'chick' },
  'Otis':    { c:'#9aa2ad', sz:1.05, f:'brows' },
  'Hazel':   { c:'#c07840', sz:.9,   f:'keen' },
  'Bram':    { c:'#5a4a68', sz:1.1,  f:'crest' },
  'Reed':    { c:'#6a8a70', sz:.9,   f:'lean' },
  'Cleo':    { c:'#d06060', sz:.9,   f:'song' },
  'Finn':    { c:'#4a9aa8', sz:.95,  f:'lean' },
  'Old Marra': { c:'#ded6c0', sz:1.0, f:'brows' },
};
const ART = {}, ARTT = {}; // base + talking portraits: Flow art (jpg) if present
Object.keys(PAL).forEach(n => { const file = (n==='Old Marra'?'marra':n.toLowerCase());
  const img = new Image();
  img.onload  = () => { ART[n] = img; };
  img.onerror = () => { ART[n] = null; };
  img.src = 'art/' + file + '.jpg';
  const tk = new Image();
  tk.onload  = () => { ARTT[n] = tk; };
  tk.onerror = () => { ARTT[n] = null; };
  tk.src = 'art/' + file + '_talk.jpg'; });
const TITLE_ART = new Image(); let titleArtOk = false;
TITLE_ART.onload = () => { titleArtOk = true; }; TITLE_ART.onerror = ()=>{};
TITLE_ART.src = 'art/title.png';
const HUNTER_ART = new Image(); let hunterArtOk = false;
HUNTER_ART.onload = () => { hunterArtOk = true; }; HUNTER_ART.onerror = ()=>{};
HUNTER_ART.src = 'art/hunter.jpg';
/* cutscene videos (10s loops) — fall back to code-drawn scene if absent */
const CUTVIDS = { burn:'burning.mp4', fall:'falling.mp4', vow:'vow.mp4', hunter:'hunter.mp4' };
const cutVid = $('cutVid'); let curVid = '', vidDead = {};
if (cutVid) cutVid.onerror = () => { vidDead[curVid] = true; cutVid.style.display = 'none'; };
function setCutVid(sc){ if (!cutVid) return;
  const v = MODE==='cut' ? CUTVIDS[sc] : null;
  if (v && !vidDead[v]){
    if (curVid !== v){ curVid = v; cutVid.src = 'art/' + v; }
    cutVid.style.display = 'block';
    if (cutVid.play){ const p = cutVid.play(); if (p && p.catch) p.catch(()=>{}); }
  } else { cutVid.style.display = 'none'; if (cutVid.pause) try{ cutVid.pause(); }catch(e){} }
}

function codePortrait(name, px){ const p = PAL[name] || { c:'#8a8a7a', sz:1, f:'soft' };
  const c = document.createElement('canvas'); c.width = c.height = px;
  const x = c.getContext('2d'), m = px/2;
  const g = x.createRadialGradient(m, m*.8, px*.1, m, m, m);
  g.addColorStop(0,'#232a36'); g.addColorStop(1,'#12161c');
  x.fillStyle = g; x.fillRect(0,0,px,px);
  const s = px*.3*p.sz;
  x.fillStyle = shade(p.c,-25); x.beginPath(); x.ellipse(m, m*1.35, s*1.15, s*.95, 0, 0, 7); x.fill(); // breast
  x.fillStyle = p.c; x.beginPath(); x.arc(m, m*.85, s*.72, 0, 7); x.fill(); // head
  x.fillStyle = shade(p.c,18); x.beginPath(); x.ellipse(m, m*1.42, s*.6, s*.5, 0, 0, 7); x.fill(); // belly light
  x.fillStyle = '#e8a03a'; x.beginPath(); // beak
  x.moveTo(m+s*.55, m*.85); x.lineTo(m+s*1.05, m*.92); x.lineTo(m+s*.55, m*1.02); x.fill();
  x.fillStyle = '#f4efe2'; x.beginPath(); x.arc(m+s*.25, m*.75, s*.2, 0, 7); x.fill(); // eye
  x.fillStyle = '#181410'; x.beginPath(); x.arc(m+s*.31, m*.75, s*.1, 0, 7); x.fill();
  x.strokeStyle = shade(p.c,-35); x.lineWidth = Math.max(1,px*.015); // wing hint
  x.beginPath(); x.moveTo(m-s*.9, m*1.25); x.quadraticCurveTo(m-s*.2, m*1.5, m+s*.4, m*1.35); x.stroke();
  if (p.f==='brows'){ x.strokeStyle='#e5e0d2'; x.lineWidth=px*.03;
    x.beginPath(); x.moveTo(m+s*.05, m*.6); x.lineTo(m+s*.45, m*.66); x.stroke(); }
  if (p.f==='tuft'||p.f==='crest'){ x.strokeStyle=shade(p.c,-20); x.lineWidth=px*.025;
    for (let i=0;i<3;i++){ x.beginPath(); x.moveTo(m-s*.15+i*s*.15, m*.85-s*.7);
      x.quadraticCurveTo(m-s*.1+i*s*.15, m*.85-s*1.05, m+i*s*.18, m*.85-s*.95); x.stroke(); } }
  if (p.f==='chick'){ x.strokeStyle=shade(p.c,25); x.lineWidth=px*.02;
    for (let i=0;i<5;i++){ x.beginPath(); const a0=-1.4+i*.35;
      x.moveTo(m+Math.cos(a0)*s*.7, m*.85+Math.sin(a0)*s*.7);
      x.lineTo(m+Math.cos(a0)*s*.95, m*.85+Math.sin(a0)*s*.95); x.stroke(); } }
  if (p.f==='song'){ x.fillStyle='#e8a03a'; x.beginPath(); // open beak
    x.moveTo(m+s*.55, m*.78); x.lineTo(m+s*1.1, m*.68); x.lineTo(m+s*.6, m*.9); x.fill(); }
  return c;
}
function shade(hex, amt){ const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,Math.min(255,(n>>16)+amt)), g = Math.max(0,Math.min(255,((n>>8)&255)+amt)),
        b = Math.max(0,Math.min(255,(n&255)+amt));
  return 'rgb('+r+','+g+','+b+')'; }
function portraitEl(name, small, talk){ let el;
  const src = (talk && ARTT[name]) ? ARTT[name] : ART[name];
  if (src){ el = document.createElement('img'); el.src = src.src; }
  else el = codePortrait(name, small?104:152);
  el.className = 'pf' + (small?' small':'');
  const b = S && byName(name);
  if (b && (b.hurt>0 || S.hope<30)) el.style.filter = 'saturate(.55) brightness(.8)';
  return el;
}
function animPortrait(name, small){ const el = portraitEl(name, small);
  if (el.tagName === 'IMG' && ART[name] && ARTT[name]){ let k = 0;
    const iv = setInterval(() => { k++;
      el.src = (k%2 ? ARTT[name] : ART[name]).src;
      if (k > 7){ clearInterval(iv); el.src = ART[name].src; } }, 170); }
  return el;
}

function adapt(){ // adaptive difficulty: -1 merciful … +1 harsh
  const a = alive().length, frac = a/12, h = S.hope/100, sd = Math.min(1,S.seeds/60);
  return Math.max(-1, Math.min(1, (frac-.6)*1.5 + (h-.5) + (sd-.5) - S.mercies*.15));

/* ---------------- painterly scene renderer ---------------- */
/* scenes: 'burn' 'fall' 'vow' 'ash' 'plains' 'dusk' 'dogs' 'stone' */
let t0 = performance.now(), scroll = 0;
function sky(top, mid, bot){ const g = ctx.createLinearGradient(0,0,0,vh());
  g.addColorStop(0,top); g.addColorStop(.55,mid); g.addColorStop(1,bot);
  ctx.fillStyle = g; ctx.fillRect(0,0,vw(),vh()); }
function ridge(yBase, amp, col, seed, sc){ ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(0,vh());
  for (let x=0;x<=vw();x+=14){ const p = (x+scroll*sc+seed)*.006;
    ctx.lineTo(x, yBase - Math.abs(Math.sin(p)*amp + Math.sin(p*2.7)*amp*.4)); }
  ctx.lineTo(vw(),vh()); ctx.closePath(); ctx.fill(); }
function trees(yBase, col, seed, sc, burnt){ ctx.fillStyle = col;
  for (let x=-40;x<vw()+40;x+=52){ const wx = x - (scroll*sc+seed)%52;
    const hgt = 26 + (hash('t'+Math.round((x+scroll*sc+seed)/52))%28);
    if (burnt){ ctx.fillRect(wx, yBase-hgt, 3, hgt);
      ctx.fillRect(wx-6, yBase-hgt*.7, 6, 2); ctx.fillRect(wx+3, yBase-hgt*.5, 7, 2); }
    else { ctx.beginPath(); ctx.moveTo(wx, yBase); ctx.lineTo(wx+9, yBase-hgt); ctx.lineTo(wx+18, yBase); ctx.fill(); }
  } }
function bird(x, y, s, flap, col){ ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.2, s*.16);
  ctx.lineCap = 'round'; const w = Math.sin(flap)* s*.7; ctx.beginPath();
  ctx.moveTo(x - s, y - w); ctx.quadraticCurveTo(x - s*.3, y, x, y);
  ctx.quadraticCurveTo(x + s*.3, y, x + s, y - w); ctx.stroke(); }
function flock(cx, cy, s, time, col, count){ const n = count===undefined?9:count;
  bird(cx, cy, s, time*7, col);
  for (let i=1;i<=Math.floor(n/2);i++){
    bird(cx - i*s*1.8, cy + i*s*1.2, s*.85, time*7 + i*.8, col);
    if (i*2 <= n-1) bird(cx + i*s*1.8 - s*.4, cy + i*s*1.2, s*.85, time*7 + i*.9+.4, col); } }
function flockRoster(cx, cy, s, time){ // each living bird drawn distinct: size, tint, flap, raggedness
  const list = S ? alive() : [];
  if (!list.length){ flock(cx, cy, s, time, 'rgba(14,12,10,.9)'); return; }
  list.forEach((b, idx) => { const p = PAL[b.n] || {c:'#20242c', sz:1};
    const side = idx===0 ? 0 : (idx%2===1 ? -1 : 1), row = Math.ceil(idx/2);
    const px = cx + side*row*s*1.45 - (side===1?s*.35:0),
          py = cy + row*s*1.0 + Math.sin(time*1.3 + idx*1.1)*2;
    const rag = b.hurt>0 ? .55 : 1;
    const flapRate = (7 + (hash(b.n)%3)) * (b.n==='Waddles'?.8:1) * (b.n==='Dot'?1.35:1);
    const jitter = b.hurt>0 ? Math.sin(time*13+idx)*2.5 : 0;
    const col = 'rgba(' + [Math.round(14+parseInt(p.c.slice(1,3),16)*.14),
      Math.round(12+parseInt(p.c.slice(3,5),16)*.14),
      Math.round(10+parseInt(p.c.slice(5,7),16)*.14)].join(',') + ',.92)';
    bird(px, py + jitter, s*1.05*p.sz, time*flapRate + idx*.7, col);
    if (rag<1){ ctx.strokeStyle = 'rgba(200,140,90,.35)'; ctx.lineWidth = 1; // faint strain mark
      ctx.beginPath(); ctx.arc(px, py-6, 2, 0, 7); ctx.stroke(); }
  });
}
/* ambient sky life during flight: no interaction, pure atmosphere */
let ambType = null, ambStart = 0, ambNextAt = 14;
function ambient(time){
  if (!ambType && time > ambNextAt){
    ambType = ['geese','heron','lights'][Math.floor(Math.random()*3)]; ambStart = time; }
  if (!ambType) return;
  const el = time - ambStart;
  if (el > 13){ ambType = null; ambNextAt = time + 20 + Math.random()*24; return; }
  if (ambType === 'geese'){ // a stranger V, heading the other way, high and small
    const x = -80 + el*95, y = vh()*.14 + Math.sin(el*.8)*6;
    for (let i=0;i<5;i++)
      bird(x - i*11, y + Math.abs(i-2)*5, 4.5, time*10 + i, 'rgba(24,26,32,.5)');
  } else if (ambType === 'heron'){ // one great slow bird, lower, unbothered
    bird(vw()+70 - el*52, vh()*.52 + Math.sin(el*.6)*8, 15, time*2.1, 'rgba(28,30,38,.4)');
  } else { // far town lights near the ground, drifting past
    const x0 = vw()+50 - el*70;
    for (let i=0;i<6;i++){ const lx = x0 + i*16 + (i%3)*7, ly = vh()*.93 + (i%2)*5;
      ctx.globalAlpha = .35 + Math.sin(time*3 + i)*.15;
      ctx.fillStyle = '#ffce8a'; ctx.fillRect(lx, ly, 2.4, 2.4); }
    ctx.globalAlpha = 1;
  }
}
function embers(n, time){ ctx.fillStyle = 'rgba(255,150,60,.7)';
  for (let i=0;i<n;i++){ const p = hash('e'+i), x = (p%vw()) + Math.sin(time*.7+i)*30,
    y = vh() - ((time*26 + p%700) % (vh()*1.1));
    ctx.globalAlpha = .25 + (p%50)/100; ctx.fillRect(x, y, 2, 2); }
  ctx.globalAlpha = 1; }
function stars(n){ ctx.fillStyle = '#cfd6e4';
  for (let i=0;i<n;i++){ const p = hash('s'+i);
    ctx.globalAlpha = .2 + (p%60)/100; ctx.fillRect(p%vw(), (p>>3)%(vh()*.5), 1.5, 1.5); }
  ctx.globalAlpha = 1; }

function coverImg(img){ const iw = img.width||1, ih = img.height||1,
    sc = Math.max(vw()/iw, vh()/ih), w = iw*sc, h = ih*sc;
  ctx.drawImage(img, (vw()-w)/2, (vh()-h)/2, w, h); }
const SCENES = {
  burn(time){
    if (titleArtOk && MODE==='title'){ coverImg(TITLE_ART);
      embers(40,time); flock(vw()*.62, vh()*.3 + Math.sin(time)*6, 10, time, 'rgba(10,7,5,.85)', 12);
      return; }
    sky('#1a0f0e','#5c2415','#c4571e');
    embers(60,time);
    ridge(vh()*.8, 60, '#140a08', 0, .1); trees(vh()*.97, '#0d0605', 40, .2, true);
    ctx.fillStyle = 'rgba(255,120,30,.14)'; ctx.beginPath();
    ctx.arc(vw()*.5, vh()*1.05, vh()*.5 + Math.sin(time*2)*14, 0, 7); ctx.fill();
    flock(vw()*.62, vh()*.32 + Math.sin(time)*6, 11, time, '#0e0806', 13); },
  fall(time){ sky('#2a2f38','#454b55','#6a6a63');
    ridge(vh()*.85, 40, '#23262c', 300, .05);
    flock(vw()*.6, vh()*.3, 10, time, '#181a1e', 12);
    const fy = vh()*.35 + (time%4)*vh()*.14;
    bird(vw()*.38, fy, 9, time*2.4, '#181a1e');
    ctx.strokeStyle = 'rgba(232,226,212,.35)'; ctx.lineWidth = 1;
    for (let i=0;i<3;i++){ const yy = fy - 30 - i*26 + Math.sin(time*3+i)*6;
      ctx.beginPath(); ctx.moveTo(vw()*.38 - 8, yy); ctx.quadraticCurveTo(vw()*.38, yy+5, vw()*.38+8, yy); ctx.stroke(); } },
  vow(time){ sky('#141c2a','#3a3f52','#8a6a55');
    stars(70); ridge(vh()*.86, 60, '#10141d', 800, .04);
    ctx.strokeStyle = '#0c0f15'; ctx.lineWidth = 5; ctx.beginPath();
    ctx.moveTo(0, vh()*.72); ctx.bezierCurveTo(vw()*.3, vh()*.66, vw()*.7, vh()*.7, vw(), vh()*.62); ctx.stroke();
    for (let i=0;i<11;i++){ const bx = vw()*.14 + i*vw()*.07,
      by = vh()*.7 - Math.sin((bx/vw())*3)*vh()*.03 - 7;
      ctx.fillStyle = '#0c0f15'; ctx.beginPath(); ctx.ellipse(bx, by, 6, 8, 0, 0, 7); ctx.fill(); }
    ctx.fillStyle = 'rgba(200,160,90,.12)'; ctx.beginPath();
    ctx.arc(vw()*.78, vh()*.2, 60 + Math.sin(time)*4, 0, 7); ctx.fill(); },
  flight(time){ // main travel scene — burns fade behind, plains ahead
    const prog = Math.min(1, S ? S.dist/S.distGoal : 0);
    const dusk = S && S.day % 3 === 0;
    if (prog < .25) sky('#241412','#6b3a20','#a86a3a');
    else if (dusk)  sky('#1b2233','#54425a','#c07a50');
    else            sky('#33455e','#7a8aa0','#cdb98f');
    if (prog < .25) embers(24, time);
    ridge(vh()*.72, 90, prog<.25?'#1d1210':'#2c3648', 100, .3);
    ridge(vh()*.84, 60, prog<.25?'#140b09':'#1e2634', 500, .55);
    trees(vh()*.99, prog<.25?'#0d0705':'#141a24', 900, .9, prog<.25);
    // memorial stones from past runs
    stones().forEach(st => { const sx = (st.dist/100)*S.distGoal, dx = (sx - S.dist)*30 + vw()*.5;
      if (dx>-40 && dx<vw()+40){ ctx.fillStyle = '#3a4152';
        ctx.beginPath(); ctx.moveTo(dx-7,vh()*.985); ctx.lineTo(dx,vh()*.985-16); ctx.lineTo(dx+7,vh()*.985); ctx.fill();
        ctx.fillStyle = 'rgba(232,226,212,.5)'; ctx.font = '10px Georgia'; ctx.textAlign='center';
        ctx.fillText(st.name, dx, vh()*.985-22); } });
    ambient(time);
    flockRoster(vw()*.44, vh()*.34 + Math.sin(time*.9)*8, 13, time); },
  camp(time){ sky('#0d1420','#162032','#243048');
    stars(80); ridge(vh()*.8, 50, '#0b1018', 420, .02);
    trees(vh()*.99, '#070a10', 620, 0, false);
    const fx = vw()*.5, fy = vh()*.86, flick = .85 + Math.sin(time*9)*.08 + Math.sin(time*23)*.05;
    const g = ctx.createRadialGradient(fx, fy, 4, fx, fy, 120*flick);
    g.addColorStop(0,'rgba(255,190,90,.55)'); g.addColorStop(.4,'rgba(230,120,40,.22)');
    g.addColorStop(1,'rgba(230,120,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, 130, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffcf7a'; for (let i=0;i<4;i++){ const a = time*2+i*1.7;
      ctx.globalAlpha = .5+Math.sin(a)*.3;
      ctx.fillRect(fx-6+Math.sin(a)*6, fy-8-((time*30+i*28)%40), 2, 3); }
    ctx.globalAlpha = 1;
    // roosting silhouettes on a branch
    ctx.strokeStyle = '#05070c'; ctx.lineWidth = 4; ctx.beginPath();
    ctx.moveTo(vw()*.12, vh()*.68); ctx.quadraticCurveTo(vw()*.5, vh()*.63, vw()*.88, vh()*.66); ctx.stroke();
    const list = S ? alive() : [];
    list.forEach((b,i) => { const p = PAL[b.n]||{sz:1};
      const bx = vw()*.16 + i*(vw()*.68/Math.max(1,list.length-1)),
            by = vh()*.655 - Math.sin((bx/vw())*3)*vh()*.012 - 7*p.sz;
      ctx.fillStyle = '#05070c'; ctx.beginPath();
      ctx.ellipse(bx, by, 5.5*p.sz, 7.5*p.sz, 0, 0, 7); ctx.fill(); }); },
  hunter(time){
    if (hunterArtOk){ coverImg(HUNTER_ART);
      ctx.fillStyle = 'rgba(5,7,10,.25)'; ctx.fillRect(0,0,vw(),vh()); return; }
    sky('#07080c','#0d0f14','#14161c');
    const lx = vw()*.5, ly = vh()*.62;
    const g = ctx.createRadialGradient(lx, ly, 4, lx, ly, 90+Math.sin(time*3)*6);
    g.addColorStop(0,'rgba(255,190,90,.9)'); g.addColorStop(1,'rgba(255,190,90,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, 100, 0, 7); ctx.fill();
    ctx.fillStyle = '#020304'; // coat, hat, boots — low angle silhouette
    ctx.fillRect(lx-26, ly-150, 52, 150);
    ctx.beginPath(); ctx.ellipse(lx, ly-158, 40, 10, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(lx, ly-166, 16, 0, 7); ctx.fill();
    ctx.fillRect(lx-30, ly-6, 24, 10); ctx.fillRect(lx+8, ly-6, 24, 10);
    for (let i=0;i<2;i++){ const dx = lx + (i?70:-78) + Math.sin(time+i)*3;
      ctx.beginPath(); ctx.ellipse(dx, ly+2, 26, 9, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(dx+(i?18:-18), ly-8, 8, 7, i?.3:-.3, 0, 7); ctx.fill(); }
    ctx.fillStyle = 'rgba(210,214,224,.06)'; // falling ash
    for (let i=0;i<26;i++){ const p = hash('a'+i);
      ctx.fillRect((p%vw()) + Math.sin(time+i)*14, ((time*18 + p%600) % vh()), 2, 2); } },
  dogs(time){ sky('#0a0d14','#11141d','#1c1f28');
    stars(50); ridge(vh()*.8, 30, '#0d0f16', 60, .02);
    trees(vh()*.99, '#07080d', 200, 0, false);
    for (let i=0;i<3;i++){ const lx = vw()*(.25+i*.22) + Math.sin(time*.8+i*2)*12;
      const g = ctx.createRadialGradient(lx, vh()*.78, 2, lx, vh()*.78, 46);
      g.addColorStop(0,'rgba(255,190,90,.8)'); g.addColorStop(1,'rgba(255,190,90,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, vh()*.78, 46, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#05060a';
    for (let i=0;i<2;i++){ const dx = vw()*(.36+i*.2)+Math.sin(time+i)*6, dy = vh()*.92;
      ctx.beginPath(); ctx.ellipse(dx, dy, 26, 10, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(dx+22, dy-8, 9, 7, .3, 0, 7); ctx.fill(); } },
};
let scene = 'burn', lastScene = '';
function frame(now){ const time = now/1000;
  if (MODE==='flight') scroll += 1.2;
  if (scene !== lastScene){ lastScene = scene; if (AU.ctx) auScene(scene); }
  ctx.clearRect(0,0,vw(),vh());
  (SCENES[scene]||SCENES.flight)(time);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- cutscene engine ---------------- */
let cutQ = [], cutDone = null, typing = false, typeTimer = null;
function playCut(lines, done){ cutQ = lines.slice(); cutDone = done; MODE='cut'; show('cut'); nextLine(); }
function nextLine(){
  if (typing){ // finish instantly
    clearInterval(typeTimer); typing = false;
    const l = cutQ[0]; renderLine(l, l.t.length); cutQ.shift(); return; }
  if (!cutQ.length){ const d = cutDone; cutDone = null;
    if (d){ d(); setCutVid(scene); } return; }
  const l = cutQ[0]; if (l.scene) scene = l.scene; if (l.theme!==undefined) auTheme(l.theme);
  setCutVid(scene);
  if (l.who && l.who!=='—') murmur(l.who);
  let i = 0; typing = true;
  typeTimer = setInterval(()=>{ i += 2; renderLine(l, i);
    if (i >= l.t.length){ clearInterval(typeTimer); typing = false; cutQ.shift();
      renderLine(l, l.t.length); } }, 24);
}
function renderLine(l, i){ const box = $('cutText'); box.innerHTML =
  (l.who && l.who!=='—' ? '<span class="who">'+l.who.toUpperCase()+'</span>' : '') +
  l.t.slice(0, i).replace(/\n/g,'<br>');
  if (l.who && l.who!=='—' && PAL[l.who]){
    const talk = i < l.t.length && Math.floor(Date.now()/170)%2===0;
    box.prepend(portraitEl(l.who, false, talk)); } }
$('cut').addEventListener('pointerdown', () => { uiTick(); nextLine(); });

/* ---------------- flight loop ---------------- */
let flightTimer = null;
function startFlight(){ MODE='flight'; scene='flight'; show('hud'); auTheme(.35); hud(); save();
  clearInterval(flightTimer); flightTimer = setInterval(tick, 1600); }
function tick(){ if (MODE!=='flight') return;
  S.dist += 1.1;
  const foragers = alive().filter(b=>b.r==='forager').length;
  const drain = Math.max(0, alive().length*.05 - foragers*.045);
  S.seeds = Math.max(0, S.seeds - drain);
  if (S.seeds<=0){ S.hope = Math.max(0, S.hope-1); }
  S.day = 1 + Math.floor(S.dist/9);
  if (S.dist >= S.nextEventAt){ fireEvent(); return; }
  if (!S.camped && S.dist >= S.distGoal*.6){ S.camped = true; campScene(); return; }
  if (S.dist >= S.distGoal){ clearInterval(flightTimer); cliffCut(); return; }
  hud();
}
function hud(){ const hopeTxt = S.hope>66?'high':S.hope>33?'wavering':'failing';
  $('hudTop').innerHTML =
    'DAY <b>'+S.day+'</b> &nbsp;·&nbsp; FLOCK <b>'+alive().length+'</b>' +
    (byName('Gertie').alive&&!byName('Gertie').left?' <b>+ egg</b>':'') +
    ' &nbsp;·&nbsp; SEEDS <b>'+Math.round(S.seeds)+'</b> &nbsp;·&nbsp; HOPE <b>'+hopeTxt+'</b>';
  $('distFill').style.width = Math.min(100, S.dist/S.distGoal*100)+'%';
  const worried = S.flock.some(b => b.alive && !b.left && b.hurt>0);
  $('flockBtn').classList.toggle('alert', worried);
  $('flockBtn').textContent = worried ? 'FLOCK •' : 'FLOCK';
}
/* ---------------- flock roster ---------------- */
function condText(b){ if (!b.alive) return ['lost', true];
  if (b.left) return ['resting at a haven', true];
  if (b.hurt>0) return ['wing-strained', true];
  if (S.hope<30) return ['weary', true];
  return ['flying well', false]; }
const VOICE = {
  Kevin:  'If we make it — when we make it — I’m building the nest twice as deep.',
  Gertie: 'The egg turned this morning. She’s listening now. So watch what you say.',
  Waddles:'I’m not slow. I’m saving my burst for when it counts.',
  Pip:    'I could scout the whole route in a day. Half a day, if Reed stopped saying “steady.”',
  Mabel:  'Wings mend. The trick is convincing the bird.',
  Dot:    'Otis says the stars have names. I’m learning ALL of them.',
  Otis:   'I saw the southern grounds once. The reeds sing there. That part I did not make up.',
  Hazel:  'Every seed is a mile. Waste neither.',
  Bram:   'Marra chose you. I’m still deciding. Fly well and I’ll decide faster.',
  Reed:   'Wind’s turning. Two days, maybe three. You’ll want the flock rested.',
  Cleo:   'Songs are maps. My mother’s reached all the way south. I only remember half.',
  Finn:   'I count us every morning. Twelve. I’ll keep counting, if that’s alright.',
};
function openRoster(){ const rows = $('rosterRows'); rows.innerHTML = '';
  S.flock.forEach(b => { const r = document.createElement('div'); r.className = 'rrow';
    r.style.cursor = 'pointer';
    r.appendChild(portraitEl(b.n, true));
    const ri = document.createElement('div'); ri.className = 'ri';
    ri.innerHTML = '<b>' + b.n + '</b> <span style="color:#8d8672;font-size:12px">· ' +
      (ROLES[b.r]||'Flyer') + (b.egg?' · carrying the egg':'') + '</span><small>' + b.note + '</small>';
    r.appendChild(ri);
    const [ct, bad] = condText(b);
    const c = document.createElement('div'); c.className = 'cond' + (bad?' bad':'');
    c.textContent = ct; r.appendChild(c);
    r.onclick = () => rosterDetail(b);
    rows.appendChild(r); });
  $('roster').classList.add('show'); uiTick();
}
function rosterDetail(b){ const rows = $('rosterRows'); rows.innerHTML = ''; murmur(b.n);
  const wrap = document.createElement('div'); wrap.style.cssText = 'text-align:center;padding:8px 4px';
  const p = animPortrait(b.n); p.style.width = p.style.height = '128px'; wrap.appendChild(p);
  const [ct] = condText(b);
  wrap.innerHTML += '<div style="font-size:19px;color:#f0e6c8;margin-top:4px">' + b.n + '</div>' +
    '<div style="font-size:12px;letter-spacing:2px;color:#8d8672;margin:2px 0 10px">' +
    (ROLES[b.r]||'Flyer').toUpperCase() + (b.egg?' · CARRYING THE EGG':'') + ' · ' + ct.toUpperCase() + '</div>' +
    '<div style="font-style:italic;color:#ddd6c6;line-height:1.6;font-size:15px">“' + (VOICE[b.n]||b.note) + '”</div>' +
    '<div style="color:#8d8672;font-size:13px;margin-top:10px">' + b.note + '</div>';
  const back = document.createElement('button'); back.className = 'tbtn';
  back.style.marginTop = '16px'; back.textContent = 'BACK';
  back.onclick = (e) => { e.stopPropagation(); openRoster(); };
  wrap.appendChild(back);
  rows.appendChild(wrap);
}
$('flockBtn').onclick = openRoster;
$('rosterClose').onclick = () => { $('roster').classList.remove('show'); uiTick(); };

function roll(p){ return Math.random() < p; }
function hopeUp(n){ S.hope = Math.min(100, S.hope+n); }
function hopeDn(n){ S.hope = Math.max(0, S.hope-n); }
function hurt(name, amt){ const b = byName(name); if (b) b.hurt += amt; }

/* speaker = the character actually featured/talking in the event text.
   Strangers (Crow, Starling) only show a face if art/crow.jpg etc. exists. */
const SPEAKER = { thermal:'Reed', silo:'Hazel', crow:'Crow', rain:'Otis', wire:'Pip',
  starling:'Starling', eggnight:'Kevin', hawkshadow:'Bram', memorial:'Otis',
  rations:'Hazel', finn:'Finn', gorge:'Otis',
  promise:'Kevin', duet:'Cleo', firstglide:'Mabel' };
const STRANGERS = ['Crow','Starling'];
STRANGERS.forEach(n => { const img = new Image();
  img.onload = () => { ART[n] = img; }; img.onerror = () => { ART[n] = null; };
  img.src = 'art/' + n.toLowerCase() + '.jpg';
  const tk = new Image();
  tk.onload = () => { ARTT[n] = tk; }; tk.onerror = () => { ARTT[n] = null; };
  tk.src = 'art/' + n.toLowerCase() + '_talk.jpg'; });
function fireEvent(){ const pool = EVENTS.filter(e =>
    !S.seenEvents.includes(e.id) && (!e.cond || e.cond(S)));
  S.nextEventAt = S.dist + 5 + Math.random()*3.5;
  if (!pool.length){ hud(); return; }
  const ev = pool[Math.floor(Math.random()*pool.length)];
  S.seenEvents.push(ev.id);
  MODE='card'; show('card'); scene='flight';
  $('cardTitle').textContent = ev.t;
  const sp = SPEAKER[ev.id];
  const txt = $('cardText'); txt.textContent = ev.p();
  txt.classList.remove('outcome');
  const spOk = sp && (STRANGERS.includes(sp) ? !!ART[sp] : (byName(sp) && byName(sp).alive));
  if (spOk){ txt.prepend(animPortrait(sp)); murmur(sp); }
  $('cardCont').innerHTML = '';
  const box = $('cardChoices'); box.innerHTML = '';
  ev.c.forEach(ch => { const b = document.createElement('button');
    b.className = 'choice'; b.textContent = ch.t;
    b.onclick = () => { uiTick(); S.choicesMade++;
      const out = ch.f(S); S.seeds = Math.max(0, S.seeds);
      box.innerHTML = '';
      txt.textContent = out; txt.classList.add('outcome');
      if (spOk) txt.prepend(portraitEl(sp));
      const c = document.createElement('button'); c.className='tbtn'; c.textContent='FLY ON';
      c.onclick = () => { uiTick(); resumeFlight(); }; $('cardCont').appendChild(c); };
    box.appendChild(b); });
}
function resumeFlight(){ MODE='flight'; show('hud'); hud(); save(); }

/* ---------------- camp: full night scene, three phases ---------------- */
const CAMP_TALKS = {
  'Bram': ['Sit with Bram, who was the leader’s second.', 'Bram is quiet a long time. Then: “I thought it should have been me. Marra knew better. You land the flock gentler than I would have.” It costs him to say it. You both pretend it doesn’t.', 5],
  'Kevin': ['Sit with Kevin, Gertie, and the egg.', 'Gertie lets you rest a wing near the egg. “If it’s a girl,” Kevin says, “Gertie wants Marra.” Gertie looks at him. “Kevin wants Marra,” she corrects softly. “I want her to hatch somewhere safe enough to be anyone.”', 6],
  'Otis': ['Sit with Otis while he names the stars for Dot.', '“That one,” Otis tells Dot, “is the Wayfinder. Every bird that ever flew south flew under it.” Dot asks if Marra is up there now. Otis doesn’t miss a wingbeat: “Who do you think is holding the lantern?”', 6],
  'Cleo': ['Sit with Cleo and Finn at the fire’s edge.', 'Cleo hums, low, until Finn’s shoulders come down from around his ears. “I don’t remember the words,” Finn admits. “Nobody does,” Cleo says. “That’s why flocks hum.” You stay until the ember-light dies.', 5],
  'Waddles': ['Sit with Waddles and Hazel, who found supper.', 'Hazel splits her last gleanings twelve ways with terrifying precision. Waddles solemnly donates his share to Dot, then spends an hour pretending he isn’t hungry. Hazel slips him hers when she thinks no one sees. You see.', 5],
  'watch': ['Take the first watch alone at the edge of camp.', 'You watch the dark so the others don’t have to. Near midnight, Reed lands beside you without a word and takes the north half of the sky. Leaders, it turns out, get watched over too.', 4],
};
function campScene(){ MODE='card'; show('card'); scene='camp'; auTheme(.25);
  S.campTalks = 0;
  campIntro();
}
function campIntro(){
  $('cardTitle').textContent = 'CAMP — THE FIRST GREEN TREES';
  const txt = $('cardText'); txt.classList.remove('outcome');
  txt.textContent = 'The flock lands in living branches for the first time since the fire. Green leaves. Unburned bark. A small fire of deadfall crackles below the roost. For a while nobody says anything at all. The night is yours — spend it well.';
  $('cardCont').innerHTML = ''; const box = $('cardChoices'); box.innerHTML = '';
  const c = document.createElement('button'); c.className='tbtn'; c.textContent='JOIN THE FIRE';
  c.onclick = () => { uiTick(); campTalkMenu(); }; $('cardCont').appendChild(c);
}
function campTalkMenu(){
  if (S.campTalks >= 2){ campRations(); return; }
  $('cardTitle').textContent = S.campTalks===0 ? 'THE FIRE — EARLY NIGHT' : 'THE FIRE — LATE NIGHT';
  const txt = $('cardText'); txt.classList.remove('outcome');
  txt.textContent = S.campTalks===0 ? 'Small circles of feathers and firelight. Who do you spend this hour beside?'
    : 'The fire burns lower. One more hour before sleep. Who needs you now?';
  $('cardCont').innerHTML = ''; const box = $('cardChoices'); box.innerHTML = '';
  Object.keys(CAMP_TALKS).filter(k => !(S.campDone||[]).includes(k)).forEach(k => {
    const [label, out, hp] = CAMP_TALKS[k];
    const b = document.createElement('button'); b.className='choice';
    b.textContent = label;
    if (k!=='watch' && PAL[k]){ const p = portraitEl(k, true);
      p.style.cssText += ';float:left;margin-right:10px'; b.prepend(p); }
    b.onclick = () => { uiTick(); if (k!=='watch') murmur(k);
      S.campDone = (S.campDone||[]); S.campDone.push(k); S.campTalks++;
      hopeUp(hp); box.innerHTML='';
      txt.textContent = out; txt.classList.add('outcome');
      if (k!=='watch') txt.prepend(animPortrait(k));
      const c = document.createElement('button'); c.className='tbtn';
      c.textContent = S.campTalks>=2 ? 'THE FIRE DIES DOWN' : 'ANOTHER HOUR';
      c.onclick = () => { uiTick(); campTalkMenu(); }; $('cardCont').appendChild(c); };
    box.appendChild(b); });
}
function campRations(){
  $('cardTitle').textContent = 'BEFORE SLEEP — THE SEED STORE';
  const txt = $('cardText'); txt.classList.remove('outcome');
  txt.textContent = 'Hazel lays out what the flock carries: ' + Math.round(S.seeds) + ' seeds, give or take a crop. Tomorrow starts hungry or it doesn’t.';
  $('cardCont').innerHTML = ''; const box = $('cardChoices'); box.innerHTML = '';
  [ ['Eat well tonight. Tomorrow needs strong wings.', ()=>{ S.seeds=Math.max(0,S.seeds-8); hopeUp(4);
      return 'Full crops all around. Waddles declares it the finest meal of his life, which he also said yesterday. Spirits lift like sparks.'; }],
    ['Half rations. The green country may not stay generous.', ()=>{ S.seeds+=2; hopeDn(1);
      return 'Nobody complains out loud. Hazel nods at you once, which from Hazel is a standing ovation. The store will stretch.'; }],
  ].forEach(([label, fn]) => { const b = document.createElement('button');
    b.className='choice'; b.textContent = label;
    b.onclick = () => { uiTick(); const out = fn(); box.innerHTML='';
      txt.textContent = out; txt.classList.add('outcome');
      const c = document.createElement('button'); c.className='tbtn'; c.textContent='SLEEP';
      c.onclick = () => { uiTick(); scene='flight'; auTheme(.35); resumeFlight(); };
      $('cardCont').appendChild(c); };
    box.appendChild(b); });
}

/* ---------------- end of act ---------------- */
function endAct(){ MODE='end';
  S.flock.forEach(b => { if (!b.alive) addStone(b.n, S.dist); });
  S.act1done = true; save();
  $('shareImg').src = shareCard(); show('end');
}
function shareCard(){ const c = document.createElement('canvas');
  c.width = 640; c.height = 800; const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,800);
  g.addColorStop(0,'#141c2a'); g.addColorStop(.6,'#3a3f52'); g.addColorStop(1,'#8a6a55');
  x.fillStyle = g; x.fillRect(0,0,640,800);
  x.fillStyle = '#0c0f15'; x.beginPath(); x.moveTo(0,800);
  for (let px=0;px<=640;px+=10) x.lineTo(px, 700 - Math.abs(Math.sin(px*.008)*70));
  x.lineTo(640,800); x.fill();
  for (let i=0;i<9;i++){ const bx = 140+i*45, by = 200+Math.abs(i-4)*22;
    x.strokeStyle = '#0e0c0a'; x.lineWidth = 3; x.lineCap='round'; x.beginPath();
    x.moveTo(bx-12, by-6); x.quadraticCurveTo(bx, by+2, bx+12, by-6); x.stroke(); }
  x.fillStyle = '#c8b98a'; x.font = '13px Georgia'; x.textAlign = 'center';
  x.fillText('T H E   L O N G   M I G R A T I O N', 320, 90);
  x.fillStyle = '#e8e2d4'; x.font = '30px Georgia';
  x.fillText('Act I — The Burning', 320, 130);
  x.font = '15px Georgia'; x.fillStyle = '#c8b98a';
  x.fillText('Led by ' + S.player + '  ·  Day ' + S.day, 320, 320);
  // survivor portrait row(s)
  const surv = alive(); const per = Math.min(6, surv.length), pw = 72, gap = 14;
  surv.forEach((b, i) => { const row = Math.floor(i/per), inRow = Math.min(per, surv.length - row*per),
      x0 = 320 - (inRow*pw + (inRow-1)*gap)/2, px = x0 + (i%per)*(pw+gap), py = 350 + row*(pw+30);
    const src = ART[b.n] || codePortrait(b.n, pw);
    x.save(); x.beginPath(); x.arc(px+pw/2, py+pw/2, pw/2, 0, 7); x.clip();
    x.drawImage(src, px, py, pw, pw); x.restore();
    x.strokeStyle = 'rgba(200,185,138,.6)'; x.lineWidth = 1.5;
    x.beginPath(); x.arc(px+pw/2, py+pw/2, pw/2, 0, 7); x.stroke();
    x.fillStyle = '#ddd6c6'; x.font = '12px Georgia';
    x.fillText(b.n, px+pw/2, py+pw+16); });
  const gone = S.flock.filter(b=>!b.alive).map(b=>b.n),
        left = S.flock.filter(b=>b.left).map(b=>b.n);
  if (byName('Gertie').alive && !byName('Gertie').left){
    x.fillStyle = '#c8b98a'; x.font = 'italic 14px Georgia';
    x.fillText('— and the egg —', 320, 350 + Math.ceil(surv.length/per)*(pw+30) + 8); }
  x.fillStyle = '#b3ab97'; x.font = 'italic 14px Georgia';
  if (gone.length) wrap(x, 'The sky remembers: ' + gone.join(', '), 320, 600, 520, 22);
  if (left.length) wrap(x, 'Resting at havens: ' + left.join(', '), 320, 640, 520, 22);
  if (!gone.length && !left.length) x.fillText('Not one feather lost. Yet.', 320, 610);
  x.fillStyle = '#8d8672'; x.font = '13px Georgia';
  x.fillText('The dogs have the scent.  Act II is coming.', 320, 690);
  x.fillText('freefowl.com/migration', 320, 760);
  return c.toDataURL('image/png');
}
function wrap(x, text, cx, y, w, lh){ const words = text.split(' '); let line = '';
  words.forEach(word => { if (x.measureText(line+word).width > w){ x.fillText(line, cx, y); y += lh; line=''; }
    line += word+' '; }); x.fillText(line, cx, y); }

/* ---------------- boot ---------------- */
function begin(fresh){ auInit();
  if (!fresh){ const sv = loadSave();
    if (sv && !sv.act1done){ S = sv; startFlight(); return; } }
  S = newState(); save(); scene='burn'; openCut();
}
$('btnNew').onclick  = () => begin(true);
$('btnCont').onclick = () => begin(false);
$('btnTitle').onclick = () => { show('title'); MODE='title'; scene='vow'; };
$('shareBtn').onclick = async () => { uiTick();
  try { const res = await fetch($('shareImg').src), blob = await res.blob();
    const file = new File([blob], 'long-migration-act1.png', { type:'image/png' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'The Long Migration',
        text:'We made it out of the burning. freefowl.com/migration' }); return; }
  } catch(e){}
  const a = document.createElement('a'); a.href = $('shareImg').src;
  a.download = 'long-migration-act1.png'; a.click();
};
(function initTitle(){ const sv = loadSave();
  if (sv && !sv.act1done){ $('btnCont').style.display=''; $('btnCont').classList.remove('dim');
    if (sv.player) $('pname').value = sv.player; }
  scene = 'burn';
})();

/* test hooks */
globalThis.__lm = { get S(){return S;}, newState, begin, fireEvent, EVENTS, nextLine,
  startFlight, tick, campScene, endAct, alive:()=>alive(), adapt, stones };
</script>
